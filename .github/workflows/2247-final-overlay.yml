name: Final 2247 integration overlay

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  overlay:
    if: github.head_ref == 'audit/2247-final-current-main-integration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Overlay exact approved stack onto current main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=c552afcfef2bbd06dcdfbe48d6efe4874812b417
          git fetch origin fix/2253-crobat-source-binding --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git checkout "$SOURCE_SHA" -- \
            CMakeLists.txt \
            README.md \
            SIM-PLAN.md \
            docs/CROBAT_MODEL_REPORT.md \
            docs/MODEL_ASSUMPTIONS.md \
            docs/MULTI_DECK_REPORT.md \
            docs/REPORT.md \
            results/baseline_manifest.json \
            results/crobat_variant_model.csv \
            results/multi_deck_comparison.csv \
            results/multi_deck_manifest.json \
            results/simulation_results.csv \
            scripts/generate_multi_deck_comparison.py \
            scripts/update_crobat_modeling_docs.py \
            scripts/update_multi_deck_docs.py \
            scripts/update_setup_docs.py \
            src/trace_engine_v2/part_003.inc \
            src/trace_engine_v2/part_014c.inc \
            src/trace_engine_v2/part_016.inc \
            src/trace_engine_v2/part_issue_1724_crobat_stadium_compression.inc \
            tests/issue_1700_pre_steven_vessel_tests.cpp \
            tests/issue_1704_item_lock_burnet_route_tests.cpp \
            tests/issue_1845_proactive_tapu_retreat_tests.cpp \
            tests/issue_2247_lock_timing_tests.cpp \
            tests/issue_2252_crobat_compression_stale_recheck_tests.cpp \
            tests/issue_2253_crobat_artifact_source_binding_tests.cpp \
            tests/pokemon_communication_tests.cpp \
            tests/run_issue_1086_wonder_tag_serena_payload.cmake

          # Keep current main's already-merged #2225 wrapper/include/test intact.
          test -f src/trace_engine_v2/part_issue_2225_arven_vessel_supporter_override.inc
          test -f tests/issue_2225_arven_vessel_supporter_route_tests.cpp
          grep -q 'part_issue_2225_arven_vessel_supporter_override.inc' \
            src/trace_engine_v2/part_issue_1873_blender_crispin_supporter_override.inc

          git rm .github/workflows/2247-final-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate validated #2247 #2252 #2253 stack onto current main"
          git push origin HEAD:${GITHUB_HEAD_REF}
