name: Apply issue 1497 Pineco hold fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1497-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1497-preserve-pineco-direct-route'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the confirmed route-preservation fix
        run: python scripts/apply_issue_1497.py
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run focused route regressions
        id: focused
        shell: bash
        run: |
          set +e
          ./build/regidrago_unified_tests issue_1420_steven_direct_treasure_tests > issue1497-focused.log 2>&1
          status=$?
          cat issue1497-focused.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve failed focused output
        if: steps.focused.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_issue_1497.py .github/workflows/apply-issue-1497.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve issue 1497 focused failure evidence"
          git push origin HEAD:fix/issue-1497-preserve-pineco-direct-route
          exit 1
      - name: Run three reviewed simulate-this audits
        if: steps.focused.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-1497-seed35.txt
          ! grep -q "T1 | BENCH | rules: R-GAME-BENCH | Pineco from hand" trace-1497-seed35.txt
          grep -q "Held Pineco in hand because the complete K1 direct T2 route" trace-1497-seed35.txt
          grep -q "T2 | READY" trace-1497-seed35.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 18 --require-ready-by 2 | tee trace-1497-seed18.txt
          grep -q "Arven banked the next-turn Secret Box route" trace-1497-seed18.txt
          grep -q "T2 | READY" trace-1497-seed18.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 40 --require-ready-by 2 | tee trace-1497-seed40.txt
          grep -q "Gladion recovered the legally known prized Secret Box" trace-1497-seed40.txt
          grep -q "T2 | READY" trace-1497-seed40.txt
      - name: Regenerate source-bound evidence
        if: steps.focused.outputs.status == '0'
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        if: steps.focused.outputs.status == '0'
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated fix and evidence
        if: steps.focused.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_issue_1497.py .github/workflows/apply-issue-1497.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Pineco on the deterministic direct T2 route (#1497)"
          git push origin HEAD:fix/issue-1497-preserve-pineco-direct-route
