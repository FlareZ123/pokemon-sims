name: Apply issue 1895 evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1895-quick-ball-payload-cost'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply source-bound probability evidence
        shell: bash
        run: |
          cat .github/patches/issue-1895-evidence.00 .github/patches/issue-1895-evidence.01 .github/patches/issue-1895-evidence.02 .github/patches/issue-1895-evidence.03 .github/patches/issue-1895-evidence.04 | base64 --decode | gunzip > /tmp/issue-1895-evidence.patch
          git apply --check /tmp/issue-1895-evidence.patch
          git apply /tmp/issue-1895-evidence.patch
          git diff --check
          rm .github/patches/issue-1895-evidence.0*
          rm .github/workflows/apply-issue-1895-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Update issue 1895 probability evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
