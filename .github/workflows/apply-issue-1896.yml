name: Apply issue 1896 fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1896-treasure-current-turn-payload'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply validated patch
        shell: bash
        run: |
          base64 --decode .github/patches/issue-1896.patch.b64 > /tmp/issue-1896.patch
          git apply --check /tmp/issue-1896.patch
          git apply /tmp/issue-1896.patch
          git diff --check
          rm .github/patches/issue-1896.patch.b64
          rm .github/workflows/apply-issue-1896.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix issue 1896 Treasure current-turn payload'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
