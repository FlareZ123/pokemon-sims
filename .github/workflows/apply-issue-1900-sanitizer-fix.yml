name: Apply PR 1900 sanitizer fixture fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1896-treasure-current-turn-payload'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fix Scenario lifetime in regression fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/issue_1876_treasure_payload_cost_tests.cpp')
          text = path.read_text()
          old = '''  sim::State state = route_state();
            state.discard = {sim::Card::DialgaGX};
            sim::Engine engine = make_engine(flex(), rng, state, false);'''
          new = '''  // Engine retains this Scenario reference: https://eel.is/c++draft/class.temporary#6.10
            const sim::Scenario flex_scenario = flex();
            sim::State state = route_state();
            state.discard = {sim::Card::DialgaGX};
            sim::Engine engine = make_engine(flex_scenario, rng, state, false);'''
          old2 = '''  sim::Engine already_ready = make_engine(flex(), rng, std::move(state), false);'''
          new2 = '''  sim::Engine already_ready =
                make_engine(flex_scenario, rng, std::move(state), false);'''
          if old not in text or old2 not in text:
              raise SystemExit('Expected PR 1900 fixture text not found')
          path.write_text(text.replace(old, new).replace(old2, new2))
          PY
          git diff --check
          rm .github/workflows/apply-issue-1900-sanitizer-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix PR 1900 sanitizer fixture lifetime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
