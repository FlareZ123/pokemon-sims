name: Apply issue 2164 fix

on:
  pull_request:
    branches:
      - fix/issue-2172-register-prize-fallback-tests
      - main
    paths:
      - .github/workflows/apply-issue-2164.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/issue-2164-quick-ball-latias-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2164-quick-ball-latias-finish
          fetch-depth: 0
      - name: Apply isolated source fix
        shell: python
        run: |
          import base64
          import subprocess

          patch = base64.b64decode("")
          subprocess.run(["git", "apply", "--whitespace=error-all", "-"], input=patch, check=True)
      - name: Configure Release validation
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --target regidrago_sim regidrago_unified_tests --parallel 2
      - name: Run focused regression
        run: ./build/regidrago_unified_tests issue_2164_quick_ball_latias_finish_tests
      - name: Audit both exact seed routes
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 69 --require-ready-by 4 | tee issue-2164-strict.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 69 --require-ready-by 4 | tee issue-2164-flex.txt
          grep -F "Quick Ball issue-2164 current-turn payload cost" issue-2164-strict.txt
          grep -F "Latias ex for the issue-2164" issue-2164-strict.txt
          grep -F "T4 | READY" issue-2164-strict.txt
          grep -F "Quick Ball issue-2164 current-turn payload cost" issue-2164-flex.txt
          grep -F "Latias ex for the issue-2164" issue-2164-flex.txt
          grep -F "T4 | READY" issue-2164-flex.txt
          ! grep -F "T4 | WONDER TAG" issue-2164-strict.txt
          ! grep -F "T4 | PLAY SUPPORTER | Serena" issue-2164-strict.txt
      - name: Refresh canonical setup evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe ./build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python tests/setup_report_contract_tests.py
      - name: Refresh paired setup evidence
        run: |
          python scripts/generate_multi_deck_comparison.py --exe ./build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
          python tests/multi_deck_report_contract_tests.py
      - name: Commit isolated fix and evidence
        run: |
          rm .github/workflows/apply-issue-2164.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Quick Ball Latias current-turn finish"
          git push origin HEAD:fix/issue-2164-quick-ball-latias-finish
