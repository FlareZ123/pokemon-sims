name: Apply issue 2175 fix

on:
  push:
    branches:
      - fix/issue-2175-prize-k1-quick-ball
    paths:
      - .github/workflows/apply-issue-2175.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2175-prize-k1-quick-ball
          fetch-depth: 0
      - name: Apply isolated source and test changes
        shell: python
        run: |
          from pathlib import Path
          import base64

          source_path = Path("src/trace_engine_v2/part_009b1.inc")
          source = source_path.read_text(encoding="utf-8")
          old = '    // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#hidden-information-policy\n    // https://github.com/FlareZ123/pokemon-sims/issues/694\n    const bool search_has_target = deck_seen_\n'
          new = '    // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#hidden-information-policy\n    // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states\n    // https://github.com/FlareZ123/pokemon-sims/issues/694\n    // https://github.com/FlareZ123/pokemon-sims/issues/2175\n    const bool search_has_target = prizes_known()\n'
          if source.count(old) != 1:
              raise SystemExit("issue-2175 source anchor count was not exactly one")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/issue_2175_quick_ball_prize_k1_target_tests.cpp")
          test_path.write_bytes(base64.b64decode(""))
          Path(".github/workflows/apply-issue-2175.yml").unlink()
      - name: Configure focused validation
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build unified tests
        run: cmake --build build --target regidrago_unified_tests --parallel 2
      - name: Run issue 2175 regression
        run: ./build/regidrago_unified_tests issue_2175_quick_ball_prize_k1_target_tests
      - name: Commit isolated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Quick Ball Prize-K1 target legality"
          git push origin HEAD:fix/issue-2175-prize-k1-quick-ball
