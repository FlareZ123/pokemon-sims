name: Apply issue 2188 confirmed fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-issue-2188.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/issue-2188-mysterious-treasure-prize-k1'
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2188-mysterious-treasure-prize-k1
          fetch-depth: 0
      - name: Apply exact K1 target boundary and focused controls
        shell: python
        run: |
          from pathlib import Path
          import base64

          source_path = Path("src/trace_engine_v2/part_009a.inc")
          source = source_path.read_text(encoding="utf-8")
          old = '''    // https://api.pokemontcg.io/v2/cards/sm6-113
              // https://compendium.pokegym.net/category/5-trainers/trainers-in-general/#:~:text=No%2C%20you%20cannot%20play%20a%20Trainer%20when%20it%20is%20known%20that%20it%20will%20have%20no%20effect.
              // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#hidden-information-policy
              // https://github.com/FlareZ123/pokemon-sims/issues/693
              const bool search_has_target = deck_seen_
          '''.replace("              ", "    ")
          new = '''    // https://api.pokemontcg.io/v2/cards/sm6-113
              // Appletun is an off-recipe Dragon target that the exact K1 deck must admit:
              // https://api.pokemontcg.io/v2/cards/sv8-140
              // https://compendium.pokegym.net/category/5-trainers/trainers-in-general/#:~:text=No%2C%20you%20cannot%20play%20a%20Trainer%20when%20it%20is%20known%20that%20it%20will%20have%20no%20effect.
              // https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
              // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#hidden-information-policy
              // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
              // https://github.com/FlareZ123/pokemon-sims/issues/693
              // https://github.com/FlareZ123/pokemon-sims/issues/2188
              const bool search_has_target = prizes_known()
          '''.replace("              ", "    ")
          if source.count(old) != 1:
              raise SystemExit("issue-2188 production anchor count was not exactly one")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_data = ""
          Path("tests/issue_2188_mysterious_treasure_prize_k1_target_tests.cpp").write_bytes(
              base64.b64decode(test_data)
          )
          Path(".github/workflows/apply-issue-2188.yml").unlink()
      - name: Configure focused validation
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build unified tests
        run: cmake --build build --target regidrago_unified_tests --parallel 2
      - name: Run issue 2188 target controls
        run: ./build/regidrago_unified_tests issue_2188_mysterious_treasure_prize_k1_target_tests
      - name: Commit isolated confirmed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Mysterious Treasure Prize-K1 target legality"
          git push origin HEAD:fix/issue-2188-mysterious-treasure-prize-k1
