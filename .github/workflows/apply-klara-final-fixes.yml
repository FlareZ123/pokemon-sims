name: Apply Klara final fixes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [klara-workflow-base]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'enhancement-1773-klara-swap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement-1773-klara-swap
          fetch-depth: 0
      - name: Merge current main and apply corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          cp docs/RULES_TRACEABILITY.md /tmp/klara-rules-traceability.md
          cp docs/RULE_SOURCES.md /tmp/klara-rule-sources.md
          git merge --no-commit --no-ff -X theirs origin/main
          python3 .github/klara-final-fix.py
          rm -f .github/klara-final-fix.py
          rm -f .github/workflows/apply-klara-final-fixes.yml
          git add -A
          git commit -m 'Merge current main and fix Klara sanitizer regressions'
          git push origin HEAD:enhancement-1773-klara-swap
