name: Apply Klara final fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'enhancement-1773-klara-swap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement-1773-klara-swap
          fetch-depth: 0
      - name: Apply source and regression corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/trace_engine_v2/part_000.inc',
              '#include <map>\n#include <numeric>',
              '#include <map>\n#include <memory>\n#include <numeric>',
          )

          replace_once(
              'src/trace_engine_v2/part_003.inc',
              '''  Engine(const Scenario& scenario, const DeckRecipe& recipe, std::mt19937_64& rng, TraceLog* trace = nullptr)\n      : scenario_(scenario), recipe_(recipe), rng_(rng), trace_(trace) {}\n''',
              '''  Engine(const Scenario& scenario, const DeckRecipe& recipe, std::mt19937_64& rng, TraceLog* trace = nullptr)\n      : scenario_(scenario), recipe_(recipe), rng_(rng), trace_(trace) {}\n\n  Engine(const Scenario& scenario, DeckRecipe&& recipe, std::mt19937_64& rng,\n         TraceLog* trace = nullptr)\n      : scenario_(scenario),\n        owned_recipe_(std::make_shared<DeckRecipe>(std::move(recipe))),\n        recipe_(*owned_recipe_),\n        rng_(rng),\n        trace_(trace) {\n    // Synthetic fixtures may pass a temporary recipe. Own that rvalue so later\n    // route projections and recipe inventory checks cannot retain a dangling\n    // reference. Shared ownership also keeps default Engine copies safe:\n    // https://eel.is/c++draft/class.temporary\n    // https://eel.is/c++draft/util.smartptr.shared\n    // Sanitizer evidence: https://github.com/FlareZ123/pokemon-sims/pull/1774\n  }\n''',
          )

          replace_once(
              'src/trace_engine_v2/part_003.inc',
              '''  const Scenario& scenario_;\n  const DeckRecipe& recipe_;\n''',
              '''  const Scenario& scenario_;\n  std::shared_ptr<const DeckRecipe> owned_recipe_;\n  const DeckRecipe& recipe_;\n''',
          )

          replace_once(
              'src/trace_engine_v2/part_klara_recovery_override.inc',
              '''  void choose_supporter() {\n    if (!supporter_allowed() || !setup_axis_missing()) return;\n    if (play_klara_recovery()) return;\n    choose_supporter_klara_original();\n  }\n''',
              '''  void choose_supporter() {\n    if (!supporter_allowed()) return;\n    if (setup_axis_missing() && play_klara_recovery()) return;\n\n    // Klara's setup-only admission must not hide existing Supporter routes that\n    // repair the Active position after another Regidrago is already complete,\n    // including Professor Turo plus Oricorio Energy compression:\n    // Klara: https://api.pokemontcg.io/v2/cards/swsh6-145\n    // Professor Turo's Scenario: https://api.pokemontcg.io/v2/cards/sv4-171\n    // Oricorio: https://api.pokemontcg.io/v2/cards/sm2-55\n    // Official Supporter procedure: https://www.pokemon.com/us/pokemon-tcg/rules\n    // Sanitizer regression: https://github.com/FlareZ123/pokemon-sims/pull/1774\n    choose_supporter_klara_original();\n  }\n''',
          )

          replace_once(
              'src/trace_engine_v2/part_issue_1209_treasure_tapu_crispin_override.inc',
              '''        hand_count(Card::MysteriousTreasure) >= 2 &&\n        hand_count(Card::RoseannesBackup) > 0 &&\n        hand_count(Card::ForestSealStone) > 0 &&\n''',
              '''        hand_count(Card::MysteriousTreasure) >= 2 &&\n        (hand_count(Card::RoseannesBackup) > 0 ||\n         hand_count(Card::Klara) > 0) &&\n        hand_count(Card::ForestSealStone) > 0 &&\n''',
          )

          replace_once(
              'src/trace_engine_v2/part_issue_1209_treasure_tapu_crispin_override.inc',
              '''    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163\n    // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113\n    // Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145\n''',
              '''    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163\n    // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113\n    // Klara, the registered shell's second printed discard cost: https://api.pokemontcg.io/v2/cards/swsh6-145\n    // Roseanne's Backup, retained legacy recipe support: https://api.pokemontcg.io/v2/cards/swsh9-148\n    // Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145\n''',
          )

          path = Path('tests/issue_1236_vessel_before_steven_tests.cpp')
          text = path.read_text()
          substitutions = [
              ('sim::Card::LatiasEx, sim::Card::RoseannesBackup,',
               'sim::Card::LatiasEx, sim::Card::Klara,'),
              ("with Roseanne's Backup and searches Regidrago VSTAR.",
               'with Klara and searches Regidrago VSTAR.'),
              ("// Roseanne's Backup: https://api.pokemontcg.io/v2/cards/swsh9-148",
               '// Klara: https://api.pokemontcg.io/v2/cards/swsh6-145'),
              ('sim::State no_roseanne = route_state();\n  erase_one(no_roseanne.hand, sim::Card::RoseannesBackup);\n  blocked(no_roseanne, scenario(), 1236004,',
               'sim::State no_supporter_cost = route_state();\n  erase_one(no_supporter_cost.hand, sim::Card::Klara);\n  blocked(no_supporter_cost, scenario(), 1236004,'),
          ]
          for old, new in substitutions:
              if text.count(old) != 1:
                  raise SystemExit(f'tests/issue_1236_vessel_before_steven_tests.cpp: replacement count for {old!r} was {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/issue_1109_late_steven_blender_tests.cpp')
          text = path.read_text()
          old = '''  const bool used_steven_by_t3 =\n      trace_contains(trace, "T2 | PLAY SUPPORTER | rules: R-STEVEN-01") ||\n      trace_contains(trace, "T3 | PLAY SUPPORTER | rules: R-STEVEN-01");\n  expect(used_steven_by_t3, "Seed 143 must play Steven by T3.");\n'''
          new = '''  const bool used_steven_by_t3 =\n      trace_contains(trace, "T2 | PLAY SUPPORTER | rules: R-STEVEN-01") ||\n      trace_contains(trace, "T3 | PLAY SUPPORTER | rules: R-STEVEN-01");\n  const bool used_klara_by_t3 =\n      trace_contains(trace, "T2 | PLAY SUPPORTER | rules: R-KLARA-01") ||\n      trace_contains(trace, "T3 | PLAY SUPPORTER | rules: R-KLARA-01");\n  expect(used_steven_by_t3 || used_klara_by_t3,\n         "Seed 143 must use Steven or the earlier legal Klara route by T3.");\n'''
          if text.count(old) != 1:
              raise SystemExit('tests/issue_1109_late_steven_blender_tests.cpp: integration assertion not found exactly once')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''  // The complete Steven route must outrank spending Gladion on a redundant Basic.\n  // A later policy may legally discover an earlier Steven plus Burnet continuation,\n  // so this integration regression preserves the route and its original T4 deadline\n  // while the exact-state test above continues to cover held Blender admission:\n''',
              '''  // The complete route must outrank spending Gladion on a redundant Basic.\n  // The registered shell may now use Klara for an earlier legal T3 completion, while\n  // the exact-state test above continues to cover held-Blender Steven admission:\n''',
              1,
          )
          text = text.replace(
              "  // Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145\n",
              "  // Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145\n  // Klara: https://api.pokemontcg.io/v2/cards/swsh6-145\n",
              1,
          )
          path.write_text(text)
          PY

          rm -f .github/workflows/apply-klara-final-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Klara sanitizer and compatibility regressions'
          git push origin HEAD:enhancement-1773-klara-swap
