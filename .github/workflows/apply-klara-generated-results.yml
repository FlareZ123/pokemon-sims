name: Apply Klara generated results

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'enhancement-1773-klara-swap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement-1773-klara-swap
          fetch-depth: 0
      - name: Commit matched shell matrices and reports
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/klara-generated-final.b64 | tar -xzf -
          rm -f .github/klara-generated-final.b64
          rm -f .github/workflows/apply-klara-generated-results.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record matched Klara swap statistics'
          git push origin HEAD:enhancement-1773-klara-swap
