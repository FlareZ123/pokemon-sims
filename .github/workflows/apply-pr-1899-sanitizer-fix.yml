name: Apply PR 1899 sanitizer fixture fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1895-quick-ball-payload-cost'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fix Scenario lifetimes in issue 1895 regression fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/issue_1895_quick_ball_payload_cost_tests.cpp')
          text = path.read_text()
          old = '''void test_exact_route_and_boundaries() {
            std::mt19937_64 rng(1895);
            sim::Engine engine = make_engine(strict(), rng, route_state());'''
          new = '''void test_exact_route_and_boundaries() {
            std::mt19937_64 rng(1895);
            // Engine retains these Scenario references: https://eel.is/c++draft/class.temporary#6.10
            const sim::Scenario strict_scenario = strict();
            const sim::Scenario item_locked_scenario = strict(sim::LockMode::FullItem);
            sim::Engine engine = make_engine(strict_scenario, rng, route_state());'''
          replacements = {
              'make_engine(strict(), rng, route_state(), false)': 'make_engine(strict_scenario, rng, route_state(), false)',
              '''sim::Engine item_locked = make_engine(
                strict(sim::LockMode::FullItem), rng, route_state());''': '''sim::Engine item_locked =
                make_engine(item_locked_scenario, rng, route_state());''',
              'make_engine(strict(), rng, std::move(supporter_spent))': 'make_engine(strict_scenario, rng, std::move(supporter_spent))',
              'make_engine(strict(), rng, std::move(one_type))': 'make_engine(strict_scenario, rng, std::move(one_type))',
              'make_engine(strict(), rng, std::move(no_target))': 'make_engine(strict_scenario, rng, std::move(no_target))',
              'make_engine(strict(), rng, std::move(payload_done))': 'make_engine(strict_scenario, rng, std::move(payload_done))',
          }
          if old not in text:
              raise SystemExit('Expected issue 1895 fixture text not found')
          text = text.replace(old, new)
          for source, target in replacements.items():
              if source not in text:
                  raise SystemExit(f'Expected issue 1895 fixture fragment not found: {source}')
              text = text.replace(source, target)
          path.write_text(text)
          PY
          git diff --check
          rm .github/workflows/apply-pr-1899-sanitizer-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix PR 1899 sanitizer fixture lifetimes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
