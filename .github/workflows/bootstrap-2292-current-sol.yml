name: Bootstrap issue 2292 current-main evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/2292-current-main-evidence-sol'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply validated #2292 source and focused regression
        run: |
          git fetch origin a4f4c4bebc178ad1091a0a9fd852bb7c541f5fbe 569254ece9d37ad54cbedd2a4605047b45c12928
          git diff a4f4c4bebc178ad1091a0a9fd852bb7c541f5fbe 569254ece9d37ad54cbedd2a4605047b45c12928 -- CMakeLists.txt src/trace_engine_v2/part_012.inc tests/issue_2292_gladion_final_prize_energy_tests.cpp | git apply -3
      - name: Validate focused route and exact current-main witness
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'issue_2292|trace_issue_2292' --output-on-failure
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 692 --require-ready-by 4
      - name: Regenerate canonical source-bound setup evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired source-bound setup evidence
        run: |
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Validate complete Release suite
        run: ctest --test-dir build --output-on-failure
      - name: Commit validated source and evidence
        run: |
          git rm .github/workflows/bootstrap-2292-current-sol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A CMakeLists.txt src/trace_engine_v2/part_012.inc tests/issue_2292_gladion_final_prize_energy_tests.cpp README.md docs results
          git commit -m 'Fix #2292 Gladion Prize Energy route with current evidence'
          git push origin HEAD:${{ github.head_ref }}
