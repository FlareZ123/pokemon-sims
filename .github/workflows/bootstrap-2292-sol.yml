name: Bootstrap issue 2292 current-main fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/2292-gladion-prize-energy-sol'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed focused patch
        run: |
          git fetch origin 448101d2ab706ab759467674899d6b819b9ddb36 49309ea8c807cf985f1e0cb178cf87c111bc3f1f
          git diff 448101d2ab706ab759467674899d6b819b9ddb36 49309ea8c807cf985f1e0cb178cf87c111bc3f1f -- CMakeLists.txt src/trace_engine_v2/part_012.inc tests/issue_2292_gladion_final_prize_energy_tests.cpp | git apply -3
      - name: Validate exact witness and focused regression
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'issue_2292|trace_issue_2292' --output-on-failure
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 692 --require-ready-by 4
      - name: Commit materialized fix
        run: |
          git rm .github/workflows/bootstrap-2292-sol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt src/trace_engine_v2/part_012.inc tests/issue_2292_gladion_final_prize_energy_tests.cpp
          git commit -m 'Fix #2292 Gladion final Prize Energy finish'
          git push origin HEAD:${{ github.head_ref }}
