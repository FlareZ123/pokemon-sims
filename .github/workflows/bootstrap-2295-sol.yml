name: Bootstrap issue 2295 current-main fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/2295-paid-retreat-blender-sol'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed source-only correction
        run: |
          git fetch origin fix/2295-current-main-reclaim-20260808-sol:refs/remotes/origin/fix/2295-current-main-reclaim-20260808-sol
          git show origin/fix/2295-current-main-reclaim-20260808-sol:scripts/apply_issue_2295_reclaim.py > scripts/apply_issue_2295_reclaim.py
          python scripts/apply_issue_2295_reclaim.py
      - name: Validate exact witnesses
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 29 --require-ready-by 4
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 86 --require-ready-by 4
      - name: Commit materialized fix
        run: |
          git rm .github/workflows/bootstrap-2295-sol.yml scripts/apply_issue_2295_reclaim.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt src/trace_engine_v2/part_014c_latias_bench_override.inc
          git commit -m 'Fix #2295 paid retreat plus held Blender completion'
          git push origin HEAD:${{ github.head_ref }}
