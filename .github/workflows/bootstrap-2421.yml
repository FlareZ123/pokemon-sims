name: Bootstrap issue 2421 materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'fix/2421-tate-dde-routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2421-tate-dde-routes
          fetch-depth: 0
      - name: Apply source and regression fix
        run: python3 tools/materialize_issue_2421.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build focused tests
        run: cmake --build build --target regidrago_unified_tests -j2
      - name: Run focused regression
        run: ctest --test-dir build -R issue_2421_tate_dde_routes_tests --output-on-failure
      - name: Commit final branch content
        run: |
          rm .github/workflows/bootstrap-2421.yml .github/workflows/materialize-2421.yml tools/materialize_issue_2421.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix #2421 DDE-aware Tate routes"
          git push origin HEAD:fix/2421-tate-dde-routes
