name: Bootstrap issue 2423 materialization

on:
  pull_request:
    branches:
      - main

concurrency:
  group: issue-2423-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'fix/2423-legacy-star-dde-projections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2423-legacy-star-dde-projections
          fetch-depth: 0
      - name: Apply source and regression fix
        run: python3 tools/materialize_issue_2423.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build focused tests
        run: cmake --build build --target regidrago_unified_tests -j2
      - name: Run focused regression
        run: ctest --test-dir build -R issue_2423_legacy_star_dde_projection_tests --output-on-failure
      - name: Commit final branch content
        run: |
          rm .github/workflows/bootstrap-2423.yml tools/materialize_issue_2423.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix #2423 Legacy Star DDE projections"
          git push origin HEAD:fix/2423-legacy-star-dde-projections
