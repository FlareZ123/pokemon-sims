name: Bootstrap issue 2443 fix

on:
  push:
    branches:
      - fix/2443-klara-dde-setup-advance

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize production and regression changes
        run: python3 tools/materialize_issue_2443.py
      - name: Build focused regression
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_unified_tests -j2
          ./build/regidrago_unified_tests issue_2443_klara_dde_setup_advance_tests
      - name: Commit clean fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_klara_recovery_override.inc tests/issue_2443_klara_dde_setup_advance_tests.cpp
          git rm .github/workflows/bootstrap-2443-push.yml tools/materialize_issue_2443.py .github/issue-2443-bootstrap-trigger
          git commit -m "Fix #2443 Klara DDE setup-advance projection"
          git push
