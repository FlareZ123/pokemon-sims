name: Bootstrap issue 2444 fix

on:
  push:
    branches:
      - fix/2444-roseanne-dde-energy-recovery

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize production change
        run: python3 tools/materialize_issue_2444.py
      - name: Build simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_sim -j2
      - name: Commit clean source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_014b.inc
          git rm .github/workflows/bootstrap-2444-push.yml tools/materialize_issue_2444.py .github/issue-2444-bootstrap-trigger
          git commit -m "Fix #2444 Roseanne DDE energy-recovery projection"
          git push
