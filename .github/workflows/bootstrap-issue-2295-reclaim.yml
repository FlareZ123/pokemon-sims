name: Bootstrap reclaimed issue 2295
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/2295-current-main-reclaim-20260808-sol'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_issue_2295_reclaim.py
      - name: Build and verify exact regressions
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'issue_2295' --output-on-failure
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 29 --require-ready-by 4 | tee issue-2295-seed29.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 86 --require-ready-by 4 | tee issue-2295-seed86.txt
      - name: Refresh source-bound matrices
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit materialized fix
        run: |
          git rm scripts/apply_issue_2295_reclaim.py .github/workflows/bootstrap-issue-2295-reclaim.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix #2295 paid retreat with held Blender completion'
          git push origin HEAD:${{ github.head_ref }}
