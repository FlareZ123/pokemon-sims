name: Bootstrap issue 2323 current-main port

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  port-reviewed-fix:
    if: github.head_ref == 'fix/2323-current-main-sol'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed source and regression diff only
        run: |
          git fetch origin fix/2323-early-treasure-regi-redundant-payload-sol
          git diff origin/main...origin/fix/2323-early-treasure-regi-redundant-payload-sol -- src tests > /tmp/issue-2323.patch
          git apply --3way /tmp/issue-2323.patch
      - name: Materialize refined current-main port
        run: |
          git rm .github/workflows/bootstrap-issue-2323-port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Fix refined #2323 T1 Treasure Regidrago timer route'
          git push origin HEAD:${{ github.head_ref }}
