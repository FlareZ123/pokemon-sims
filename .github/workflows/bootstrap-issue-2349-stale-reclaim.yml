name: Bootstrap reclaimed issue 2349
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/2349-stale-reclaim-20260808-sol'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materialize reviewed test correction
        run: |
          git fetch origin fix/2349-opening-bench-tapu-characterization:refs/remotes/origin/fix/2349-opening-bench-tapu-characterization
          git checkout origin/fix/2349-opening-bench-tapu-characterization -- tests/opening_bench_tapu_route_tests.cpp
      - name: Validate focused regression
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'regidrago_opening_bench_tapu_route_tests' --output-on-failure
      - name: Commit materialized fix
        run: |
          git rm .github/workflows/bootstrap-issue-2349-stale-reclaim.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/opening_bench_tapu_route_tests.cpp
          git commit -m 'Fix #2349 stale opening Tapu characterization'
          git push origin HEAD:${{ github.head_ref }}
