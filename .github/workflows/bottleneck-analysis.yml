name: Regidrago Bottleneck Analysis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout is required before compiling repository code:
      # https://docs.github.com/en/actions/tutorials/create-an-example-workflow
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile broad bottleneck analyzer
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          tools/regidrago_bottleneck_analysis_v2.cpp
          -o bottleneck_analysis

      - name: Compile balanced-swap confirmer
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          tools/regidrago_bottleneck_confirm.cpp
          -o bottleneck_confirm

      - name: Run paired 10k checkpoint screen
        run: ./bottleneck_analysis 10000 results/bottleneck-analysis

      - name: Run paired 50k all-scenario confirmation
        run: ./bottleneck_confirm 50000 results/bottleneck-confirm

      # Workflow artifacts preserve generated diagnostic CSVs after the job:
      # https://docs.github.com/en/actions/concepts/workflows-and-actions/workflow-artifacts
      - name: Upload checkpoint data
        uses: actions/upload-artifact@v4
        with:
          name: regidrago-shell-bottleneck-checkpoints
          path: |
            results/bottleneck-analysis
            results/bottleneck-confirm
          retention-days: 7
