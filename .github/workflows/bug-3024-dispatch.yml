name: Bug 3024 dispatch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bug/3024-semantic-1552-continuation
      - name: Apply prepared patch
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/bug-3024-materialize.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'bug-3024-materializer', 'exec'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bug-3024-materialize.yml .github/workflows/bug-3024-dispatch.yml
          git add src/trace_engine_v2/part_tate_blender_attachment_override.inc tests/issue_1552_t1_vessel_route_tests.cpp
          git commit -m "Fix #3024: generalize the #1552 continuation semantically"
          git push origin bug/3024-semantic-1552-continuation
