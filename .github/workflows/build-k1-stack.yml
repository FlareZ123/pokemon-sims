name: Build K1 Provenance Stack

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore reviewed stack generator
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/build_k1_stack.py
          python -m py_compile /tmp/build_k1_stack.py
      - name: Create isolated cumulative branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --detach origin/main
          issues=(2070 2072 2073 2074 2076 2077 2078 2079 2080 2081 2082 2083 2084 2085 2086 2087 2088 2089 2090 2091 2092 2093 2094 2096 2097 2098 2099 2100 2101 2102 2103)
          branches=(fix/2070-oricorio-treasure-tapu fix/2072-wonder-tag-burnet-legacy-star fix/2073-fss-treasure-energy fix/2074-wonder-tag-complete-route fix/2076-arven-fss-blender-contention fix/2077-ultra-ball-post-payload-outlet fix/2078-one-discard-known-dead-costs fix/2079-evolution-incense-payload-outlet fix/2080-fss-k1-hold-targets fix/2081-late-steven-vstar-vessel fix/2082-wonder-tag-steven-fss fix/2083-late-steven-payload-treasure fix/2084-duplicate-held-arven fix/2085-late-steven-held-blender fix/2086-late-steven-held-burnet fix/2087-fss-latias-burnet fix/2088-fss-bank-tate fix/2089-arven-quick-ball-latias fix/2090-quick-ball-dialga-vessel fix/2091-blender-known-dead-costs fix/2092-arven-redundant-fss-regression fix/2093-rulebox-late-steven fix/2094-treasure-tapu-projection fix/2096-arven-powerglass fix/2097-fss-complete-quick-ball fix/2098-wonder-tag-redundant-crispin fix/2099-wonder-tag-gladion-held-energy fix/2100-wonder-tag-arven-held-burnet fix/2101-wonder-tag-steven-consistency fix/2102-late-steven-t3-compression fix/2103-wonder-tag-arven-payload)
          for index in "${!issues[@]}"; do
            issue="${issues[$index]}"
            branch="${branches[$index]}"
            python /tmp/build_k1_stack.py . --issue "$issue"
            git add src tests results docs
            git commit -m "Accept Prize-inspection K1 for issue #$issue"
            git push --force origin "HEAD:refs/heads/$branch"
          done
          printf '%s\n' "${branches[@]}" > built-k1-branches.txt
      - uses: actions/upload-artifact@v4
        with:
          name: built-k1-branches
          path: built-k1-branches.txt
