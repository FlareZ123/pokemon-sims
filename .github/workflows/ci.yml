name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-combined-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build release simulator
        run: cmake --build build --parallel 2
      - name: Run focused #4035 regression
        run: ./build/issue_1393_crispin_before_gladion_tests
      - name: Regenerate shell baseline and canonical traces
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Regenerate paired named-deck matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out results/multi_deck_comparison.csv
      - name: Refresh paired manifest provenance
        run: python -c "from pathlib import Path; import hashlib,json; from scripts.baseline_provenance import simulator_policy_source_digest; root=Path('.').resolve(); p=root/'results'/'multi_deck_manifest.json'; m=json.loads(p.read_text(encoding='utf-8')); m['simulator_policy_source_sha256']=simulator_policy_source_digest(root); m['comparison_csv_sha256']=hashlib.sha256((root/'results'/'multi_deck_comparison.csv').read_bytes()).hexdigest(); p.write_text(json.dumps(m, indent=2, sort_keys=True)+'\\n', encoding='utf-8')"
      - name: Refresh generated reports
        run: |
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit exact generated evidence
        run: |
          rm -f results/*.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs README.md
          if git diff --cached --quiet; then
            echo "No generated evidence changes"
          else
            git commit -m "Refresh #4035 combined generated evidence"
            git push origin HEAD:${{ github.ref_name }}
          fi
