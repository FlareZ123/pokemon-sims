name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase-clean-4026:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reapply focused #4026 commits on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git cherry-pick de0766665350ad899dea618397ba58b40f89ae3f
          git cherry-pick 7484aebec6851174e7bf7d5b5a0639e365f6270a
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git commit -m "Restore permanent CI after #4026 rebase"
          git push origin HEAD:fix/4026-steven-treasure-lock-reclaim
