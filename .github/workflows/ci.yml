name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print simulator policy digest
        run: python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print('DIGEST=' + simulator_policy_source_digest(Path('.')))"
