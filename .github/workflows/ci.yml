name: CI

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync-issue-3561-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Commit exact generated evidence to final bug branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: bug-3561-relative-vessel-final
          SOURCE_DIGEST: 5792ed5d58e98c94e2798aff090b3eabb6157a710243aca79e935c3acca5cfb8
          ARTIFACT_ID: "9238889171"
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/evidence.zip
          mkdir -p /tmp/evidence
          unzip -q /tmp/evidence.zip -d /tmp/evidence
          cp /tmp/evidence/t2-t3-matrix.csv results/simulation_results.csv
          cp /tmp/evidence/multi-deck-matrix.csv results/multi_deck_comparison.csv
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path('.')
          source_digest = os.environ['SOURCE_DIGEST']
          comparison = root / 'results/multi_deck_comparison.csv'
          comparison_sha = hashlib.sha256(comparison.read_bytes()).hexdigest()
          baseline = root / 'results/baseline_manifest.json'
          data = json.loads(baseline.read_text(encoding='utf-8'))
          data['simulator_policy_source_sha256'] = source_digest
          baseline.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          multi = root / 'results/multi_deck_manifest.json'
          data = json.loads(multi.read_text(encoding='utf-8'))
          data['comparison_csv_sha256'] = comparison_sha
          data['simulator_policy_source_sha256'] = source_digest
          multi.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('comparison_sha256=' + comparison_sha)
          PY
          python scripts/update_setup_docs.py
          python scripts/update_multi_deck_docs.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in ('results/simulation_results.csv', 'results/multi_deck_comparison.csv'):
              data = Path(path).read_bytes()
              print(path, hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulation_results.csv results/multi_deck_comparison.csv results/baseline_manifest.json results/multi_deck_manifest.json docs/REPORT.md docs/TRACE_AUDIT.md docs/MULTI_DECK_REPORT.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "Fix #3561: refresh generated simulation evidence"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
