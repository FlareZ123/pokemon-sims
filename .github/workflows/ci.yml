name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2 --target regidrago_sim
      - name: Validate strict-jit go-first seed 43
        shell: bash
        run: |
          set -euo pipefail
          # Quick Ball: https://api.pokemontcg.io/v2/cards/swsh1-179
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Advanced rules: https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
          # Policy priorities: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace.txt
          grep -Fq "T1 | DISCARD | rules: R-QB-01 | Grass Energy (Quick Ball cost)" trace.txt
          grep -Fq "T1 | PLAY ITEM | rules: R-QB-01" trace.txt
          grep -Fq "T2 | HOLD SUPPORTER | rules: R-MT-01; R-TAPU-01; R-CRISPIN-01" trace.txt
          grep -Fq "T2 | DISCARD | rules: R-MT-01; P-JIT-01 | Dragapult ex (Mysterious Treasure cost)" trace.txt
          grep -Fq "T2 | WONDER TAG | rules: R-TAPU-01 | Searched and revealed Crispin." trace.txt
          grep -Fq "T2 | PLAY SUPPORTER | rules: R-CRISPIN-01; R-GAME-SUPPORTER" trace.txt
          grep -Fq "T2 | READY | rules: R-RVS-01; P-JIT-01" trace.txt
