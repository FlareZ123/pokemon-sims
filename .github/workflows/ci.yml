name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --parallel 2
      - name: Run eight independent simulate-this audits
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-3.txt
          # Steven may search up to three cards. Held Fire plus target-legal Quick Ball
          # already completes the T3 Energy and strict-JIT payload axes, so preserve
          # Crispin and the one-copy ACE SPEC after taking the missing VSTAR card:
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sv6-130
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://api.pokemontcg.io/v2/cards/sv8-164
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/issues/952
          # https://github.com/FlareZ123/pokemon-sims/issues/978
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee trace-4.txt
          grep -q "Searched up to 3 cards: Regidrago VSTAR. Turn ended." trace-4.txt
          grep -q "T3 | DISCARD.*Dragapult ex (Quick Ball cost)" trace-4.txt
          ! grep -q "Searched up to 3 cards: Regidrago VSTAR, Crispin" trace-4.txt
          ! grep -q "Searched up to 3 cards: Regidrago VSTAR, Brilliant Blender" trace-4.txt
          grep -q "T3 | READY" trace-4.txt
          # Quick Ball must preserve the strict-JIT Dragon until the VSTAR card axis is reachable:
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/issues/953
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 19 --require-ready-by 3 | tee trace-5.txt
          # Earthen Vessel must preserve its one-discard payload outlet until VSTAR is reachable:
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/issues/954
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 42 --require-ready-by 3 | tee trace-6.txt
          # Quick Ball must take the live Tapu Lele-GX -> Crispin connector before Vessel:
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sm2-60
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/issues/962
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee trace-7.txt
          grep -q "Searched a Basic Pokémon: Tapu Lele-GX" trace-7.txt
          grep -q "WONDER TAG.*Searched and revealed Crispin" trace-7.txt
          # The source-bounded seed-43 route spends one dynamically replaceable Grass
          # on T1, then preserves the T2 Supporter play while Mysterious Treasure
          # discards Dragapult ex and searches Tapu Lele-GX for Wonder Tag into Crispin:
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sm2-60
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/sv6-130
          # https://api.pokemontcg.io/v2/cards/swsh12-135
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/issues/1209
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace-8.txt
          grep -q "T1 | DISCARD.*Grass Energy (Quick Ball cost)" trace-8.txt
          grep -q "searched a Basic Pokemon: Regidrago V" trace-8.txt
          grep -q "T2 | HOLD SUPPORTER.*Mysterious Treasure to Tapu Lele-GX to Crispin" trace-8.txt
          grep -q "T2 | DISCARD.*Dragapult ex (Mysterious Treasure cost)" trace-8.txt
          grep -q "T2 | WONDER TAG.*Crispin" trace-8.txt
          grep -q "T2 | PLAY SUPPORTER.*R-CRISPIN-01" trace-8.txt
          ! grep -q "STAR ALCHEMY" trace-8.txt
          grep -q "T2 | READY" trace-8.txt
      - name: Run three reviewed Pineco setup audits
        shell: bash
        run: |
          set -euo pipefail
          # Seed 35 has a complete K1 direct route. Steven banks Crispin and a
          # Dragon payload, then held Mysterious Treasure supplies its own discard
          # cost while preserving Secret Box, Pineco, Forretress ex, Bench space,
          # and the self-Knock-Out for later turns:
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sv6-130
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://api.pokemontcg.io/v2/cards/sv6-163
          # https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # https://github.com/FlareZ123/pokemon-sims/issues/1420
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee pineco-trace-35.txt
          grep -q "banked Crispin and Dragapult ex" pineco-trace-35.txt
          grep -q "Dragapult ex (Mysterious Treasure cost)" pineco-trace-35.txt
          grep -q "without advancing the Pineco line" pineco-trace-35.txt
          ! grep -q "Secret Box discarded three other cards" pineco-trace-35.txt
          ! grep -q "T2 | EXPLODING ENERGY" pineco-trace-35.txt
          ! grep -q "T2 | EVOLVE | rules: R-FORRETRESS-01" pineco-trace-35.txt
          grep -q "T2 | READY" pineco-trace-35.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 18 --require-ready-by 2 | tee pineco-trace-18.txt
          grep -q "Arven banked the next-turn Secret Box route" pineco-trace-18.txt
          grep -q "T2 | READY" pineco-trace-18.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 40 --require-ready-by 2 | tee pineco-trace-40.txt
          grep -q "Gladion recovered the legally known prized Secret Box" pineco-trace-40.txt
          grep -q "T2 | READY" pineco-trace-40.txt
      - name: Generate canonical T2 and T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-matrix.csv
      - name: Verify canonical shell matrix
        run: cmp t2-t3-matrix.csv results/simulation_results.csv
      - name: Generate paired two-deck T2, T3, and T4 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-matrix.csv
      - name: Verify committed paired matrix
        run: cmp multi-deck-matrix.csv results/multi_deck_comparison.csv
      - name: Record simulator policy source digest
        run: >-
          python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))"
          | tee simulator-policy-source-sha256.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Record tested source
        run: git rev-parse HEAD > tested-head.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_attempt }}
          path: |
            trace-*.txt
            pineco-trace-*.txt
            t2-t3-matrix.csv
            multi-deck-matrix.csv
            simulator-policy-source-sha256.txt
            tested-head.txt
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
          if-no-files-found: warn

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer targets once
        run: cmake --build build-sanitizers --parallel 2
      - name: Run complete sanitizer suite
        env:
          # Detect the reference-parameter lifetime failure covered by issue #907:
          # https://eel.is/c++draft/class.temporary#6.10
          # https://github.com/FlareZ123/pokemon-sims/issues/907
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitizers --parallel 2 --output-on-failure
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-validation-${{ github.run_attempt }}
          path: build-sanitizers/Testing
          if-no-files-found: warn

  # BEGIN ISSUE 1513 SOURCE-BOUND APPLY
  apply_issue_1513:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-1513-turo-before-tapu'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply confirmed issue 1513 source and regression
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one patch anchor in {path}")
              temporary = path.with_suffix(path.suffix + ".tmp")
              temporary.write_text(text.replace(old, new, 1), encoding="utf-8")
              os.replace(temporary, path)

          source_path = Path("src/trace_engine_v2/part_issue_991_wonder_tag_burnet_legacy_star_override.inc")
          old_predicate_anchor = '''  void trace_tapu_hold_once(std::string_view key, std::string_view rules,
                             std::string_view detail) {
'''
          new_predicate_anchor = '''  bool held_turo_direct_active_promotion_route() const {
    // Professor Turo's Scenario directly removes a Basic Active and forces a
    // Benched replacement. When a complete Regidrago VSTAR is already Benched,
    // preserve Tapu Lele-GX and its one-shot Wonder Tag instead of creating a
    // longer Tapu -> Tate & Liza route for the same Active-position axis:
    // Professor Turo's Scenario: https://api.pokemontcg.io/v2/cards/sv4-171
    // Tapu Lele-GX / Wonder Tag: https://api.pokemontcg.io/v2/cards/sm2-60
    // Tate & Liza: https://api.pokemontcg.io/v2/cards/sm7-148
    // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Supporter and Active-replacement procedure: https://www.pokemon.com/us/pokemon-tcg/rules
    // Direct-connector priority: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1513
    const bool active_regidrago_has_ready_direct_evolution = state_.active &&
        state_.active->card == Card::RegidragoV &&
        state_.active->entered_turn < state_.turn &&
        hand_count(Card::RegidragoVstar) > 0 &&
        state_.active->grass >= 2 && state_.active->fire >= 1;

    // Under Item lock, Turo may solve the Active axis one turn before Burnet solves
    // the strict-JIT payload axis. Preserve the existing delayed-Burnet contract:
    // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
    // Strict-JIT policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
    // Prior route contract: https://github.com/FlareZ123/pokemon-sims/issues/900
    const bool delayed_burnet_payload_route = strict_payload_timing() && item_locked() &&
        need_payload() && state_.turn < scenario_.max_turn &&
        hand_count(Card::ProfessorBurnet) > 0 && payload_might_be_in_deck();
    if (!supporter_allowed() || hand_count(Card::ProfessorTuro) == 0 || !state_.active ||
        !is_basic(state_.active->card) || active_regidrago_has_ready_direct_evolution ||
        !need_active_vstar() || need_regi() || need_vstar() || need_energy() ||
        (need_payload() && !delayed_burnet_payload_route) || can_free_retreat_with_latias() ||
        hand_count(Card::TateLiza) > 0) {
      return false;
    }

    return std::any_of(state_.bench.begin(), state_.bench.end(), [](const Pokemon& pokemon) {
      return pokemon.card == Card::RegidragoVstar && pokemon.grass >= 2 && pokemon.fire >= 1;
    });
  }

  void trace_tapu_hold_once(std::string_view key, std::string_view rules,
                             std::string_view detail) {
'''
          replace_once(source_path, old_predicate_anchor, new_predicate_anchor)

          old_wrapper_anchor = '''  bool bench_tapu_if_useful() {
    if (held_banked_steven_has_known_t3_active_regi_route()) {
'''
          new_wrapper_anchor = '''  bool bench_tapu_if_useful() {
    if (held_turo_direct_active_promotion_route()) {
      // Held Professor Turo already removes the Basic Active and promotes the
      // complete Benched Regidrago VSTAR. Do not spend Tapu Lele-GX, its Bench
      // slot, Wonder Tag, and Tate & Liza on the same Active-position axis:
      // Professor Turo's Scenario: https://api.pokemontcg.io/v2/cards/sv4-171
      // Tapu Lele-GX / Wonder Tag: https://api.pokemontcg.io/v2/cards/sm2-60
      // Tate & Liza: https://api.pokemontcg.io/v2/cards/sm7-148
      // Active-replacement procedure: https://www.pokemon.com/us/pokemon-tcg/rules
      // Direct-connector priority: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
      // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1513
      trace_tapu_hold_once(
          "issue-1513-held-turo-active-promotion",
          "R-TURO-01; R-TAPU-01; R-TATE-01; R-GAME-SUPPORTER; P-CONNECTOR-01",
          "Retained Tapu because held Professor Turo directly promotes the complete Benched Regidrago VSTAR.");
      return false;
    }
    if (held_banked_steven_has_known_t3_active_regi_route()) {
'''
          replace_once(source_path, old_wrapper_anchor, new_wrapper_anchor)

          test_path = Path("tests/issue_1513_turo_over_tapu_tests.cpp")
          test_content = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <algorithm>
#include <random>
#include <stdexcept>
#include <string>
#include <utility>

namespace sim {

struct EngineTestAccess {
  static void set_state(Engine& engine, State state) {
    engine.state_ = std::move(state);
    engine.deck_seen_ = true;
    engine.prizes_revealed_ = true;
  }

  static bool held_turo_route(const Engine& engine) {
    return engine.held_turo_direct_active_promotion_route();
  }

  static bool bench_tapu(Engine& engine) {
    return engine.bench_tapu_if_useful();
  }

  static bool play_turo(Engine& engine) {
    return engine.play_turo_active_promotion_route();
  }

  static const State& state(const Engine& engine) {
    return engine.state_;
  }
};

}  // namespace sim

namespace {

void expect(const bool condition, const char* message) {
  if (!condition) throw std::runtime_error(message);
}

bool contains(const std::vector<sim::Card>& cards, const sim::Card card) {
  return std::find(cards.begin(), cards.end(), card) != cards.end();
}

bool trace_contains(const sim::TraceLog& trace, const std::string& text) {
  return std::any_of(trace.lines.begin(), trace.lines.end(), [&text](const std::string& line) {
    return line.find(text) != std::string::npos;
  });
}

sim::State exact_t3_state() {
  sim::State state;
  state.turn = 3;
  state.active = sim::Pokemon{sim::Card::DialgaGX, 0};
  state.bench = {
      sim::Pokemon{sim::Card::RegidragoVstar, 1, 2, 1, sim::Tool::ForestSealStone},
      sim::Pokemon{sim::Card::Oricorio, 1},
      sim::Pokemon{sim::Card::RegidragoV, 1}};
  state.hand = {
      sim::Card::TapuLeleGX,
      sim::Card::ProfessorTuro,
      sim::Card::Fire,
      sim::Card::BrilliantBlender};
  state.discard = {
      sim::Card::MysteriousTreasure,
      sim::Card::Dragapult,
      sim::Card::Crispin};
  return state;
}

void test_exact_state_preserves_tapu_and_uses_direct_turo() {
  const auto scenario = sim::scenario_by_label("no-discard-control/go-first");
  const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
  expect(scenario.has_value() && deck != nullptr, "The issue-1513 fixture is unavailable.");

  std::mt19937_64 rng(151301);
  sim::Engine engine(*scenario, deck->recipe, rng);
  sim::EngineTestAccess::set_state(engine, exact_t3_state());

  // Turo directly returns the Basic Active and the complete Benched VSTAR becomes
  // Active. Tapu -> Wonder Tag -> Tate spends extra discrete resources for the same
  // axis: https://api.pokemontcg.io/v2/cards/sv4-171
  // https://api.pokemontcg.io/v2/cards/sm2-60
  // https://api.pokemontcg.io/v2/cards/sm7-148
  // https://www.pokemon.com/us/pokemon-tcg/rules
  // https://github.com/FlareZ123/pokemon-sims/issues/1513
  expect(sim::EngineTestAccess::held_turo_route(engine),
         "The direct held-Turo route was not recognized.");
  expect(!sim::EngineTestAccess::bench_tapu(engine),
         "Tapu Lele-GX was still Benched before the direct Turo route.");
  expect(sim::EngineTestAccess::play_turo(engine),
         "Professor Turo did not execute the direct Active-promotion route.");

  const sim::State& state = sim::EngineTestAccess::state(engine);
  expect(state.active && state.active->card == sim::Card::RegidragoVstar,
         "The complete Benched Regidrago VSTAR was not promoted.");
  expect(contains(state.hand, sim::Card::DialgaGX),
         "The Basic Active was not returned to hand.");
  expect(contains(state.hand, sim::Card::TapuLeleGX),
         "Tapu Lele-GX was not preserved in hand.");
  expect(contains(state.discard, sim::Card::ProfessorTuro),
         "Professor Turo was not consumed as the Supporter action.");
  expect(!state.retreat_used,
         "The direct Turo route incorrectly consumed the Retreat action.");
  expect(std::none_of(state.bench.begin(), state.bench.end(), [](const sim::Pokemon& pokemon) {
           return pokemon.card == sim::Card::TapuLeleGX;
         }),
         "Tapu Lele-GX remained as an avoidable two-Prize Bench liability.");
}

void test_route_boundaries_preserve_existing_choices() {
  const auto scenario = sim::scenario_by_label("no-discard-control/go-first");
  const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
  expect(scenario.has_value() && deck != nullptr, "The boundary fixture is unavailable.");

  auto route_from = [&](sim::State state, const std::uint64_t seed) {
    std::mt19937_64 rng(seed);
    sim::Engine engine(*scenario, deck->recipe, rng);
    sim::EngineTestAccess::set_state(engine, std::move(state));
    return sim::EngineTestAccess::held_turo_route(engine);
  };

  sim::State no_turo = exact_t3_state();
  no_turo.hand.erase(std::remove(no_turo.hand.begin(), no_turo.hand.end(), sim::Card::ProfessorTuro),
                     no_turo.hand.end());
  expect(!route_from(std::move(no_turo), 151302),
         "The route was admitted without Professor Turo.");

  sim::State held_tate = exact_t3_state();
  held_tate.hand.push_back(sim::Card::TateLiza);
  expect(!route_from(std::move(held_tate), 151303),
         "The existing naturally held Tate & Liza preference was displaced.");

  sim::State incomplete_vstar = exact_t3_state();
  incomplete_vstar.bench.front().grass = 1;
  expect(!route_from(std::move(incomplete_vstar), 151304),
         "The route was admitted without a complete Benched GGF VSTAR.");

  sim::State free_retreat = exact_t3_state();
  free_retreat.bench.push_back(sim::Pokemon{sim::Card::LatiasEx, 1});
  expect(!route_from(std::move(free_retreat), 151305),
         "Turo displaced an already-live zero-Retreat Latias route.");
}

void test_seed_47_uses_turo_without_tapu_tate_chain() {
  const auto scenario = sim::scenario_by_label("no-discard-control/go-first");
  const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
  expect(scenario.has_value() && deck != nullptr, "The seed-47 fixture is unavailable.");

  std::mt19937_64 rng(47);
  sim::TraceLog trace{true, {}};
  sim::Engine engine(*scenario, deck->recipe, rng, &trace);
  const sim::TrialOutcome outcome = engine.run();

  // The source-bound seed must keep its earliest T3 readiness while avoiding the
  // UDP Tapu, Wonder Tag, and Tate chain: https://api.pokemontcg.io/v2/cards/sv4-171
  // https://api.pokemontcg.io/v2/cards/sm2-60
  // https://api.pokemontcg.io/v2/cards/sm7-148
  // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
  // https://github.com/FlareZ123/pokemon-sims/issues/1513
  expect(outcome.first_ready_turn == 3 && !outcome.setup_failed,
         "Seed 47 did not retain its earliest T3 ready state.");
  expect(trace_contains(trace, "T3 | HOLD TAPU LELE-GX") &&
             trace_contains(trace, "T3 | PLAY SUPPORTER") &&
             trace_contains(trace, "Professor Turo returned the Basic Active Pokémon"),
         "Seed 47 did not use the preserved-Tapu direct Turo route.");
  expect(!trace_contains(trace, "T3 | BENCH | Tapu Lele-GX") &&
             !trace_contains(trace, "T3 | WONDER TAG") &&
             !trace_contains(trace, "T3 | PLAY SUPPORTER | Tate & Liza"),
         "Seed 47 still used the longer Tapu -> Tate & Liza chain.");

  const sim::State& state = sim::EngineTestAccess::state(engine);
  expect(state.active && state.active->card == sim::Card::RegidragoVstar,
         "Seed 47 did not finish with the complete Regidrago VSTAR Active.");
  expect(contains(state.hand, sim::Card::DialgaGX),
         "Seed 47 did not return Dialga-GX to hand.");
  expect(contains(state.hand, sim::Card::TapuLeleGX),
         "Seed 47 did not preserve Tapu Lele-GX in hand.");
  expect(!state.retreat_used,
         "Seed 47 incorrectly consumed the Retreat action.");
}

}  // namespace

int main() {
  test_exact_state_preserves_tapu_and_uses_direct_turo();
  test_route_boundaries_preserve_existing_choices();
  test_seed_47_uses_turo_without_tapu_tate_chain();
  return 0;
}
