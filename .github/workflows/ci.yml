name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate-this-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Run simulate-this audit
        shell: bash
        run: |
          set -euo pipefail
          # Quick Ball: https://api.pokemontcg.io/v2/cards/swsh1-179
          # Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Advanced rules: https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee trace-pass-2.txt
          grep -q "Searched a Basic Pokémon: Tapu Lele-GX" trace-pass-2.txt
          grep -q "WONDER TAG.*Searched and revealed Crispin" trace-pass-2.txt
          grep -q "READY" trace-pass-2.txt
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: simulate-this-pass-2
          path: trace-pass-2.txt
          if-no-files-found: error
