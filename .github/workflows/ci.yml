name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current-main seed-58 regression contract
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > /tmp/ci-main.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/ci-main.yml')
          text = path.read_text()
          old = '''          # Steven may search up to three cards. Held Fire plus target-legal Quick Ball
          # already completes the T3 Energy and strict-JIT payload axes, so preserve
          # Crispin and the one-copy ACE SPEC after taking the missing VSTAR card:
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sv6-130
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://api.pokemontcg.io/v2/cards/sv8-164
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/issues/952
          # https://github.com/FlareZ123/pokemon-sims/issues/978
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee trace-4.txt
          grep -q "Searched up to 3 cards: Regidrago VSTAR. Turn ended." trace-4.txt
          grep -q "T3 | DISCARD.*Dragapult ex (Quick Ball cost)" trace-4.txt
          assert_absent "Searched up to 3 cards: Regidrago VSTAR, Crispin" trace-4.txt
          assert_absent "Searched up to 3 cards: Regidrago VSTAR, Brilliant Blender" trace-4.txt
          grep -q "T3 | READY" trace-4.txt
'''
          new = '''          # Steven may search up to three unrestricted cards. In this K1 state the
          # free second target banks Brilliant Blender with Regidrago VSTAR, preserving
          # Quick Ball and the held Dragon payload for the ready turn:
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/sv8-164
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sv6-130
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # https://github.com/FlareZ123/pokemon-sims/issues/3653
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee trace-4.txt
          grep -q "Searched up to 3 cards: Regidrago VSTAR, Brilliant Blender. Turn ended." trace-4.txt
          assert_absent "T3 | DISCARD.*Dragapult ex (Quick Ball cost)" trace-4.txt
          grep -q "T3 | READY" trace-4.txt
'''
          if old not in text:
              raise SystemExit('seed-58 contract block did not match current main')
          Path('.github/workflows/ci.yml').write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Fix #3653 CI regression contract"
          git push origin HEAD
