name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1786908861701
          fetch-depth: 0
      - name: Regenerate multi-deck report
        run: python scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MULTI_DECK_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Cleanup: regenerate rebased multi-deck report"
          git push origin HEAD:cleanup-1786908861701
