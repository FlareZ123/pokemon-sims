name: Matrix artifact readback

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  read-matrix:
    runs-on: ubuntu-24.04
    steps:
      - name: Download existing release evidence
        uses: actions/download-artifact@v4
        with:
          name: release-validation-1
          path: evidence
          github-token: ${{ github.token }}
          repository: FlareZ123/pokemon-sims
          run-id: 37476942317
      - name: Print canonical T2/T3 matrix
        run: cat evidence/t2-t3-matrix.csv
