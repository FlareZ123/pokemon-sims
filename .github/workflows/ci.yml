name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2 --target regidrago_sim
      - name: Validate strict-jit go-second seed 1
        shell: bash
        run: |
          set -euo pipefail
          # Hisuian Heavy Ball: https://api.pokemontcg.io/v2/cards/asr-146
          # Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
          # Latias ex: https://api.pokemontcg.io/v2/cards/sv8-76
          # Advanced rules: https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
          # Policy priorities: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace.txt
          grep -q "Heavy Ball for Tapu Lele-GX" trace.txt
          grep -q "WONDER TAG.*Steven's Resolve" trace.txt
          grep -q "Searched up to 3 cards: Regidrago VSTAR, Crispin, Latias ex" trace.txt
          grep -q "T2 | PLAY SUPPORTER.*R-CRISPIN-01" trace.txt
          grep -q "T2 | PLAY ITEM.*R-BLENDER-01" trace.txt
          grep -q "T2 | RETREAT.*R-LATIAS-01" trace.txt
          grep -q "T2 | READY" trace.txt
