name: CI

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  refresh-generated-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the already-computed validation artifact
        uses: actions/download-artifact@v8
        with:
          name: release-validation-1
          path: validation-evidence
          github-token: ${{ github.token }}
          repository: FlareZ123/pokemon-sims
          run-id: 31927754132
      - name: Refresh generated evidence without re-running aggregate simulation
        shell: bash
        run: |
          set -euo pipefail
          cp validation-evidence/t2-t3-matrix.csv results/simulation_results.csv
          cp validation-evidence/multi-deck-matrix.csv results/multi_deck_comparison.csv
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)

          baseline_path = root / 'results' / 'baseline_manifest.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          baseline['simulator_policy_source_sha256'] = digest
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          comparison_path = root / 'results' / 'multi_deck_comparison.csv'
          multi_path = root / 'results' / 'multi_deck_manifest.json'
          multi = json.loads(multi_path.read_text(encoding='utf-8'))
          multi['simulator_policy_source_sha256'] = digest
          multi['comparison_csv_sha256'] = hashlib.sha256(comparison_path.read_bytes()).hexdigest()
          multi_path.write_text(json.dumps(multi, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
      - name: Restore permanent CI and commit exact generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml results docs README.md
          git commit -m "Refresh #4026 generated evidence from CI artifact"
          git push origin HEAD:fix/4026-steven-treasure-lock-reclaim
