name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - name: Generate one paired matrix and print evidence
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-matrix.csv
          python scripts/extract_deck_matrix.py --input multi-deck-matrix.csv --output t2-t3-matrix.csv --deck regidrago-shell
          printf '%s\n' '=== MULTI_DECK_MATRIX ==='
          cat multi-deck-matrix.csv
          printf '%s\n' '=== SHELL_MATRIX ==='
          cat t2-t3-matrix.csv
          printf '%s\n' '=== SOURCE_DIGEST ==='
          python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))"
          exit 1
