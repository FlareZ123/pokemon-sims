name: CI

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  matrix-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Download retained paired-matrix artifact
        uses: actions/download-artifact@v4
        with:
          name: release-validation-1
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31867933512
      - name: Print exact T2/T3 matrix from retained 100k run
        shell: bash
        run: |
          # Reuse the retained paired run rather than recomputing another 100k trials.
          # Official action: https://github.com/actions/download-artifact
          # Source run: https://github.com/FlareZ123/pokemon-sims/actions/runs/31867933512
          cat evidence/t2-t3-matrix.csv
