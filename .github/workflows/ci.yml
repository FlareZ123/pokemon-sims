name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate-this-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Run simulate-this audit
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
          # Quick Ball: https://api.pokemontcg.io/v2/cards/swsh1-179
          # Dragapult ex: https://api.pokemontcg.io/v2/cards/sv6-130
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Advanced rules: https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee trace-pass-1.txt
          grep -q "Searched up to 3 cards: Regidrago VSTAR, Brilliant Blender. Turn ended." trace-pass-1.txt
          if grep -q "T3 | DISCARD.*Dragapult ex (Quick Ball cost)" trace-pass-1.txt; then
            echo "Premature Quick Ball payload discard detected" >&2
            exit 1
          fi
          grep -q "T3 | READY" trace-pass-1.txt
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: simulate-this-pass-1-independent
          path: trace-pass-1.txt
          if-no-files-found: error
