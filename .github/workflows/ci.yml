name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'fix/issue-1634-secret-box-latias-burnet'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Capture independent traces
        shell: bash
        run: |
          set +e
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 123 --require-ready-by 4 > issue-1634-seed-123.txt 2>&1
          seed_status=$?
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 137 > issue-1634-shell-137.txt 2>&1
          shell_status=$?
          ./build/regidrago_sim --simulate-this --model-variant crobat2-erika-channeler --scenario no-discard-control/go-first --seed 83 > issue-1634-crobat-83.txt 2>&1
          crobat_status=$?
          printf 'seed123=%s\nshell137=%s\ncrobat83=%s\n' "$seed_status" "$shell_status" "$crobat_status" | tee statuses.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: issue-1634-route-diagnostics-${{ github.run_attempt }}
          path: |
            statuses.txt
            issue-1634-*.txt
            build/regidrago_unified_tests
          if-no-files-found: error
