name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate-this-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Run simulate-this audit
        shell: bash
        run: |
          set -euo pipefail
          # Quick Ball: https://api.pokemontcg.io/v2/cards/swsh1-179
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Dragapult ex: https://api.pokemontcg.io/v2/cards/sv6-130
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Advanced rules: https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace-pass-3.txt
          grep -q "T1 | DISCARD.*Grass Energy (Quick Ball cost)" trace-pass-3.txt
          grep -q "T2 | DISCARD.*Dragapult ex (Mysterious Treasure cost)" trace-pass-3.txt
          grep -q "T2 | WONDER TAG.*Crispin" trace-pass-3.txt
          grep -q "T2 | READY" trace-pass-3.txt
          if grep -q "STAR ALCHEMY" trace-pass-3.txt; then
            echo "Dominated Star Alchemy route detected" >&2
            exit 1
          fi
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: simulate-this-pass-3
          path: trace-pass-3.txt
          if-no-files-found: error
