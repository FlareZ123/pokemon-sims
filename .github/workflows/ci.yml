    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1786908861701
          fetch-depth: 0
      - name: Restore Forretress cleanup anchors
        run: |
          python -c 'from pathlib import Path; p=Path("CARD_CLASS_CLEANUP.md"); lines=p.read_text().splitlines(); para="The namespace-scope Forretress composition has its canonical package at `src/trace_engine_v2/core/forretress/package.inc`. Public scenario aliases and registry declarations live in `src/trace_engine_v2/core/forretress/scenario_contract.inc`, keeping namespace contract ownership separate from runtime mechanics and scenario-family composition at the same verified boundary. `part_014c.inc` now consumes the canonical package directly at the same post-Engine namespace boundary, and the historical `src/trace_engine_v2/part_forretress_ex_combo.inc` forwarding path is retired and should not be recreated. Canonical package: https://github.com/FlareZ123/pokemon-sims/blob/main/src/trace_engine_v2/core/forretress/package.inc Canonical contract: https://github.com/FlareZ123/pokemon-sims/blob/main/src/trace_engine_v2/core/forretress/scenario_contract.inc C++ textual-include semantics: https://eel.is/c++draft/cpp.include"; bullet="- Forretress namespace composition: `src/trace_engine_v2/core/forretress/package.inc`; registry declarations remain in `src/trace_engine_v2/core/forretress/scenario_contract.inc`, with runtime mechanics in `core/forretress/runtime.inc`."; step="7. Keep `core/forretress/package.inc` as the sole namespace-scope Forretress composition owner and `core/forretress/scenario_contract.inc` as the registry declaration owner. `part_014c.inc` consumes the package directly and the historical `part_forretress_ex_combo.inc` forwarding path is retired; do not recreate that compatibility layer."; counts=[0,0,0]; out=[]; [(counts.__setitem__(0,counts[0]+1),out.append(para)) if line.startswith("The namespace-scope Forretress composition") else (counts.__setitem__(1,counts[1]+1),out.append(bullet)) if line.startswith("- Forretress namespace composition:") else (counts.__setitem__(2,counts[2]+1),out.append(step)) if line.startswith("7. Keep ") and "Forretress composition owner" in line else out.append(line) for line in lines]; assert counts==[1,1,1], counts; p.write_text("\n".join(out)+"\n")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CARD_CLASS_CLEANUP.md
          git commit -m "Cleanup: restore Forretress plan anchors"
          git push origin HEAD:cleanup-1786908861701
