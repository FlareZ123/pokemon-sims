name: CI

on:
  push:
    branches: [fix/issue-1513-turo-before-tapu]

permissions:
  contents: write

concurrency:
  group: issue-1513-regeneration
  cancel-in-progress: true

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regenerate-1513]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1513-turo-before-tapu
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove temporary digest probe
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("tests/issue_1513_turo_over_tapu_tests.cpp")
          text = path.read_text(encoding="utf-8")
          text = text.replace("#include <cstdlib>\n", "", 1)
          old = '''int main() {
            const int digest_status = std::system(
                "python3 -c \\"from pathlib import Path; import sys; "
                "root=Path('..').resolve(); sys.path.insert(0,str(root)); "
                "from scripts.baseline_provenance import simulator_policy_source_digest; "
                "print('ISSUE1513_SOURCE_DIGEST='+simulator_policy_source_digest(root))\\"");
            expect(digest_status == 0, "The source-digest probe failed.");
          '''
          if old not in text:
              raise SystemExit("Digest probe block was not found exactly once")
          text = text.replace(old, "int main() {\n", 1)
          temporary = path.with_suffix(path.suffix + ".tmp")
          temporary.write_text(text, encoding="utf-8")
          os.replace(temporary, path)
          PY
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Regenerate fixed-seed matrices atomically
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out simulation-results.tmp
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-comparison.tmp
          python - <<'PY'
          import os
          from pathlib import Path
          os.replace(Path("simulation-results.tmp"), Path("results/simulation_results.csv"))
          os.replace(Path("multi-deck-comparison.tmp"), Path("results/multi_deck_comparison.csv"))
          PY
      - name: Refresh source-bound manifests and reports
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import tempfile
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path(".").resolve()
          digest = simulator_policy_source_digest(root)

          def atomic_json(path: Path, value: dict[str, object]) -> None:
              with tempfile.NamedTemporaryFile("w", encoding="utf-8", newline="\n", dir=path.parent, delete=False) as handle:
                  json.dump(value, handle, indent=2)
                  handle.write("\n")
                  temporary = Path(handle.name)
              os.replace(temporary, path)

          baseline_path = root / "results" / "baseline_manifest.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["simulator_policy_source_sha256"] = digest
          atomic_json(baseline_path, baseline)

          comparison_path = root / "results" / "multi_deck_comparison.csv"
          comparison_sha = hashlib.sha256(comparison_path.read_bytes()).hexdigest()
          multi_path = root / "results" / "multi_deck_manifest.json"
          multi = json.loads(multi_path.read_text(encoding="utf-8"))
          multi["comparison_csv_sha256"] = comparison_sha
          multi["simulator_policy_source_sha256"] = digest
          atomic_json(multi_path, multi)
          print(f"simulator_policy_source_sha256={digest}")
          print(f"comparison_csv_sha256={comparison_sha}")
          PY
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Validate focused route and three simulate-this traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_unified_tests issue_1513_turo_over_tapu_tests
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 47 --require-ready-by 3 | tee issue-1513-trace-47.txt
          grep -q "T3 | HOLD TAPU LELE-GX" issue-1513-trace-47.txt
          grep -q "T3 | PLAY SUPPORTER.*Professor Turo returned the Basic Active Pokémon" issue-1513-trace-47.txt
          ! grep -q "T3 | BENCH | Tapu Lele-GX" issue-1513-trace-47.txt
          ! grep -q "T3 | WONDER TAG" issue-1513-trace-47.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee issue-1513-trace-104.txt
          grep -q "WONDER TAG.*Crispin" issue-1513-trace-104.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 6 --require-ready-by 4 | tee issue-1513-trace-6.txt
          grep -q "READY" issue-1513-trace-6.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Restore permanent CI and commit regenerated evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml tests/issue_1513_turo_over_tapu_tests.cpp results/simulation_results.csv results/baseline_manifest.json results/multi_deck_comparison.csv results/multi_deck_manifest.json docs/REPORT.md docs/MULTI_DECK_REPORT.md docs/TRACE_AUDIT.md README.md
          git commit -m "Refresh issue 1513 source-bound baselines"
          git push origin HEAD:fix/issue-1513-turo-before-tapu
