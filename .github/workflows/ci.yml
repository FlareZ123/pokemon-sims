name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'fix/issue-1633-crispin-before-gladion'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build combined simulator
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Validate three independent combined routes
        shell: bash
        run: |
          set -euo pipefail
          # Crispin, Gladion, Celestial Roar, and Apex Dragon:
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/sm4-95
          # https://api.pokemontcg.io/v2/cards/swsh12-135
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --model-variant crobat2-erika-channeler --scenario no-discard-control/go-first --seed 83 | tee combined-crobat-83.txt
          grep -q "T2 | PLAY SUPPORTER | rules: R-CRISPIN-01" combined-crobat-83.txt
          grep -q "T2 | HOLD ATTACK" combined-crobat-83.txt
          ! grep -q "T2 | PLAY SUPPORTER | rules: R-GLADION-01" combined-crobat-83.txt
          # Mysterious Treasure, Latias ex, and Brilliant Blender from merged #1636:
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sv8-76
          # https://api.pokemontcg.io/v2/cards/sv8-164
          ./build/regidrago_sim --simulate-this --model-variant crobat1-erika --scenario strict-jit/go-second --seed 1 --require-ready-by 4 | tee combined-crobat-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 137 --require-ready-by 2 | tee combined-shell-137.txt
      - name: Regenerate shell, paired-deck, and Crobat evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results
          python scripts/update_multi_deck_docs.py --repo-root .
          ./build/regidrago_sim --model-crobat --trials 100000 --seed 20260705 --out results/crobat_variant_model.csv
          shopt -s nullglob
          for script in scripts/*crobat*.py; do
            name=$(basename "$script")
            case "$name" in
              update*) python "$script" --repo-root . ;;
            esac
          done
      - name: Run complete refreshed Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit generated evidence and restore CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refresh combined setup evidence for issue 1633"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1633-combined-evidence-${{ github.run_attempt }}
          path: |
            combined-*.txt
            results/*.csv
            build/Testing
          if-no-files-found: warn
