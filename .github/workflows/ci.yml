name: Materialize issue 1514 public-state refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1514-public-refinement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refine-validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1514-k0-crispin'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply public-state refinement
        run: python .github/issue-1514-public-refinement.py
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run paired K0 and focused issue regression
        run: ./build/regidrago_unified_tests issue_1514_k0_duplicate_crispin_tests
      - name: Run three reviewed simulate-this traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-second --seed 33 --require-ready-by 3 | tee trace-33.txt
          grep -q "T1 | HOLD TAPU LELE-GX" trace-33.txt
          ! grep -q "T1 | BENCH | Tapu Lele-GX from hand." trace-33.txt
          grep -q "T3 | READY" trace-33.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee trace-104.txt
          grep -q "Searched a Basic Pokémon: Tapu Lele-GX" trace-104.txt
          grep -q "T3 | READY" trace-104.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace-43.txt
          grep -q "T2 | WONDER TAG" trace-43.txt
          grep -q "T2 | READY" trace-43.txt
      - name: Generate exact committed matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out results/multi_deck_comparison.csv
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Restore trusted workflow and commit validated files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/issue-1514-public-refinement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/trace_engine_v2/part_issue_991_wonder_tag_burnet_legacy_star_override.inc tests/issue_1514_k0_duplicate_crispin_tests.cpp results/simulation_results.csv results/multi_deck_comparison.csv
          git commit -m "Use public K0 information for issue 1514"
          git push origin HEAD:fix/issue-1514-k0-crispin
