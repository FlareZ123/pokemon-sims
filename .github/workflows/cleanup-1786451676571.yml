name: Cleanup part 005 structure

on:
  push:
    branches: [cleanup-1786451676571]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-1786451676571
          fetch-depth: 0
      - name: Create three behavior-preserving cleanup commits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          import fcntl
          import os
          import tempfile
          from pathlib import Path

          source = Path('src/trace_engine_v2/part_005.inc')

          def atomic_write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              lock_path = path.with_name(f'.{path.name}.lock')
              with lock_path.open('w', encoding='utf-8') as lock:
                  fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                  fd, temp_name = tempfile.mkstemp(prefix=f'.{path.name}.', dir=path.parent)
                  try:
                      with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as handle:
                          handle.write(text)
                          handle.flush()
                          os.fsync(handle.fileno())
                      os.replace(temp_name, path)
                  finally:
                      try:
                          os.unlink(temp_name)
                      except FileNotFoundError:
                          pass
                      try:
                          lock_path.unlink()
                      except FileNotFoundError:
                          pass

          text = source.read_text(encoding='utf-8')
          start_marker = '  // Test-variant combo support.'
          end_marker = '\n  std::string current_deck_id() const {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          contract = Path('src/trace_engine_v2/core/forretress_combo_contract.inc')
          if contract.exists():
              raise SystemExit(f'{contract} already exists')
          atomic_write(contract, block)
          text = text[:start] + '  #include "core/forretress_combo_contract.inc"\n' + text[end:]
          atomic_write(source, text)
          PY
          git add src/trace_engine_v2/part_005.inc src/trace_engine_v2/core/forretress_combo_contract.inc
          git commit -m "Cleanup: centralize Forretress combo contract"

          python - <<'PY'
