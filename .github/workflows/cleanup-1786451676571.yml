          import os
          import tempfile
          from pathlib import Path

          source = Path('src/trace_engine_v2/part_005.inc')

          def atomic_write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              lock_path = path.with_name(f'.{path.name}.lock')
              with lock_path.open('w', encoding='utf-8') as lock:
                  fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                  fd, temp_name = tempfile.mkstemp(prefix=f'.{path.name}.', dir=path.parent)
                  try:
                      with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as handle:
                          handle.write(text)
                          handle.flush()
                          os.fsync(handle.fileno())
                      os.replace(temp_name, path)
                  finally:
                      try:
                          os.unlink(temp_name)
                      except FileNotFoundError:
                          pass
                      try:
                          lock_path.unlink()
                      except FileNotFoundError:
                          pass

          text = source.read_text(encoding='utf-8')
          deck_start_marker = '  std::string current_deck_id() const {'
          setup_marker = '\n  void setup() {'
          deck_start = text.index(deck_start_marker)
          deck_end = text.index(setup_marker, deck_start)
          deck_block = text[deck_start:deck_end].rstrip() + '\n'

          labels_start_marker = '\n  std::string dci_name() const {'
          labels_end_marker = '\n  void choose_opening_active() {'
          labels_start = text.index(labels_start_marker, deck_end)
          labels_end = text.index(labels_end_marker, labels_start)
          labels_block = text[labels_start + 1:labels_end].rstrip() + '\n'

          labels = Path('src/trace_engine_v2/core/simulation_labels.inc')
          if labels.exists():
              raise SystemExit(f'{labels} already exists')
          atomic_write(labels, deck_block + '\n' + labels_block)

          text = text[:labels_start] + text[labels_end:]
          deck_start = text.index(deck_start_marker)
          deck_end = text.index(setup_marker, deck_start)
          text = text[:deck_start] + '  #include "core/simulation_labels.inc"\n' + text[deck_end:]
          atomic_write(source, text)
          PY
          git add src/trace_engine_v2/part_005.inc src/trace_engine_v2/core/simulation_labels.inc
          git commit -m "Cleanup: centralize simulation labels"

