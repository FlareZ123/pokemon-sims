name: Cleanup evidence dump

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dump-generated-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Generate paired two-deck matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-matrix.csv
      - name: Derive shell matrix
        run: python scripts/extract_deck_matrix.py --input multi-deck-matrix.csv --output t2-t3-matrix.csv --deck regidrago-shell
      - name: Print exact generated evidence
        shell: bash
        run: |
          echo "BEGIN_T2_T3_MATRIX"
          cat t2-t3-matrix.csv
          echo "END_T2_T3_MATRIX"
          echo "BEGIN_MULTI_DECK_MATRIX"
          cat multi-deck-matrix.csv
          echo "END_MULTI_DECK_MATRIX"
          echo "BEGIN_SOURCE_DIGEST"
          python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))"
          echo "END_SOURCE_DIGEST"
