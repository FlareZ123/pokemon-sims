name: Cleanup matrix report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Generate paired matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-matrix.csv
      - name: Extract shell matrix
        run: python scripts/extract_deck_matrix.py --input multi-deck-matrix.csv --output t2-t3-matrix.csv --deck regidrago-shell
      - name: Print generated matrices
        shell: bash
        run: |
          echo '=== SHELL MATRIX ==='
          cat t2-t3-matrix.csv
          echo '=== PAIRED MATRIX ==='
          cat multi-deck-matrix.csv
          echo '=== SOURCE DIGEST ==='
          python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))"
