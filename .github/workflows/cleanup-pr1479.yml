name: Clean PR 1479 workspace artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1478-field-blower-direct-regi'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Remove untracked validation workspace outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build scripts/__pycache__
          rm -f trace-129.txt trace-290.txt trace-43.txt trace-statuses.txt
          rm .github/workflows/cleanup-pr1479.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove validation workspace artifacts"
          git push origin HEAD:${{ github.head_ref }}
