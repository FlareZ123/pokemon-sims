name: Cleanup provenance digest

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/cleanup-provenance-digest.yml"

permissions:
  contents: read

jobs:
  digest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print simulator source digest
        shell: pwsh
        run: python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))"
