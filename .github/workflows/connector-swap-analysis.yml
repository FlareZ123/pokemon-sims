name: Regidrago Connector Swap Analysis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Expand full connector inventory
        run: python3 tools/expand_connector_swap_screen.py

      - name: Compile connector swap analyzer
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          tools/regidrago_connector_swap_screen_full.cpp
          -o connector_swap_screen

      - name: Run paired connector-only screen
        run: ./connector_swap_screen 5000 results/connector-swap-screen

      - name: Upload connector swap data
        uses: actions/upload-artifact@v4
        with:
          name: regidrago-connector-swap-screen
          path: results/connector-swap-screen
          retention-days: 7
