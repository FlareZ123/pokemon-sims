name: Regidrago Connector Swap Analysis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile balanced connector packages
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          tools/regidrago_balanced_connector_packages.cpp
          -o balanced_connector_packages

      - name: Run paired 50k all-scenario package confirmation
        run: ./balanced_connector_packages 50000 results/balanced-connector-packages

      - name: Upload balanced package data
        uses: actions/upload-artifact@v4
        with:
          name: regidrago-balanced-connector-packages
          path: results/balanced-connector-packages
          retention-days: 7
