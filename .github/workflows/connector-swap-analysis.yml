name: Regidrago Connector Swap Analysis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile generic connector mix analyzer
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          tools/regidrago_generic_connector_mix.cpp
          -o generic_connector_mix

      - name: Screen and confirm frozen seven-slot package
        run: ./generic_connector_mix 500 10000 results/generic-connector-mix

      - name: Upload generic connector mix data
        uses: actions/upload-artifact@v4
        with:
          name: regidrago-generic-connector-mix
          path: results/generic-connector-mix
          retention-days: 7
