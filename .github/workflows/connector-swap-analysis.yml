name: Regidrago Connector Swap Analysis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile VSTAR connector confirmation
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          tools/regidrago_vstar_connector_confirm.cpp
          -o vstar_connector_confirm

      - name: Run paired 50k all-scenario VSTAR confirmation
        run: ./vstar_connector_confirm 50000 results/vstar-connector-confirm

      - name: Upload VSTAR connector confirmation data
        uses: actions/upload-artifact@v4
        with:
          name: regidrago-vstar-connector-confirm
          path: results/vstar-connector-confirm
          retention-days: 7
