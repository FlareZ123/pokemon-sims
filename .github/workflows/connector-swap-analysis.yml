name: Regidrago Connector Swap Analysis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile connector confirmation
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          tools/regidrago_connector_swap_confirm.cpp
          -o connector_swap_confirm

      - name: Run paired 50k all-scenario confirmation
        run: ./connector_swap_confirm 50000 results/connector-swap-confirm

      - name: Upload connector confirmation data
        uses: actions/upload-artifact@v4
        with:
          name: regidrago-connector-swap-confirm
          path: results/connector-swap-confirm
          retention-days: 7
