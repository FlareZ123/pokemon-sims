name: Current Branch Three Pass 20260729 1153

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  current-branch-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Focused confirmed-route regression
        run: ./build/regidrago_unified_tests issue_1821_steven_latias_grass_tests

      - name: Pass 1 exact seed 161803 T3
        shell: bash
        run: |
          set -euo pipefail
          # Oricorio, Tapu Lele-GX, Steven's Resolve, Crispin, Latias ex, Earthen Vessel, Dragapult ex, and Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/sm2-55 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-76 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official procedure and confirmed route: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf https://github.com/FlareZ123/pokemon-sims/issues/1821
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 161803 --require-ready-by 3 | tee trace-pass-1.txt

      - name: Pass 2 shell earliest legal T2 control
        shell: bash
        run: |
          set -euo pipefail
          # Earliest-route, K1, and strict-JIT specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-pass-2.txt

      - name: Pass 3 scheduled-lock T3 control
        shell: bash
        run: |
          set -euo pipefail
          # Scheduled Item-lock model and merged route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#turn-2-item-lock https://github.com/FlareZ123/pokemon-sims/issues/1817
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-turn2-item-lock/go-second --seed 314159 --require-ready-by 3 | tee trace-pass-3.txt

      - name: Regenerate source-bound baselines
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2

      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate canonical setup matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-shell-matrix.csv

      - name: Generate all-deck all-condition matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out t2-t3-all-condition-matrix.csv

      - name: Upload branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-branch-three-pass-20260729-1153-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            tested-head.txt
            trace-pass-*.txt
            t2-t3-shell-matrix.csv
            t2-t3-all-condition-matrix.csv
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
