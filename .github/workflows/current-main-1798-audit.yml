name: Current Main 1798 Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: git archive --format=zip --output=current-main-source.zip HEAD
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Simulate pass 1 shell strict JIT going first
        shell: bash
        run: |
          set -euo pipefail
          # K1, DCI/JIT, and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 20260729 | tee trace-pass-1.txt
      - name: Simulate pass 2 shell combined lock going second
        shell: bash
        run: |
          set -euo pipefail
          # Lock model: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-combined-lock/go-second --seed 314159 | tee trace-pass-2.txt
      - name: Simulate pass 3 Pineco matchup-flex JIT going first
        shell: bash
        run: |
          set -euo pipefail
          # Pineco and Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-first --seed 271828 | tee trace-pass-3.txt
      - name: Reproduce issue 1798 on exact current main
        shell: bash
        run: |
          set -euo pipefail
          # Brilliant Blender discards selected cards from the deck: https://api.pokemontcg.io/v2/cards/sv8-164
          # Steven's Resolve searches up to three cards and ends the turn: https://api.pokemontcg.io/v2/cards/sm7-145
          # Regidrago VSTAR and Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Refined bug scope: https://github.com/FlareZ123/pokemon-sims/issues/1798
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 1801 | tee issue-1798-seed-1801.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Generate canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-matrix.csv
      - name: Generate all-deck T2 T3 T4 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out all-deck-matrix.csv
      - name: Record tested source
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-1798-audit-${{ github.run_attempt }}
          path: |
            current-main-source.zip
            trace-pass-*.txt
            issue-1798-seed-1801.txt
            t2-t3-matrix.csv
            all-deck-matrix.csv
            tested-head.txt
            build/Testing
          if-no-files-found: warn
