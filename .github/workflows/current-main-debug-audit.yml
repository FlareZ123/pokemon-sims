name: Seed 364 Current-Main Reproduction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce-seed-364:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Reproduce dominated Gladion route
        shell: bash
        run: |
          set -euo pipefail
          # Crispin, Steven's Resolve, Earthen Vessel, Regidrago VSTAR, and Gladion: https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sm4-95
          # Official Supporter, Item, search, attachment, evolution, and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # K1, DCI/JIT, supporter contention, and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          set +e
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 364 --require-ready-by 4 | tee seed-364-current-main.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "first-ready turn: 5 | setup result: failure" seed-364-current-main.txt
          grep -F "Completed mandatory Prize exchange with Grass Energy." seed-364-current-main.txt
          grep -F "Searched the complete late VSTAR-Vessel route" seed-364-current-main.txt
      - name: Record tested source
        run: git rev-parse HEAD | tee seed-364-tested-head.txt
      - name: Upload reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-364-current-main-reproduction-${{ github.run_attempt }}
          path: |
            seed-364-current-main.txt
            seed-364-tested-head.txt
          if-no-files-found: error
