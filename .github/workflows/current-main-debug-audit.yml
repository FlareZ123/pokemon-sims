name: Current Main Debug Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: git archive --format=zip --output=current-main-source.zip HEAD
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Pass 1 shell strict JIT going first
        shell: bash
        run: |
          set -euo pipefail
          # Knowledge, DCI/JIT, and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 20260729 | tee debug-trace-pass-1.txt
      - name: Pass 2 shell combined lock going second
        shell: bash
        run: |
          set -euo pipefail
          # Lock and action-legality model: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-combined-lock/go-second --seed 314159 | tee debug-trace-pass-2.txt
      - name: Pass 3 Pineco matchup-flex JIT going first
        shell: bash
        run: |
          set -euo pipefail
          # Pineco and Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Pineco route specification: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-first --seed 271828 | tee debug-trace-pass-3.txt
      - name: Generate canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out debug-t2-t3-matrix.csv
      - name: Generate all-deck T2 T3 T4 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out debug-all-deck-matrix.csv
      - name: Record tested source
        run: git rev-parse HEAD | tee debug-tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-debug-evidence-${{ github.run_attempt }}
          path: |
            current-main-source.zip
            debug-trace-pass-*.txt
            debug-t2-t3-matrix.csv
            debug-all-deck-matrix.csv
            debug-tested-head.txt
          if-no-files-found: error
