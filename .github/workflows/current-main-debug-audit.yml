name: Additional Current-Main Reproductions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce-additional-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Reproduce seed 854 unused Quick Ball route
        shell: bash
        run: |
          set -euo pipefail
          # Quick Ball, Tapu Lele-GX, Steven's Resolve, Crispin, Earthen Vessel: https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv4-163
          # Official Supporter, Item, search, attachment, evolution, and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # K1, DCI/JIT, and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          set +e
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 854 --require-ready-by 3 | tee seed-854-current-main.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "first-ready turn: 5 | setup result: failure" seed-854-current-main.txt
          grep -F "Hand=Tate & Liza, Grass Energy, Lusamine, Quick Ball, Regidrago VSTAR" seed-854-current-main.txt
      - name: Reproduce seed 1801 skipped manual attachment
        shell: bash
        run: |
          set -euo pipefail
          # Crispin, Steven's Resolve, Brilliant Blender, Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv8-164 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official Supporter, attachment, evolution, Item, and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # K1, DCI/JIT, and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          set +e
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 1801 --require-ready-by 4 | tee seed-1801-current-main.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "first-ready turn: 5 | setup result: failure" seed-1801-current-main.txt
          grep -F "Hand=Dragapult ex, Powerglass, Brilliant Blender, Roseanne's Backup, Dipplin TWM 127, Fire Energy" seed-1801-current-main.txt
      - name: Record tested source
        run: git rev-parse HEAD | tee additional-tested-head.txt
      - name: Upload reproductions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-current-main-reproductions-${{ github.run_attempt }}
          path: |
            seed-854-current-main.txt
            seed-1801-current-main.txt
            additional-tested-head.txt
          if-no-files-found: error
