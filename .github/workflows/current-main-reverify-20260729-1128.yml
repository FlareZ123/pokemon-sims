name: Current Main Reverify 20260729 1128

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  current-main-reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Pass 1 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Card data and official procedure: https://api.pokemontcg.io/v2/cards/sm2-55 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-76 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Repository policy and filed bug: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/issues/1821
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 161803 | tee trace-pass-1.txt

      - name: Pass 2 Pineco matchup-flex JIT going first
        shell: bash
        run: |
          set -euo pipefail
          # Card data and official procedure: https://api.pokemontcg.io/v2/cards/sm4-95 https://api.pokemontcg.io/v2/cards/sv1-166 https://api.pokemontcg.io/v2/cards/swsh12-156 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/me2-87 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Repository policy and filed bug: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#pineco-forretress-route https://github.com/FlareZ123/pokemon-sims/issues/1822
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-first --seed 8675309 | tee trace-pass-2.txt

      - name: Pass 3 shell Supporter lock going second
        shell: bash
        run: |
          set -euo pipefail
          # Card data and official procedure: https://api.pokemontcg.io/v2/cards/sm2-55 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Lock and route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#lock-model https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-supporter-lock/go-second --seed 20260729 | tee trace-pass-3.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2

      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate canonical setup matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-shell-matrix.csv

      - name: Generate all-deck all-condition matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out t2-t3-all-condition-matrix.csv

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-reverify-20260729-1128-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            tested-head.txt
            trace-pass-*.txt
            t2-t3-shell-matrix.csv
            t2-t3-all-condition-matrix.csv
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
