name: DDE branch sync

on:
  pull_request:
    paths:
      - 'docs/dde-sync-trigger-20260810.md'

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'fix/dde-semantic-rollup-reclaim-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dde-semantic-rollup-reclaim-20260809
          fetch-depth: 0
      - name: Merge current main with the single reviewed resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Current main is already an ancestor of the DDE branch."
            exit 0
          fi

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="src/trace_engine_v2/part_issue_1798_steven_blender_route.inc"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --theirs -- "$expected"
            python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          path = Path('src/trace_engine_v2/part_issue_1798_steven_blender_route.inc')
          text = path.read_text(encoding='utf-8')
          old = '''    return state_.active->grass >= 2 && state_.active->fire >= 1 &&\n        payload_ready();\n'''
          new = '''    return pays_apex_energy_cost(*state_.active) && payload_ready();  // DDE/Apex energy semantics: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/ https://api.pokemontcg.io/v2/cards/swsh12-136 https://github.com/FlareZ123/pokemon-sims/issues/2368\n'''
          if text.count(old) != 1:
              raise SystemExit('reviewed #1798 readiness pattern was not present exactly once')
          text = text.replace(old, new)
          fd, temp_name = tempfile.mkstemp(prefix=f'.{path.name}.', dir=path.parent)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as handle:
                  handle.write(text)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_name, path)
          except BaseException:
              try:
                  os.unlink(temp_name)
              except FileNotFoundError:
                  pass
              raise
          PY
            git add -- "$expected"
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved conflicts remain."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

          git push origin HEAD:fix/dde-semantic-rollup-reclaim-20260809
