name: DDE current-main integration

on:
  push:
    branches: [reclaim/dde-current-main-sol2-20260811]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reclaim/dde-current-main-sol2-20260811
          fetch-depth: 0
      - name: Merge reviewed DDE rollup onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main fix/dde-semantic-rollup-reclaim-20260809 >/dev/null 2>&1
          test "$(git rev-parse origin/main)" = "57785ca59d15719e72695fbee47147f72c2caacf"
          old=origin/fix/dde-semantic-rollup-reclaim-20260809
          git merge --no-commit --no-edit "$old" || true

          actual=$(git diff --name-only --diff-filter=U | sort)
          expected=$(printf '%s\n' \
            docs/MULTI_DECK_REPORT.md \
            docs/REPORT.md \
            results/baseline_manifest.json \
            results/multi_deck_comparison.csv \
            results/multi_deck_manifest.json \
            results/simulation_results.csv \
            src/trace_engine_v2/part_010_fss_override.inc \
            src/trace_engine_v2/part_forretress_ex_combo.inc | sort)
          test "$actual" = "$expected"

          for path in \
            docs/MULTI_DECK_REPORT.md \
            docs/REPORT.md \
            results/baseline_manifest.json \
            results/multi_deck_comparison.csv \
            results/multi_deck_manifest.json \
            results/simulation_results.csv \
            src/trace_engine_v2/part_010_fss_override.inc \
            src/trace_engine_v2/part_forretress_ex_combo.inc; do
            git checkout --ours -- "$path"
            git add "$path"
          done

          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact match')
              path.write_text(text.replace(old, new), encoding='utf-8')

          def replace_regex(path: Path, pattern: str, repl: str, expected: int) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, repl, text, flags=re.MULTILINE)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} regex matches, found {count}')
              path.write_text(updated, encoding='utf-8')

          fss = Path('src/trace_engine_v2/part_010_fss_override.inc')
          replace_once(
              fss,
              '''    const bool held_manual_already_completes_energy =
                  (grass_needed() == 1 && fire_needed() == 0 && hand_count(Card::Grass) > 0) ||
                  (grass_needed() == 0 && fire_needed() == 1 && hand_count(Card::Fire) > 0);
              if (held_manual_already_completes_energy) return false;

              const bool grass_available = deck_count_after_search_started(Card::Grass) > 0;
              const bool fire_available = deck_count_after_search_started(Card::Fire) > 0;
              const bool crispin_completes_energy =
                  (grass_needed() == 1 && fire_needed() == 0 && grass_available) ||
                  (grass_needed() == 0 && fire_needed() == 1 && fire_available) ||
                  (grass_needed() == 1 && fire_needed() == 1 && grass_available && fire_available);
              if (!crispin_completes_energy) return false;

              const Pokemon* regi = target_regi();
          ''',
              '''    // DDE makes Grass and Fire alternative one-card completions; do not add the
              // typed helpers as independent deficits. https://github.com/FlareZ123/pokemon-sims/issues/2427
              const Pokemon* regi = target_regi();
              const bool held_manual_already_completes_energy = regi != nullptr &&
                  completing_basic_energy_for(*regi, [this](const Card card) {
                    return hand_count(card) > 0;
                  }).has_value();
              if (held_manual_already_completes_energy) return false;

              const bool grass_available = deck_count_after_search_started(Card::Grass) > 0;
              const bool fire_available = deck_count_after_search_started(Card::Fire) > 0;
              const bool crispin_completes_energy = regi != nullptr &&
                  (minimum_basic_attachments_to_apex(
                       *regi, grass_available ? 1 : 0, fire_available ? 1 : 0) <=
                       (grass_available && fire_available ? 2 : 1));
              if (!crispin_completes_energy) return false;
          ''')
          replace_regex(
              fss,
              r'pokemon\.entered_turn < state_\.turn && pokemon\.grass >= 2 &&\s+pokemon\.fire >= 1;',
              'pokemon.entered_turn < state_.turn && pays_apex_energy_cost(pokemon);',
              2)
          replace_once(
              fss,
              '''    return !spends_additional_entry_connector && projected.active_is_vstar() &&
                  projected.state_.active->grass >= 2 &&
                  projected.state_.active->fire >= 1 && projected.payload_ready();
          ''',
              '''    return !spends_additional_entry_connector && projected.active_is_vstar() &&
                  projected.pays_apex_energy_cost(*projected.state_.active) &&
                  projected.payload_ready();
          ''')
          replace_regex(
              fss,
              r'pokemon\.grass == 0 && pokemon\.fire == 0;',
              'total_energy_units(pokemon) == 0;',
              1)

          legacy = Path('src/trace_engine_v2/part_forretress_ex_combo_legacy.inc')
          replace_once(
              legacy,
              '''    const auto promotion_rank = [](const Pokemon& pokemon) {
                const int role = pokemon.card == Card::RegidragoVstar ? 3 :
                    (pokemon.card == Card::RegidragoV ? 2 : 1);
                return std::tuple{role, pokemon.grass + pokemon.fire,
                                  -pokemon.entered_turn};
              };
          ''',
              '''    const auto promotion_rank = [this](const Pokemon& pokemon) {
                const int role = pokemon.card == Card::RegidragoVstar ? 3 :
                    (pokemon.card == Card::RegidragoV ? 2 : 1);
                const bool regidrago = pokemon.card == Card::RegidragoVstar ||
                    pokemon.card == Card::RegidragoV;
                const bool apex_paid = regidrago && pays_apex_energy_cost(pokemon);
                bool one_basic_from_apex = false;
                if (regidrago && !apex_paid) {
                  for (const Card basic : {Card::Grass, Card::Fire}) {
                    Pokemon projected = pokemon;
                    if (attach_energy_card(projected, basic) &&
                        pays_apex_energy_cost(projected)) {
                      one_basic_from_apex = true;
                      break;
                    }
                  }
                }
                // Preserve evolution-stage priority, then prefer the same-stage attacker
                // closest to an immediate Apex Dragon. DDE supplies two Energy of every type:
                // Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-2
                // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
                // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
                // Knock Out / replacement Active: https://www.pokemon.com/us/pokemon-tcg/rules
                // DDE semantic contract: https://github.com/FlareZ123/pokemon-sims/issues/2238
                // Policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
                // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2447
                const int semantic_energy_class = apex_paid ? 2 :
                    (one_basic_from_apex ? 1 : 0);
                const int attached_energy_units = pokemon.grass + pokemon.fire +
                    2 * pokemon.double_dragon;
                return std::tuple{role, semantic_energy_class, attached_energy_units,
                                  -pokemon.entered_turn};
              };
          ''')
          PY

          git add src/trace_engine_v2/part_010_fss_override.inc \
                  src/trace_engine_v2/part_forretress_ex_combo_legacy.inc
          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f .github/workflows/dde-reclaim-push-recovery.yml
          rm -f .github/workflows/dde-rollup-reclaim-materialize.yml
          rm -f docs/dde-reclaim-trigger-20260809.md
          rm -f docs/dde-reclaim-trigger-20260810.md
          git rm .github/workflows/dde-sol2-conflict-audit.yml
          git add -A
          git diff --cached --check
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Run focused DDE regression suite
        run: ctest --test-dir build --output-on-failure -R 'issue_2368|issue_241|issue_242|issue_243|issue_244|issue_2714|issue_2800|issue_2807'
      - name: Run three reviewed simulate-this traces
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 4
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2
      - name: Commit integrated DDE rollup
        run: |
          set -euo pipefail
          git commit -m 'Reclaim DDE: integrate reviewed semantic rollup on current main'
          git push origin HEAD:reclaim/dde-current-main-sol2-20260811
