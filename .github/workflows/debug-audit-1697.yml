name: Issue 1697 source-bound audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'issue-1697-prized-fss-held-energy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Audit seed 83 preserved Crispin route
        shell: bash
        run: |
          set -euo pipefail
          # Gladion: https://api.pokemontcg.io/v2/cards/sm4-95
          # Forest Seal Stone: https://api.pokemontcg.io/v2/cards/swsh12-156
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Core rules: https://www.pokemon.com/us/pokemon-tcg/rules
          # Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1697
          ./build/regidrago_sim --simulate-this --model-variant crobat2-erika-channeler --scenario no-discard-control/go-first --seed 83 --require-ready-by 3 | tee audit-seed-83.txt
          grep -q 'T2 | PLAY SUPPORTER.*Exchanged Gladion for Forest Seal Stone' audit-seed-83.txt
          grep -q 'T2 | STAR ALCHEMY' audit-seed-83.txt
          grep -q 'T2 | EVOLVE' audit-seed-83.txt
          grep -q 'T3 | ATTACH.*Fire Energy manually' audit-seed-83.txt
          grep -q 'T3 | READY' audit-seed-83.txt
          ! grep -q 'T2 | PLAY SUPPORTER.*R-CRISPIN-01' audit-seed-83.txt
      - name: Audit seed 218 direct Latias Grass route
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Latias ex: https://api.pokemontcg.io/v2/cards/sv8-76
          # Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
          # Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Core rules: https://www.pokemon.com/us/pokemon-tcg/rules
          # Confirmed route: https://github.com/FlareZ123/pokemon-sims/issues/1645
          ./build/regidrago_sim --simulate-this --model-variant crobat1-heavy-ball --scenario matchup-flex-jit/go-second --seed 218 --require-ready-by 4 | tee audit-seed-218.txt
          grep -q 'Searched the complete Latias-Grass T4 route: Latias ex, Grass Energy' audit-seed-218.txt
          grep -q 'T2 | EVOLVE' audit-seed-218.txt
          grep -q 'T2 | RETREAT' audit-seed-218.txt
          grep -q 'T4 | READY' audit-seed-218.txt
          ! grep -q 'Searched up to 3 cards: Regidrago V, Regidrago VSTAR, Gladion' audit-seed-218.txt
      - name: Audit seed 245 Vessel Burnet route
        shell: bash
        run: |
          set -euo pipefail
          # Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
          # Quick Ball: https://api.pokemontcg.io/v2/cards/swsh1-179
          # Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Core rules: https://www.pokemon.com/us/pokemon-tcg/rules
          # Confirmed route: https://github.com/FlareZ123/pokemon-sims/issues/1646
          ./build/regidrago_sim --simulate-this --model-variant crobat1-erika --scenario strict-jit/go-first --seed 245 --require-ready-by 3 | tee audit-seed-245.txt
          grep -q 'Discarded the dominated Quick Ball and searched Grass Energy for the held Burnet finish' audit-seed-245.txt
          grep -q 'Professor Burnet' audit-seed-245.txt
          grep -q 'T3 | READY' audit-seed-245.txt
          ! grep -q 'Brilliant Blender discarded modeled Dragon payloads' audit-seed-245.txt
      - name: Record exact source
        shell: bash
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1697-source-bound-${{ github.run_attempt }}
          path: |
            audit-seed-*.txt
            tested-head.txt
            repository-source.tgz
          if-no-files-found: warn
