name: Source-bound debug audit 2026-07-24-3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-audit-20260724-3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/debug-20260724-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture repository snapshot and static inventory
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-head.txt
          find . -path ./.git -prune -o -type f -print | sort > repository-files.txt
          tar --exclude=.git --exclude='*.lock' -czf repository-snapshot.tar.gz \
            CMakeLists.txt README.md .github src tests scripts docs results
          python - <<'PY' | tee static-inventory.txt
          from pathlib import Path
          import re

          roots = [Path("src"), Path("tests"), Path("scripts"), Path("docs")]
          files = [
              path
              for root in roots
              for path in root.rglob("*")
              if path.is_file()
          ]
          source_files = [
              path for path in files
              if path.suffix in {".cpp", ".hpp", ".h", ".inc", ".py", ".cmake", ".md"}
          ]
          total_lines = 0
          malformed_includes = []
          todo_markers = []
          direct_card_urls = 0
          direct_rule_urls = 0
          for path in source_files:
              text = path.read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()
              total_lines += len(lines)
              direct_card_urls += text.count("https://api.pokemontcg.io/v2/cards/")
              direct_rule_urls += text.count("https://www.pokemon.com/us/pokemon-tcg/rules")
              for number, line in enumerate(lines, 1):
                  stripped = line.strip()
                  if stripped.startswith("#include") and re.search(r'[">]\s*\S+', stripped):
                      malformed_includes.append(f"{path}:{number}:{stripped}")
                  if re.search(r"\b(TODO|FIXME|HACK|XXX)\b", line):
                      todo_markers.append(f"{path}:{number}:{stripped}")

          print(f"files={len(files)}")
          print(f"source_files={len(source_files)}")
          print(f"source_lines={total_lines}")
          print(f"direct_card_urls={direct_card_urls}")
          print(f"direct_rule_urls={direct_rule_urls}")
          print("malformed_includes:")
          print("\n".join(malformed_includes) if malformed_includes else "none")
          print("todo_markers:")
          print("\n".join(todo_markers) if todo_markers else "none")
          PY

      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Run three independent simulate-this passes
        shell: bash
        run: |
          set -euo pipefail
          # Scheduled T2 Item lock makes the direct T2 VSTAR route mandatory:
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Forest Seal Stone: https://api.pokemontcg.io/v2/cards/swsh12-156
          # Core turn and Item procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository regression: https://github.com/FlareZ123/pokemon-sims/issues/925
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-turn2-item-lock/go-second --seed 25 --require-ready-by 2 | tee pass-1-item-lock.txt
          grep -q "T2 | READY" pass-1-item-lock.txt

          # Rule Box Ability lock requires the legal Stadium answer before Rule Box Abilities:
          # Path to the Peak: https://api.pokemontcg.io/v2/cards/swsh6-148
          # Chaotic Swell: https://api.pokemontcg.io/v2/cards/sm12-187
          # Forest Seal Stone: https://api.pokemontcg.io/v2/cards/swsh12-156
          # Core Stadium and Ability procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Reviewed trace registry: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/TRACE_AUDIT.md
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-rulebox-ability-lock/go-second --seed 13 --require-ready-by 3 | tee pass-2-rulebox-lock.txt
          grep -q "READY" pass-2-rulebox-lock.txt

          # The Pineco line must preserve Secret Box and Exploding Energy when the direct
          # Steven plus Mysterious Treasure route already reaches T2 readiness:
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          # Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Core procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee pass-3-pineco.txt
          grep -q "T2 | READY" pass-3-pineco.txt

      - name: Reproduce the known strict-include claim
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cmake -S . -B build-pedantic -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS=-pedantic-errors > strict-configure.txt 2>&1
          configure_status=$?
          if [ "$configure_status" -eq 0 ]; then
            cmake --build build-pedantic --parallel 2 > strict-build.txt 2>&1
            build_status=$?
          else
            build_status=$configure_status
            cp strict-configure.txt strict-build.txt
          fi
          set -e
          printf '%s\n' "$build_status" > strict-build-status.txt
          cat strict-build.txt
          test "$build_status" -ne 0
          grep -q 'part_016.inc"}' strict-build.txt
          # C++ include grammar: https://eel.is/c++draft/cpp.include
          # Confirmed and claimed bug: https://github.com/FlareZ123/pokemon-sims/issues/1482

      - name: Generate current T2 and T3 matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-matrix.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-20260724-3-${{ github.run_attempt }}
          path: |
            pass-*.txt
            tested-head.txt
            repository-files.txt
            repository-snapshot.tar.gz
            static-inventory.txt
            strict-configure.txt
            strict-build.txt
            strict-build-status.txt
            t2-t3-matrix.csv
            multi-deck-matrix.csv
            build/Testing
          if-no-files-found: warn
