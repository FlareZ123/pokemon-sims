name: Source-bound debug audit 2026-07-26 Harumi 1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-audit-20260726-harumi-1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/debug-20260726-harumi-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Run three independent simulate-this passes
        shell: bash
        run: |
          set -euo pipefail

          # Going second permits a first-turn Supporter and attack. This canonical strict-JIT
          # seed must reach the earliest repository-registered ready turn without reading
          # future cards or hidden Prizes before legal inspection:
          # Core turn, Supporter, attack, evolution, and attachment procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Regidrago V / Celestial Roar: https://api.pokemontcg.io/v2/cards/swsh12-135
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Repository knowledge and earliest-route contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-shell-strict-seed1.txt
          grep -q "T3 | READY" trace-shell-strict-seed1.txt
          grep -q "first-ready turn: 3" trace-shell-strict-seed1.txt

          # Matchup-flex JIT may spend only cards admitted by its dynamic DCI profile, while
          # the payload must still enter discard on the ready turn. Seed 3 is the registered
          # T2 compression fixture and must not consume a protected singleton or delay an axis:
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Dynamic DCI and JIT policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Earliest complete-route priority: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-shell-flex-seed3.txt
          grep -q "T2 | READY" trace-shell-flex-seed3.txt
          grep -q "first-ready turn: 2" trace-shell-flex-seed3.txt

          # The registered Pineco recipe must compare direct setup against the complete
          # Forretress route, pay every discard cost, obey evolution timing, and preserve
          # the shared VSTAR Power. Seed 35 is the repository's documented T2 trace:
          # Pineco: https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          # Pineco route specification: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pineco-strict-seed35.txt
          grep -q "T2 | READY" trace-pineco-strict-seed35.txt
          grep -q "first-ready turn: 2" trace-pineco-strict-seed35.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Generate fresh T2 and T3 setup matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out t2-t3-all-decks-matrix.csv

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-20260726-harumi-1-${{ github.run_attempt }}
          path: |
            trace-*.txt
            t2-t3-shell-matrix.csv
            t2-t3-all-decks-matrix.csv
            build/Testing
          if-no-files-found: warn
