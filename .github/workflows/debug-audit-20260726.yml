name: Debug Audit 20260726

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-bound-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run three independent simulate-this reviews
        shell: bash
        run: |
          set -euo pipefail
          # Repository setup objective and trace contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          # Core turn and Supporter procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee audit-trace-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee audit-trace-2.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee audit-trace-3.txt
      - name: Generate source-bound matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-canonical-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-paired-matrix.csv
      - name: Archive inspected source
        run: tar --exclude=.git --exclude=build -czf source-snapshot.tgz .
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-20260726-${{ github.run_attempt }}
          path: |
            audit-trace-*.txt
            audit-canonical-matrix.csv
            audit-paired-matrix.csv
            source-snapshot.tgz
            build/regidrago_sim
          if-no-files-found: error
