name: Debug audit 2026-07-28 issue 1700

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/debug-20260728-1700'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Audit shell seed 1 strict T2 route
        shell: bash
        run: |
          set -euo pipefail
          # Heavy Ball, Steven's Resolve, Crispin, Latias ex, Brilliant Blender, Regidrago VSTAR, rules, and repository policy:
          # https://api.pokemontcg.io/v2/cards/swsh10-146
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/sv8-76
          # https://api.pokemontcg.io/v2/cards/sv8-164
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee audit-shell-seed-1.txt
          grep -q 'T1 | PLAY ITEM .*exchanged Heavy Ball for Tapu Lele-GX' audit-shell-seed-1.txt
          grep -q 'Searched up to 3 cards: Regidrago VSTAR, Crispin, Latias ex' audit-shell-seed-1.txt
          grep -q 'T2 | PLAY ITEM .*Brilliant Blender' audit-shell-seed-1.txt
          grep -q 'T2 | RETREAT .*promoted the best-powered Benched Regidrago VSTAR' audit-shell-seed-1.txt
          grep -q 'T2 | READY' audit-shell-seed-1.txt
      - name: Audit Pineco seed 35 direct T2 route
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve, Crispin, Mysterious Treasure, Regidrago VSTAR, rules, and confirmed direct route:
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # https://github.com/FlareZ123/pokemon-sims/issues/1420
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee audit-pineco-seed-35.txt
          grep -q 'Steven.s Resolve banked Crispin and Dragapult ex for the resource-preserving direct T2 Mysterious Treasure route' audit-pineco-seed-35.txt
          grep -q 'T2 | PLAY SUPPORTER .*R-CRISPIN-01' audit-pineco-seed-35.txt
          grep -q 'T2 | DISCARD .*Dragapult ex' audit-pineco-seed-35.txt
          grep -q 'Completed the resource-preserving direct T2 Mysterious Treasure route without advancing the Pineco line' audit-pineco-seed-35.txt
          grep -q 'T2 | READY' audit-pineco-seed-35.txt
          ! grep -q 'Secret Box' audit-pineco-seed-35.txt
      - name: Audit Crobat seed 245 Vessel Burnet T3 route
        shell: bash
        run: |
          set -euo pipefail
          # Earthen Vessel, Quick Ball, Professor Burnet, Brilliant Blender, Regidrago VSTAR, rules, and confirmed route:
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # https://api.pokemontcg.io/v2/cards/sv8-164
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # https://github.com/FlareZ123/pokemon-sims/issues/1646
          ./build/regidrago_sim --simulate-this --model-variant crobat1-erika --scenario strict-jit/go-first --seed 245 --require-ready-by 3 | tee audit-crobat-seed-245.txt
          grep -q 'Discarded the dominated Quick Ball and searched Grass Energy for the held Burnet finish' audit-crobat-seed-245.txt
          grep -q 'T3 | PLAY SUPPORTER .*R-BURNET-01' audit-crobat-seed-245.txt
          grep -q 'Searched and discarded: Mega Dragonite ex, Dragapult ex' audit-crobat-seed-245.txt
          grep -q 'T3 | READY' audit-crobat-seed-245.txt
          ! grep -q 'Brilliant Blender discarded modeled Dragon payloads' audit-crobat-seed-245.txt
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-issue-1700-${{ github.run_attempt }}
          path: |
            audit-*.txt
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn
