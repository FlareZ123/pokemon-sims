name: Debug audit 2026-07-28 Harumi three passes 11

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/debug-20260728-harumi-three-passes-11-314159'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Pass 1 shell earliest T2 route
        shell: bash
        run: |
          set -euo pipefail
          # Oricorio Vital Dance: https://api.pokemontcg.io/v2/cards/sm2-55
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Regidrago VSTAR evolution and GGF attack cost: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Crispin Energy acceleration: https://api.pokemontcg.io/v2/cards/sv7-133
          # Official first-turn, evolution, attachment, and Supporter rules: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Repository earliest-ready and K1 policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 314159 --require-ready-by 2 | tee audit-pass-1-shell-seed-314159.txt
          grep -q "T1 | Vital Dance.*Grass Energy, Fire Energy" audit-pass-1-shell-seed-314159.txt
          grep -q "T1 | PLAY ITEM.*Regidrago VSTAR" audit-pass-1-shell-seed-314159.txt
          grep -q "T1 | ATTACH.*Grass Energy manually to Regidrago V" audit-pass-1-shell-seed-314159.txt
          grep -q "T2 | ATTACH.*Fire Energy manually to Regidrago V" audit-pass-1-shell-seed-314159.txt
          grep -q "T2 | PLAY SUPPORTER.*attached Grass Energy to Regidrago VSTAR" audit-pass-1-shell-seed-314159.txt
          ! grep -q "T1 | READY" audit-pass-1-shell-seed-314159.txt
          grep -q "T2 | READY" audit-pass-1-shell-seed-314159.txt
      - name: Pass 2 Pineco earliest T3 route
        shell: bash
        run: |
          set -euo pipefail
          # Dawn three-Pokemon search: https://api.pokemontcg.io/v2/cards/me2-87
          # Pineco and Forretress ex evolution line: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
          # Quick Ball same-turn Dragon discard: https://api.pokemontcg.io/v2/cards/swsh1-179
          # Dragapult ex payload: https://api.pokemontcg.io/v2/cards/sv6-130
          # Official evolution, retreat, attachment, Ability, and Item rules: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Repository Pineco and JIT policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-first --seed 8675308 --require-ready-by 3 | tee audit-pass-2-pineco-seed-8675308.txt
          grep -q "T1 | RETREAT.*promoted Regidrago V" audit-pass-2-pineco-seed-8675308.txt
          grep -q "T2 | PLAY SUPPORTER.*Pineco, Forretress ex, Mega Dragonite ex" audit-pass-2-pineco-seed-8675308.txt
          grep -q "T2 | Earthen Vessel.*Grass Energy, Fire Energy" audit-pass-2-pineco-seed-8675308.txt
          grep -q "T2 | EVOLVE.*Regidrago VSTAR" audit-pass-2-pineco-seed-8675308.txt
          grep -q "T3 | USE ABILITY.*attached 1 Basic Grass Energy" audit-pass-2-pineco-seed-8675308.txt
          grep -q "T3 | DISCARD.*Dragapult ex (Quick Ball cost)" audit-pass-2-pineco-seed-8675308.txt
          ! grep -q "T2 | READY" audit-pass-2-pineco-seed-8675308.txt
          grep -q "T3 | READY" audit-pass-2-pineco-seed-8675308.txt
      - name: Pass 3 shell resource-preserving T2 route
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V and Celestial Roar: https://api.pokemontcg.io/v2/cards/swsh12-135
          # Crispin Energy acceleration: https://api.pokemontcg.io/v2/cards/sv7-133
          # Serena draw mode and chosen discard: https://api.pokemontcg.io/v2/cards/swsh11-164
          # Dialga-GX is a Dragon payload: https://api.pokemontcg.io/v2/cards/sm5-100
          # Regidrago VSTAR evolution and GGF attack cost: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official attack, attachment, Supporter, and evolution rules: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Repository resource-preservation, DCI, JIT, and earliest-ready policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 19 --require-ready-by 2 | tee audit-pass-3-shell-seed-19.txt
          grep -q "T1 | PLAY SUPPORTER.*attached Grass Energy to Regidrago V" audit-pass-3-shell-seed-19.txt
          grep -q "T1 | HOLD ATTACK.*guaranteed payload route" audit-pass-3-shell-seed-19.txt
          ! grep -q "T1 | ATTACK" audit-pass-3-shell-seed-19.txt
          grep -q "T2 | ATTACH.*Fire Energy manually to Regidrago V" audit-pass-3-shell-seed-19.txt
          grep -q "T2 | DISCARD.*Dialga-GX (Serena chosen discard)" audit-pass-3-shell-seed-19.txt
          grep -q "T2 | EVOLVE.*Regidrago VSTAR" audit-pass-3-shell-seed-19.txt
          ! grep -q "T1 | READY" audit-pass-3-shell-seed-19.txt
          grep -q "T2 | READY" audit-pass-3-shell-seed-19.txt
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-harumi-three-passes-11-${{ github.run_attempt }}
          path: |
            audit-pass-*.txt
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn
