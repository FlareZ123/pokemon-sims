name: Debug audit 2026-07-28 Harumi three passes 7

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/debug-20260728-harumi-three-passes-7-1355'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Pass 1 shell strict going first
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V / Celestial Roar: https://api.pokemontcg.io/v2/cards/swsh12-135
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # K0/K1, DCI, AMR, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 314159 | tee audit-pass-1-shell-seed-314159.txt
      - name: Pass 2 Pineco no-discard going second
        shell: bash
        run: |
          set -euo pipefail
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          # Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario no-discard-control/go-second --seed 8675309 | tee audit-pass-2-pineco-seed-8675309.txt
      - name: Pass 2 Steven Prize counterfactual
        shell: bash
        run: |
          set -euo pipefail
          cp -a . /tmp/steven-projection
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/steven-projection/src/trace_engine_v2/part_012.inc')
          source = path.read_text()
          original = 'for (const Card target : {Card::RegidragoVstar, Card::RegidragoV, Card::ProfessorBurnet, Card::Crispin, Card::MegaDragonite}) {'
          projected = 'for (const Card target : {Card::RegidragoVstar, Card::RegidragoV, Card::ProfessorBurnet, Card::Crispin, Card::MegaDragonite, Card::StevensResolve}) {'
          if original not in source:
              raise SystemExit('Gladion fallback selector changed')
          path.write_text(source.replace(original, projected, 1))
          PY
          # Gladion: https://api.pokemontcg.io/v2/cards/sm4-95
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # K1 and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Official Prize, Supporter, Item, evolution, and search procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          cmake -S /tmp/steven-projection -B /tmp/steven-projection/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/steven-projection/build --target regidrago_sim --parallel 2
          /tmp/steven-projection/build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario no-discard-control/go-second --seed 8675309 | tee audit-pass-2-steven-projection-seed-8675309.txt
      - name: Pass 3 Crobat matchup-flex going first
        shell: bash
        run: |
          set -euo pipefail
          # Crobat V / Dark Asset: https://api.pokemontcg.io/v2/cards/swsh3-104
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Crobat connector, DCI, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#crobat-v-draw-connector-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --model-variant crobat1-heavy-ball --scenario matchup-flex-jit/go-first --seed 424242 | tee audit-pass-3-crobat-seed-424242.txt
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-harumi-three-passes-7-${{ github.run_attempt }}
          path: |
            audit-pass-*.txt
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn
