name: Debug audit 2026-07-28 Harumi three passes 8

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/debug-20260728-harumi-three-passes-8-1455'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Pass 1 shell strict going first
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V / Celestial Roar: https://api.pokemontcg.io/v2/cards/swsh12-135
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # K0/K1, DCI, AMR, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 271828 | tee audit-pass-1-shell-seed-271828.txt
      - name: Pass 1 Channeler-cost counterfactual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/channeler-cost-projection
          cp -a . /tmp/channeler-cost-projection
          rm -rf /tmp/channeler-cost-projection/build
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/channeler-cost-projection/src/trace_engine_v2/part_006.inc')
          source = path.read_text()
          marker = (
              "    // The card currently being played cannot pay its own discard cost. When an\n"
              "    // effect identifies that card, a distinct Ultra Ball is another card in hand\n"
          )
          projected = (
              "    // Audit-only projection. Channeler has no present setup effect in this\n"
              "    // single-player model, while the second Mysterious Treasure remains a live\n"
              "    // VSTAR or Active-position connector.\n"
              "    if (excluded_from_cost && *excluded_from_cost == Card::MysteriousTreasure &&\n"
              "        scenario_.dci == DciProfile::StrictJit &&\n"
              "        hand_count(Card::MysteriousTreasure) >= 2 &&\n"
              "        hand_count(Card::Channeler) > 0) {\n"
              "      return Card::Channeler;\n"
              "    }\n\n"
          )
          if marker not in source:
              raise SystemExit('discard selector marker changed')
          path.write_text(source.replace(marker, projected + marker, 1))
          PY
          # Channeler: https://api.pokemontcg.io/v2/cards/sm11-190
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Repository opponent-action and DCI scope: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#opponent-actions https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          cmake -S /tmp/channeler-cost-projection -B /tmp/channeler-cost-projection/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/channeler-cost-projection/build --target regidrago_sim --parallel 2
          /tmp/channeler-cost-projection/build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 271828 | tee audit-pass-1-channeler-projection-seed-271828.txt
      - name: Pass 2 Pineco no-discard going second
        shell: bash
        run: |
          set -euo pipefail
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          # Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario no-discard-control/go-second --seed 8675309 | tee audit-pass-2-pineco-seed-8675309.txt
      - name: Pass 3 Crobat matchup-flex going first
        shell: bash
        run: |
          set -euo pipefail
          # Crobat V / Dark Asset: https://api.pokemontcg.io/v2/cards/swsh3-104
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Crobat connector, DCI, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#crobat-v-draw-connector-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --model-variant crobat1-heavy-ball --scenario matchup-flex-jit/go-first --seed 424242 | tee audit-pass-3-crobat-seed-424242.txt
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-harumi-three-passes-8-${{ github.run_attempt }}
          path: |
            audit-pass-*.txt
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn
