name: Debug audit 2026-07-28 Harumi three passes 8

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/debug-20260728-harumi-three-passes-8'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Pass 1 shell strict going first
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V / Celestial Roar: https://api.pokemontcg.io/v2/cards/swsh12-135
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Observable-state, K0/K1, DCI, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 271828 | tee audit-pass-1-shell-seed-271828.txt
      - name: Pass 2 Pineco matchup-flex going second
        shell: bash
        run: |
          set -euo pipefail
          # Pineco: https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 161803 | tee audit-pass-2-pineco-seed-161803.txt
      - name: Pass 3 shell turn-two Item lock going second
        shell: bash
        run: |
          set -euo pipefail
          # Item-lock scenario contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Forest Seal Stone / Star Alchemy: https://api.pokemontcg.io/v2/cards/swsh12-156
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-turn2-item-lock/go-second --seed 57721 | tee audit-pass-3-item-lock-seed-57721.txt
      - name: Generate registered-deck T2/T3 matrix
        shell: bash
        run: |
          set -euo pipefail
          # Canonical paired-matrix contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-comparison.csv
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-harumi-three-passes-8-${{ github.run_attempt }}
          path: |
            audit-pass-*.txt
            audit-multi-deck-comparison.csv
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn