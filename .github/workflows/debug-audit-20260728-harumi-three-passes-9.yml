name: Debug audit 2026-07-28 Harumi three passes 9

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/debug-20260728-harumi-three-passes-9'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Pass 1 shell strict direct T2
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
          # Observable K0/K1, DCI, JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 19 --require-ready-by 2 | tee audit-pass-1-shell-seed-19.txt
          grep -F 'T2 | READY' audit-pass-1-shell-seed-19.txt
          ! grep -F 'CELESTIAL ROAR' audit-pass-1-shell-seed-19.txt
      - name: Pass 2 Pineco direct route with visible bench choice
        shell: bash
        run: |
          set -euo pipefail
          # Pineco: https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Pineco direct-route comparison policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Official Bench and Supporter procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee audit-pass-2-pineco-seed-35.txt
          grep -F 'T1 | BENCH | rules: R-GAME-BENCH | Pineco from hand.' audit-pass-2-pineco-seed-35.txt
          grep -F 'Completed the resource-preserving direct T2 Mysterious Treasure route without advancing the Pineco line' audit-pass-2-pineco-seed-35.txt
          grep -F 'T2 | READY' audit-pass-2-pineco-seed-35.txt
      - name: Pass 3 shell combined-lock direct T2
        shell: bash
        run: |
          set -euo pipefail
          # Chaotic Swell: https://api.pokemontcg.io/v2/cards/sm12-187
          # Path to the Peak: https://api.pokemontcg.io/v2/cards/swsh6-148
          # Regidrago VSTAR / Legacy Star and Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Combined-lock contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#combined-lock
          # Official first-turn, Stadium, evolution, and attachment procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-combined-lock/go-first --seed 22 --require-ready-by 2 | tee audit-pass-3-combined-seed-22.txt
          grep -F 'T2 | PLAY STADIUM' audit-pass-3-combined-seed-22.txt
          grep -F 'T2 | LEGACY STAR' audit-pass-3-combined-seed-22.txt
          grep -F 'T2 | READY' audit-pass-3-combined-seed-22.txt
      - name: Generate registered-deck T2/T3 matrix
        shell: bash
        run: |
          set -euo pipefail
          # Canonical paired matrix contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-comparison.csv
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-harumi-three-passes-9-${{ github.run_attempt }}
          path: |
            audit-pass-*.txt
            audit-multi-deck-comparison.csv
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn
