name: Debug audit 2026-07-28 three new traces

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/debug-20260728-three-new-traces'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Audit shell strict-JIT route
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago VSTAR readiness, K0/K1, DCI, and official turn procedure:
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#discard-capability-index-dci
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 777 | tee audit-shell-seed-777.txt
      - name: Audit Pineco strict-JIT route
        shell: bash
        run: |
          set -euo pipefail
          # Secret Box, Forretress ex, Regidrago VSTAR, route-aware DCI, and official procedure:
          # https://api.pokemontcg.io/v2/cards/sv6-163
          # https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 1337 | tee audit-pineco-seed-1337.txt
      - name: Audit Crobat under Rule Box Ability lock
        shell: bash
        run: |
          set -euo pipefail
          # Crobat V, Path to the Peak-style Rule Box Ability suppression, Forest Seal Stone, and lock policy:
          # https://api.pokemontcg.io/v2/cards/swsh3-104
          # https://api.pokemontcg.io/v2/cards/swsh6-148
          # https://api.pokemontcg.io/v2/cards/swsh12-156
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#rule-box-ability-lock
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --model-variant crobat2-erika-channeler --scenario strict-jit-rulebox-ability-lock/go-first --seed 2026 | tee audit-crobat-lock-seed-2026.txt
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-three-new-traces-${{ github.run_attempt }}
          path: |
            audit-*.txt
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn
