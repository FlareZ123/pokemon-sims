name: Debug Audit Harumi Current

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-audit-harumi-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-main-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Pass 1 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # K0/K1, DCI/JIT, and earliest-route specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee current-trace-1.txt
      - name: Pass 2 shell matchup-flex JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V and VSTAR identities and ready-state requirements:
          # https://api.pokemontcg.io/v2/cards/swsh12-135
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee current-trace-2.txt
      - name: Pass 3 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco route and card sources:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # https://api.pokemontcg.io/v2/cards/sv6-163
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee current-trace-3.txt
      - name: Replay current-main open seed witnesses
        shell: bash
        run: |
          set -euo pipefail
          capture_witness() {
            local output="$1"
            shift
            set +e
            "$@" | tee "$output"
            local rc=${PIPESTATUS[0]}
            set -e
            if [[ $rc -ne 0 && $rc -ne 1 ]]; then
              return "$rc"
            fi
          }
          # Confirmed open issue: https://github.com/FlareZ123/pokemon-sims/issues/1700
          capture_witness current-open-1700.txt ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 218
          # Confirmed open issue: https://github.com/FlareZ123/pokemon-sims/issues/1737
          capture_witness current-open-1737.txt ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario no-discard-control/go-second --seed 8675309
          # Confirmed open issue: https://github.com/FlareZ123/pokemon-sims/issues/1775
          capture_witness current-open-1775.txt ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 38
      - name: Run complete Release suite
        run: ctest --test-dir build --output-on-failure
      - name: Generate canonical shell matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out current-t2-t3-shell.csv
      - name: Generate paired deck matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out current-t2-t3-paired.csv
      - name: Record exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee current-tested-head.txt
          git archive --format=zip --output=current-source-snapshot.zip HEAD
      - name: Upload current-main evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-harumi-current-${{ github.run_attempt }}
          path: |
            current-trace-*.txt
            current-open-*.txt
            current-t2-t3-shell.csv
            current-t2-t3-paired.csv
            current-tested-head.txt
            current-source-snapshot.zip
          if-no-files-found: error
