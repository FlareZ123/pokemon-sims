name: Current main debug audit 20260727

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-strict-seed-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target regidrago_sim
      - name: Review strict shell seed 1
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
          # Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76
          # Official turn, search, discard, attachment, evolution, Ability, retreat, Supporter, Item, and attack procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository K0/K1, DCI/JIT, Supporter contention, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee shell-strict-seed-1.txt
          git rev-parse HEAD | tee tested-head.txt
      - name: Upload trace and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-strict-seed-1-${{ github.run_attempt }}
          path: |
            shell-strict-seed-1.txt
            tested-head.txt
            README.md
            CMakeLists.txt
            src
            tests
            scripts
            docs
            results/*.csv
            results/*.json
          if-no-files-found: error

  pineco-strict-seed-35:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target regidrago_sim
      - name: Review strict Pineco seed 35
        shell: bash
        run: |
          set -euo pipefail
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          # Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn, search, discard, Bench, evolution, Ability, attachment, retreat, Supporter, Item, and attack procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository Secret Box, AMR, DCI/JIT, Supporter contention, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee pineco-strict-seed-35.txt
          git rev-parse HEAD | tee tested-head.txt
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pineco-strict-seed-35-${{ github.run_attempt }}
          path: |
            pineco-strict-seed-35.txt
            tested-head.txt
          if-no-files-found: error

  shell-strict-seed-2411:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target regidrago_sim
      - name: Review strict shell seed 2411
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
          # Official turn, search, discard, attachment, evolution, Ability, retreat, Supporter, Item, and attack procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository K0/K1, DCI/JIT, Supporter contention, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 2411 --require-ready-by 3 | tee shell-strict-seed-2411.txt
          git rev-parse HEAD | tee tested-head.txt
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-strict-seed-2411-${{ github.run_attempt }}
          path: |
            shell-strict-seed-2411.txt
            tested-head.txt
          if-no-files-found: error

  confirm-issue-1683:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target regidrago_sim
      - name: Confirm Serena lock trace
        shell: bash
        run: |
          set -euo pipefail
          # Serena requires at least one discard and then draws until five: https://api.pokemontcg.io/v2/cards/swsh12-164
          # Quick Ball discards another card and searches a Basic Pokemon: https://api.pokemontcg.io/v2/cards/swsh1-179
          # Path to the Peak removes Rule Box Pokemon Abilities: https://api.pokemontcg.io/v2/cards/swsh6-148
          # Tapu Lele-GX Wonder Tag triggers only from a hand-to-Bench play: https://api.pokemontcg.io/v2/cards/sm2-60
          # Official Supporter, Item, Ability, search, discard, Bench, and turn procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository lock, DCI/JIT, K1, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          # Confirmation-pending bug: https://github.com/FlareZ123/pokemon-sims/issues/1683
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-rulebox-ability-lock/go-second --seed 2413 | tee issue-1683-seed-2413.txt
          git rev-parse HEAD | tee tested-head.txt
      - name: Upload confirmation trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1683-seed-2413-${{ github.run_attempt }}
          path: |
            issue-1683-seed-2413.txt
            tested-head.txt
          if-no-files-found: error

  t2-t3-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target regidrago_sim
      - name: Generate all-condition matrix
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago VSTAR ready-state attack cost and Dragon-copy effect: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn, attachment, evolution, Ability, Item, Supporter, retreat, Stadium, and attack procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository registered decks, 16 scenarios, strict-JIT, locks, and success thresholds: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260727 --out ci-current-main-matrix.csv
          git rev-parse HEAD | tee tested-head.txt
      - name: Upload matrix
        uses: actions/upload-artifact@v4
        with:
          name: current-main-t2-t3-matrix-${{ github.run_attempt }}
          path: |
            ci-current-main-matrix.csv
            tested-head.txt
          if-no-files-found: error
