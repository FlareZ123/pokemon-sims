name: Debug Harumi Full Review

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run three simulate-this passes
        run: |
          mkdir -p audit
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 2026072801 > audit/trace-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario no-discard-control/go-second --seed 8675309 > audit/trace-2.txt
          ./build/regidrago_sim --simulate-this --model-variant crobat1-serena --scenario strict-jit/go-second --seed 2154 > audit/trace-3.txt
      - name: Generate T2 and T3 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260728 --out audit/t2-t3-matrix.csv
      - name: Record tested commit
        run: git rev-parse HEAD > audit/tested-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: harumi-full-review
          path: |
            audit
            src
            tests
            scripts
            docs
            CMakeLists.txt
            README.md
          if-no-files-found: error
          retention-days: 7
