name: Debug issue 1749 three-pass audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'fix/issue-1749-preserve-redundant-regi'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and focused test
        run: cmake --build build --target regidrago_sim regidrago_issue_1749_redundant_regidrago_bench_tests --parallel 2
      - name: Run focused regression
        run: ./build/regidrago_issue_1749_redundant_regidrago_bench_tests
      - name: Pass 1 exact Crobat issue route
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V / VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Forest Seal Stone: https://api.pokemontcg.io/v2/cards/swsh12-156
          # Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
          # Issue: https://github.com/FlareZ123/pokemon-sims/issues/1749
          ./build/regidrago_sim --simulate-this --model-variant crobat1-heavy-ball --scenario matchup-flex-jit/go-second --seed 20260728 | tee audit-pass-1-crobat-seed-20260728.txt
          ! grep -F 'T2 | BENCH | rules: R-GAME-BENCH | Regidrago V from hand.' audit-pass-1-crobat-seed-20260728.txt
          grep -F 'T2 | READY' audit-pass-1-crobat-seed-20260728.txt
      - name: Pass 2 registered shell strict route
        shell: bash
        run: |
          set -euo pipefail
          # K0/K1, DCI, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 271828 | tee audit-pass-2-shell-seed-271828.txt
      - name: Pass 3 registered Pineco route
        shell: bash
        run: |
          set -euo pipefail
          # Pineco / Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario no-discard-control/go-second --seed 424242 | tee audit-pass-3-pineco-seed-424242.txt
      - name: Package exact tested source
        shell: bash
        run: git ls-files -z | tar --null --files-from=- --create --gzip --file=repository-source.tgz
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-issue-1749-three-pass-${{ github.run_attempt }}
          path: |
            audit-pass-*.txt
            repository-source.tgz
            tested-head.txt
            build/regidrago_sim
          if-no-files-found: warn
