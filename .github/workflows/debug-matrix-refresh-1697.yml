name: Issue 1697 matrix refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    if: github.head_ref == 'issue-1697-prized-fss-held-energy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Regenerate canonical setup evidence
        # Canonical fixed-seed matrix specification: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#run-aggregate-smoke-test
        # Source-bound provenance contract: https://github.com/FlareZ123/pokemon-sims/blob/main/scripts/baseline_provenance.py
        # Confirmed policy fix: https://github.com/FlareZ123/pokemon-sims/issues/1697
        run: >-
          python scripts/regenerate_setup_baselines.py
          --exe build/regidrago_sim
          --out-dir results
          --max-seed 5000
          --trials 100000
          --matrix-seed 20260705
      - name: Regenerate paired deck evidence
        # Paired common-random-number matrix specification: https://github.com/FlareZ123/pokemon-sims/blob/main/scripts/generate_multi_deck_comparison.py
        # Confirmed policy fix: https://github.com/FlareZ123/pokemon-sims/issues/1697
        run: >-
          python scripts/generate_multi_deck_comparison.py
          --exe build/regidrago_sim
          --out-dir results
          --trials 100000
          --matrix-seed 20260705
      - name: Refresh report and verify contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_multi_deck_docs.py --repo-root .
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
          git diff --check
          git diff --name-only | tee generated-files.txt
          git rev-parse HEAD | tee tested-head.txt
      - name: Upload generated matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1697-matrix-refresh-${{ github.run_attempt }}
          path: |
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/MULTI_DECK_REPORT.md
            generated-files.txt
            tested-head.txt
          if-no-files-found: warn
