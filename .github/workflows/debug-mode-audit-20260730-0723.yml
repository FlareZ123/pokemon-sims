name: Debug Mode Audit 20260730 0723

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260730-0723-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2

      - name: Simulate pass 1 shell strict JIT
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state specification and official turn procedure:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee control-pass-1.txt

      - name: Simulate pass 2 shell matchup-flex JIT
        shell: bash
        run: |
          set -euo pipefail
          # Dynamic DCI, K1, and earliest-route specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee control-pass-2.txt

      - name: Simulate pass 3 registered Pineco ALS
        shell: bash
        run: |
          set -euo pipefail
          # Registered ALS and exact card identities:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee control-pass-3.txt

      - name: Reproduce all current open bug witnesses
        shell: bash
        run: |
          set -euo pipefail
          # Printed costs and effects:
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/swsh12-164
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Repository K1, DCI/JIT, and earliest-route specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-full-item-lock/go-second --seed 206 | tee issue-1855.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 108 | tee issue-1869.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 292 | tee issue-1871.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 453 | tee issue-1872.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 38 | tee issue-1873.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 169 | tee issue-1874.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 169 | tee issue-1877.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 241 | tee issue-1878.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 146 | tee issue-1879-a.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 163 | tee issue-1879-b.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 951 | tee issue-1895.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 925 | tee issue-1896.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 258 | tee issue-1898.txt

      - name: Generate canonical T2 and T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-t2-t3-matrix.csv
      - name: Generate paired all-condition matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build ASan and UBSan tests
        run: cmake --build build-sanitize --parallel 2
      - name: Run ASan and UBSan suite
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Record static-analysis inputs and exact source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git rev-parse HEAD | tee audit-tested-head.txt
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-20260730-0723-${{ github.run_attempt }}
          path: |
            control-pass-*.txt
            issue-*.txt
            audit-t2-t3-matrix.csv
            audit-multi-deck-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            build/Testing
            build-sanitize/Testing
          if-no-files-found: error
