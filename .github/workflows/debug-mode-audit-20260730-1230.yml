name: Debug Mode Audit 20260730 1230

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260730-1230-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2

      - name: Perfect-play simulate pass 1 shell strict JIT
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee control-pass-1.txt
          grep -q "first-ready turn: 2" control-pass-1.txt

      - name: Perfect-play simulate pass 2 shell strict JIT going first
        shell: bash
        run: |
          set -euo pipefail
          # Powerglass end-of-turn attachment: https://api.pokemontcg.io/v2/cards/sv6pt5-63
          # Earliest productive route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee control-pass-2.txt
          grep -q "first-ready turn: 3" control-pass-2.txt

      - name: Perfect-play simulate pass 3 registered Pineco ALS
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco ALS: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco: https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee control-pass-3.txt
          grep -q "first-ready turn: 2" control-pass-3.txt

      - name: Reproduce confirmation-pending action replay bugs
        shell: bash
        run: |
          set -euo pipefail
          # Arven can search an Item that remains playable in the same turn: https://api.pokemontcg.io/v2/cards/sv1-166
          # Brilliant Blender discards up to five Pokemon from deck: https://api.pokemontcg.io/v2/cards/sv8-164
          # Regidrago VSTAR readiness and Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # K1, current-turn JIT, and earliest-route contracts: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Issue 1910: https://github.com/FlareZ123/pokemon-sims/issues/1910
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 1955 | tee issue-1910.txt
          grep -q "first-ready turn: 4" issue-1910.txt
          # Latias ex Skyliner and post-transition replay boundary: https://api.pokemontcg.io/v2/cards/sv8-76 https://github.com/FlareZ123/pokemon-sims/issues/1911
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 329 | tee issue-1911.txt
          grep -q "first-ready turn: not ready through T5" issue-1911.txt
          # Final manual attachment must not end the action phase while a legal Item remains: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf https://github.com/FlareZ123/pokemon-sims/issues/1912
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 3698 | tee issue-1912.txt
          grep -q "first-ready turn: not ready through T5" issue-1912.txt

      - name: Generate canonical T2 and T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-t2-t3-matrix.csv
      - name: Verify canonical matrix
        run: cmp audit-t2-t3-matrix.csv results/simulation_results.csv
      - name: Generate paired all-condition matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv
      - name: Verify paired matrix
        run: cmp audit-multi-deck-matrix.csv results/multi_deck_comparison.csv
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Record static-analysis inputs and tested source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git rev-parse HEAD | tee audit-tested-head.txt
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-20260730-1230-${{ github.run_attempt }}
          path: |
            control-pass-*.txt
            issue-*.txt
            audit-t2-t3-matrix.csv
            audit-multi-deck-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            build/Testing
          if-no-files-found: error
