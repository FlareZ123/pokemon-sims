name: Debug Mode Audit 20260730 1538

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260730-1538-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Perfect-play simulate-this pass 1
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee control-pass-1.txt
          grep -q "first-ready turn: 2" control-pass-1.txt

      - name: Perfect-play simulate-this pass 2
        shell: bash
        run: |
          set -euo pipefail
          # Powerglass attaches at the end of turn after the attack step: https://api.pokemontcg.io/v2/cards/sv6pt5-63
          # Earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee control-pass-2.txt
          grep -q "first-ready turn: 3" control-pass-2.txt

      - name: Perfect-play simulate-this pass 3
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco ALS: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco, Forretress ex, and Secret Box: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee control-pass-3.txt
          grep -q "first-ready turn: 2" control-pass-3.txt

      - name: Record K1 provenance gates
        shell: bash
        run: |
          set -euo pipefail
          # K1 equivalence specification: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          git grep -nE 'deck_seen_.*prizes_known|prizes_known.*deck_seen_|deck_seen_.*prizes_revealed|prizes_revealed.*deck_seen_' -- src > k1-provenance-gates.txt || true

      - name: Generate and verify T2 and T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          # Fixed-seed matrix contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#reproduce
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-shell-matrix.csv
          cmp audit-shell-matrix.csv results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-all-conditions-matrix.csv
          cmp audit-all-conditions-matrix.csv results/multi_deck_comparison.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Record exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee audit-tested-head.txt
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-20260730-1538-${{ github.run_attempt }}
          path: |
            control-pass-*.txt
            k1-provenance-gates.txt
            audit-shell-matrix.csv
            audit-all-conditions-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            build/Testing
          if-no-files-found: error
