name: Debug Mode Audit 20260730 Current

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260730-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Perfect-play simulate-this pass 1
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee control-pass-1.txt
          grep -q "first-ready turn: 2" control-pass-1.txt

      - name: Perfect-play simulate-this pass 2
        shell: bash
        run: |
          set -euo pipefail
          # Powerglass resolves after the attack step: https://api.pokemontcg.io/v2/cards/sv6pt5-63
          # Earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee control-pass-2.txt
          grep -q "first-ready turn: 3" control-pass-2.txt

      - name: Perfect-play simulate-this pass 3
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco ALS: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco, Forretress ex, Secret Box: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee control-pass-3.txt
          grep -q "first-ready turn: 2" control-pass-3.txt

      - name: Reproduce all claimed open witnesses
        shell: bash
        run: |
          set -euo pipefail
          # Printed effects: https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sv8-164 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sv7-133
          # K1, JIT, DCI, contention, earliest route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Official procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          check() {
            local issue="$1" deck="$2" scenario="$3" seed="$4" expected="$5" suffix="${6:-}"
            ./build/regidrago_sim --simulate-this --deck "$deck" --scenario "$scenario" --seed "$seed" | tee "issue-${issue}${suffix}.txt"
            grep -q "first-ready turn: $expected" "issue-${issue}${suffix}.txt"
          }
          check 1912 regidrago-shell strict-jit/go-first 3698 "not ready through T5"
          check 1911 regidrago-shell matchup-flex-jit/go-first 329 "not ready through T5"
          check 1896 regidrago-shell matchup-flex-jit/go-second 925 4 -flex
          check 1896 regidrago-shell strict-jit/go-second 925 4 -strict
          check 1895 regidrago-shell strict-jit/go-first 951 4
          check 1877 regidrago-shell strict-jit/go-second 169 4
          check 1874 regidrago-shell strict-jit/go-first 169 "not ready through T5"
          check 1872 regidrago-shell matchup-flex-jit/go-first 453 "not ready through T5" -first
          check 1872 regidrago-shell matchup-flex-jit/go-second 453 "not ready through T5" -second
          check 1871 regidrago-shell strict-jit/go-first 292 "not ready through T5"
          check 1869 regidrago-shell strict-jit/go-second 108 4
          check 1878 regidrago-shell strict-jit/go-second 241 4
          check 1873 regidrago-shell strict-jit/go-second 38 4
          check 1879 regidrago-shell strict-jit/go-first 146 "not ready through T5" -first
          check 1879 regidrago-shell strict-jit/go-second 163 4 -second

      - name: Reproduce confirmation-pending issue 1918
        shell: bash
        run: |
          set -euo pipefail
          cat > issue-1918-probe.cpp <<'CPP'
          #define REGIDRAGO_SIM_NO_MAIN
          #include "src/regidrago_sim.cpp"
          #include <iostream>
          #include <random>
          #include <utility>
          namespace sim {
          struct EngineTestAccess {
            static void set_state(Engine& engine, State state, bool deck_seen,
                                  bool prizes_revealed) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = deck_seen;
              engine.prizes_revealed_ = prizes_revealed;
            }
            static bool route_available(const Engine& engine) {
              return engine.issue_1393_held_crispin_completion_available();
            }
          };
          }
          static sim::State exact_state() {
            sim::State state;
            state.turn = 2;
            state.active = sim::Pokemon{sim::Card::RegidragoV, 1, 1, 0,
                                        sim::Tool::ForestSealStone};
            state.bench = {
                sim::Pokemon{sim::Card::TapuLeleGX, 1, 0, 0, sim::Tool::None},
                sim::Pokemon{sim::Card::RegidragoV, 2, 0, 0, sim::Tool::None}};
            state.hand = {sim::Card::QuickBall, sim::Card::RegidragoVstar,
                          sim::Card::Crispin, sim::Card::Gladion,
                          sim::Card::MegaDragonite, sim::Card::BrilliantBlender};
            state.deck = {sim::Card::Grass, sim::Card::Oricorio,
                          sim::Card::Dragapult, sim::Card::DialgaGX,
                          sim::Card::Fire};
            state.prizes = {sim::Card::GoodraVstar};
            return state;
          }
          int main() {
            // K1 equivalence: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
            // Current helper and report: https://github.com/FlareZ123/pokemon-sims/blob/main/src/trace_engine_v2/part_issue_1393_crispin_route_helper.inc https://github.com/FlareZ123/pokemon-sims/issues/1918
            // Crispin, Blender, Gladion, Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-164 https://api.pokemontcg.io/v2/cards/sm4-95 https://api.pokemontcg.io/v2/cards/swsh12-136
            const sim::Scenario scenario{"issue-1918", sim::DciProfile::StrictJit,
                                         sim::LockMode::None, false, 4};
            std::mt19937_64 deck_rng{1918};
            sim::Engine deck_k1(scenario, sim::baseline_recipe(), deck_rng);
            sim::EngineTestAccess::set_state(deck_k1, exact_state(), true, false);
            std::cout << "deck-search K1 route="
                      << sim::EngineTestAccess::route_available(deck_k1) << '\n';
            std::mt19937_64 prize_rng{1918};
            sim::Engine prize_k1(scenario, sim::baseline_recipe(), prize_rng);
            sim::EngineTestAccess::set_state(prize_k1, exact_state(), false, true);
            std::cout << "prize-inspection K1 route="
                      << sim::EngineTestAccess::route_available(prize_k1) << '\n';
          }
          CPP
          c++ -std=c++20 -O0 issue-1918-probe.cpp -o issue-1918-probe
          ./issue-1918-probe | tee issue-1918.txt
          grep -q "deck-search K1 route=1" issue-1918.txt
          grep -q "prize-inspection K1 route=0" issue-1918.txt

      - name: Generate and verify T2/T3 matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-t2-t3-matrix.csv
          cmp audit-t2-t3-matrix.csv results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv
          cmp audit-multi-deck-matrix.csv results/multi_deck_comparison.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Record exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git rev-parse HEAD | tee audit-tested-head.txt
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-current-${{ github.run_attempt }}
          path: |
            control-pass-*.txt
            issue-*.txt
            audit-t2-t3-matrix.csv
            audit-multi-deck-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            build/Testing
          if-no-files-found: error
