name: Debug Mode Audit 20260731 0105

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260731-0105-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2

      - name: Simulate pass 1 shell strict JIT
        shell: bash
        run: |
          set -euo pipefail
          # Readiness contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Official turn and Trainer procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee control-pass-1.txt

      - name: Simulate pass 2 shell matchup-flex JIT
        shell: bash
        run: |
          set -euo pipefail
          # Dynamic DCI: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Earliest complete route priority: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee control-pass-2.txt

      - name: Simulate pass 3 registered Pineco ALS
        shell: bash
        run: |
          set -euo pipefail
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco: https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee control-pass-3.txt

      - name: Reproduce every open seeded bug witness
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 108 | tee issue-1869.txt # https://github.com/FlareZ123/pokemon-sims/issues/1869
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 292 | tee issue-1871.txt # https://github.com/FlareZ123/pokemon-sims/issues/1871
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 453 | tee issue-1872-first.txt # https://github.com/FlareZ123/pokemon-sims/issues/1872
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 453 | tee issue-1872-second.txt # https://github.com/FlareZ123/pokemon-sims/issues/1872
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 38 | tee issue-1873.txt # https://github.com/FlareZ123/pokemon-sims/issues/1873
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 169 | tee issue-1877.txt # https://github.com/FlareZ123/pokemon-sims/issues/1877
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 146 | tee issue-1879-seed-146.txt # https://github.com/FlareZ123/pokemon-sims/issues/1879
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 163 | tee issue-1879-seed-163.txt # https://github.com/FlareZ123/pokemon-sims/issues/1879
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 951 | tee issue-1895.txt # https://github.com/FlareZ123/pokemon-sims/issues/1895
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 329 | tee issue-1911.txt # https://github.com/FlareZ123/pokemon-sims/issues/1911

      - name: Record static witnesses for open Crobat omissions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Issue 1952 Ultra Ball exhaustive fallback"
            grep -n -A 28 -B 2 "fallback_ultra_ball_target_after_search_started" src/trace_engine_v2/part_009a.inc
            echo
            echo "Issue 1955 Pokemon Communication modeled universe"
            sed -n '1,40p' src/trace_engine_v2/part_pokemon_communication.inc
          } | tee static-open-bugs.txt
          # Ultra Ball searches any Pokemon after two-card discard: https://api.pokemontcg.io/v2/cards/swsh12pt5-146
          # Pokemon Communication exchanges any Pokemon: https://api.pokemontcg.io/v2/cards/sm9-152
          # Crobat V identity and Dark Asset: https://api.pokemontcg.io/v2/cards/swsh3-104
          # Confirmed issues: https://github.com/FlareZ123/pokemon-sims/issues/1952 https://github.com/FlareZ123/pokemon-sims/issues/1955

      - name: Generate canonical T2 and T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-t2-t3-matrix.csv
      - name: Generate paired all-condition matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Record broad static-analysis inputs
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git rev-parse HEAD | tee audit-tested-head.txt
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-20260731-0105-${{ github.run_attempt }}
          path: |
            control-pass-*.txt
            issue-*.txt
            static-open-bugs.txt
            audit-t2-t3-matrix.csv
            audit-multi-deck-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            build/Testing
          if-no-files-found: error
