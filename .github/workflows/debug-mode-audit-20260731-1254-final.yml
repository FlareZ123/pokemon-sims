name: Debug Mode Audit 20260731 1254 Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260731-1254-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Perfect-play simulate-this pass 1
        run: |
          # Ready-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee perfect-play-1.txt
          grep -q "first-ready turn: 2" perfect-play-1.txt
          grep -q "setup result: success" perfect-play-1.txt

      - name: Perfect-play simulate-this pass 2
        run: |
          # Going first cannot attack on the first turn: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Powerglass resolves after the attack step: https://api.pokemontcg.io/v2/cards/sv6pt5-63
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee perfect-play-2.txt
          grep -q "first-ready turn: 3" perfect-play-2.txt
          grep -q "setup result: success" perfect-play-2.txt

      - name: Perfect-play simulate-this pass 3
        run: |
          # Pineco ALS policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco, Forretress ex, Secret Box: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee perfect-play-3.txt
          grep -q "first-ready turn: 2" perfect-play-3.txt
          grep -q "setup result: success" perfect-play-3.txt

      - name: Verify issue 1979 K1 provenance differential
        shell: bash
        run: |
          set -euo pipefail
          cat > issue-1979-probe.cpp <<'CPP'
          #define REGIDRAGO_SIM_NO_MAIN
          #include "src/regidrago_sim.cpp"
          #include <iostream>
          #include <random>
          #include <utility>
          namespace sim {
          struct EngineTestAccess {
            static void set_state(Engine& engine, State state, bool deck_seen,
                                  bool prizes_revealed) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = deck_seen;
              engine.prizes_revealed_ = prizes_revealed;
            }
            static bool available(const Engine& engine) {
              return engine.issue_1875_quick_ball_tapu_crispin_route_available();
            }
          };
          }
          static sim::State exact_state() {
            sim::State state;
            state.turn = 3;
            state.active = sim::Pokemon{sim::Card::RegidragoVstar, 1, 1, 0};
            state.hand = {sim::Card::Fire, sim::Card::QuickBall, sim::Card::Dragapult};
            state.deck = {sim::Card::RegidragoV, sim::Card::Grass, sim::Card::Fire,
                          sim::Card::Crispin, sim::Card::TapuLeleGX};
            return state;
          }
          int main() {
            // Deck inspection and full Prize inspection are equivalent K1: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
            // Quick Ball, Tapu Lele-GX, Crispin, Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-136
            // Confirmed issue: https://github.com/FlareZ123/pokemon-sims/issues/1979
            const sim::Scenario scenario{"issue-1979", sim::DciProfile::StrictJit,
                                         sim::LockMode::None, true, 5};
            std::mt19937_64 a{1979}, b{1979}, c{1979};
            sim::Engine deck_k1(scenario, sim::baseline_recipe(), a);
            sim::Engine prize_k1(scenario, sim::baseline_recipe(), b);
            sim::Engine k0(scenario, sim::baseline_recipe(), c);
            sim::EngineTestAccess::set_state(deck_k1, exact_state(), true, false);
            sim::EngineTestAccess::set_state(prize_k1, exact_state(), false, true);
            sim::EngineTestAccess::set_state(k0, exact_state(), false, false);
            std::cout << "deck-only=" << sim::EngineTestAccess::available(deck_k1) << '\n';
            std::cout << "prize-only=" << sim::EngineTestAccess::available(prize_k1) << '\n';
            std::cout << "k0=" << sim::EngineTestAccess::available(k0) << '\n';
          }
          CPP
          c++ -std=c++20 -O0 issue-1979-probe.cpp -o issue-1979-probe
          ./issue-1979-probe | tee issue-1979.txt
          grep -q "deck-only=1" issue-1979.txt
          grep -q "prize-only=0" issue-1979.txt
          grep -q "k0=0" issue-1979.txt

      - name: Generate and verify T2 and T3 matrices
        run: |
          # Canonical matrix specification: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-canonical-shell-baseline
          # Paired matrix specification: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-t2-t3-matrix.csv
          cmp audit-t2-t3-matrix.csv results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv
          cmp audit-multi-deck-matrix.csv results/multi_deck_comparison.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Run complete ASan and UBSan suite
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Record static and source evidence
        run: |
          git rev-parse HEAD | tee audit-tested-head.txt
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git grep -nE 'deck_seen_|prizes_known\(|prizes_revealed_' -- 'src/**/*.inc' 'src/**/*.cpp' > knowledge-state-markers.txt || true
          git grep -nE 'api\.pokemontcg\.io/v2/cards/' -- '*.cpp' '*.hpp' '*.inc' '*.md' > card-source-markers.txt || true
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-20260731-1254-final-${{ github.run_attempt }}
          path: |
            perfect-play-*.txt
            issue-1979.txt
            audit-t2-t3-matrix.csv
            audit-multi-deck-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            knowledge-state-markers.txt
            card-source-markers.txt
            build/Testing
            build-sanitize/Testing
          if-no-files-found: error
