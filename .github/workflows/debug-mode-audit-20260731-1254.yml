name: Debug Mode Audit 20260731 1254

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260731-1254-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Perfect-play simulate-this pass 1
        shell: bash
        run: |
          set -euo pipefail
          # Ready state and T2/T3 contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Earliest legal route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee perfect-play-1.txt
          grep -q "first-ready turn: 2" perfect-play-1.txt
          grep -q "setup result: success" perfect-play-1.txt

      - name: Perfect-play simulate-this pass 2
        shell: bash
        run: |
          set -euo pipefail
          # The player going first cannot attack on the first turn: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Powerglass attaches after the attack step: https://api.pokemontcg.io/v2/cards/sv6pt5-63
          # Earliest legal route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee perfect-play-2.txt
          grep -q "first-ready turn: 3" perfect-play-2.txt
          grep -q "setup result: success" perfect-play-2.txt

      - name: Perfect-play simulate-this pass 3
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco ALS policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco, Forretress ex, and Secret Box: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          # Official evolution, Supporter, Item, attachment, and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee perfect-play-3.txt
          grep -q "first-ready turn: 2" perfect-play-3.txt
          grep -q "setup result: success" perfect-play-3.txt

      - name: Reproduce every seed-based open bug witness
        shell: bash
        run: |
          set -euo pipefail
          # Readiness, K1, JIT, DCI, Supporter contention, and route priority: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Regidrago VSTAR, Treasure, Quick Ball, Vessel, Blender, Crispin, Serena, Burnet: https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sv8-164 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-164 https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          check() {
            local issue="$1" deck="$2" scenario="$3" seed="$4" expected="$5" suffix="${6:-}"
            ./build/regidrago_sim --simulate-this --deck "$deck" --scenario "$scenario" --seed "$seed" | tee "issue-${issue}${suffix}.txt"
            grep -q "first-ready turn: $expected" "issue-${issue}${suffix}.txt"
          }
          check 1869 regidrago-shell strict-jit/go-second 108 4
          check 1871 regidrago-shell strict-jit/go-first 292 "not ready through T5"
          check 1872 regidrago-shell matchup-flex-jit/go-first 453 "not ready through T5" -first
          check 1872 regidrago-shell matchup-flex-jit/go-second 453 "not ready through T5" -second
          check 1873 regidrago-shell strict-jit/go-second 38 4
          check 1879 regidrago-shell strict-jit/go-first 146 "not ready through T5" -first
          check 1879 regidrago-shell strict-jit/go-second 163 4 -second
          check 1895 regidrago-shell strict-jit/go-first 951 4 -strict
          check 1895 regidrago-shell matchup-flex-jit/go-first 489 4 -flex
          check 1911 regidrago-shell matchup-flex-jit/go-first 329 "not ready through T5"

      - name: Verify issue 1979 K1 provenance differential
        shell: bash
        run: |
          set -euo pipefail
          cat > issue-1979-probe.cpp <<'CPP'
          #define REGIDRAGO_SIM_NO_MAIN
          #include "src/regidrago_sim.cpp"
          #include <iostream>
          #include <random>
          #include <utility>
          namespace sim {
          struct EngineTestAccess {
            static void set_state(Engine& engine, State state, const bool deck_seen,
                                  const bool prizes_revealed) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = deck_seen;
              engine.prizes_revealed_ = prizes_revealed;
            }
            static bool route_available(const Engine& engine) {
              return engine.issue_1875_quick_ball_tapu_crispin_route_available();
            }
          };
          }
          static sim::State exact_state() {
            sim::State state;
            state.turn = 3;
            state.active = sim::Pokemon{sim::Card::RegidragoVstar, 1, 0, 1};
            state.hand = {sim::Card::Fire, sim::Card::QuickBall, sim::Card::Dragapult};
            state.deck = {sim::Card::RegidragoV, sim::Card::Grass, sim::Card::Fire,
                          sim::Card::Crispin, sim::Card::TapuLeleGX};
            return state;
          }
          int main() {
            // K1 is established by either deck inspection or full Prize inspection: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
            // Heavy Ball, Quick Ball, Tapu Lele-GX, Crispin, and Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh10-146 https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-136
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1979
            const sim::Scenario scenario{"issue-1979", sim::DciProfile::StrictJit,
                                         sim::LockMode::None, true, 5};
            std::mt19937_64 deck_rng{1979};
            sim::Engine deck_k1(scenario, sim::baseline_recipe(), deck_rng);
            sim::EngineTestAccess::set_state(deck_k1, exact_state(), true, false);
            std::cout << "deck-only=" << sim::EngineTestAccess::route_available(deck_k1) << '\n';
            std::mt19937_64 prize_rng{1979};
            sim::Engine prize_k1(scenario, sim::baseline_recipe(), prize_rng);
            sim::EngineTestAccess::set_state(prize_k1, exact_state(), false, true);
            std::cout << "prize-only=" << sim::EngineTestAccess::route_available(prize_k1) << '\n';
            std::mt19937_64 k0_rng{1979};
            sim::Engine k0(scenario, sim::baseline_recipe(), k0_rng);
            sim::EngineTestAccess::set_state(k0, exact_state(), false, false);
            std::cout << "k0=" << sim::EngineTestAccess::route_available(k0) << '\n';
          }
          CPP
          c++ -std=c++20 -O0 issue-1979-probe.cpp -o issue-1979-probe
          ./issue-1979-probe | tee issue-1979.txt
          grep -q "deck-only=1" issue-1979.txt
          grep -q "prize-only=0" issue-1979.txt
          grep -q "k0=0" issue-1979.txt

      - name: Generate and verify canonical and paired T2/T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          # Fixed-seed aggregate specification: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-canonical-shell-baseline
          # Matched two-deck matrix specification: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-t2-t3-matrix.csv
          cmp audit-t2-t3-matrix.csv results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv
          cmp audit-multi-deck-matrix.csv results/multi_deck_comparison.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure and run ASan and UBSan suite
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Record static-analysis and exact-source evidence
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee audit-tested-head.txt
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git grep -nE 'deck_seen_|prizes_known\(|prizes_revealed_' -- 'src/**/*.inc' 'src/**/*.cpp' > knowledge-state-markers.txt || true
          git grep -nE 'api\.pokemontcg\.io/v2/cards/' -- '*.cpp' '*.hpp' '*.inc' '*.md' > card-source-markers.txt || true
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim

      - name: Upload source-bound audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-20260731-1254-${{ github.run_attempt }}
          path: |
            perfect-play-*.txt
            issue-*.txt
            audit-t2-t3-matrix.csv
            audit-multi-deck-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            knowledge-state-markers.txt
            card-source-markers.txt
            build/Testing
            build-sanitize/Testing
          if-no-files-found: error
