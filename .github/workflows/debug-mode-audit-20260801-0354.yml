name: Debug Mode Audit 20260801 0354

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-mode-audit-20260801-0354-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source base
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee audit-tested-head.txt
          git merge-base --is-ancestor 8bd11653e92cc490030f0e96cde1bdacddb261c7 HEAD

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Perfect-play simulate-this pass 1
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Earliest complete route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee perfect-pass-1.txt
          grep -q "first-ready turn: 2" perfect-pass-1.txt
          grep -q "setup result: success" perfect-pass-1.txt

      - name: Perfect-play simulate-this pass 2
        shell: bash
        run: |
          set -euo pipefail
          # Powerglass resolves after the attack step: https://api.pokemontcg.io/v2/cards/sv6pt5-63
          # Apex Dragon requires GGF and a Dragon attack in discard: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Timing review: https://github.com/FlareZ123/pokemon-sims/issues/919
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee perfect-pass-2.txt
          grep -q "first-ready turn: 3" perfect-pass-2.txt
          grep -q "setup result: success" perfect-pass-2.txt

      - name: Perfect-play simulate-this pass 3
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco, Forretress ex, and Secret Box: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee perfect-pass-3.txt
          grep -q "first-ready turn: 2" perfect-pass-3.txt
          grep -q "setup result: success" perfect-pass-3.txt

      - name: Capture current open bug witnesses
        shell: bash
        run: |
          set -euo pipefail
          # K1, DCI/JIT, connector costs, and Supporter contention: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          trace() {
            local issue="$1" deck="$2" scenario="$3" seed="$4" suffix="${5:-}"
            ./build/regidrago_sim --simulate-this --deck "$deck" --scenario "$scenario" --seed "$seed" | tee "issue-${issue}${suffix}.txt"
          }
          trace 1871 regidrago-shell strict-jit/go-first 292
          trace 1872 regidrago-shell matchup-flex-jit/go-first 453 -first
          trace 1872 regidrago-shell matchup-flex-jit/go-second 453 -second
          trace 1873 regidrago-shell strict-jit/go-second 38
          trace 1879 regidrago-shell strict-jit/go-first 146 -first
          trace 1879 regidrago-shell strict-jit/go-second 163 -second
          trace 1895 regidrago-shell strict-jit/go-first 951
          trace 1895 regidrago-shell matchup-flex-jit/go-first 489 -flex
          trace 1911 regidrago-shell matchup-flex-jit/go-first 329

      - name: Verify open static bug anchors
        shell: bash
        run: |
          set -euo pipefail
          # K1 specification: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          # Heavy Ball and Pineco: https://api.pokemontcg.io/v2/cards/swsh10-146 https://api.pokemontcg.io/v2/cards/sv4pt5-1
          grep -n "complete_issue_1596_turo_vessel_dialga_route" src/trace_engine_v2/part_issue_1439_treasure_tapu_crispin_override.inc | tee issue-2000-anchor.txt
          grep -n "!deck_seen_" src/trace_engine_v2/part_issue_1439_treasure_tapu_crispin_override.inc | tee -a issue-2000-anchor.txt
          grep -n "issue_1715_quick_ball_tapu_burnet_next_window_route" src/trace_engine_v2/part_celestial_roar_override.inc | tee issue-2001-anchor.txt
          grep -n "!deck_seen_" src/trace_engine_v2/part_celestial_roar_override.inc | tee -a issue-2001-anchor.txt
          grep -n "steven_zero_energy_latias_vessel_candidate" src/trace_engine_v2/part_issue_1002_steven_target_override.inc | tee issue-2023-anchor.txt
          grep -n "!deck_seen_" src/trace_engine_v2/part_issue_1002_steven_target_override.inc | tee -a issue-2023-anchor.txt
          grep -n "issue_1223_full_item_lock_steven_grass_route_available" src/trace_engine_v2/part_issue_1030_steven_turo_override.inc | tee issue-2022-anchor.txt
          grep -n "!deck_seen_" src/trace_engine_v2/part_issue_1030_steven_turo_override.inc | tee -a issue-2022-anchor.txt
          grep -n "Card::Pineco" src/trace_engine_v2/part_prize_payload_outlet_override.inc | tee issue-1964-anchor.txt || true

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Generate and compare canonical T2 and T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          # Canonical matrix contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-canonical-shell-baseline
          # Paired matrix contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-simulation-results.csv
          cmp audit-simulation-results.csv results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-comparison.csv
          cmp audit-multi-deck-comparison.csv results/multi_deck_comparison.csv

      - name: Record repository-wide static evidence
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | sort > tracked-files.txt
          git grep -nEI 'TODO|FIXME|HACK|BUG' -- '*.cpp' '*.hpp' '*.inc' '*.py' '*.cmake' '*.md' > static-markers.txt || true
          git grep -n "!deck_seen_" -- 'src/*.cpp' 'src/**/*.inc' > deck-seen-gates.txt || true
          git grep -nE 'sm5-82|sm6-82' -- '*.cpp' '*.hpp' '*.inc' '*.md' '*.yml' > suspect-card-ids.txt || true
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim

      - name: Upload Release audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-mode-audit-20260801-0354-${{ github.run_attempt }}
          path: |
            perfect-pass-*.txt
            issue-*.txt
            issue-*-anchor.txt
            audit-simulation-results.csv
            audit-multi-deck-comparison.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            tracked-files.txt
            static-markers.txt
            deck-seen-gates.txt
            suspect-card-ids.txt
            build/Testing
          if-no-files-found: error

  sanitizer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure ASan and UBSan
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure
