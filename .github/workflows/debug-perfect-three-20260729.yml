name: Debug Perfect Three 20260729

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git ls-files | sort > source-files.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release simulator and tests
        run: cmake --build build --parallel 2
      - name: Pass 1 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V and VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # K1, strict-JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-pass-1.txt
      - name: Pass 2 shell matchup-flex JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Dynamic DCI and AMR model: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Regidrago VSTAR attack cost and Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-pass-2.txt
      - name: Pass 3 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Pineco and Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pass-3.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Generate all-deck T2 T3 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out all-deck-matrix.csv
      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-three-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            source-files.txt
            tested-head.txt
            trace-pass-*.txt
            all-deck-matrix.csv
            build/Testing
          if-no-files-found: warn
