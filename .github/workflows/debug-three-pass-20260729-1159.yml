name: Debug Three Pass 20260729 1159

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-three-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Simulate pass 1 shell earliest T2
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V/VSTAR and official evolution, attachment, Supporter, Item, Ability, retreat, and turn procedure: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # K1, DCI/JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-pass-1.txt

      - name: Simulate pass 2 Pineco earliest T2
        shell: bash
        run: |
          set -euo pipefail
          # Pineco, Forretress ex, Dawn, Mysterious Treasure, Crispin, Regidrago VSTAR, and official procedure: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Registered Pineco, K1, DCI/JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pass-2.txt

      - name: Simulate pass 3 scheduled Item lock T3
        shell: bash
        run: |
          set -euo pipefail
          # Oricorio, Mysterious Treasure, Tapu Lele-GX, Steven's Resolve, Professor Burnet, Regidrago VSTAR, and official procedure: https://api.pokemontcg.io/v2/cards/sm2-55 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/swsh12tg-TG26 https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Scheduled Item lock and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#turn-2-item-lock https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/issues/1817
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-turn2-item-lock/go-second --seed 314159 --require-ready-by 3 | tee trace-pass-3.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2

      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate shell T2/T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-shell-matrix.csv

      - name: Generate all-condition T2/T3 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out t2-t3-all-condition-matrix.csv

      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-three-pass-20260729-1159-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            tested-head.txt
            trace-pass-*.txt
            t2-t3-shell-matrix.csv
            t2-t3-all-condition-matrix.csv
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
