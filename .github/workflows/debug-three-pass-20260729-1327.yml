name: Debug Three Pass 20260729 1327

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Pass 1 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V/VSTAR and official turn procedure: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # K1, DCI/JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-pass-1.txt

      - name: Pass 2 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Pineco, Forretress ex, Secret Box, and official turn procedure: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Registered deck and decision-priority specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#registered-decks https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pass-2.txt

      - name: Pass 3 shell no-discard-control going first
        shell: bash
        run: |
          set -euo pipefail
          # Search Items, Energy attachment, and official turn procedure: https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sv4-163 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # No-discard-control and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 1 --require-ready-by 3 | tee trace-pass-3.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2

      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate canonical setup matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-shell-matrix.csv

      - name: Generate all-deck all-condition matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out t2-t3-all-condition-matrix.csv

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-three-pass-20260729-1327-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            tested-head.txt
            trace-pass-*.txt
            t2-t3-shell-matrix.csv
            t2-t3-all-condition-matrix.csv
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
