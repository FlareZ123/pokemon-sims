name: Current Main Debug Three Pass 20260729 1453

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git ls-files | sort > source-files.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release simulator and tests
        run: cmake --build build --parallel 2
      - name: Simulate pass 1 shell going second seed 1
        shell: bash
        run: |
          set -euo pipefail
          # Evolution timing, Supporter timing, manual attachment, and ordinary turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Regidrago VSTAR, Steven's Resolve, Crispin, Brilliant Blender, and Latias ex: https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-164 https://api.pokemontcg.io/v2/cards/sv8-76
          # Earliest legal route and strict-JIT specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-pass-1.txt
          grep -F "first-ready turn: 2 | setup result: success" trace-pass-1.txt
      - name: Simulate pass 2 shell going first seed 2
        shell: bash
        run: |
          set -euo pipefail
          # Powerglass attaches Basic Energy at the end of the turn, after the attack window: https://api.pokemontcg.io/v2/cards/sv6pt5-63
          # Legacy Star and Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn, evolution, Ability, attachment, and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Future-card oracle prohibition and earliest legal route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee trace-pass-2.txt
          grep -F "first-ready turn: 3 | setup result: success" trace-pass-2.txt
      - name: Simulate pass 3 Pineco going second seed 35
        shell: bash
        run: |
          set -euo pipefail
          # Mysterious Treasure discard and search text: https://api.pokemontcg.io/v2/cards/sm6-113
          # Tapu Lele-GX, Steven's Resolve, Crispin, Regidrago VSTAR, and Dragapult ex: https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sv6-130
          # Official turn, Supporter, Item, evolution, attachment, and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Strict-JIT and named-deck specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#registered-decks
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pass-3.txt
          grep -F "first-ready turn: 2 | setup result: success" trace-pass-3.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Configure sanitizer build
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build sanitizer simulator and tests
        run: cmake --build build-sanitize --parallel 2
      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure
      - name: Generate canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-matrix.csv
      - name: Generate all-deck T2 T3 T4 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out all-deck-matrix.csv
      - name: Upload debug evidence and local-validation binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-debug-three-pass-20260729-1453-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            source-files.txt
            tested-head.txt
            trace-pass-*.txt
            t2-t3-matrix.csv
            all-deck-matrix.csv
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
