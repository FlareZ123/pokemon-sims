name: Debug Three Pass 20260729 1922

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'audit/debug-three-pass-20260729-1922'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release simulator and tests
        run: cmake --build build --parallel 2
      - name: Simulate pass 1 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago VSTAR, strict-JIT ready state, and earliest-route policy: https://api.pokemontcg.io/v2/cards/swsh12-136 https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-pass-1.txt
      - name: Simulate pass 2 shell Rule Box Ability lock
        shell: bash
        run: |
          set -euo pipefail
          # Path to the Peak, Mysterious Treasure, Regidrago VSTAR, and lock specification: https://api.pokemontcg.io/v2/cards/swsh6-148 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/swsh12-136 https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#lock-model
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-rulebox-ability-lock/go-second --seed 13 --require-ready-by 2 | tee trace-pass-2.txt
      - name: Simulate pass 3 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Secret Box, Pineco, Forretress ex, Dawn, and registered route policy: https://api.pokemontcg.io/v2/cards/sv6-163 https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/me2-87 https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pass-3.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Generate canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-matrix.csv
      - name: Generate all-deck setup matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out all-deck-matrix.csv
      - name: Capture static audit surfaces
        run: |
          git grep -n -E 'TODO|FIXME|HACK|BUG' -- src tests docs scripts > static-markers.txt || true
          git grep -n -E 'simulate-this|strict-jit|K1|DCI|lock|Supporter|Retreat|attach_manual|choose_discard' -- docs src > policy-surfaces.txt || true
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-three-pass-1922-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            tested-head.txt
            trace-pass-*.txt
            t2-t3-matrix.csv
            all-deck-matrix.csv
            static-markers.txt
            policy-surfaces.txt
            build/Testing
          if-no-files-found: warn
