name: Debug source artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upload current source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-main-source
          path: |
            CMakeLists.txt
            src
            tests
            CARD_CLASS_CLEANUP.md
