name: Diagnose PR provenance

on:
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkoutv4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print source and artifact digests
        run: |
          python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; import hashlib; root=Path('.').resolve(); print('SOURCE_DIGEST=' + simulator_policy_source_digest(root)); print('MULTI_CSV_DIGEST=' + hashlib.sha256((root / 'results/multi_deck_comparison.csv').read_bytes()).hexdigest()); print('MULTI_CSV_CRLF=' + str((root / 'results/multi_deck_comparison.csv').read_bytes().count(bytes([13,10]))))"
