name: Diagnose issue 2891 seed939 arbitration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-2891-seed939.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_sim --parallel 2
      - name: Run seed 939 trace
        shell: bash
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 939
