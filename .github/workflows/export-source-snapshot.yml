name: Apply Issue 2069 Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2069-prize-k1-oricorio-first
      - name: Apply isolated source and regression changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('src/trace_engine_v2/part_issue_1476_redundant_burnet_route_override.inc')
          text = source.read_text()
          old = """  bool issue_1476_t2_oricorio_first_route_available_after_search_started() const {
            if (!deck_seen_ || state_.turn != 1 || !scenario_.going_first ||
          """
          new = """  bool issue_1476_t2_oricorio_first_route_available_after_search_started() const {
            // A resolved deck search or complete Prize inspection establishes the same
            // fixed-list K1. This route reads exact remaining-deck inventory, so it must
            // use the repository-wide knowledge predicate rather than one provenance:
            // Hisuian Heavy Ball: https://api.pokemontcg.io/v2/cards/swsh10-146
            // K1 specification: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
            // Confirmed provenance bug: https://github.com/FlareZ123/pokemon-sims/issues/2069
            if (!prizes_known() || state_.turn != 1 || !scenario_.going_first ||
          """
          if old not in text:
              raise SystemExit('source anchor not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/issue_1476_redundant_burnet_dci_tests.cpp')
          text = test.read_text()
          old = """  static void set_state(Engine& engine, State state,
                                  const bool deck_seen = false) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = deck_seen;
              engine.prizes_revealed_ = deck_seen;
            }
          """
          new = """  static void set_state(Engine& engine, State state,
                                  const bool deck_seen = false,
                                  const bool prizes_revealed = false) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = deck_seen;
              engine.prizes_revealed_ = prizes_revealed;
            }

            static bool prizes_known(const Engine& engine) {
              return engine.prizes_known();
            }
          """
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if old not in text:
              raise SystemExit('test access anchor not found')
          text = text.replace(old, new, 1)

          replacement = textwrap.dedent(r'''\
          void test_k1_t2_route_requires_every_inspected_axis() {
            const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
            expect(deck != nullptr, "The registered shell recipe is unavailable.");
            const sim::Scenario scenario{
                "issue-1476-k1", sim::DciProfile::StrictJit,
                sim::LockMode::None, true, 2};

            const auto route_available = [&](sim::State state, const std::uint64_t seed,
                                             const bool deck_seen,
                                             const bool prizes_revealed) {
              std::mt19937_64 rng(seed);
              sim::Engine engine(scenario, deck->recipe, rng);
              sim::EngineTestAccess::set_state(engine, std::move(state), deck_seen,
                                              prizes_revealed);
              return std::pair{sim::EngineTestAccess::prizes_known(engine),
                               sim::EngineTestAccess::t2_route_available(engine)};
            };

            const auto deck_k1 = route_available(inspected_t1_route_state(), 147610,
                                                 true, false);
            expect(deck_k1.first && deck_k1.second,
                   "The deck-search K1 T2 route was rejected.");

            // Heavy Ball exposes every face-down Prize card. With a fixed 60-card list,
            // complete Prize inspection proves the same Oricorio, Tapu Lele-GX, Crispin,
            // Energy, and payload inventory used by the already-validated deck-search route:
            // Hisuian Heavy Ball: https://api.pokemontcg.io/v2/cards/swsh10-146
            // Oricorio / Vital Dance: https://api.pokemontcg.io/v2/cards/sm2-55
            // Tapu Lele-GX / Wonder Tag: https://api.pokemontcg.io/v2/cards/sm2-60
            // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
            // Official Prize inspection, search, Bench, Ability, attachment, Supporter, and evolution procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
            // K1 and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
            // Confirmed provenance bug: https://github.com/FlareZ123/pokemon-sims/issues/2069
            const auto prize_k1 = route_available(inspected_t1_route_state(), 147609,
                                                  false, true);
            expect(prize_k1.first && prize_k1.second,
                   "The Prize-inspection K1 T2 route was rejected.");

            const auto true_k0 = route_available(inspected_t1_route_state(), 147608,
                                                 false, false);
            expect(!true_k0.first && !true_k0.second,
                   "The exact hidden-zone route was admitted at true K0.");

            const auto rejected_without = [&](const sim::Card card, const char* message,
                                              const std::uint64_t seed) {
              sim::State state = inspected_t1_route_state();
              state.deck.erase(std::find(state.deck.begin(), state.deck.end(), card));
              expect(!route_available(std::move(state), seed, true, false).second, message);
            };

            rejected_without(sim::Card::Oricorio,
                             "The route survived without Oricorio in the inspected deck.",
                             147611);
            rejected_without(sim::Card::TapuLeleGX,
                             "The route survived without Tapu Lele-GX in the inspected deck.",
                             147612);
            rejected_without(sim::Card::Crispin,
                             "The route survived without Crispin in the inspected deck.",
                             147613);
            rejected_without(sim::Card::Grass,
                             "The route survived with only one inspected Grass Energy.",
                             147614);
            rejected_without(sim::Card::Fire,
                             "The route survived without inspected Fire Energy.",
                             147615);

            sim::State one_payload = inspected_t1_route_state();
            one_payload.deck.erase(std::find(one_payload.deck.begin(), one_payload.deck.end(),
                                             sim::Card::MegaDragonite));
            one_payload.deck.erase(std::find(one_payload.deck.begin(), one_payload.deck.end(),
                                             sim::Card::GoodraVstar));
            expect(!route_available(std::move(one_payload), 147616, true, false).second,
                   "The route failed to reserve a Blender payload against the T2 draw.");
          }

          void test_seed_129_reaches_t2_through_oricorio_first()''')
          pattern = re.compile(
              r'void test_k1_t2_route_requires_every_inspected_axis\(\) \{.*?\n\}\n\nvoid test_seed_129_reaches_t2_through_oricorio_first\(\)',
              re.DOTALL,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('route regression anchor not found')
          test.write_text(text)
          PY
      - name: Run focused regression
        shell: bash
        run: |
          g++ -std=c++20 -O0 -UNDEBUG -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            tests/issue_1476_redundant_burnet_dci_tests.cpp -o issue_1476_test
          ./issue_1476_test
      - name: Refresh source-bound provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.')
          digest = simulator_policy_source_digest(root)
          baseline = root / 'results/baseline_manifest.json'
          data = json.loads(baseline.read_text())
          old = data['simulator_policy_source_sha256']
          data['simulator_policy_source_sha256'] = digest
          baseline.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          for path in [root / 'results/multi_deck_manifest.json',
                       root / 'docs/MULTI_DECK_REPORT.md']:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'old digest missing from {path}')
              path.write_text(text.replace(old, digest))
          PY
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/export-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_issue_1476_redundant_burnet_route_override.inc \
            tests/issue_1476_redundant_burnet_dci_tests.cpp \
            results/baseline_manifest.json results/multi_deck_manifest.json \
            docs/MULTI_DECK_REPORT.md .github/workflows/export-source-snapshot.yml
          git commit -m "Accept Prize-inspection K1 for issue-1476 Oricorio route"
          git push origin HEAD:fix/2069-prize-k1-oricorio-first
