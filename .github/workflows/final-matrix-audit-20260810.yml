name: Final Matrix Audit 20260810

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: final-matrix-audit-20260810-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Generate all-deck T2 and T3 matrix once
        run: |
          # Run the registered aggregate population once for both decks to avoid the duplicate shell experiment tracked by #2724:
          # https://github.com/FlareZ123/pokemon-sims/issues/2724
          # Registered aggregate/matrix contract:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out final-multi-deck-matrix.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          source = Path('final-multi-deck-matrix.csv')
          rows = list(csv.DictReader(source.open(newline='', encoding='utf-8')))
          fields = ['deck', 'scenario', 'trials', 'ready_by_t2_pct', 'ready_by_t2_se_pp', 'ready_by_t3_pct', 'ready_by_t3_se_pp']
          with Path('final-t2-t3-matrix.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows({field: row[field] for field in fields} for row in rows)
          PY
          cat final-t2-t3-matrix.csv

      - name: Upload matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-matrix-audit-20260810-${{ github.run_attempt }}
          path: |
            final-multi-deck-matrix.csv
            final-t2-t3-matrix.csv
          if-no-files-found: error
