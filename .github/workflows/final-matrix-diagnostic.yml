name: Final branch cleanup diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/final-matrix-diagnostic.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete completed temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/cleanup-1786649650448
          gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/ci-final-matrix-1786650911977
