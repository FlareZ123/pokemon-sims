name: Fix 1593 report refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-1593-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1593-fss-treasure'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Refresh canonical reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Validate report contracts
        run: ctest --test-dir build --output-on-failure -R 'setup_report_contract|multi_deck_report_contract'
      - name: Commit refreshed reports
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs results
          git rm .github/workflows/fix-1593-report-refresh.yml
          git commit -m 'Refresh setup reports for issue 1593'
          git push origin HEAD:${GITHUB_HEAD_REF}
