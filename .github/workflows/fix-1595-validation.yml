name: Fix 1595 source-bound validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-1595-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1595-gladion-grass-turo'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply isolated patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/issue-1595.patch.b64.part-00 scripts/issue-1595.patch.b64.part-01 scripts/issue-1595.patch.b64.part-02 | base64 -d > /tmp/issue-1595.patch
          git apply --check /tmp/issue-1595.patch
          git apply /tmp/issue-1595.patch
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Focused regression and three reviewed traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_unified_tests issue_1595_gladion_grass_turo_blender_tests
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 155 --require-ready-by 4 | tee simulate-155.txt
          grep -q 'known prized Grass Energy' simulate-155.txt
          grep -q 'T4 | HOLD QUICK BALL' simulate-155.txt
          grep -q 'T4 | READY' simulate-155.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee simulate-43.txt
          grep -q 'T2 | READY' simulate-43.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 42 --require-ready-by 3 | tee simulate-42.txt
          grep -q 'T3 | READY' simulate-42.txt
      - name: Release suite before refreshed reports
        run: ctest --test-dir build --parallel 4 --output-on-failure -E 'setup_report_contract|multi_deck_report_contract'
      - name: Refresh 100000-trial matrices
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Sanitizer suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure
      - name: Materialize validated source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/regidrago_sim.cpp src/trace_engine_v2/part_issue_1595_gladion_grass_turo_blender_override.inc src/trace_engine_v2/part_issue_1595_preserve_turo_over_quick_ball_override.inc tests/issue_1595_gladion_grass_turo_blender_tests.cpp
          git rm .github/workflows/fix-1595-validation.yml scripts/issue-1595.patch.b64.part-00 scripts/issue-1595.patch.b64.part-01 scripts/issue-1595.patch.b64.part-02
          git commit -m 'Use prized Grass for the Blender-Turo route'
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1595-validation-${{ github.run_attempt }}
          path: |
            simulate-*.txt
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
