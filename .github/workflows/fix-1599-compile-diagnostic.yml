name: Fix 1599 compile diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/issue-1599-quick-ball-tapu-crispin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_issue_1599_patch_v2.py
      - name: Capture build
        shell: bash
        run: |
          set -o pipefail
          (cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2) 2>&1 | tee build.log
      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1599-compile-diagnostic
          path: build.log
          if-no-files-found: warn
