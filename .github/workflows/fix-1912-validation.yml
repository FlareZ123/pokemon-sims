name: Fix 1912 Apply Validated Artifact

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: fix-1912-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-validated-artifact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download validated combined evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 30567342876
          --repo FlareZ123/pokemon-sims
          --name issue-1912-validation-rebased-1
          --dir /tmp/issue-1912-artifact
      - name: Verify validated changed-file contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-generated-diff.txt <<'EOF'
          M	docs/MULTI_DECK_REPORT.md
          M	docs/REPORT.md
          M	results/baseline_manifest.json
          M	results/multi_deck_comparison.csv
          M	results/multi_deck_manifest.json
          M	results/simulation_results.csv
          EOF
          diff -u /tmp/expected-generated-diff.txt /tmp/issue-1912-artifact/generated-diff.txt
          test "$(cat /tmp/issue-1912-artifact/tested-head.txt)" = "6523844c351362ef1ef0b75b5585188d39cf8038"
      - name: Apply validated evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/issue-1912-artifact/docs/REPORT.md docs/REPORT.md
          cp /tmp/issue-1912-artifact/docs/MULTI_DECK_REPORT.md docs/MULTI_DECK_REPORT.md
          cp /tmp/issue-1912-artifact/results/baseline_manifest.json results/baseline_manifest.json
          cp /tmp/issue-1912-artifact/results/multi_deck_manifest.json results/multi_deck_manifest.json
          cp /tmp/issue-1912-artifact/results/simulation_results.csv results/simulation_results.csv
          cp /tmp/issue-1912-artifact/results/multi_deck_comparison.csv results/multi_deck_comparison.csv
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/MULTI_DECK_REPORT.md
          docs/REPORT.md
          results/baseline_manifest.json
          results/multi_deck_comparison.csv
          results/multi_deck_manifest.json
          results/simulation_results.csv
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
      - name: Commit validated evidence to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REPORT.md docs/MULTI_DECK_REPORT.md results/baseline_manifest.json results/multi_deck_manifest.json results/simulation_results.csv results/multi_deck_comparison.csv
          git commit -m "Regenerate issue 1912 combined setup evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
