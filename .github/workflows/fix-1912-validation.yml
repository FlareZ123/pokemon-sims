name: Fix 1912 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fix-1912-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Run focused issue 1912 regression
        run: ./build/regidrago_unified_tests issue_1912_post_attachment_blender_tests
      - name: Validate three source-bound issue witnesses
        shell: bash
        run: |
          set -euo pipefail
          # A manual Energy attachment does not end the turn, and a held Item remains playable:
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Brilliant Blender searches and discards deck cards:
          # https://api.pokemontcg.io/v2/cards/sv8-164
          # Apex Dragon requires GGF and a Dragon attack in discard:
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # K1, current-turn JIT, and earliest-route specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1912
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 3698 --require-ready-by 3 | tee issue-1912-seed-3698.txt
          grep -q "T3 | PLAY ITEM | rules: R-BLENDER-01" issue-1912-seed-3698.txt
          grep -q "T3 | READY" issue-1912-seed-3698.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 4984 --require-ready-by 4 | tee issue-1912-seed-4984.txt
          grep -q "T4 | PLAY ITEM | rules: R-BLENDER-01" issue-1912-seed-4984.txt
          grep -q "T4 | READY" issue-1912-seed-4984.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 2166 --require-ready-by 3 | tee issue-1912-seed-2166.txt
          grep -q "T3 | PLAY ITEM | rules: R-BLENDER-01" issue-1912-seed-2166.txt
          grep -q "T3 | READY" issue-1912-seed-2166.txt
      - name: Run complete Release suite before regeneration
        run: ctest --test-dir build --parallel 4 --output-on-failure
        continue-on-error: true
      - name: Regenerate shell setup evidence
        run: >-
          python scripts/regenerate_setup_baselines.py
          --exe build/regidrago_sim
          --out-dir results
          --trials 100000
          --matrix-seed 20260705
      - name: Update shell setup report
        run: python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired all-condition evidence
        run: >-
          python scripts/generate_multi_deck_comparison.py
          --exe build/regidrago_sim
          --out-dir results
          --trials 100000
          --matrix-seed 20260705
      - name: Update paired setup report
        run: python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite against regenerated evidence
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Record generated diff and tested source
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status | tee generated-diff.txt
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=tested-source.zip HEAD
          cp build/regidrago_sim validated-regidrago_sim
      - name: Upload regenerated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1912-validation-rebased-${{ github.run_attempt }}
          path: |
            issue-1912-seed-*.txt
            generated-diff.txt
            tested-head.txt
            tested-source.zip
            validated-regidrago_sim
            results/simulation_results.csv
            results/baseline_manifest.json
            results/setup_traces
            docs/REPORT.md
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/MULTI_DECK_REPORT.md
            build/Testing
          if-no-files-found: error
