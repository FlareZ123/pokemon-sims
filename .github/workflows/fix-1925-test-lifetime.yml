name: Fix issue 1925 test lifetime

on:
  push:
    branches: [chore/refresh-k1-provenance]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Keep Scenario fixture alive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/issue_1174_celestial_roar_gladion_treasure_tests.cpp')
          text = path.read_text()
          old = '''    std::mt19937_64 rng{seed};
              sim::Engine engine = make_engine(strict_first(), rng,
                  guaranteed_next_window_state(), nullptr, deck_seen, prizes_revealed);
          '''
          new = '''    std::mt19937_64 rng{seed};
              // Engine stores Scenario by reference, so keep the fixture alive through use:
              // C++ object lifetime: https://en.cppreference.com/w/cpp/language/lifetime.html
              const sim::Scenario scenario = strict_first();
              sim::Engine engine = make_engine(scenario, rng,
                  guaranteed_next_window_state(), nullptr, deck_seen, prizes_revealed);
          '''
          if old not in text:
              raise SystemExit('expected lifetime block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-1925-test-lifetime.yml
          git add tests/issue_1174_celestial_roar_gladion_treasure_tests.cpp
          git commit -m "Fix issue 1925 regression fixture lifetime"
          git push origin HEAD:chore/refresh-k1-provenance
