# Re-run against final main after refreshing source-bound provenance.
name: Harumi cleanup validation 20260809

on:
  pull_request:
    paths:
      - '.github/workflows/harumi-cleanup-validation-20260809.yml'

permissions:
  contents: read

jobs:
  cleanup-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build all targets
        run: cmake --build build --parallel 2
      - name: Print simulator policy source digest
        run: python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))"
      - name: Run tests except source-bound report contracts
        run: ctest --test-dir build --parallel 4 --output-on-failure -E 'setup_report_contract|multi_deck_report_contract'
      - name: Recheck simulate-this seed 1
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3
      - name: Recheck simulate-this seed 2
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 4
      - name: Recheck simulate-this seed 3
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2
      - name: Verify canonical matrix is behavior-identical
        shell: bash
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out cleanup-shell.csv
          cmp cleanup-shell.csv results/simulation_results.csv
      - name: Verify paired matrix is behavior-identical
        shell: bash
        run: |
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out cleanup-paired.csv
          cmp cleanup-paired.csv results/multi_deck_comparison.csv
