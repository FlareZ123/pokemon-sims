name: Harumi Cleanup Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'audit/cleanup-validation-20260810-0409'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run behavior suite excluding known active artifact contracts
        run: |
          ctest --test-dir build --parallel 4 --output-on-failure -E 'setup_report_contract|multi_deck_report_contract|setup_docs_generator_contract'
      - name: Run three independent simulate-this audits
        run: |
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-3.txt
          grep -q 'T2 | READY' trace-1.txt
          grep -q 'T3 | READY' trace-2.txt
          grep -q 'T2 | READY' trace-3.txt
      - name: Generate one aggregate all-decks matrix
        run: |
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out t2-t3-all-decks.csv
          cat t2-t3-all-decks.csv
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: harumi-cleanup-validation
          path: |
            trace-*.txt
            t2-t3-all-decks.csv
