name: Harumi Current Main Audit 2026-07-27 Pass 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harumi-current-main-audit-2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.head_ref == 'audit/harumi-20260727-main-three-pass-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run three independent simulate-this audits
        shell: bash
        run: |
          set -euo pipefail
          # Quick Ball, Mysterious Treasure, Tapu Lele-GX, Crispin, and first-turn rules:
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sm2-60
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://www.pokemon.com/us/pokemon-tcg/rules
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee audit-shell-seed43.txt
          grep -q 'T2 | READY' audit-shell-seed43.txt
          grep -q 'T2 | WONDER TAG.*Crispin' audit-shell-seed43.txt

          # Path-style Rule Box Ability lock, Forest Seal Stone, and Regidrago readiness:
          # https://api.pokemontcg.io/v2/cards/swsh6-148
          # https://api.pokemontcg.io/v2/cards/swsh12-156
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/us/pokemon-tcg/rules
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-rulebox-ability-lock/go-second --seed 13 --require-ready-by 3 | tee audit-shell-rulebox-seed13.txt
          grep -q 'T3 | READY' audit-shell-rulebox-seed13.txt

          # Gladion, Secret Box, Pineco, Forretress ex, and registered route specification:
          # https://api.pokemontcg.io/v2/cards/sm4-95
          # https://api.pokemontcg.io/v2/cards/sv6-163
          # https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # https://api.pokemontcg.io/v2/cards/sv4pt5-2
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 40 --require-ready-by 2 | tee audit-pineco-seed40.txt
          grep -q 'Gladion recovered the legally known prized Secret Box' audit-pineco-seed40.txt
          grep -q 'T2 | READY' audit-pineco-seed40.txt
      - name: Generate T2 and T3 matrices under all registered conditions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-results/t2-t3-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-results/multi-deck-matrix.csv
      - name: Run complete Release suite
        shell: bash
        run: ctest --test-dir build --parallel 4 --output-on-failure | tee release-suite.txt
      - name: Record source binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rev-parse origin/main > tested-main.txt
          git rev-parse HEAD > tested-head.txt
          git diff --name-only origin/main...HEAD > audit-diff.txt
          test "$(cat audit-diff.txt)" = '.github/workflows/harumi-current-main-audit-20260727-2.yml'
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-current-main-audit-2-${{ github.run_attempt }}
          path: |
            audit-*.txt
            audit-results/*.csv
            release-suite.txt
            tested-main.txt
            tested-head.txt
            audit-diff.txt
            build/Testing
          if-no-files-found: warn
