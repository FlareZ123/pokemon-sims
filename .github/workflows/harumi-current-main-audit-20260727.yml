name: Harumi Current Main Audit 2026-07-27

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harumi-current-main-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.head_ref == 'audit/harumi-20260727-main-3pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run three reviewed perfect-play traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee perfect-shell-1.txt
          grep -q 'T2 | READY' perfect-shell-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee perfect-shell-3.txt
          grep -q 'T2 | READY' perfect-shell-3.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 18 --require-ready-by 2 | tee perfect-pineco-18.txt
          grep -q 'T2 | READY' perfect-pineco-18.txt
      - name: Reproduce three confirmation-pending policy bugs
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --model-variant crobat2-erika-channeler --scenario no-discard-control/go-first --seed 83 | tee bug-1644-seed83.txt
          grep -q 'T3 | PLAY SUPPORTER | rules: R-GLADION-01' bug-1644-seed83.txt
          ./build/regidrago_sim --simulate-this --model-variant crobat1-heavy-ball --scenario matchup-flex-jit/go-second --seed 218 | tee bug-1645-seed218.txt
          grep -q 'Searched up to 3 cards: Regidrago V, Regidrago VSTAR, Gladion' bug-1645-seed218.txt
          ./build/regidrago_sim --simulate-this --model-variant crobat1-erika --scenario strict-jit/go-first --seed 245 | tee bug-1646-seed245.txt
          grep -q 'T3 | POLICY | rules: P-AXIS-01 | End: Active=Regidrago VSTAR \[GF\]' bug-1646-seed245.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Generate T2 and T3 matrices under all registered conditions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results
      - name: Record source binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rev-parse origin/main > tested-main.txt
          git diff --name-only origin/main...HEAD > audit-diff.txt
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-current-main-audit-${{ github.run_attempt }}
          path: |
            perfect-*.txt
            bug-*.txt
            tested-main.txt
            audit-diff.txt
            results/*.csv
            build/Testing
          if-no-files-found: warn
