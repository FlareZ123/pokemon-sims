name: Harumi Current Main Debug 20260730 0753

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harumi-current-main-debug-20260730-0753-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source anchors and static markers
        shell: bash
        run: |
          set -euo pipefail
          python tests/source_anchor_contract_tests.py
          git grep -nE 'TODO|FIXME|HACK|BUG' -- ':!results' ':!docs' > static-markers.txt || true
          python -m compileall -q scripts tests

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build simulator and tests
        run: cmake --build build --parallel 2

      - name: Simulate pass 1 shell strict JIT
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee control-pass-1.txt
          grep -q 'READY' control-pass-1.txt
          # Ready-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy

      - name: Simulate pass 2 shell matchup-flex JIT
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee control-pass-2.txt
          grep -q 'READY' control-pass-2.txt
          # Dynamic DCI and earliest legal route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities

      - name: Simulate pass 3 registered Pineco ALS
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee control-pass-3.txt
          grep -q 'T2 | READY' control-pass-3.txt
          # Pineco ALS and printed effects: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2

      - name: Reproduce every open source-bound bug witness
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 951 | tee issue-1895.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 925 | tee issue-1896-flex.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 925 | tee issue-1896-strict.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 108 | tee issue-1869.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 292 | tee issue-1871.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 453 | tee issue-1872-first.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 453 | tee issue-1872-second.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 38 | tee issue-1873.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 169 | tee issue-1874.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 169 | tee issue-1877.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 241 | tee issue-1878.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 146 | tee issue-1879-first.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 163 | tee issue-1879-second.txt
          # Item costs and searches: https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv4-163
          # Supporter contention and effects: https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-164 https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn, cost, search, discard, Supporter, Bench, and Energy procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf

      - name: Generate and verify canonical shell T2 T3 matrix
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out current-main-shell-matrix.csv
          cmp current-main-shell-matrix.csv results/simulation_results.csv
          # Matrix specification: https://github.com/FlareZ123/pokemon-sims/blob/main/SIM-PLAN.md

      - name: Generate and verify paired all-condition matrix
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out current-main-paired-matrix.csv
          cmp current-main-paired-matrix.csv results/multi_deck_comparison.csv
          # Paired matrix specification: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MULTI_DECK_REPORT.md

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Record exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee audit-tested-head.txt
          git archive --format=zip --output=audit-source-snapshot.zip HEAD
          cp build/regidrago_sim audit-regidrago_sim

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-current-main-debug-20260730-0753-${{ github.run_attempt }}
          path: |
            control-pass-*.txt
            issue-*.txt
            static-markers.txt
            current-main-shell-matrix.csv
            current-main-paired-matrix.csv
            audit-tested-head.txt
            audit-source-snapshot.zip
            audit-regidrago_sim
            build/Testing
          if-no-files-found: warn
