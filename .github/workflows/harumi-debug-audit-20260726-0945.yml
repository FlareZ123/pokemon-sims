name: Harumi debug audit 20260726 0945

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/harumi-20260726-0945'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run three independent perfect-play traces
        shell: bash
        run: |
          set -euo pipefail
          # --simulate-this is the repository's seeded full-game trace surface:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#test-surfaces
          ./build/regidrago_sim --simulate-this --model-variant crobat1-roseanne --scenario strict-jit/go-second --seed 6 --require-ready-by 3 | tee simulate-6.txt
          grep -q 'T3 | READY' simulate-6.txt
          grep -q 'T3 | PLAY SUPPORTER | rules: R-ARVEN-01' simulate-6.txt
          grep -q 'T3 | PLAY ITEM | rules: R-BLENDER-01' simulate-6.txt

          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee simulate-35.txt
          grep -q 'T2 | READY' simulate-35.txt

          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee simulate-43.txt
          grep -q 'T2 | READY' simulate-43.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Generate fresh T2/T3 matrices
        shell: bash
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260726 --out audit-simulation-results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260726 --out audit-multi-deck-comparison.csv
      - name: Run sanitizer suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-debug-audit-20260726-0945
          path: |
            simulate-*.txt
            audit-simulation-results.csv
            audit-multi-deck-comparison.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
