name: Harumi current-main debug audit 2026-07-26 1240 v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harumi-debug-audit-20260726-1240-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/harumi-20260726-1240'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record exact source and static scan
        shell: bash
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git rev-parse origin/main | tee tested-main.txt
          git diff --name-status origin/main...HEAD | tee audit-diff.txt
          git archive --format=tar.gz -o tested-source.tar.gz HEAD
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          suffixes = {".cc", ".cpp", ".cxx", ".h", ".hpp", ".inc", ".md", ".py", ".txt", ".yml", ".yaml", ".cmake", ".json", ".csv"}
          texts = {}
          for name in tracked:
              path = Path(name)
              if path.suffix.lower() not in suffixes and path.name != "CMakeLists.txt":
                  continue
              try:
                  texts[name] = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  pass
          malformed = []
          unfinished = []
          raw_random = []
          hidden_reads = []
          for name, text in texts.items():
              for line_no, line in enumerate(text.splitlines(), 1):
                  if re.search(r'^\s*#\s*include\s+[^<"\s].*\.inc', line): malformed.append((name, line_no, line.strip()))
                  if name != ".github/workflows/harumi-debug-audit-20260726-1240-v2.yml" and re.search(r"\b(?:TODO|FIXME|HACK|XXX)\b", line): unfinished.append((name, line_no, line.strip()))
                  if re.search(r"\b(?:rand|random_shuffle)\s*\(", line): raw_random.append((name, line_no, line.strip()))
                  if "state_.deck" in line or "state_.prizes" in line: hidden_reads.append((name, line_no, line.strip()))
          with open("static-audit.txt", "w", encoding="utf-8") as out:
              out.write(f"tracked_text_files={len(texts)}\ntracked_text_lines={sum(t.count(chr(10)) + 1 for t in texts.values())}\n")
              out.write(f"malformed_include={len(malformed)}\nunfinished_marker={len(unfinished)}\nraw_random_call_inventory={len(raw_random)}\nhidden_zone_read_inventory={len(hidden_reads)}\n")
              out.write("knowledge_spec=https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states\n")
              out.write("priority_spec=https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities\n")
              for label, rows in (("unfinished", unfinished), ("hidden_reads", hidden_reads)):
                  out.write(f"\n[{label}]\n")
                  for row in rows: out.write(":".join(map(str, row)) + "\n")
          if malformed: raise SystemExit("malformed include directives remain")
          if raw_random: raise SystemExit("uncontrolled legacy random calls remain")
          PY
          sed -n '1,360p' static-audit.txt

      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Three perfect-play simulate-this passes
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve route: https://api.pokemontcg.io/v2/cards/sm7-145 https://github.com/FlareZ123/pokemon-sims/issues/952
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee perfect-58.txt
          grep -q "T3 | READY" perfect-58.txt
          # Secret Box, Dawn, Forest of Vitality, and Exploding Energy: https://api.pokemontcg.io/v2/cards/sv6-163 https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/me1-117 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee perfect-pineco-35.txt
          grep -q "T2 | READY" perfect-pineco-35.txt
          # Mysterious Treasure to Tapu Lele-GX to Crispin: https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sv7-133 https://github.com/FlareZ123/pokemon-sims/issues/1209
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee perfect-43.txt
          grep -q "T2 | READY" perfect-43.txt

      - name: Reverify stale issue 1516
        shell: bash
        run: |
          set -euo pipefail
          # Quick Ball, Wonder Tag, Crispin, Gladion, and the one-Supporter limit: https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sm4-95 https://www.pokemon.com/us/pokemon-tcg/rules https://github.com/FlareZ123/pokemon-sims/issues/1516
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 42 --require-ready-by 3 | tee issue-1516-seed-42.txt
          grep -q "T1 | PLAY ITEM.*Tapu Lele-GX" issue-1516-seed-42.txt
          grep -q "T1 | WONDER TAG.*Crispin" issue-1516-seed-42.txt
          grep -q "T3 | READY" issue-1516-seed-42.txt

      - name: Broad simulate-this sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exploratory-traces
          while IFS='|' read -r deck scenario seed; do
            [ -n "$deck" ] || continue
            ./build/regidrago_sim --simulate-this --deck "$deck" --scenario "$scenario" --seed "$seed" > "exploratory-traces/${deck}-${scenario//\//_}-seed-${seed}.txt"
          done <<'CASES'
          regidrago-shell|strict-jit/go-first|7
          regidrago-shell|strict-jit/go-first|19
          regidrago-shell|strict-jit/go-second|11
          regidrago-shell|strict-jit/go-second|57
          regidrago-shell|matchup-flex-jit/go-first|73
          regidrago-shell|matchup-flex-jit/go-second|119
          regidrago-shell|no-discard-control/go-first|5
          regidrago-shell|no-discard-control/go-first|41
          regidrago-shell|no-discard-control/go-second|97
          regidrago-shell|strict-jit-combined-lock/go-second|13
          regidrago-shell|strict-jit-full-item-lock/go-first|61
          regidrago-shell|strict-jit-rulebox-ability-lock/go-second|109
          regidrago-pineco|strict-jit/go-first|9
          regidrago-pineco|strict-jit/go-second|35
          regidrago-pineco|matchup-flex-jit/go-first|83
          regidrago-pineco|matchup-flex-jit/go-second|17
          regidrago-pineco|matchup-flex-jit/go-second|67
          regidrago-pineco|no-discard-control/go-second|127
          CASES
          python - <<'PY'
          from pathlib import Path
          import re
          findings = []
          for path in sorted(Path("exploratory-traces").glob("*.txt")):
              lines = path.read_text(encoding="utf-8").splitlines()
              ready = [int(m.group(1)) for line in lines if (m := re.search(r"\bT(\d+)\s+\|\s+READY\b", line))]
              action_count = {}
              for line in lines:
                  if m := re.search(r"\bT(\d+)\s+\|\s+POLICY\s+\|\s+Start:", line): action_count[int(m.group(1))] = 0
                  elif m := re.search(r"\bT(\d+)\s+\|\s+(?!POLICY\b)", line):
                      turn = int(m.group(1))
                      if turn in action_count: action_count[turn] += 1
                  elif m := re.search(r"\bT(\d+)\s+\|\s+POLICY\s+\|\s+End:", line):
                      turn = int(m.group(1)); later = [r for r in ready if r > turn]
                      if action_count.get(turn, 0) == 0 and later: findings.append(f"{path.name}: idle T{turn} before later readiness T{min(later)}")
          Path("exploratory-findings.txt").write_text("\n".join(findings) + ("\n" if findings else "no automatic idle-turn findings\n"), encoding="utf-8")
          PY
          cat exploratory-findings.txt

      - name: Complete Release suite and matrices
        run: |
          ctest --test-dir build --parallel 4 --output-on-failure
          ./build/regidrago_sim --trials 100000 --seed 20260726 --out shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260726 --out all-decks-matrix.csv
          cat shell-matrix.csv
          cat all-decks-matrix.csv

      - name: Sanitizer suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-debug-audit-20260726-1240-v2-${{ github.run_attempt }}
          path: |
            tested-head.txt
            tested-main.txt
            audit-diff.txt
            tested-source.tar.gz
            static-audit.txt
            perfect-*.txt
            issue-1516-seed-42.txt
            exploratory-traces
            exploratory-findings.txt
            shell-matrix.csv
            all-decks-matrix.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
