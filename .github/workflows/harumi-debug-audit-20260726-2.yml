name: Harumi debug audit 2026-07-26 pass 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harumi-debug-audit-20260726-2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/harumi-debug-20260726-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact source and repository inventory
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-head.txt
          git rev-parse origin/main | tee tested-main.txt
          git diff --name-status origin/main...HEAD | tee audit-diff.txt
          find . -path ./.git -prune -o -type f -print | sort > repository-files.txt
          grep -RInE 'TODO|FIXME|HACK|XXX|simulate-this|choose_discard|deck_seen_|prizes_known|supporter_allowed|item_locked|ability_available' src tests docs scripts CMakeLists.txt README.md > static-scan.txt || true
          git archive --format=tar.gz --output=source-snapshot.tar.gz HEAD
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: CI simulate-this pass one, shell going second
        shell: bash
        run: |
          set -euo pipefail
          # Registered trace command and ready-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#run-one-readable-hand https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#scope
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee simulate-shell-seed-1.txt
          grep -q 'T3 | READY' simulate-shell-seed-1.txt
      - name: CI simulate-this pass two, Pineco going second
        shell: bash
        run: |
          set -euo pipefail
          # The registered Pineco seed-35 route and source-bound card identities: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#run-one-readable-hand https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee simulate-pineco-seed-35.txt
          grep -q 'T2 | READY' simulate-pineco-seed-35.txt
      - name: CI simulate-this pass three, Steven route control
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve searches up to three cards and the repository preserves the shortest complete visible route: https://api.pokemontcg.io/v2/cards/sm7-145 https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/issues/952
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee simulate-shell-seed-58.txt
          grep -q 'T3 | READY' simulate-shell-seed-58.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure | tee release-tests.txt
      - name: Generate current T2 and T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --trials 100000 --seed 20260726 --out shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260726 --out all-decks-matrix.csv
          cat shell-matrix.csv
          cat all-decks-matrix.csv
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-debug-audit-20260726-2-${{ github.run_attempt }}
          path: |
            tested-head.txt
            tested-main.txt
            audit-diff.txt
            repository-files.txt
            static-scan.txt
            source-snapshot.tar.gz
            simulate-*.txt
            release-tests.txt
            shell-matrix.csv
            all-decks-matrix.csv
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
          if-no-files-found: warn
