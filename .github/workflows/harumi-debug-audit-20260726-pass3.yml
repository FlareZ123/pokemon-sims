name: Harumi source-bound debug audit 2026-07-26 pass 3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harumi-debug-audit-20260726-pass3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/harumi-20260726-0741'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record exact source identity
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git rev-parse origin/main | tee tested-main.txt
          git diff --name-status origin/main...HEAD | tee audit-diff.txt

      - name: Scan the entire tracked repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path(".")
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          suffixes = {
              ".cc", ".cpp", ".cxx", ".h", ".hpp", ".inc", ".md", ".py",
              ".txt", ".yml", ".yaml", ".cmake", ".json", ".csv",
          }
          files = [
              root / name
              for name in tracked
              if (root / name).suffix.lower() in suffixes or (root / name).name == "CMakeLists.txt"
          ]
          texts = {}
          for path in files:
              try:
                  texts[path.as_posix()] = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  pass

          malformed_includes = []
          unfinished_markers = []
          hidden_zone_reads = []
          raw_random_calls = []
          direct_rule_urls = []

          for name, text in texts.items():
              for line_no, line in enumerate(text.splitlines(), 1):
                  if re.search(r'^\s*#\s*include\s+[^<"\s].*\.inc', line):
                      malformed_includes.append((name, line_no, line.strip()))
                  if name != ".github/workflows/harumi-debug-audit-20260726-pass3.yml" and re.search(r"\b(?:TODO|FIXME|HACK|XXX)\b", line):
                      unfinished_markers.append((name, line_no, line.strip()))
                  if "state_.deck" in line or "state_.prizes" in line:
                      hidden_zone_reads.append((name, line_no, line.strip()))
                  if re.search(r"\b(?:rand|random_shuffle)\s*\(", line):
                      raw_random_calls.append((name, line_no, line.strip()))
                  if "https://" in line and (
                      "pokemon.com" in line
                      or "api.pokemontcg.io" in line
                      or "github.com/FlareZ123/pokemon-sims" in line
                  ):
                      direct_rule_urls.append((name, line_no, line.strip()))

          with open("static-audit.txt", "w", encoding="utf-8") as out:
              out.write(f"tracked_text_files={len(texts)}\n")
              out.write(f"tracked_text_lines={sum(text.count(chr(10)) + 1 for text in texts.values())}\n")
              out.write(f"malformed_include={len(malformed_includes)}\n")
              out.write(f"unfinished_marker={len(unfinished_markers)}\n")
              out.write(f"hidden_zone_read_inventory={len(hidden_zone_reads)}\n")
              out.write(f"raw_random_call_inventory={len(raw_random_calls)}\n")
              out.write(f"direct_source_url_inventory={len(direct_rule_urls)}\n")
              out.write("k0_spec=https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#k0-before-a-legal-inspection\n")
              out.write("priority_spec=https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities\n")
              out.write("rules_register=https://github.com/FlareZ123/pokemon-sims/blob/main/docs/RULE_SOURCES.md\n")
              for label, rows in [
                  ("malformed_include", malformed_includes),
                  ("unfinished_marker", unfinished_markers),
                  ("hidden_zone_read_inventory", hidden_zone_reads),
                  ("raw_random_call_inventory", raw_random_calls),
              ]:
                  out.write(f"\n[{label}]\n")
                  for row in rows:
                      out.write(":".join(map(str, row)) + "\n")

          if malformed_includes:
              raise SystemExit("malformed include directives remain")
          if raw_random_calls:
              raise SystemExit("uncontrolled legacy random calls remain")
          PY
          sed -n '1,320p' static-audit.txt

      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Perfect-play pass one
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve searches up to three cards, while held Quick Ball and the Dragon payload cover the remaining setup axes: https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/swsh1-179 https://github.com/FlareZ123/pokemon-sims/issues/952
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee perfect-58.txt
          grep -q "Searched up to 3 cards: Regidrago VSTAR. Turn ended." perfect-58.txt
          grep -q "T3 | READY" perfect-58.txt

      - name: Perfect-play pass two
        shell: bash
        run: |
          set -euo pipefail
          # The registered Pineco line uses Secret Box, Dawn, Forest of Vitality, and Exploding Energy only through their printed legal effects: https://api.pokemontcg.io/v2/cards/sv6-163 https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/me1-117 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#registered-decks
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee perfect-pineco-35.txt
          grep -q "T2 | READY" perfect-pineco-35.txt

      - name: Perfect-play pass three
        shell: bash
        run: |
          set -euo pipefail
          # Mysterious Treasure can discard Dragapult ex, search Tapu Lele-GX, and preserve the Supporter action for Crispin: https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/cel25c-60_A https://api.pokemontcg.io/v2/cards/sv7-133 https://github.com/FlareZ123/pokemon-sims/issues/1209
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee perfect-43.txt
          grep -q "T2 | HOLD SUPPORTER.*Mysterious Treasure to Tapu Lele-GX to Crispin" perfect-43.txt
          grep -q "T2 | READY" perfect-43.txt

      - name: Run broad exploratory simulate-this sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exploratory-traces
          while IFS='|' read -r mode identity scenario seed; do
            [ -n "$mode" ] || continue
            safe_identity="${identity//\//_}"
            safe_scenario="${scenario//\//_}"
            out="exploratory-traces/${mode}-${safe_identity}-${safe_scenario}-seed-${seed}.txt"
            if [ "$mode" = "deck" ]; then
              ./build/regidrago_sim --simulate-this --deck "$identity" --scenario "$scenario" --seed "$seed" > "$out"
            else
              ./build/regidrago_sim --simulate-this --model-variant "$identity" --scenario "$scenario" --seed "$seed" > "$out"
            fi
          done <<'CASES'
          deck|regidrago-shell|strict-jit/go-first|7
          deck|regidrago-shell|strict-jit/go-first|19
          deck|regidrago-shell|strict-jit/go-first|73
          deck|regidrago-shell|strict-jit/go-second|11
          deck|regidrago-shell|strict-jit/go-second|57
          deck|regidrago-shell|strict-jit/go-second|119
          deck|regidrago-shell|no-discard-control/go-first|5
          deck|regidrago-shell|no-discard-control/go-first|41
          deck|regidrago-shell|no-discard-control/go-first|97
          deck|regidrago-shell|strict-jit-combined-lock/go-second|13
          deck|regidrago-shell|strict-jit-combined-lock/go-second|61
          deck|regidrago-shell|strict-jit-combined-lock/go-second|109
          deck|regidrago-pineco|strict-jit/go-first|9
          deck|regidrago-pineco|strict-jit/go-first|35
          deck|regidrago-pineco|strict-jit/go-first|83
          deck|regidrago-pineco|matchup-flex-jit/go-second|17
          deck|regidrago-pineco|matchup-flex-jit/go-second|67
          deck|regidrago-pineco|matchup-flex-jit/go-second|127
          model|crobat1-roseanne|strict-jit/go-second|2
          model|crobat1-roseanne|strict-jit/go-second|6
          model|crobat1-roseanne|strict-jit/go-second|10
          model|crobat2-erika-channeler|no-discard-control/go-first|3
          model|crobat2-erika-channeler|no-discard-control/go-first|15
          model|crobat2-erika-channeler|no-discard-control/go-first|63
          CASES

          python - <<'PY'
          from pathlib import Path
          import re

          findings = []
          for path in sorted(Path("exploratory-traces").glob("*.txt")):
              lines = path.read_text(encoding="utf-8").splitlines()
              ready_turns = [
                  int(match.group(1))
                  for line in lines
                  if (match := re.search(r"\bT(\d+)\s+\|\s+READY\b", line))
              ]
              action_counts = {}
              for line in lines:
                  start = re.search(r"\bT(\d+)\s+\|\s+POLICY\s+\|\s+Start:", line)
                  if start:
                      turn = int(start.group(1))
                      action_counts[turn] = 0
                      continue
                  action = re.search(r"\bT(\d+)\s+\|\s+(?!POLICY\b)", line)
                  if action:
                      turn = int(action.group(1))
                      if turn in action_counts:
                          action_counts[turn] += 1
                  end = re.search(r"\bT(\d+)\s+\|\s+POLICY\s+\|\s+End:", line)
                  if end:
                      turn = int(end.group(1))
                      if action_counts.get(turn, 0) == 0 and any(rt > turn for rt in ready_turns):
                          findings.append(
                              f"{path.name}: idle T{turn} before later readiness T{min(rt for rt in ready_turns if rt > turn)}"
                          )

          Path("exploratory-findings.txt").write_text(
              "\n".join(findings) + ("\n" if findings else "no automatic idle-turn findings\n"),
              encoding="utf-8",
          )
          PY
          cat exploratory-findings.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Generate and print fresh T2 and T3 matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260726 --out shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260726 --out all-decks-matrix.csv
          echo '--- shell matrix ---'
          cat shell-matrix.csv
          echo '--- all-decks matrix ---'
          cat all-decks-matrix.csv

      - name: Run sanitizer suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-debug-audit-20260726-pass3-${{ github.run_attempt }}
          path: |
            tested-head.txt
            tested-main.txt
            audit-diff.txt
            static-audit.txt
            perfect-*.txt
            exploratory-traces
            exploratory-findings.txt
            shell-matrix.csv
            all-decks-matrix.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
