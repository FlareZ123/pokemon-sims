name: Harumi debug audit 20260726 pass 9

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harumi-debug-audit-20260726-pass9-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/debug-mode-20260726-pass9'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source boundary
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-head.txt
          git rev-parse origin/main | tee tested-main.txt
          git diff --name-only origin/main...HEAD | tee audit-diff.txt
          test "$(wc -l < audit-diff.txt)" -eq 1
          grep -qx '.github/workflows/harumi-debug-audit-20260726-pass9.yml' audit-diff.txt
      - name: Build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Simulate pass 1 shell seed 43
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee debug-trace-pass1-shell-43.txt
          grep -q 'T2 | READY' debug-trace-pass1-shell-43.txt
      - name: Simulate pass 2 Pineco seed 35
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee debug-trace-pass2-pineco-35.txt
          grep -q 'T2 | READY' debug-trace-pass2-pineco-35.txt
      - name: Simulate pass 3 shell seed 58
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 58 --require-ready-by 2 | tee debug-trace-pass3-shell-58.txt
          grep -q 'T2 | READY' debug-trace-pass3-shell-58.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Generate fresh T2 and T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-debug-audit-20260726-pass9-${{ github.run_attempt }}
          path: |
            tested-head.txt
            tested-main.txt
            audit-diff.txt
            debug-trace-*.txt
            audit-shell-matrix.csv
            audit-multi-deck-matrix.csv
            build/Testing
          if-no-files-found: warn
