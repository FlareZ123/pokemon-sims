name: Harumi debug audit 20260727 pass 10

on:
  pull_request:
    branches: [main]

# Read-only source-bound audit against the current main simulator.
# Repository objective and imperfect-information contract:
# https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#scope
# https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
permissions:
  contents: read

concurrency:
  group: harumi-debug-audit-20260727-pass10-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/harumi-debug-20260727-0108'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record source boundary
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-head.txt
          git rev-parse origin/main | tee tested-main.txt
          git diff --name-only origin/main...HEAD | tee audit-diff.txt
          test "$(wc -l < audit-diff.txt)" -eq 1
          grep -qx '.github/workflows/harumi-debug-audit-20260727-pass10.yml' audit-diff.txt
      - name: Run static repository checks
        shell: bash
        run: |
          set -euo pipefail
          # GitHub custom-anchor contract: https://docs.github.com/en/enterprise-cloud@latest/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax#custom-anchors
          python tests/source_anchor_contract_tests.py
          git ls-files | sort > tracked-files.txt
          grep -RInE 'TODO|FIXME|XXX|HACK' src tests docs scripts > static-markers.txt || true
          grep -RIn 'https://' src tests docs > direct-source-urls.txt || true
      - name: Build Release and strict C++20
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          # C++ include grammar: https://eel.is/c++draft/cpp.include
          cmake -S . -B build-pedantic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-pedantic-errors
          cmake --build build-pedantic --parallel 2
      - name: Run three independent perfect-play traces
        shell: bash
        run: |
          set -euo pipefail
          # Steven, Crispin, Mysterious Treasure, Dragapult ex, Regidrago VSTAR, and Secret Box:
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sv6-130
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee debug-trace-pineco-35.txt
          grep -q 'banked Crispin and Dragapult ex' debug-trace-pineco-35.txt
          grep -q 'Dragapult ex (Mysterious Treasure cost)' debug-trace-pineco-35.txt
          grep -q 'without advancing the Pineco line' debug-trace-pineco-35.txt
          ! grep -q 'Secret Box discarded three other cards' debug-trace-pineco-35.txt
          ! grep -q 'T2 | EXPLODING ENERGY' debug-trace-pineco-35.txt
          grep -q 'T2 | READY' debug-trace-pineco-35.txt

          # Quick Ball, Mysterious Treasure, Tapu Lele-GX, Crispin, and Apex Dragon:
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sm2-60
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Core first-turn, search, Supporter, attachment, evolution, and retreat procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee debug-trace-shell-43.txt
          grep -q 'T1 | DISCARD.*Grass Energy (Quick Ball cost)' debug-trace-shell-43.txt
          grep -q 'searched a Basic Pokemon: Regidrago V' debug-trace-shell-43.txt
          grep -q 'T2 | HOLD SUPPORTER.*Mysterious Treasure to Tapu Lele-GX to Crispin' debug-trace-shell-43.txt
          grep -q 'T2 | DISCARD.*Dragapult ex (Mysterious Treasure cost)' debug-trace-shell-43.txt
          grep -q 'T2 | WONDER TAG.*Crispin' debug-trace-shell-43.txt
          ! grep -q 'STAR ALCHEMY' debug-trace-shell-43.txt
          grep -q 'T2 | READY' debug-trace-shell-43.txt

          # Steven may search up to three cards, while Quick Ball supplies the current-turn payload outlet:
          # https://api.pokemontcg.io/v2/cards/sm7-145
          # https://api.pokemontcg.io/v2/cards/swsh1-179
          # https://api.pokemontcg.io/v2/cards/sv6-130
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Earliest direct completion and resource preservation: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee debug-trace-shell-58.txt
          grep -q 'Searched up to 3 cards: Regidrago VSTAR. Turn ended.' debug-trace-shell-58.txt
          ! grep -q 'Searched up to 3 cards: Regidrago VSTAR, Crispin' debug-trace-shell-58.txt
          ! grep -q 'Searched up to 3 cards: Regidrago VSTAR, Brilliant Blender' debug-trace-shell-58.txt
          grep -q 'T3 | DISCARD.*Dragapult ex (Quick Ball cost)' debug-trace-shell-58.txt
          grep -q 'T3 | READY' debug-trace-shell-58.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Build and run ASan plus UBSan suite
        shell: bash
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitizers --parallel 2
          ctest --test-dir build-sanitizers --parallel 2 --output-on-failure
      - name: Generate fresh T2 and T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-multi-deck-matrix.csv
          ./build/regidrago_sim --model-crobat --trials 100000 --seed 20260723 --out audit-crobat-matrix.csv
          cmp audit-shell-matrix.csv results/simulation_results.csv
          cmp audit-multi-deck-matrix.csv results/multi_deck_comparison.csv
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harumi-debug-audit-20260727-pass10-${{ github.run_attempt }}
          path: |
            tested-head.txt
            tested-main.txt
            audit-diff.txt
            tracked-files.txt
            static-markers.txt
            direct-source-urls.txt
            debug-trace-*.txt
            audit-*-matrix.csv
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
            build-sanitizers/Testing
          if-no-files-found: warn
