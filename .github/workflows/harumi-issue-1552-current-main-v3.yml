name: Harumi Issue 1552 Current Main Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: harumi-issue-1552-current-main-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    if: github.head_ref == 'fix/issue-1552-current-main-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and apply the approved current-main source and test patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/issue-1552-current-main-v2
          git show origin/fix/issue-1552-current-main-v2:scripts/apply_issue_1552_current_main.py > scripts/apply_issue_1552_current_main.py
          git show origin/fix/issue-1552-current-main-v2:scripts/refine_issue_1552_current_main_tests.py > scripts/refine_issue_1552_current_main_tests.py
          python scripts/apply_issue_1552_current_main.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/refine_issue_1552_current_main_tests.py')
          source = path.read_text(encoding='utf-8')
          marker = '\nreplace_once(\n    "tests/run_issue_1092_quick_ball_energy_jit_gate.cmake",\n'
          if source.count(marker) != 1:
              raise SystemExit(f'issue-1552 refinement split count: {source.count(marker)}')
          path.write_text(source.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
          python scripts/refine_issue_1552_current_main_tests.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/run_issue_1092_quick_ball_energy_jit_gate.cmake')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '# reaches GG on T2 and preserves the established T3 Blender finish:':
                  '# reaches GGF on T2 and completes strict-JIT on that same earliest turn:',
              'if(NOT issue_1092_seed_104_connector MATCHES "T3 \\| READY \\|")':
                  'if(NOT issue_1092_seed_104_connector MATCHES "T2 \\| READY \\|")',
              'Seed 104 lost its established T3 ready route:':
                  'Seed 104 lost its established T2 ready route:',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'issue-1552 CMake replacement count for {old!r}: {source.count(old)}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          rm scripts/apply_issue_1552_current_main.py scripts/refine_issue_1552_current_main_tests.py
          git diff --check
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run focused regression and four reviewed traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_unified_tests issue_1552_t1_vessel_route_tests
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 2 | tee trace-seed-104.txt
          grep -q 'T1 | DISCARD | rules: R-EV-01; P-DCI-01; P-COMPRESS-01 | Mysterious Treasure' trace-seed-104.txt
          grep -q 'T2 | DISCARD | rules: R-QB-01; P-DCI-01; P-JIT-01 | Dialga-GX' trace-seed-104.txt
          grep -q 'T2 | READY' trace-seed-104.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace-seed-43.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-seed-35.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 58 --require-ready-by 2 | tee trace-seed-58.txt
      - name: Run complete Release suite with current-main blocker allowance
        shell: bash
        run: |
          set +e
          ctest --test-dir build --parallel 4 --output-on-failure
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            sed 's/^[0-9]*://' build/Testing/Temporary/LastTestsFailed.log | sort > actual-failures.txt
            printf '%s\n' multi_deck_report_contract regidrago_issue_1494_ci_audit_inventory_tests setup_docs_generator_contract setup_report_contract | sort > expected-failures.txt
            diff -u expected-failures.txt actual-failures.txt
          fi
      - name: Run complete ASan and UBSan suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          set +e
          ctest --test-dir build-sanitize --parallel 4 --output-on-failure
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            sed 's/^[0-9]*://' build-sanitize/Testing/Temporary/LastTestsFailed.log | sort > actual-sanitizer-failures.txt
            printf '%s\n' multi_deck_report_contract regidrago_issue_1494_ci_audit_inventory_tests setup_docs_generator_contract setup_report_contract | sort > expected-sanitizer-failures.txt
            diff -u expected-sanitizer-failures.txt actual-sanitizer-failures.txt
          fi
      - name: Generate fresh T2 and T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out audit-results/t2-t3-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out audit-results/multi-deck-matrix.csv
      - name: Materialize validated source and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/harumi-issue-1552-current-main-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/trace_engine_v2/part_014a.inc \
            src/trace_engine_v2/part_tate_blender_attachment_override.inc \
            tests/issue_1552_t1_vessel_route_tests.cpp \
            tests/issue_1447_vessel_timing_tests.cpp \
            tests/issue_1516_quick_ball_tapu_crispin_tests.cpp \
            tests/run_issue_1092_quick_ball_energy_jit_gate.cmake \
            .github/workflows/harumi-issue-1552-current-main-v3.yml
          git commit -m 'Use the seed 104 T1 Vessel route on current main'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1552-current-main-v3-${{ github.run_attempt }}
          path: |
            trace-*.txt
            audit-results/*.csv
            build/Testing
            build-sanitize/Testing
            actual-*.txt
            expected-*.txt
          if-no-files-found: warn
