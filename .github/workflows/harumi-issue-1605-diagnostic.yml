name: Harumi Issue 1605 Build Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/issue-1605-current-main-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the composed patch and capture compiler output
        shell: bash
        run: |
          set +e
          git fetch origin fix/issue-1605-arven-redundant-payload
          git checkout origin/fix/issue-1605-arven-redundant-payload -- scripts/fix_issue_1605_anchor.py scripts/apply_issue_1605_patch.py scripts/activate_issue_1605_arven_route.py
          python scripts/fix_issue_1605_anchor.py 2>&1 | tee anchor.log
          anchor_status=${PIPESTATUS[0]}
          python scripts/harumi_adapt_issue_1605_after_1598.py 2>&1 | tee adapter.log
          adapter_status=${PIPESTATUS[0]}
          python scripts/apply_issue_1605_patch.py 2>&1 | tee apply.log
          apply_status=${PIPESTATUS[0]}
          python scripts/activate_issue_1605_arven_route.py 2>&1 | tee activate.log
          activate_status=${PIPESTATUS[0]}
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
          configure_status=${PIPESTATUS[0]}
          cmake --build build --parallel 2 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          printf 'anchor=%s\nadapter=%s\napply=%s\nactivate=%s\nconfigure=%s\nbuild=%s\n' "$anchor_status" "$adapter_status" "$apply_status" "$activate_status" "$configure_status" "$build_status" > status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1605-build-diagnostic-${{ github.run_attempt }}
          path: |
            anchor.log
            adapter.log
            apply.log
            activate.log
            configure.log
            build.log
            status.txt
