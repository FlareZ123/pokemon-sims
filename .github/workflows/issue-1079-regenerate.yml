name: Issue 1079 Regenerate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate-published-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Regenerate shell baseline
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Render shell reports
        run: python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired deck comparison
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Render paired deck report
        run: python scripts/update_multi_deck_docs.py --repo-root .
      - name: Upload regenerated provenance
        uses: actions/upload-artifact@v4
        with:
          name: issue-1079-regenerated-results-${{ github.run_attempt }}
          path: |
            results/simulation_results.csv
            results/baseline_manifest.json
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/traces
            results/multi_deck_traces
            docs/REPORT.md
            docs/TRACE_AUDIT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: error

# Temporary CI evidence workflow for https://github.com/FlareZ123/pokemon-sims/issues/1079
