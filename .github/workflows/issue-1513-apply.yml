name: Apply issue 1513 fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1513-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1513-turo-before-tapu'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the confirmed direct-Turo route fix
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one patch anchor in {path}")
              temporary = path.with_suffix(path.suffix + ".tmp")
              temporary.write_text(text.replace(old, new, 1), encoding="utf-8")
              os.replace(temporary, path)

          turo_path = Path("src/trace_engine_v2/part_turo_oricorio_override.inc")
