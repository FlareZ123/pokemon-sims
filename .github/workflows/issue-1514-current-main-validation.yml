name: Issue 1514 current-main validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1514-current-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1514-public-k0-search-order'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run focused and non-report tests
        run: |
          ./build/regidrago_unified_tests issue_1514_k0_duplicate_crispin_tests
          ctest --test-dir build --parallel 4 --output-on-failure -E "setup_report_contract|multi_deck_report_contract"
      - name: Review three issue-specific simulate-this traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-second --seed 33 --require-ready-by 3 | tee issue-1514-seed-33.txt
          grep -q "T1 | HOLD TAPU LELE-GX" issue-1514-seed-33.txt
          grep -q "T1 | PLAY ITEM | rules: R-QB-01" issue-1514-seed-33.txt
          ! grep -q "T1 | WONDER TAG" issue-1514-seed-33.txt
          grep -q "T3 | READY" issue-1514-seed-33.txt

          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee issue-1514-seed-104.txt
          grep -q "Searched a Basic Pokémon: Tapu Lele-GX" issue-1514-seed-104.txt
          grep -q "WONDER TAG.*Crispin" issue-1514-seed-104.txt
          grep -q "T3 | READY" issue-1514-seed-104.txt

          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1514-seed-43.txt
          grep -q "T2 | WONDER TAG.*Crispin" issue-1514-seed-43.txt
          grep -q "T2 | READY" issue-1514-seed-43.txt
      - name: Regenerate current-main matrices
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete source-bound suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated results and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-1514-current-main-validation.yml
          git add README.md docs results
          git commit -m "Refresh issue 1514 current-main matrices"
          git push origin HEAD:${{ github.head_ref }}
      - name: Package tested source
        run: |
          git rev-parse HEAD > issue-1514-tested-head.txt
          git archive --format=tar.gz --output=issue-1514-source.tar.gz HEAD
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1514-current-main-${{ github.run_attempt }}
          path: |
            issue-1514-seed-*.txt
            issue-1514-tested-head.txt
            issue-1514-source.tar.gz
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
          if-no-files-found: warn
