name: Materialize issue 1514 evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1514-source-bound-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1514-k0-crispin-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Review three issue routes
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-second --seed 33 --require-ready-by 3 | tee issue-1514-seed-33.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee issue-1514-seed-104.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1514-seed-43.txt
          grep -q "T1 | HOLD TAPU LELE-GX" issue-1514-seed-33.txt
          grep -q "T3 | READY" issue-1514-seed-33.txt
          grep -q "WONDER TAG" issue-1514-seed-104.txt
          grep -q "T3 | READY" issue-1514-seed-104.txt
          grep -q "T2 | WONDER TAG" issue-1514-seed-43.txt
          grep -q "T2 | READY" issue-1514-seed-43.txt
      - name: Regenerate source-bound matrices and reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit source-bound evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-1514-source-bound.yml
          git add README.md docs results
          git commit -m "Refresh source-bound evidence for issue 1514"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload issue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1514-source-bound-${{ github.run_attempt }}
          path: |
            issue-1514-seed-*.txt
            results/baseline_manifest.json
            results/simulation_results.csv
            results/multi_deck_manifest.json
            results/multi_deck_comparison.csv
            build/Testing
          if-no-files-found: warn
