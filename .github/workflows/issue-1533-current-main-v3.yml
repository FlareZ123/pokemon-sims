name: Materialize validated issue 1533 evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1533-current-main-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1533-current-main-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Detect validated evidence marker
        id: gate
        shell: bash
        run: |
          if [[ -f scripts/issue_1533_validated_evidence.sha256 ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Verify validated matrices
        if: steps.gate.outputs.run == 'true'
        run: sha256sum --check scripts/issue_1533_validated_evidence.sha256
      - name: Apply previously validated source and regression
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/refine_issue_1533_materializer.py
          python scripts/apply_issue_1533_current_main.py
      - name: Regenerate documentation from validated matrices
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          python scripts/update_crobat_modeling_docs.py --csv results/crobat_variant_model.csv --out docs/CROBAT_MODEL_REPORT.md
          rm -f docs/CROBAT_MODEL_REPORT.md.lock results/crobat_variant_model.csv.lock
          git diff --check
      - name: Commit validated source and reports
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_014c_latias_bench_override.inc tests/issue_1533_blender_treasure_latias_tests.cpp README.md docs results
          git rm scripts/apply_issue_1533_current_main.py scripts/refine_issue_1533_materializer.py scripts/issue_1533_validated_evidence.sha256
          git commit -m 'Use Treasure-Latias-Blender for seed 1 T4'
          git push origin HEAD:${GITHUB_HEAD_REF}
