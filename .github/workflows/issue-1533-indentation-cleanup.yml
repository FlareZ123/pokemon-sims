name: Clean issue 1533 indentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1533-indentation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1533-current-main-v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Detect cleanup script
        id: gate
        shell: bash
        run: |
          if [[ -f scripts/fix_issue_1533_indentation.py ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Apply cleanup
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/fix_issue_1533_indentation.py
          git diff --check
      - name: Commit cleanup
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_014c_latias_bench_override.inc
          git rm -f scripts/fix_issue_1533_indentation.py
          git commit -m 'Clean issue 1533 route indentation'
          git push origin HEAD:${GITHUB_HEAD_REF}
