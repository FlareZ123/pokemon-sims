name: Validate issue 1552 on current main v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1552-current-main-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1552-current-main-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Detect source materializers
        id: gate
        shell: bash
        run: |
          if [[ -f scripts/apply_issue_1552_current_main.py && -f scripts/refine_issue_1552_current_main_tests.py ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Apply isolated source and regressions
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/apply_issue_1552_current_main.py 2>&1 | tee apply-issue-1552.log
          python scripts/prepare_issue_1552_refinement.py 2>&1 | tee -a apply-issue-1552.log
          python scripts/refine_issue_1552_current_main_tests.py 2>&1 | tee -a apply-issue-1552.log
          git diff --check
      - name: Build Release
        if: steps.gate.outputs.run == 'true'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Validate focused regression and four traces
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_unified_tests issue_1552_t1_vessel_route_tests
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 2 | tee simulate-issue-1552-seed104.txt
          grep -q 'T1 | DISCARD | rules: R-EV-01; P-DCI-01; P-COMPRESS-01 | Mysterious Treasure' simulate-issue-1552-seed104.txt
          grep -q 'T2 | DISCARD | rules: R-QB-01; P-DCI-01; P-JIT-01 | Dialga-GX' simulate-issue-1552-seed104.txt
          grep -q 'T2 | WONDER TAG' simulate-issue-1552-seed104.txt
          grep -q 'T2 | READY' simulate-issue-1552-seed104.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee simulate-control-shell-43.txt
          grep -q 'T2 | READY' simulate-control-shell-43.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee simulate-control-pineco-35.txt
          grep -q 'T2 | READY' simulate-control-pineco-35.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 58 --require-ready-by 2 | tee simulate-control-shell-58.txt
          grep -q 'T2 | READY' simulate-control-shell-58.txt
      - name: Release suite before generated reports
        if: steps.gate.outputs.run == 'true'
        run: ctest --test-dir build --parallel 4 --output-on-failure -E 'setup_report_contract|multi_deck_report_contract|crobat_model_report_contract'
      - name: Regenerate source-bound reports
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --model-crobat --trials 100000 --seed 20260723 --out results/crobat_variant_model.csv &
          crobat_pid=$!
          trap 'kill "$crobat_pid" 2>/dev/null || true' EXIT
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          wait "$crobat_pid"
          trap - EXIT
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          python scripts/update_crobat_modeling_docs.py --csv results/crobat_variant_model.csv --out docs/CROBAT_MODEL_REPORT.md
          rm -f docs/CROBAT_MODEL_REPORT.md.lock results/crobat_variant_model.csv.lock
          git diff --check
      - name: Complete Release suite
        if: steps.gate.outputs.run == 'true'
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Complete sanitizer suite
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure
      - name: Materialize validated source and reports
        id: materialize
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/trace_engine_v2/part_014a.inc src/trace_engine_v2/part_tate_blender_attachment_override.inc tests/issue_1552_t1_vessel_route_tests.cpp tests/issue_1447_vessel_timing_tests.cpp tests/issue_1516_quick_ball_tapu_crispin_tests.cpp tests/run_issue_1092_quick_ball_energy_jit_gate.cmake README.md docs results
            git rm -f scripts/apply_issue_1552_current_main.py scripts/prepare_issue_1552_refinement.py scripts/refine_issue_1552_current_main_tests.py
            git commit -m 'Use the seed 104 T1 Vessel route'
            git push origin HEAD:${GITHUB_HEAD_REF}
          } 2>&1 | tee materialize-issue-1552.log
      - name: Upload validation evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: issue-1552-current-main-v2-${{ github.run_attempt }}
          path: |
            apply-issue-1552.log
            materialize-issue-1552.log
            simulate-*.txt
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            results/crobat_variant_model.csv
            results/baseline_manifest.json
            results/multi_deck_manifest.json
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
      - name: Propagate materialization failure
        if: steps.materialize.outcome == 'failure'
        run: exit 1
