name: Issue 1565 source-bound validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1565-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1565-legacy-arven-blender-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply isolated source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trace_engine_v2/part_014c_latias_bench_override.inc')
          text = path.read_text()
          old = '''      if (!state_.supporter_used && setup_axis_missing()) choose_supporter();
              }
          '''
          new = '''      if (!state_.supporter_used && setup_axis_missing()) choose_supporter();
                // A Supporter recovered by Legacy Star may search an Item that is immediately
                // legal later in the same turn. Reopen the Item fixed point after Arven so a
                // searched Brilliant Blender can establish the current-turn payload before
                // the ready-state check:
                // Regidrago VSTAR / Legacy Star: https://api.pokemontcg.io/v2/cards/swsh12-136
                // Arven: https://api.pokemontcg.io/v2/cards/sv1-166
                // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
                // Core Supporter and Item procedure: https://www.pokemon.com/us/pokemon-tcg/rules
                // Earliest complete route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
                // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1565
                if (!state_.turn_ended) {
                  play_chaotic_swell();
                  play_field_blower();
                  play_basics_from_hand();
                  play_items_until_stable(true);
                }
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('issue-1565 source anchor was not unique')
          path.write_text(text.replace(old, new, 1))

          Path('tests/issue_1565_legacy_arven_blender_replay_tests.cpp').write_text(r'''#define REGIDRAGO_SIM_NO_MAIN
          #include "../src/regidrago_sim.cpp"

          #include <algorithm>
          #include <iostream>
          #include <random>
          #include <stdexcept>
          #include <string>

          namespace sim { struct EngineTestAccess {}; }

          namespace {
          void expect(const bool condition, const char* message) {
            if (!condition) throw std::runtime_error(message);
          }

          bool trace_contains(const sim::TraceLog& trace, const std::string& needle) {
            return std::any_of(trace.lines.begin(), trace.lines.end(),
                               [&needle](const std::string& line) {
                                 return line.find(needle) != std::string::npos;
                               });
          }

          void test_seed_6_replays_arven_searched_blender_on_turn_three() {
            const auto scenario = sim::scenario_by_label("strict-jit/go-second");
            const sim::CrobatModelingDeck* deck =
                sim::crobat_modeling_deck_by_id("crobat1-roseanne");
            expect(scenario.has_value() && deck != nullptr,
                   "The issue-1565 fixture is unavailable.");

            std::mt19937_64 rng{6};
            sim::TraceLog trace{true, {}};
            sim::Engine engine(*scenario, deck->recipe, rng, &trace);
            const sim::TrialOutcome outcome = engine.run();

            // Legacy Star may recover Arven, Arven may search Brilliant Blender, and the
            // searched Item may be played later in that same turn before the ready check:
            // Regidrago VSTAR / Legacy Star: https://api.pokemontcg.io/v2/cards/swsh12-136
            // Arven: https://api.pokemontcg.io/v2/cards/sv1-166
            // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
            // Core Supporter and Item procedure: https://www.pokemon.com/us/pokemon-tcg/rules
            // Earliest complete route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1565
            expect(outcome.first_ready_turn == 3 && !outcome.setup_failed,
                   "Seed 6 did not reach strict-JIT readiness on turn three.");
            expect(trace_contains(trace, "T3 | LEGACY STAR |") &&
                       trace_contains(trace, "T3 | PLAY SUPPORTER | rules: R-ARVEN-01") &&
                       trace_contains(trace, "T3 | PLAY ITEM | rules: R-BLENDER-01") &&
                       trace_contains(trace, "T3 | READY |"),
                   "Seed 6 did not replay the Arven-searched Blender on turn three.");
          }
          }

          int main() {
            try {
              test_seed_6_replays_arven_searched_blender_on_turn_three();
              std::cout << "Issue 1565 Legacy Star Arven-Blender replay tests passed\n";
              return 0;
            } catch (const std::exception& error) {
              std::cerr << error.what() << '\n';
              return 1;
            }
          }
          ''')
          PY
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run three independent simulate-this passes
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --model-variant crobat1-roseanne --scenario strict-jit/go-second --seed 6 --require-ready-by 3 | tee simulate-6.txt
          grep -q 'T3 | LEGACY STAR' simulate-6.txt
          grep -q 'T3 | PLAY SUPPORTER.*R-ARVEN-01' simulate-6.txt
          grep -q 'T3 | PLAY ITEM.*R-BLENDER-01' simulate-6.txt
          grep -q 'T3 | READY' simulate-6.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee simulate-43.txt
          grep -q 'T2 | READY' simulate-43.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee simulate-35.txt
          grep -q 'T2 | READY' simulate-35.txt
      - name: Run Release suite excluding generated-report contracts
        run: ctest --test-dir build --parallel 4 --output-on-failure -E 'setup_report_contract|multi_deck_report_contract'
      - name: Regenerate source-bound matrices and provenance
        shell: bash
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out results/multi_deck_comparison.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)
          baseline = Path('results/baseline_manifest.json')
          data = json.loads(baseline.read_text())
          data['simulator_policy_source_sha256'] = digest
          baseline.write_text(json.dumps(data, indent=2) + '\n')

          comparison = Path('results/multi_deck_comparison.csv')
          manifest = Path('results/multi_deck_manifest.json')
          data = json.loads(manifest.read_text())
          data['simulator_policy_source_sha256'] = digest
          data['comparison_csv_sha256'] = hashlib.sha256(comparison.read_bytes()).hexdigest()
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite with regenerated evidence
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Run sanitizer suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure
      - name: Materialize fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_014c_latias_bench_override.inc tests/issue_1565_legacy_arven_blender_replay_tests.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/simulation_results.csv results/baseline_manifest.json results/multi_deck_comparison.csv results/multi_deck_manifest.json
          git rm .github/workflows/issue-1565-validation.yml
          git commit -m 'Replay Arven-searched Blender after Legacy Star'
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1565-validation-${{ github.run_attempt }}
          path: |
            simulate-*.txt
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
