name: Issue 1578 source-bound validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1578-gladion-fss-oricorio'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply isolated Gladion route fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('src/trace_engine_v2/part_012_gladion_override.inc')
          text = path.read_text()
          anchor = '    return play_gladion_original();\n  }\n'
          block = indent(dedent('''\
          const bool issue_1578_prized_fss_energy_route =
              supporter_allowed() && prizes_known() &&
              scenario_.dci == DciProfile::MatchupFlexJit &&
              scenario_.locks == LockMode::None && state_.turn == 3 &&
              state_.turn < scenario_.max_turn && !item_locked() &&
              !rule_box_abilities_locked() && !state_.vstar_power_used &&
              !state_.manual_energy_used && active_is_vstar() &&
              state_.active->tool == Tool::None &&
              state_.active->grass == 0 && state_.active->fire == 1 &&
              need_energy() && need_payload() &&
              hand_count(Card::Gladion) > 0 &&
              hand_count(Card::BrilliantBlender) > 0 &&
              prize_count_after_reveal(Card::ForestSealStone) > 0 &&
              deck_count_after_search_started(Card::Oricorio) > 0 &&
              deck_count_after_search_started(Card::Grass) >= 2 &&
              bench_space() > 0 && ability_available_for_pokemon(Card::Oricorio) &&
              payload_might_be_in_deck();
          if (issue_1578_prized_fss_energy_route) {
            // Gladion recovers the known prized Forest Seal Stone. Star Alchemy
            // searches Oricorio, Vital Dance searches two Grass Energy for the T3
            // and T4 attachments, and held Blender supplies the T4 JIT payload:
            // Gladion: https://api.pokemontcg.io/v2/cards/sm4-95
            // Forest Seal Stone / Star Alchemy: https://api.pokemontcg.io/v2/cards/swsh12-156
            // Oricorio / Vital Dance: https://api.pokemontcg.io/v2/cards/sm2-55
            // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
            // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
            // Core Prize, Supporter, Tool, Ability, Bench, and attachment procedure: https://www.pokemon.com/us/pokemon-tcg/rules
            // K1 and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
            // Confirmed reproduction: https://github.com/FlareZ123/pokemon-sims/issues/1578
            remove_one(state_.hand, Card::Gladion);
            state_.supporter_used = true;
            prizes_revealed_ = true;
            const auto prize = std::find(
                state_.prizes.begin(), state_.prizes.end(), Card::ForestSealStone);
            if (prize == state_.prizes.end()) {
              throw std::logic_error("Known prized Forest Seal Stone disappeared");
            }
            *prize = Card::Gladion;
            state_.hand.push_back(Card::ForestSealStone);
            shuffle(state_.prizes);
            trace("PLAY SUPPORTER",
                  "R-GLADION-01; R-GAME-SUPPORTER; P-KNOWLEDGE-01; P-COMPRESS-01",
                  "Exchanged Gladion for Forest Seal Stone to guarantee the T4 Oricorio and Brilliant Blender route.");
            return true;
          }

          '''), '    ')
          if text.count(anchor) != 1:
              raise SystemExit(f'issue-1578 anchor count: {text.count(anchor)}')
          path.write_text(text.replace(anchor, block + anchor, 1))
          PY

      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Validate exact route and independent controls
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 191 --require-ready-by 4 | tee issue-1578-seed-191.txt
          grep -q 'Exchanged Gladion for Forest Seal Stone' issue-1578-seed-191.txt
          grep -q 'Searched any card: Oricorio' issue-1578-seed-191.txt
          grep -q 'Vital Dance.*Grass Energy, Grass Energy' issue-1578-seed-191.txt
          grep -q 'T4 | READY' issue-1578-seed-191.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee control-seed-43.txt
          grep -q 'T2 | READY' control-seed-43.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee control-pineco-35.txt
          grep -q 'T2 | READY' control-pineco-35.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 58 --require-ready-by 3 | tee control-seed-58.txt
          grep -q 'T3 | READY' control-seed-58.txt

      - name: Run Release suite excluding generated-report contracts
        run: ctest --test-dir build --parallel 4 --output-on-failure -E 'setup_report_contract|multi_deck_report_contract'

      - name: Regenerate matrices and provenance
        shell: bash
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out results/multi_deck_comparison.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest
          digest = simulator_policy_source_digest(Path('.').resolve())
          p = Path('results/baseline_manifest.json'); data = json.loads(p.read_text()); data['simulator_policy_source_sha256'] = digest; p.write_text(json.dumps(data, indent=2) + '\n')
          csv_path = Path('results/multi_deck_comparison.csv')
          p = Path('results/multi_deck_manifest.json'); data = json.loads(p.read_text()); data['simulator_policy_source_sha256'] = digest; data['comparison_csv_sha256'] = hashlib.sha256(csv_path.read_bytes()).hexdigest(); p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Run sanitizer suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Materialize fix and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_012_gladion_override.inc docs/REPORT.md docs/MULTI_DECK_REPORT.md results/simulation_results.csv results/baseline_manifest.json results/multi_deck_comparison.csv results/multi_deck_manifest.json
          git rm .github/workflows/issue-1578-validation.yml
          git commit -m 'Use prized Forest Seal Stone for seed 191'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1578-validation-${{ github.run_attempt }}
          path: |
            issue-1578-seed-191.txt
            control-*.txt
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
