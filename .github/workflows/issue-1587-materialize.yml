name: Materialize issue 1587 fix

on:
  push:
    branches:
      - fix/issue-1587-exploding-energy-minimum-one

permissions:
  contents: write

concurrency:
  group: issue-1587-materialize
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1587-exploding-energy-minimum-one
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply the confirmed ruling correction atomically
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import fcntl
          import os
          import tempfile
          from pathlib import Path

          changed = False

          def atomic_locked_write(path: Path, content: str) -> None:
              lock_path = path.with_name(path.name + ".lock")
              lock_path.parent.mkdir(parents=True, exist_ok=True)
              with lock_path.open("w", encoding="utf-8") as lock_file:
                  fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)
                  fd, temp_name = tempfile.mkstemp(prefix=path.name + ".", dir=path.parent)
                  try:
                      with os.fdopen(fd, "w", encoding="utf-8", newline="") as temp_file:
                          temp_file.write(content)
                          temp_file.flush()
                          os.fsync(temp_file.fileno())
                      os.replace(temp_name, path)
                  finally:
                      if os.path.exists(temp_name):
                          os.unlink(temp_name)
                  fcntl.flock(lock_file.fileno(), fcntl.LOCK_UN)
              lock_path.unlink(missing_ok=True)

          def replace_once(path: Path, old: str, new: str) -> None:
              global changed
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one source block in {path}, found {text.count(old)}")
              atomic_locked_write(path, text.replace(old, new, 1))
              changed = True

          source = Path("src/trace_engine_v2/part_forretress_ex_combo.inc")
          replace_once(
              source,
              '''bool Engine::resolve_exploding_energy(
              const std::vector<std::size_t>& attachment_destinations) {
            if (!forretress_combo_enabled() ||
                !ability_available_for_pokemon(Card::ForretressEx) ||
                attachment_destinations.size() > 5U) {
          ''',
              '''bool Engine::resolve_exploding_energy(
              const std::vector<std::size_t>& attachment_destinations) {
            // Ability effects using "up to X" require a choice from 1 through X.
            // Reject an empty destination list before mutating knowledge or the board:
            // Official February 2026 ruling: https://professorprogram.pokemon.com/news/11473085
            // Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1587
            if (!forretress_combo_enabled() ||
                !ability_available_for_pokemon(Card::ForretressEx) ||
                attachment_destinations.empty() ||
                attachment_destinations.size() > 5U) {
          ''')
          replace_once(
              source,
              '''  // Exploding Energy searches for up to five Basic Grass Energy, attaches them
            // in any distribution, shuffles, then Knocks Out Forretress ex. The search is
            // optional, while using it with zero selected cards still performs the deck
            // search and the printed self-Knock-Out instruction:
            // https://api.pokemontcg.io/v2/cards/sv4pt5-2
            // https://www.pokemon.com/us/pokemon-tcg/rules
            // https://github.com/FlareZ123/pokemon-sims/issues/972
          ''',
              '''  // Exploding Energy searches for one through five Basic Grass Energy,
            // attaches them in any distribution, shuffles, then Knocks Out Forretress ex.
            // The February 2026 rule update permits zero only for attack effects:
            // Official February 2026 ruling: https://professorprogram.pokemon.com/news/11473085
            // Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
            // Core Ability, search, attachment, shuffle, and Knock Out procedure: https://www.pokemon.com/us/pokemon-tcg/rules
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1587
          ''')
          replace_once(
              source,
              '''  if (available <= 0) {
              // A K0 announcement can legally reveal that no Basic Grass Energy remains.
              // Once the hidden-zone search has begun, finish the printed consequence
              // instead of retaining K1 knowledge while leaving Forretress ex in play:
              // Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-2
              // Core deck-search, shuffle, Knock Out, and promotion procedure: https://www.pokemon.com/us/pokemon-tcg/rules
              // Knowledge-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#knowledge-states
              // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1460
              return resolve_exploding_energy({});
            }
          ''',
              '''  if (available <= 0) {
              // A K0 announcement may legally inspect the hidden deck and establish K1.
              // With no Basic Grass Energy found, there is no legal 1-through-5 Ability
              // selection, so do not mark the Ability used or apply its self-Knock-Out:
              // Official February 2026 ruling: https://professorprogram.pokemon.com/news/11473085
              // Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
              // Knowledge-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#knowledge-states
              // Confirmed superseding bug: https://github.com/FlareZ123/pokemon-sims/issues/1587
              return false;
            }
          ''')

          test_path = Path("tests/issue_1460_zero_target_exploding_energy_tests.cpp")
          test_content = '''#define REGIDRAGO_SIM_NO_MAIN
          #include "../src/regidrago_sim.cpp"

          #include <algorithm>
          #include <random>
          #include <stdexcept>
          #include <string>
          #include <utility>
          #include <vector>

          namespace sim {
          struct EngineTestAccess {
            static void set_state(Engine& engine, State state, const bool deck_seen,
                                  const bool prizes_revealed) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = deck_seen;
              engine.prizes_revealed_ = prizes_revealed;
            }
            static bool use_exploding_energy_for_setup(Engine& engine) {
              return engine.use_exploding_energy_for_setup();
            }
            static bool resolve_exploding_energy(
                Engine& engine, const std::vector<std::size_t>& destinations) {
              return engine.resolve_exploding_energy(destinations);
            }
            static const State& state(const Engine& engine) { return engine.state_; }
            static bool deck_seen(const Engine& engine) { return engine.deck_seen_; }
            static bool used_exploding_energy(const Engine& engine) {
              return engine.outcome_.used_exploding_energy;
            }
          };
          }  // namespace sim

          namespace {

          const sim::DeckRecipe& pineco_recipe() {
            const sim::NamedDeck* deck = sim::deck_by_id("regidrago-pineco");
            if (deck == nullptr) {
              throw std::runtime_error("The registered Pineco recipe is unavailable.");
            }
            return deck->recipe;
          }

          struct Fixture {
            explicit Fixture(const std::string& label)
                : scenario{label, sim::DciProfile::StrictJit, sim::LockMode::None,
                           false, 4},
                  rng{1587},
                  trace{true, {}},
                  engine{scenario, pineco_recipe(), rng, &trace} {}

            sim::Scenario scenario;
            std::mt19937_64 rng;
            sim::TraceLog trace;
            sim::Engine engine;
          };

          sim::State zero_grass_state(const bool source_active) {
            sim::State state;
            state.turn = 2;
            if (source_active) {
              state.active = sim::Pokemon{sim::Card::ForretressEx, 0, 0, 1};
              state.bench = {sim::Pokemon{sim::Card::RegidragoV, 0, 0, 1}};
            } else {
              state.active = sim::Pokemon{sim::Card::RegidragoV, 0, 0, 1};
              state.bench = {sim::Pokemon{sim::Card::ForretressEx, 0, 0, 1}};
            }
            state.deck = {sim::Card::Fire, sim::Card::Crispin};
            state.prizes = {sim::Card::Grass, sim::Card::Grass, sim::Card::Grass,
                            sim::Card::Grass, sim::Card::Grass, sim::Card::Grass};
            return state;
          }

          void verify_k0_empty_search_retains_board(const bool source_active) {
            Fixture fixture(source_active ? "issue-1587-active-source"
                                          : "issue-1587-benched-source");
            sim::EngineTestAccess::set_state(
                fixture.engine, zero_grass_state(source_active), false, false);

            // The K0 policy may begin a hidden-zone search from public copy accounting.
            // Once the search reveals zero Basic Grass Energy, the February 2026 ruling
            // leaves no legal 1-through-5 Ability selection. K1 remains acquired while
            // Forretress ex, its stack, and the board remain unchanged:
            // Official February 2026 ruling: https://professorprogram.pokemon.com/news/11473085
            // Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
            // Knowledge-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#knowledge-states
            // Confirmed superseding bug: https://github.com/FlareZ123/pokemon-sims/issues/1587
            if (sim::EngineTestAccess::use_exploding_energy_for_setup(fixture.engine)) {
              throw std::runtime_error(
                  "A K0 empty Exploding Energy search resolved an illegal zero-card selection.");
            }

            const sim::State& after = sim::EngineTestAccess::state(fixture.engine);
            const sim::Card expected_active = source_active
                ? sim::Card::ForretressEx : sim::Card::RegidragoV;
            const sim::Card expected_bench = source_active
                ? sim::Card::RegidragoV : sim::Card::ForretressEx;
            if (!sim::EngineTestAccess::deck_seen(fixture.engine) ||
                sim::EngineTestAccess::used_exploding_energy(fixture.engine) ||
                !after.active || after.active->card != expected_active ||
                after.bench.size() != 1U ||
                after.bench.front().card != expected_bench ||
                !after.discard.empty()) {
              throw std::runtime_error(
                  "The K0 empty search failed to retain K1 without resolving Exploding Energy.");
            }
          }

          void verify_resolver_rejects_empty_destinations() {
            Fixture fixture("issue-1587-empty-resolver");
            sim::State state = zero_grass_state(false);
            state.deck.push_back(sim::Card::Grass);
            sim::EngineTestAccess::set_state(fixture.engine, std::move(state), true, true);

            // The low-level resolver also enforces the Ability's 1-through-5 minimum:
            // Official February 2026 ruling: https://professorprogram.pokemon.com/news/11473085
            // Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1587
            if (sim::EngineTestAccess::resolve_exploding_energy(fixture.engine, {})) {
              throw std::runtime_error(
                  "The Exploding Energy resolver accepted an empty destination list.");
            }
            const sim::State& after = sim::EngineTestAccess::state(fixture.engine);
            if (!after.active || after.active->card != sim::Card::RegidragoV ||
                after.bench.size() != 1U ||
                after.bench.front().card != sim::Card::ForretressEx ||
                sim::EngineTestAccess::used_exploding_energy(fixture.engine) ||
                !after.discard.empty()) {
              throw std::runtime_error(
                  "Rejecting the empty resolver input mutated the board or outcome.");
            }
          }

          void verify_known_zero_declines_announcement() {
            Fixture fixture("issue-1587-k1-control");
            sim::EngineTestAccess::set_state(
                fixture.engine, zero_grass_state(false), true, true);

            // K1 already proves that no legal Basic Grass Energy selection exists, so
            // policy declines to announce the Ability and leaves every zone unchanged:
            // Official February 2026 ruling: https://professorprogram.pokemon.com/news/11473085
            // Forretress ex / Exploding Energy: https://api.pokemontcg.io/v2/cards/sv4pt5-2
            // Knowledge-state contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#knowledge-states
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1587
            if (sim::EngineTestAccess::use_exploding_energy_for_setup(fixture.engine)) {
              throw std::runtime_error(
                  "K1 policy announced Exploding Energy with a known zero-target deck.");
            }

            const sim::State& after = sim::EngineTestAccess::state(fixture.engine);
            if (!after.active || after.active->card != sim::Card::RegidragoV ||
                after.bench.size() != 1U ||
                after.bench.front().card != sim::Card::ForretressEx ||
                sim::EngineTestAccess::used_exploding_energy(fixture.engine) ||
                !after.discard.empty()) {
              throw std::runtime_error(
                  "The K1 zero-target control mutated the board or outcome.");
            }
          }

          }  // namespace

          int main() {
            verify_k0_empty_search_retains_board(false);
            verify_k0_empty_search_retains_board(true);
            verify_resolver_rejects_empty_destinations();
            verify_known_zero_declines_announcement();
          }
          '''
          test_content = "\n".join(line[10:] if line.startswith("          ") else line
                                   for line in test_content.splitlines()) + "\n"
          if test_path.read_text(encoding="utf-8") != test_content:
              atomic_locked_write(test_path, test_content)
              changed = True

          docs = Path("docs/RULES_TRACEABILITY.md")
          replace_once(
              docs,
              '''The Ability is once during the turn, supports zero through five selected Grass Energy, performs legal arbitrary distribution, creates K1 deck knowledge, shuffles, and self-Knocks Out. The effect is used by exact-state fixtures and the registered `regidrago-pineco` results: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://www.pokemon.com/us/pokemon-tcg/rules https://github.com/FlareZ123/pokemon-sims/issues/972''',
              '''The Ability is once during the turn, requires one through five selected Basic Grass Energy under the February 2026 non-attack “up to X” ruling, performs legal arbitrary distribution, creates K1 deck knowledge, shuffles, and self-Knocks Out only after a legal selection. The effect is used by exact-state fixtures and the registered `regidrago-pineco` results: https://professorprogram.pokemon.com/news/11473085 https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://www.pokemon.com/us/pokemon-tcg/rules https://github.com/FlareZ123/pokemon-sims/issues/1587''')

          Path(".issue-1587-changed").write_text("1\n" if changed else "0\n", encoding="utf-8")
          PY
          echo "changed=$(cat .issue-1587-changed)" >> "$GITHUB_OUTPUT"

      - name: Configure Release
        if: steps.patch.outputs.changed == '1'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        if: steps.patch.outputs.changed == '1'
        run: cmake --build build --parallel 2
      - name: Run focused Exploding Energy regression
        if: steps.patch.outputs.changed == '1'
        run: ./build/regidrago_unified_tests issue_1460_zero_target_exploding_energy_tests
      - name: Run three independent simulate-this audits
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee issue-1587-trace-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee issue-1587-trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1587-trace-3.txt
          grep -q "T3 | READY" issue-1587-trace-1.txt
          grep -q "T2 | READY" issue-1587-trace-2.txt
          grep -q "T2 | READY" issue-1587-trace-3.txt
      - name: Run complete Release suite
        if: steps.patch.outputs.changed == '1'
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure ASan and UBSan
        if: steps.patch.outputs.changed == '1'
        run: >-
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer targets
        if: steps.patch.outputs.changed == '1'
        run: cmake --build build-sanitizers --parallel 2
      - name: Run complete sanitizer suite
        if: steps.patch.outputs.changed == '1'
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitizers --parallel 2 --output-on-failure

      - name: Regenerate canonical and paired evidence
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
          python - <<'PY'
          import csv
          from pathlib import Path

          source = Path("results/multi_deck_comparison.csv")
          output = Path("issue-1587-t2-t3-matrix.csv")
          with source.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          fields = ["deck", "scenario", "ready_by_t2_pct", "ready_by_t3_pct"]
          with output.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows({field: row[field] for field in fields} for row in rows)
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload source-bound evidence
        if: steps.patch.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: issue-1587-validation-${{ github.run_attempt }}
          path: |
            issue-1587-trace-*.txt
            issue-1587-t2-t3-matrix.csv
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitizers/Testing
          if-no-files-found: error

      - name: Commit validated source and evidence
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .issue-1587-changed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_forretress_ex_combo.inc \
                  tests/issue_1460_zero_target_exploding_energy_tests.cpp \
                  docs/RULES_TRACEABILITY.md docs/REPORT.md docs/MULTI_DECK_REPORT.md \
                  results
          git commit -m "Require an Exploding Energy target (#1587)"
          git push origin HEAD:fix/issue-1587-exploding-energy-minimum-one
