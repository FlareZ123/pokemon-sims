name: Materialize issue 1587 source

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: issue-1587-source-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the atomic source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          workflow = Path(".github/workflows/issue-1587-materialize.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          command: str | None = None
          index = 0
          while index < len(lines):
              line = lines[index]
              indent = len(line) - len(line.lstrip(" "))
              if indent == 8 and line.strip() == "run: |":
                  index += 1
                  block: list[str] = []
                  while index < len(lines):
                      candidate = lines[index]
                      candidate_indent = len(candidate) - len(candidate.lstrip(" "))
                      if candidate.strip() and candidate_indent <= 8:
                          break
                      block.append(candidate[10:] if len(candidate) >= 10 else "")
                      index += 1
                  command = "\n".join(block)
                  break
              index += 1

          if command is None:
              raise RuntimeError("The source materializer run block was not found.")
          subprocess.run(["bash", "-lc", command], check=True, env=os.environ.copy())
          PY
          test "$(cat .issue-1587-changed)" = "1"
          rm -f .issue-1587-changed
          git diff --check
      - name: Commit the focused correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_forretress_ex_combo.inc \
                  tests/issue_1460_zero_target_exploding_energy_tests.cpp \
                  docs/RULES_TRACEABILITY.md
          git commit -m "Require an Exploding Energy target (#1587)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
