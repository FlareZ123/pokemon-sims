name: Validate issue 1608 Burnet choice

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1608-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1608-burnet-before-dead-crispin'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply smallest complete source patch
        run: python scripts/apply_issue_1608_patch.py

      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Run focused regression
        run: ./build/regidrago_unified_tests issue_1608_burnet_before_dead_crispin_tests

      - name: Perfect-play pass one - refined issue 1608 public choice
        shell: bash
        run: |
          set -euo pipefail
          # GGF is complete before T3. Professor Burnet can advance payload immediately,
          # while prized Crispin cannot improve Energy. Burnet then shuffles, so this
          # audit checks the public T3 action and makes no claim about a fixed T4 draw.
          # Gladion: https://api.pokemontcg.io/v2/cards/sm4-95
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # Core Supporter, search, discard, and shuffle procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Refined confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1608
          ./build/regidrago_sim --simulate-this --model-variant crobat2-erika-channeler --scenario no-discard-control/go-first --seed 33 | tee simulate-issue-1608-seed33.txt
          grep -q 'T3 | HOLD SUPPORTER.*Held Gladion because prized Crispin cannot improve complete GGF' simulate-issue-1608-seed33.txt
          grep -q 'T3 | PLAY SUPPORTER.*R-BURNET-01' simulate-issue-1608-seed33.txt
          grep -q 'Mega Dragonite ex' simulate-issue-1608-seed33.txt
          grep -q 'Dragapult ex' simulate-issue-1608-seed33.txt
          ! grep -q 'T3 | PLAY SUPPORTER.*exchanged Gladion for Crispin' simulate-issue-1608-seed33.txt

      - name: Perfect-play pass two - live prized Crispin control
        shell: bash
        run: |
          set -euo pipefail
          # Energy remains unresolved in this completed #971 route, so Gladion must
          # still recover prized Crispin and preserve the earliest legal T2 finish.
          # Gladion: https://api.pokemontcg.io/v2/cards/sm4-95
          # Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Confirmed control: https://github.com/FlareZ123/pokemon-sims/issues/971
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 28 --require-ready-by 2 | tee simulate-live-crispin-seed28.txt
          grep -q 'exchanged Gladion for Crispin' simulate-live-crispin-seed28.txt
          grep -q 'T2 | READY' simulate-live-crispin-seed28.txt

      - name: Perfect-play pass three - current-main Star Alchemy control
        shell: bash
        run: |
          set -euo pipefail
          # The unrelated current-main Star Alchemy route remains the earliest legal T3.
          # Forest Seal Stone: https://api.pokemontcg.io/v2/cards/swsh12-156
          # Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Validated implementation: https://github.com/FlareZ123/pokemon-sims/issues/1593 https://github.com/FlareZ123/pokemon-sims/pull/1607
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-first --seed 16 --require-ready-by 3 | tee simulate-star-alchemy-seed16.txt
          grep -q 'Star Alchemy searched Mysterious Treasure' simulate-star-alchemy-seed16.txt
          grep -q 'T3 | READY' simulate-star-alchemy-seed16.txt

      - name: Regenerate source-bound reports and matrices
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          ./build/regidrago_sim --model-crobat --trials 100000 --seed 20260723 --out results/crobat_variant_model.csv
          python scripts/update_crobat_modeling_docs.py --csv results/crobat_variant_model.csv --out docs/CROBAT_MODEL_REPORT.md

      - name: Extract T2 and T3 matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          source = Path('results/multi_deck_comparison.csv')
          with source.open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 32, f'expected 32 rows, got {len(rows)}'
          fields = ['deck', 'scenario', 'trials', 'ready_by_t2_pct', 'ready_by_t3_pct']
          with Path('t2-t3-matrix.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for row in rows:
                  writer.writerow({field: row[field] for field in fields})
          PY
          cat t2-t3-matrix.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Run complete ASan and UBSan suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Materialize validated source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests README.md docs results
          git rm .github/workflows/issue-1608-validation.yml scripts/apply_issue_1608_patch.py
          git commit -m 'Prefer Burnet over dead prized Crispin for issue 1608'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1608-validation-${{ github.run_attempt }}
          path: |
            simulate-*.txt
            t2-t3-matrix.csv
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            results/crobat_variant_model.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
