name: Validate issue 1623

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1623-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1623-hold-celestial-roar-guaranteed-t2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply isolated issue 1623 patch
        run: python scripts/apply_issue_1623_patch.py

      - name: Build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Validate focused Celestial Roar regression
        shell: bash
        run: |
          set -euo pipefail
          # Celestial Roar discards the top three and attaches only Energy; held Fire, held VSTAR, and an already banked Dragon payload make that random attack unable to improve the next legal T2 window: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv7-133 https://www.pokemon.com/us/pokemon-tcg/rules https://github.com/FlareZ123/pokemon-sims/issues/1623
          ctest --test-dir build --output-on-failure -R '^trace_issue_1079_celestial_roar_hold$'
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-second --seed 91 --require-ready-by 2 | tee issue-1623-seed-91.txt
          grep -q 'T1 | HOLD ATTACK' issue-1623-seed-91.txt
          ! grep -q 'T1 | ATTACK.*Celestial Roar' issue-1623-seed-91.txt
          grep -q 'T2 | READY' issue-1623-seed-91.txt

      - name: Perfect-play pass two
        shell: bash
        run: |
          set -euo pipefail
          # Missing no-control payload keeps Celestial Roar live, preserving the positive boundary from issue 1079: https://api.pokemontcg.io/v2/cards/swsh12-135 https://github.com/FlareZ123/pokemon-sims/issues/1079 https://github.com/FlareZ123/pokemon-sims/issues/1623
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-second --seed 19 | tee control-no-control-19.txt
          grep -q 'T1 | ATTACK.*Celestial Roar' control-no-control-19.txt

      - name: Perfect-play pass three
        shell: bash
        run: |
          set -euo pipefail
          # The registered Pineco Secret Box compression route remains an independent legal T2 control: https://api.pokemontcg.io/v2/cards/sv6-163 https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/me1-117 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee perfect-pineco-35.txt
          grep -q 'T2 | READY' perfect-pineco-35.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Generate fresh T2 and T3 matrices
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --trials 100000 --seed 20260726 --out shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260726 --out all-decks-matrix.csv
          ./build/regidrago_sim --model-crobat --trials 100000 --seed 20260726 --out crobat-matrix.csv

      - name: Run complete sanitizer suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Materialize validated source and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_celestial_roar_override.inc tests/run_issue_1079_celestial_roar_hold.cmake
          git rm .github/workflows/issue-1623-validation.yml scripts/apply_issue_1623_patch.py
          git commit -m 'Hold Celestial Roar when no-control T2 is guaranteed'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1623-validation-${{ github.run_attempt }}
          path: |
            issue-1623-seed-91.txt
            control-no-control-19.txt
            perfect-pineco-35.txt
            shell-matrix.csv
            all-decks-matrix.csv
            crobat-matrix.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
