name: Issue 1672 baseline regeneration

on:
  push:
    branches: [fix/issue-1672-fss-vessel-latias]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Regenerate shell baseline
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
      - name: Regenerate paired named-deck comparison
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Regenerate reports
        run: |
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Upload generated baseline package
        uses: actions/upload-artifact@v4
        with:
          name: issue-1672-generated-baselines
          path: |
            README.md
            docs/REPORT.md
            docs/TRACE_AUDIT.md
            docs/MULTI_DECK_REPORT.md
            results/baseline_manifest.json
            results/simulation_results.csv
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
          if-no-files-found: error
