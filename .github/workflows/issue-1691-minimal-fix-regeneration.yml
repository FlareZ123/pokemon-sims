name: Issue 1691 minimal fix regeneration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'fix/issue-1691-projection-rng-isolation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the source-bounded RNG isolation fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path("src/trace_engine_v2/part_003.inc")
          engine = engine_path.read_text(encoding="utf-8")
          broad_copy = '''
  // Engine copies are speculative route projections. Give each projection an
  // isolated snapshot so a search-and-shuffle probe cannot consume the live trial RNG:
  // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
  // Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
  // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
  // Official search and shuffle procedure: https://www.pokemon.com/us/pokemon-tcg/rules
  // C++ reference-member copy semantics: https://eel.is/c++draft/class.copy.ctor#15
  // Repository fixed-seed sampling contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#sampling-and-comparison-method
  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1691
  Engine(const Engine& other)
      : scenario_(other.scenario_),
        recipe_(other.recipe_),
        projected_rng_(other.rng_),
        rng_(*projected_rng_),
        trace_(other.trace_),
        state_(other.state_),
        outcome_(other.outcome_),
        deck_seen_(other.deck_seen_),
        prizes_revealed_(other.prizes_revealed_),
        issue_1420_direct_t2_treasure_route_(
            other.issue_1420_direct_t2_treasure_route_) {}
'''
          if engine.count(broad_copy) != 1:
              raise SystemExit("Expected exactly one broad Engine copy constructor")
          engine = engine.replace(broad_copy, "")
          member_pair = "  std::optional<std::mt19937_64> projected_rng_;\n  std::mt19937_64& rng_;"
          if engine.count(member_pair) != 1:
              raise SystemExit("Expected exactly one projected RNG member pair")
          engine = engine.replace(member_pair, "  std::mt19937_64& rng_;")
          engine_path.write_text(engine, encoding="utf-8")

          path_1235 = Path("src/trace_engine_v2/part_issue_1235_oricorio_treasure_tapu_override.inc")
          source_1235 = path_1235.read_text(encoding="utf-8")
          old_1235 = '''  bool issue_1235_t2_treasure_tapu_crispin_completion_available() const {
    if (!issue_1235_t2_treasure_tapu_context_available()) return false;
    Engine projected = *this;
    projected.trace_ = nullptr;
    if (!projected.play_mysterious_treasure(true)) return false;
    projected.play_basics_from_hand();
    if (projected.hand_count(Card::Crispin) == 0 ||
        !projected.play_crispin()) return false;
    projected.attach_manual();
    projected.evolve_best_regi();
    return projected.active_is_vstar() &&
        projected.state_.active->grass >= 2 &&
        projected.state_.active->fire >= 1 && projected.payload_ready();
  }
'''
          new_1235 = '''  bool issue_1235_t2_treasure_tapu_crispin_completion_available() const {
    if (!issue_1235_t2_treasure_tapu_context_available()) return false;

    // The speculative Engine copy retains the live rng_ reference under ordinary
    // C++ reference-member copy semantics. Preserve the fixed-seed trial stream while
    // this silent route check resolves search effects and projected deck shuffles:
    // C++ reference-member copy semantics: https://eel.is/c++draft/class.copy.ctor#15
    // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
    // Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
    // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
    // Official search and shuffle procedure: https://www.pokemon.com/us/pokemon-tcg/rules
    // Fixed-seed sampling contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#sampling-and-comparison-method
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1691
    const std::mt19937_64 live_rng = rng_;
    Engine projected = *this;
    projected.trace_ = nullptr;
    const bool available = [&projected]() {
      if (!projected.play_mysterious_treasure(true)) return false;
      projected.play_basics_from_hand();
      if (projected.hand_count(Card::Crispin) == 0 ||
          !projected.play_crispin()) return false;
      projected.attach_manual();
      projected.evolve_best_regi();
      return projected.active_is_vstar() &&
          projected.state_.active->grass >= 2 &&
          projected.state_.active->fire >= 1 && projected.payload_ready();
    }();
    rng_ = live_rng;
    return available;
  }
'''
          if source_1235.count(old_1235) != 1:
              raise SystemExit("Expected exactly one issue-1235 projection")
          path_1235.write_text(source_1235.replace(old_1235, new_1235), encoding="utf-8")

          path_1209 = Path("src/trace_engine_v2/part_issue_1209_treasure_tapu_crispin_override.inc")
          source_1209 = path_1209.read_text(encoding="utf-8")
          old_1209 = '''  bool issue_1209_t2_treasure_tapu_crispin_completion_available() const {
    if (!issue_1209_t2_treasure_tapu_context_available()) return false;

    Engine projected = *this;
    projected.trace_ = nullptr;
    if (!projected.play_mysterious_treasure(true)) return false;
    projected.play_basics_from_hand();
    if (projected.hand_count(Card::Crispin) == 0 ||
        !projected.play_crispin()) {
      return false;
    }
    projected.attach_manual();
    projected.evolve_best_regi();
    projected.retreat_to_benched_vstar_with_latias();

    return projected.active_is_vstar() &&
        projected.state_.active->grass >= 2 &&
        projected.state_.active->fire >= 1 &&
        projected.payload_ready();
  }
'''
          new_1209 = '''  bool issue_1209_t2_treasure_tapu_crispin_completion_available() const {
    if (!issue_1209_t2_treasure_tapu_context_available()) return false;

    // The speculative Engine copy retains the live rng_ reference under ordinary
    // C++ reference-member copy semantics. Preserve the fixed-seed trial stream while
    // this silent route check resolves search effects and projected deck shuffles:
    // C++ reference-member copy semantics: https://eel.is/c++draft/class.copy.ctor#15
    // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
    // Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
    // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
    // Official search and shuffle procedure: https://www.pokemon.com/us/pokemon-tcg/rules
    // Fixed-seed sampling contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#sampling-and-comparison-method
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1691
    const std::mt19937_64 live_rng = rng_;
    Engine projected = *this;
    projected.trace_ = nullptr;
    const bool available = [&projected]() {
      if (!projected.play_mysterious_treasure(true)) return false;
      projected.play_basics_from_hand();
      if (projected.hand_count(Card::Crispin) == 0 ||
          !projected.play_crispin()) {
        return false;
      }
      projected.attach_manual();
      projected.evolve_best_regi();
      projected.retreat_to_benched_vstar_with_latias();

      return projected.active_is_vstar() &&
          projected.state_.active->grass >= 2 &&
          projected.state_.active->fire >= 1 &&
          projected.payload_ready();
    }();
    rng_ = live_rng;
    return available;
  }
'''
          if source_1209.count(old_1209) != 1:
              raise SystemExit("Expected exactly one issue-1209 projection")
          path_1209.write_text(source_1209.replace(old_1209, new_1209), encoding="utf-8")
          PY
      - name: Build minimal fix and run focused regression
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ./build/regidrago_unified_tests issue_1691_projection_rng_isolation_tests
      - name: Regenerate source-bound setup evidence
        run: |
          # Fixed-seed evidence contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#sampling-and-comparison-method
          # Confirmed RNG-isolation bug: https://github.com/FlareZ123/pokemon-sims/issues/1691
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Upload exact source and evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: issue-1691-minimal-source-audit
          path: |
            CMakeLists.txt
            README.md
            src
            tests
            scripts
            docs
            results
      - name: Commit minimal fix and regenerated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs results src tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply minimal projection RNG isolation fix"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
