name: Issue 1700 Post 1821 Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.pull_request.head.ref == 'fix/issue-1700-after-1821'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Compose reviewed issue 1700 fix onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin issue-1700-pre-steven-vessel
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def old_text(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"origin/issue-1700-pre-steven-vessel:{path}"],
                  text=True,
              )

          def block(text: str, start: str, end: str) -> str:
              begin = text.index(start)
              finish = text.index(end, begin)
              return text[begin:finish]

          supporter_path = Path("src/trace_engine_v2/part_issue_1070_tate_after_vstar_search_override.inc")
          supporter = supporter_path.read_text(encoding="utf-8")
          reviewed_supporter = old_text(str(supporter_path))
          route_start = "  std::optional<Card> issue_1700_pre_steven_vessel_cost() const {"
          choose_start = "  void choose_supporter() {"
          route_block = block(reviewed_supporter, route_start, choose_start)
          if route_start not in supporter:
              supporter = supporter.replace(choose_start, route_block + choose_start, 1)

          call = (
              "  void choose_supporter() {\n"
              "    if (play_issue_1700_pre_steven_vessel_route()) return; // Earthen Vessel, Steven, and confirmed route: https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sm7-145 https://github.com/FlareZ123/pokemon-sims/issues/1700\n"
              "    if (play_issue_1700_known_prize_gladion_before_blender()) return; // Gladion and earliest T3 route: https://api.pokemontcg.io/v2/cards/sm4-95 https://github.com/FlareZ123/pokemon-sims/issues/1700\n"
          )
          if call not in supporter:
              supporter = supporter.replace(choose_start, call, 1)
          supporter_path.write_text(supporter, encoding="utf-8")

          blender_path = Path("src/trace_engine_v2/part_blender_vstar_axis_override.inc")
          blender = blender_path.read_text(encoding="utf-8")
          reviewed_blender = old_text(str(blender_path))
          helper_start = "  bool play_issue_1700_known_prize_gladion_before_blender() {"
          blender_start = "  bool play_brilliant_blender() {"
          helper_block = block(reviewed_blender, helper_start, blender_start)
          if helper_start not in blender:
              blender = blender.replace(blender_start, helper_block + blender_start, 1)
          blender_call = (
              "  bool play_brilliant_blender() {\n"
              "    if (play_issue_1700_known_prize_gladion_before_blender()) return true; // Gladion and confirmed route: https://api.pokemontcg.io/v2/cards/sm4-95 https://github.com/FlareZ123/pokemon-sims/issues/1700\n"
          )
          if blender_call not in blender:
              blender = blender.replace(blender_start, blender_call, 1)
          blender_path.write_text(blender, encoding="utf-8")

          turn_path = Path("src/trace_engine_v2/part_014c_latias_bench_override.inc")
          turn = turn_path.read_text(encoding="utf-8")
          old_turn = (
              "    play_items_until_stable(!strict_payload_timing());\n\n"
              "    attach_manual();\n"
              "    if (complete_issue_1564_quick_ball_latias_promotion()) {"
          )
          new_turn = (
              "    play_items_until_stable(!strict_payload_timing());\n\n"
              "    play_issue_1700_known_prize_gladion_before_blender(); // Gladion must use the still-open T2 Supporter window before attachment: https://api.pokemontcg.io/v2/cards/sm4-95 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf https://github.com/FlareZ123/pokemon-sims/issues/1700\n"
              "    attach_manual();\n"
              "    if (complete_issue_1564_quick_ball_latias_promotion()) {"
          )
          if new_turn not in turn:
              if turn.count(old_turn) != 1:
                  raise RuntimeError("Expected one pre-attachment issue-1700 turn-policy marker")
              turn = turn.replace(old_turn, new_turn, 1)
          turn_path.write_text(turn, encoding="utf-8")

          for test_name in (
              "tests/issue_1700_pre_steven_vessel_tests.cpp",
              "tests/issue_1645_steven_latias_grass_tests.cpp",
          ):
              test_path = Path(test_name)
              test_path.write_text(old_text(test_name), encoding="utf-8")
          PY

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Run focused issue 1700 regressions
        run: |
          ./build/regidrago_unified_tests issue_1700_pre_steven_vessel_tests
          ./build/regidrago_unified_tests issue_1645_steven_latias_grass_tests

      - name: Pass 1 registered strict JIT seed 218
        shell: bash
        run: |
          set -euo pipefail
          # Earthen Vessel, Steven's Resolve, Gladion, Latias ex, Brilliant Blender, and Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sm4-95 https://api.pokemontcg.io/v2/cards/sv8-76 https://api.pokemontcg.io/v2/cards/sv8-164 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official procedure and confirmed bug: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf https://github.com/FlareZ123/pokemon-sims/issues/1700
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 218 --require-ready-by 3 | tee trace-pass-1.txt

      - name: Pass 2 modeling matchup-flex seed 218
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --model-variant crobat1-heavy-ball --scenario matchup-flex-jit/go-second --seed 218 --require-ready-by 3 | tee trace-pass-2.txt

      - name: Pass 3 registered no-discard seed 218
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-second --seed 218 --require-ready-by 3 | tee trace-pass-3.txt

      - name: Regenerate source-bound setup evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2

      - name: Run complete sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate T2 and T3 matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out t2-t3-all-condition-matrix.csv

      - name: Commit validated fix and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-1700-post-1821-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests results docs .github/workflows/issue-1700-post-1821-validation.yml
          git commit -m 'Fix issue 1700 Vessel Gladion T3 route after issue 1821'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          git rev-parse HEAD | tee tested-head.txt

      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1700-post-1821-validation-${{ github.run_attempt }}
          path: |
            tested-head.txt
            trace-pass-*.txt
            t2-t3-shell-matrix.csv
            t2-t3-all-condition-matrix.csv
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
