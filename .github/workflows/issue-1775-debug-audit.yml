name: Issue 1775 Debug Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-1775-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  three-simulate-this-passes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Pass 1 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # K0/K1, DCI/JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee debug-trace-pass-1.txt
      - name: Pass 2 shell matchup-flex JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago V/VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Ready-state specification: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee debug-trace-pass-2.txt
      - name: Pass 3 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Pineco route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco, Forretress ex, and Secret Box: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee debug-trace-pass-3.txt
      - name: Reverify issue 1775 seed 38
        shell: bash
        run: |
          set -euo pipefail
          # Gladion, Mysterious Treasure, Earthen Vessel, Dragapult ex, and Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/sm4-95 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Confirmed issue: https://github.com/FlareZ123/pokemon-sims/issues/1775
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 38 | tee debug-trace-issue-1775.txt
      - name: Reverify approval-pending issue 1772 seed 145
        shell: bash
        run: |
          set -euo pipefail
          # Issue and source-bound route: https://github.com/FlareZ123/pokemon-sims/issues/1772 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-76
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 145 | tee debug-trace-issue-1772.txt
      - name: Generate canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out debug-t2-t3-matrix.csv
      - name: Generate paired T2 T3 T4 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out debug-multi-deck-matrix.csv
      - name: Record tested source
        run: git rev-parse HEAD | tee debug-tested-head.txt
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1775-debug-evidence-${{ github.run_attempt }}
          path: |
            debug-trace-*.txt
            debug-t2-t3-matrix.csv
            debug-multi-deck-matrix.csv
            debug-tested-head.txt
          if-no-files-found: error
