name: Issue 1795 Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-bound-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build simulator and tests
        run: cmake --build build --parallel 2

      - name: Diagnostic exact seed 364 trace
        shell: bash
        run: |
          set -euo pipefail
          # Crispin, Steven's Resolve, Earthen Vessel, Regidrago VSTAR, official procedure, and confirmed issue:
          # https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # https://github.com/FlareZ123/pokemon-sims/issues/1795
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 364 | tee issue-1795-diagnostic.txt

      - name: Focused issue 1795 regressions
        run: ctest --test-dir build -R regidrago_issue_1795_crispin_steven_vessel_tests --output-on-failure

      - name: Pass 1 exact seed 364 Crispin Steven Vessel route
        shell: bash
        run: |
          set -euo pipefail
          # Crispin, Steven's Resolve, Earthen Vessel, Regidrago VSTAR, official procedure, and confirmed issue:
          # https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/swsh12-136
          # https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # https://github.com/FlareZ123/pokemon-sims/issues/1795
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 364 --require-ready-by 4 | tee issue-1795-pass-1.txt

      - name: Pass 2 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state and earliest-route specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee issue-1795-pass-2.txt

      - name: Pass 3 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco route, Pineco, Forretress ex, and Secret Box:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee issue-1795-pass-3.txt

      - name: Regenerate canonical shell baselines
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705

      - name: Regenerate named deck comparison
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705

      - name: Regenerate reports
        run: |
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Complete Release test suite
        run: ctest --test-dir build --output-on-failure

      - name: Copy canonical T2 T3 matrices
        run: |
          cp results/simulation_results.csv issue-1795-t2-t3-matrix.csv
          cp results/multi_deck_comparison.csv issue-1795-all-decks-matrix.csv

      - name: Record tested source
        run: git rev-parse HEAD | tee issue-1795-tested-head.txt

      - name: Upload source-bound evidence and regenerated baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1795-validation-${{ github.run_attempt }}
          path: |
            issue-1795-diagnostic.txt
            issue-1795-pass-*.txt
            issue-1795-t2-t3-matrix.csv
            issue-1795-all-decks-matrix.csv
            issue-1795-tested-head.txt
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces/*.txt
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces/*.txt
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: warn
