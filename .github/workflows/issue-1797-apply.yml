name: Issue 1797 Apply and Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  source-bound-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Adapt patch to current final turn wrapper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_issue_1797.py")
          text = path.read_text(encoding="utf-8")
          old = "  void run_turn() {"
          new = "  void run_turn_issue1775_original() {"
          if text.count(old) != 2:
              raise RuntimeError("Expected two issue-1797 final turn wrapper markers")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Apply source-bound issue 1797 patch
        run: python scripts/apply_issue_1797.py

      - name: Use the repository ability-lock scenario enum
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/issue_1797_quick_ball_tapu_steven_tests.cpp")
          text = path.read_text(encoding="utf-8")
          old = "sim::LockMode::Ability"
          new = "sim::LockMode::FullRuleBoxAbility"
          if text.count(old) != 1:
              raise RuntimeError("Expected one issue-1797 ability-lock enum marker")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build simulator and tests
        run: cmake --build build --parallel 2

      - name: Focused issue 1797 regressions
        run: ctest --test-dir build -R regidrago_issue_1797_quick_ball_tapu_steven_tests --output-on-failure

      - name: Pass 1 exact seed 854 Quick Ball Tapu Steven route
        shell: bash
        run: |
          set -euo pipefail
          # Hisuian Heavy Ball, Quick Ball, Tapu Lele-GX, Steven's Resolve, Crispin, Earthen Vessel, and Regidrago VSTAR:
          # https://api.pokemontcg.io/v2/cards/swsh10-146 https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Confirmed issue: https://github.com/FlareZ123/pokemon-sims/issues/1797
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 854 --require-ready-by 3 | tee issue-1797-pass-1.txt

      - name: Pass 2 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state and earliest-route specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee issue-1797-pass-2.txt

      - name: Pass 3 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco route, Pineco, Forretress ex, and Secret Box:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee issue-1797-pass-3.txt

      - name: Regenerate canonical shell baselines
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705

      - name: Regenerate named deck comparison
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705

      - name: Regenerate reports
        run: |
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Complete Release test suite
        run: ctest --test-dir build --output-on-failure

      - name: Record tested source
        run: git rev-parse HEAD | tee issue-1797-tested-head.txt

      - name: Upload source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-1797-validation-${{ github.run_attempt }}
          path: |
            issue-1797-pass-*.txt
            issue-1797-tested-head.txt
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces/*.txt
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces/*.txt
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: error

      - name: Commit tested source, reports, and matrices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_007.inc src/trace_engine_v2/part_009b1.inc src/trace_engine_v2/part_014c_issue_1152_bridge.inc src/trace_engine_v2/part_issue_1675_latias_late_promotion_override.inc tests/issue_1797_quick_ball_tapu_steven_tests.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/simulation_results.csv results/baseline_manifest.json results/traces results/multi_deck_comparison.csv results/multi_deck_manifest.json results/multi_deck_traces
          git rm scripts/apply_issue_1797.py .github/workflows/issue-1797-apply.yml
          git commit -m "Prefer Quick Ball Tapu Steven route for #1797"
          git push origin HEAD:${{ github.head_ref }}
