name: Issue 1798 Current Main Evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive exact tested source
        run: git archive --format=zip --output=issue-1798-tested-source.zip HEAD
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Run focused regression and exact seed
        shell: bash
        run: |
          set -euo pipefail
          # Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
          # Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
          # Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1798
          ./build/regidrago_unified_tests issue_1798_steven_blender_route_tests | tee issue-1798-focused.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 1801 --require-ready-by 4 | tee issue-1798-seed-1801.txt
          grep -q "T4 | READY" issue-1798-seed-1801.txt
          ! grep -q "T3 | ATTACK" issue-1798-seed-1801.txt
      - name: Generate canonical matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-matrix.csv
      - name: Generate paired all-deck matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-matrix.csv
      - name: Record simulator policy source digest
        run: python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))" | tee simulator-policy-source-sha256.txt
      - name: Record tested source
        run: git rev-parse HEAD | tee tested-head.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1798-current-main-evidence-${{ github.run_attempt }}
          path: |
            issue-1798-tested-source.zip
            issue-1798-focused.txt
            issue-1798-seed-1801.txt
            t2-t3-matrix.csv
            multi-deck-matrix.csv
            simulator-policy-source-sha256.txt
            tested-head.txt
            build/regidrago_sim
            build/regidrago_unified_tests
          if-no-files-found: warn
