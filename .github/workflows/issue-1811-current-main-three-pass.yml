name: Issue 1811 Current Main Three Pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git ls-files | sort > source-files.txt
          git archive --format=zip --output=exact-tested-source.zip HEAD
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release simulator and tests
        run: cmake --build build --parallel 2
      - name: Simulate pass 1 issue 1811 witness
        shell: bash
        run: |
          set -euo pipefail
          # Arven, Mysterious Treasure, Forest Seal Stone, Crispin, Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv1-166 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/swsh12-156 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv4-163
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # K1, DCI/JIT, and earliest-route specifications: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 424242 | tee trace-pass-1.txt
      - name: Simulate pass 2 shell strict JIT going first
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 38 | tee trace-pass-2.txt
      - name: Simulate pass 3 Pineco matchup flex going second
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 104729 | tee trace-pass-3.txt
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Configure sanitizer build
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build sanitizer simulator and tests
        run: cmake --build build-sanitize --parallel 2
      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure
      - name: Generate canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-matrix.csv
      - name: Generate all-deck T2 T3 T4 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out all-deck-matrix.csv
      - name: Upload audit evidence and local-validation binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1811-current-main-three-pass-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            source-files.txt
            tested-head.txt
            trace-pass-*.txt
            t2-t3-matrix.csv
            all-deck-matrix.csv
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
