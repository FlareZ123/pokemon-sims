name: Issue 1821 Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1821-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1821-oricorio-steven-latias'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source composition
        run: python3 scripts/apply_issue_1821_composition.py

      - name: Remove temporary validation machinery
        run: |
          rm scripts/apply_issue_1821_composition.py
          rm .github/workflows/issue-1821-validation.yml
          git rev-parse HEAD | tee pre-finalize-head.txt

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Run focused regression
        run: ctest --test-dir build -R regidrago_issue_1821_oricorio_steven_latias_tests --output-on-failure

      - name: Trace exact fixed seed
        shell: bash
        run: |
          set -euo pipefail
          # Oricorio, Tapu Lele-GX, Steven, Crispin, Latias, Vessel, payload, and attacker sources: https://api.pokemontcg.io/v2/cards/sm2-55 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-76 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official procedure and confirmed issue: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf https://github.com/FlareZ123/pokemon-sims/issues/1821
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 161803 --require-ready-by 3 | tee trace-issue-1821.txt

      - name: Perfect control pass 1
        shell: bash
        run: |
          set -euo pipefail
          # T2 is the earliest legal Regidrago VSTAR readiness window because Pokémon cannot evolve on either player's first turn: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-control-1.txt

      - name: Perfect control pass 2
        shell: bash
        run: |
          set -euo pipefail
          # T2 is the earliest legal Regidrago VSTAR readiness window because Pokémon cannot evolve on either player's first turn: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-control-2.txt

      - name: Perfect control pass 3
        shell: bash
        run: |
          set -euo pipefail
          # Pineco, Forretress ex, and the earliest legal VSTAR window: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-control-3.txt

      - name: Regenerate canonical setup reports
        run: |
          python3 scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python3 scripts/update_setup_docs.py --repo-root .
          python3 scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python3 scripts/update_multi_deck_docs.py --repo-root .

      - name: Archive exact tested tree
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --binary > issue-1821-composition.patch
          git write-tree | tee tested-tree.txt
          git archive --format=zip --output=issue-1821-tested-source.zip "$(cat tested-tree.txt)"

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2

      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate shell matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out issue-1821-shell-matrix.csv

      - name: Generate all-condition matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out issue-1821-all-condition-matrix.csv

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1821-validation-${{ github.run_attempt }}
          path: |
            pre-finalize-head.txt
            tested-tree.txt
            issue-1821-composition.patch
            issue-1821-tested-source.zip
            trace-issue-1821.txt
            trace-control-*.txt
            issue-1821-shell-matrix.csv
            issue-1821-all-condition-matrix.csv
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            results/baseline_manifest.json
            results/multi_deck_manifest.json
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn

      - name: Commit validated source
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix issue 1821 Oricorio Steven route'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
