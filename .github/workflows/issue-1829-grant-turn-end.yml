name: Issue 1829 Grant Turn End

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1829-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply idempotent production and regression fix
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import fcntl
          import os
          import tempfile
          from pathlib import Path

          def atomic_write(path: Path, content: str) -> None:
              with tempfile.NamedTemporaryFile(
                  mode="w",
                  encoding="utf-8",
                  newline="\n",
                  dir=path.parent,
                  delete=False,
              ) as temporary:
                  temporary.write(content)
                  temporary.flush()
                  os.fsync(temporary.fileno())
                  temporary_path = Path(temporary.name)
              os.replace(temporary_path, path)

          source_path = Path("src/trace_engine_v2/part_014c.inc")
          test_path = Path("tests/issue_1790_grant_recovery_tests.cpp")
          lock_path = Path(".issue-1829-patch.lock")

          with lock_path.open("w", encoding="utf-8") as lock:
              fcntl.flock(lock.fileno(), fcntl.LOCK_EX)

              source = source_path.read_text(encoding="utf-8")
              old_source = """  std::optional<std::array<Card, 2>> grant_recovery_strict_jit_costs() {
              if (!strict_payload_timing() || !need_payload() || !active_is_vstar() ||
                  need_energy() || count_of(state_.discard, Card::Grant) == 0) {
                return std::nullopt;
              }
          """
              new_source = """  std::optional<std::array<Card, 2>> grant_recovery_strict_jit_costs() {
              // Grant's discard-pile recovery is available only during the player's turn.
              // Once an attack or another turn-ending effect sets turn_ended, readiness
              // observation must not create a new gameplay action:
              // Grant: https://api.pokemontcg.io/v2/cards/swsh10-144
              // Official turn and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
              // Existing turn-ended action gate: https://github.com/FlareZ123/pokemon-sims/blob/main/src/trace_engine_v2/part_003.inc#L157-L161
              // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1829
              if (state_.turn_ended || !strict_payload_timing() || !need_payload() ||
                  !active_is_vstar() || need_energy() ||
                  count_of(state_.discard, Card::Grant) == 0) {
                return std::nullopt;
              }
          """
              if new_source not in source:
                  if old_source not in source:
                      raise RuntimeError("Grant recovery predicate no longer matches the reviewed source")
                  source = source.replace(old_source, new_source, 1)
                  atomic_write(source_path, source)

              tests = test_path.read_text(encoding="utf-8")
              test_name = "test_grant_recovery_respects_turn_end_boundary"
              if test_name not in tests:
                  insertion_marker = "\n}  // namespace\n\nint main() {"
                  if insertion_marker not in tests:
                      raise RuntimeError("Grant regression insertion marker is missing")
                  new_test = r'''

          void test_grant_recovery_respects_turn_end_boundary() {
            Fixture ended;
            sim::State ended_state = grant_route_state();
            ended_state.turn_ended = true;
            const std::vector<sim::Card> hand_before = ended_state.hand;
            const std::vector<sim::Card> discard_before = ended_state.discard;
            const std::vector<sim::Card> discarded_this_turn_before =
                ended_state.discarded_this_turn;
            sim::EngineTestAccess::set_state(ended.engine, std::move(ended_state));

            // Grant's discard-pile action is legal only during the player's turn. A
            // readiness observer may inspect a completed turn, but it cannot discard
            // cards or recover Grant after the turn-ending boundary:
            // Grant: https://api.pokemontcg.io/v2/cards/swsh10-144
            // Official turn and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
            // Existing turn-ended action gate: https://github.com/FlareZ123/pokemon-sims/blob/main/src/trace_engine_v2/part_003.inc#L157-L161
            // Strict-JIT policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1829
            sim::EngineTestAccess::record_ready(ended.engine);

            sim::State& after_end = sim::EngineTestAccess::state(ended.engine);
            if (sim::EngineTestAccess::outcome(ended.engine).first_ready_turn != 0 ||
                after_end.hand != hand_before || after_end.discard != discard_before ||
                after_end.discarded_this_turn != discarded_this_turn_before ||
                !after_end.turn_ended) {
              throw std::runtime_error(
                  "Grant recovery mutated zones or readiness after the turn ended.");
            }

            Fixture active;
            sim::EngineTestAccess::set_state(active.engine, grant_route_state());
            sim::EngineTestAccess::record_ready(active.engine);
            sim::State& after_active = sim::EngineTestAccess::state(active.engine);
            if (sim::EngineTestAccess::outcome(active.engine).first_ready_turn != 2 ||
                !contains(after_active.hand, sim::Card::Grant) ||
                contains(after_active.discard, sim::Card::Grant) ||
                !contains(after_active.discard, sim::Card::Dragapult) ||
                !contains(after_active.discard, sim::Card::WishfulBaton)) {
              throw std::runtime_error(
                  "The legal active-turn Grant recovery route regressed.");
            }
          }
          '''
                  tests = tests.replace(insertion_marker, new_test + insertion_marker, 1)
                  old_main = """  test_grant_requires_the_card_and_an_incomplete_payload_axis();
          }"""
                  new_main = """  test_grant_requires_the_card_and_an_incomplete_payload_axis();
            test_grant_recovery_respects_turn_end_boundary();
          }"""
                  if old_main not in tests:
                      raise RuntimeError("Grant regression main call marker is missing")
                  tests = tests.replace(old_main, new_main, 1)
                  atomic_write(test_path, tests)

              fcntl.flock(lock.fileno(), fcntl.LOCK_UN)

          lock_path.unlink(missing_ok=True)
          PY

          if git diff --quiet -- src/trace_engine_v2/part_014c.inc tests/issue_1790_grant_recovery_tests.cpp; then
            echo "Issue 1829 patch already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/trace_engine_v2/part_014c.inc tests/issue_1790_grant_recovery_tests.cpp
            git commit -m "Reject Grant recovery after turn end"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Archive exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-head.txt
          git diff --check
          git archive --format=zip --output=exact-tested-source.zip HEAD

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release simulator and tests
        run: cmake --build build --parallel 2

      - name: Run focused Grant regression
        run: ./build/regidrago_unified_tests issue_1790_grant_recovery_tests

      - name: Simulate pass 1 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Repository trace specification: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#run-one-readable-hand
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-pass-1.txt

      - name: Simulate pass 2 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Secret Box and registered recipe sources: https://api.pokemontcg.io/v2/cards/sv6-163 https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#registered-decks
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pass-2.txt

      - name: Simulate pass 3 shell no-discard-control going first
        shell: bash
        run: |
          set -euo pipefail
          # Fixed trace contract: https://github.com/FlareZ123/pokemon-sims/blob/main/CMakeLists.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 6 --require-ready-by 4 | tee trace-pass-3.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Configure sanitizer build
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizer simulator and tests
        run: cmake --build build-sanitize --parallel 2

      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out issue-1829-canonical-matrix.csv

      - name: Generate all-condition T2 T3 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out issue-1829-all-condition-matrix.csv

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1829-validation-${{ github.run_attempt }}
          path: |
            exact-tested-source.zip
            tested-head.txt
            trace-pass-*.txt
            issue-1829-*-matrix.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn

      - name: Remove temporary workflow after successful validation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-1829-grant-turn-end.yml
          git commit -m "Remove temporary issue 1829 validation workflow"
          git push origin "HEAD:${HEAD_BRANCH}"
