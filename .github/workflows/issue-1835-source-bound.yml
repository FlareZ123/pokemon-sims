name: Issue 1835 Source Bound Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'fix/issue-1835-lusamine-single-target'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply confirmed patch and remove temporary machinery
        shell: bash
        run: |
          git apply --check -p2 .github/issue-1835.patch
          git apply -p2 .github/issue-1835.patch
          git rm .github/issue-1835.patch .github/workflows/issue-1835-source-bound.yml
          git diff --check

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        run: cmake --build build --parallel 2
      - name: Run focused Lusamine regressions
        run: ctest --test-dir build --output-on-failure -R 'regidrago_(issue_1392_lusamine_chaotic_swell_tests|lusamine_arven_fss_payload_tests|lusamine_arven_item_lock_tests|lusamine_erika_fallback_tests)'

      - name: Simulate pass 1 shell strict JIT
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-pass-1.txt
      - name: Simulate pass 2 combined lock
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-combined-lock/go-first --seed 8675309 | tee trace-pass-2.txt
      - name: Simulate pass 3 Pineco strict JIT
        run: ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pass-3.txt

      - name: Regenerate canonical shell reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired deck reports
        run: |
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Configure sanitizer build
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build sanitizer suite
        run: cmake --build build-sanitize --parallel 2
      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Generate final canonical T2 T3 matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260729 --out t2-t3-matrix.csv
      - name: Generate final all-deck T2 T3 matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260729 --out all-deck-matrix.csv

      - name: Archive exact validated tree
        shell: bash
        run: |
          git add -u
          git diff --cached --check
          git diff --cached > issue-1835.patch
          git diff --cached --name-only > tested-files.txt
          git rev-parse HEAD | tee parent-head.txt
          git write-tree | tee tested-tree.txt
          git archive --format=zip --output=exact-tested-source.zip "$(cat tested-tree.txt)"

      - name: Upload source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-1835-source-bound-${{ github.run_attempt }}
          path: |
            parent-head.txt
            tested-tree.txt
            tested-files.txt
            issue-1835.patch
            exact-tested-source.zip
            trace-pass-*.txt
            t2-t3-matrix.csv
            all-deck-matrix.csv
            build/Testing
            build-sanitize/Testing

      - name: Commit the exact validated tree
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Allow Lusamine to recover a lone eligible target'
          git push origin HEAD:"$HEAD_REF"
