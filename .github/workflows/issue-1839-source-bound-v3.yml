name: Issue 1839 Source Bound Validation V3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1839-dawn-secret-box-refill'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge current production main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply final issue 1839 patch
        run: |
          python scripts/apply_issue_1839.py
          python scripts/refine_issue_1839.py
          python scripts/finalize_issue_1839.py

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Run focused Dawn Secret Box regressions
        run: ctest --test-dir build -R regidrago_issue_1839_dawn_secret_box_refill_tests --output-on-failure

      - name: Simulate pass 1 exact matchup-flex seed 1618033
        shell: bash
        run: |
          set -euo pipefail
          # Dawn, Secret Box, Forretress ex, Appletun, and Regidrago VSTAR:
          # https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/sv6-163 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv8-140 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Confirmed issue: https://github.com/FlareZ123/pokemon-sims/issues/1839
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 1618033 --require-ready-by 2 | tee issue-1839-pass-1.txt
          if grep -q 'LEGACY STAR' issue-1839-pass-1.txt; then
            echo 'Exact route still spent Legacy Star' >&2
            exit 1
          fi
          grep -F 'Dawn searched and revealed: Regidrago V, Appletun sv8-140, Mega Dragonite ex.' issue-1839-pass-1.txt
          grep -F 'Dawn refilled and immediately paid Secret Box' issue-1839-pass-1.txt
          grep -F 'T2 | READY' issue-1839-pass-1.txt

      - name: Simulate pass 2 shell strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state and earliest-route specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee issue-1839-pass-2.txt
          grep -F 'T2 | READY' issue-1839-pass-2.txt

      - name: Simulate pass 3 Pineco strict JIT going second
        shell: bash
        run: |
          set -euo pipefail
          # Pineco, Forretress ex, and Secret Box route sources:
          # https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sv6-163
          # Repository route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee issue-1839-pass-3.txt
          grep -F 'T2 | READY' issue-1839-pass-3.txt

      - name: Regenerate source-bound matrices and reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Run complete Release suite
        run: ctest --test-dir build --output-on-failure

      - name: Configure, build, and run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DREGIDRAGO_ENABLE_SANITIZERS=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure

      - name: Generate final T2 T3 matrix summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          rows = list(csv.DictReader(Path('results/multi_deck_comparison.csv').open(encoding='utf-8')))
          output = Path('issue-1839-t2-t3-matrix.txt')
          with output.open('w', encoding='utf-8') as handle:
              handle.write('deck,scenario,T2,T3\n')
              for row in rows:
                  handle.write(','.join([
                      row['deck'], row['scenario'],
                      row['ready_by_t2_pct'], row['ready_by_t3_pct']
                  ]) + '\n')
          PY
          cat issue-1839-t2-t3-matrix.txt

      - name: Archive exact validated tree
        run: git archive --format=tar.gz --output=issue-1839-tested-tree.tar.gz HEAD

      - name: Upload exact source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-1839-source-bound-v3-${{ github.run_attempt }}
          path: |
            issue-1839-pass-*.txt
            issue-1839-t2-t3-matrix.txt
            issue-1839-tested-tree.tar.gz
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: error

      - name: Commit exact validated source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git add src/trace_engine_v2/part_forretress_ex_combo.inc tests/issue_1839_dawn_secret_box_refill_tests.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/simulation_results.csv results/baseline_manifest.json results/traces results/multi_deck_comparison.csv results/multi_deck_manifest.json results/multi_deck_traces
          git rm scripts/apply_issue_1839.py scripts/refine_issue_1839.py scripts/finalize_issue_1839.py .github/workflows/issue-1839-source-bound.yml .github/workflows/issue-1839-source-bound-v2.yml .github/workflows/issue-1839-source-bound-v3.yml .github/workflows/issue-1839-diagnostic.yml .github/workflows/issue-1839-exact-state-trace.yml .github/workflows/issue-1839-exact-state-trace.yml
          git commit -m "Refill Secret Box costs through Dawn for #1839"
          git push origin HEAD:${{ github.head_ref }}
