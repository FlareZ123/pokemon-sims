name: Issue 1840 Source Bound Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1840-secret-box-surplus-fire'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge current production main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Correct Mega Dragonite source URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import fcntl
          import os
          import tempfile
          from pathlib import Path

          path = Path("scripts/apply_issue_1840.py")
          lock_path = path.with_suffix(path.suffix + ".lock")
          descriptor = os.open(lock_path, os.O_CREAT | os.O_RDWR, 0o600)
          try:
              fcntl.flock(descriptor, fcntl.LOCK_EX)
              source = path.read_text(encoding="utf-8")
              stale = "https://api.pokemontcg.io/v2/cards/" + "me2-132"
              corrected = source.replace(
                  stale,
                  "https://api.pokemontcg.io/v2/cards/me2pt5-152",
              )
              if corrected == source:
                  raise SystemExit("Expected the stale Mega Dragonite URL")
              with tempfile.NamedTemporaryFile(
                  mode="w",
                  encoding="utf-8",
                  newline="",
                  dir=path.parent,
                  prefix=f".{path.name}.",
                  delete=False,
              ) as handle:
                  handle.write(corrected)
                  temporary = Path(handle.name)
              os.replace(temporary, path)
          finally:
              fcntl.flock(descriptor, fcntl.LOCK_UN)
              os.close(descriptor)
              lock_path.unlink(missing_ok=True)
          PY

      - name: Apply confirmed issue 1840 patch
        run: python scripts/apply_issue_1840.py

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Run focused surplus Fire regressions
        run: ctest --test-dir build -R regidrago_issue_1840_secret_box_surplus_fire_tests --output-on-failure

      - name: Simulate pass 1 exact seed 58
        shell: bash
        run: |
          set -euo pipefail
          # Secret Box, Dawn, Forretress ex, Mega Dragonite ex, Regidrago VSTAR, and Steven's Resolve:
          # https://api.pokemontcg.io/v2/cards/sv6-163 https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/me2pt5-152 https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sm7-145
          # Confirmed issue: https://github.com/FlareZ123/pokemon-sims/issues/1840
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 58 --require-ready-by 4 | tee issue-1840-pass-1.txt
          grep -F 'Fire Energy (Secret Box cost)' issue-1840-pass-1.txt
          grep -F 'Mega Dragonite ex (Secret Box cost)' issue-1840-pass-1.txt
          grep -F 'Dawn searched and revealed' issue-1840-pass-1.txt
          grep -F 'T4 | READY' issue-1840-pass-1.txt
          if grep -F 'T4 | PLAY SUPPORTER | rules: R-STEVEN-01' issue-1840-pass-1.txt; then
            echo "Seed 58 still ended T4 through Steven's Resolve" >&2
            exit 1
          fi

      - name: Simulate pass 2 preserve issue 1839 exact route
        shell: bash
        run: |
          set -euo pipefail
          # Dawn and immediate Secret Box retry regression:
          # https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/sv6-163
          # Completed issue: https://github.com/FlareZ123/pokemon-sims/issues/1839
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 1618033 --require-ready-by 2 | tee issue-1840-pass-2.txt
          grep -F 'Dawn refilled and immediately paid Secret Box' issue-1840-pass-2.txt
          grep -F 'T2 | READY' issue-1840-pass-2.txt
          if grep -q 'LEGACY STAR' issue-1840-pass-2.txt; then
            echo 'Issue 1839 route regressed to Legacy Star' >&2
            exit 1
          fi

      - name: Simulate pass 3 independent shell route
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state and earliest-route repository specifications:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee issue-1840-pass-3.txt
          grep -F 'T2 | READY' issue-1840-pass-3.txt

      - name: Regenerate source-bound matrices and reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Run complete Release suite
        run: ctest --test-dir build --output-on-failure

      - name: Configure, build, and run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DREGIDRAGO_ENABLE_SANITIZERS=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure

      - name: Generate final T2 T3 matrix summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          rows = list(csv.DictReader(Path('results/multi_deck_comparison.csv').open(encoding='utf-8')))
          output = Path('issue-1840-t2-t3-matrix.txt')
          with output.open('w', encoding='utf-8') as handle:
              handle.write('deck,scenario,T2,T3\n')
              for row in rows:
                  handle.write(','.join([
                      row['deck'], row['scenario'],
                      row['ready_by_t2_pct'], row['ready_by_t3_pct']
                  ]) + '\n')
          PY
          cat issue-1840-t2-t3-matrix.txt

      - name: Archive exact validated tree
        run: git archive --format=tar.gz --output=issue-1840-tested-tree.tar.gz HEAD

      - name: Upload exact source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-1840-source-bound-${{ github.run_attempt }}
          path: |
            issue-1840-pass-*.txt
            issue-1840-t2-t3-matrix.txt
            issue-1840-tested-tree.tar.gz
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: error

      - name: Commit exact validated source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git add src/trace_engine_v2/part_issue_1118_secret_box.inc tests/issue_1840_secret_box_surplus_fire_tests.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/simulation_results.csv results/baseline_manifest.json results/traces results/multi_deck_comparison.csv results/multi_deck_manifest.json results/multi_deck_traces
          git rm -f scripts/apply_issue_1840.py scripts/refine_issue_1840.py .github/workflows/issue-1840-source-bound.yml .github/workflows/issue-1840-source-bound-v2.yml
          git commit -m "Spend fully surplus Fire through Secret Box for #1840"
          git push origin HEAD:${{ github.head_ref }}
