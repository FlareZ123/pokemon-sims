name: Issue 1844 Source Bound Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-1844-legacy-vessel-next-turn'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge current production main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply confirmed issue 1844 patch
        run: python scripts/apply_issue_1844.py

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Run focused delayed Vessel regressions
        run: ctest --test-dir build -R regidrago_issue_1844_legacy_vessel_next_turn_tests --output-on-failure

      - name: Simulate pass 1 exact seed 314159
        shell: bash
        run: |
          set -euo pipefail
          # Legacy Star, Earthen Vessel, and strict-JIT payload route:
          # https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sv4-163 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/me2pt5-152
          # Confirmed issue: https://github.com/FlareZ123/pokemon-sims/issues/1844
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 314159 --require-ready-by 3 | tee issue-1844-pass-1.txt
          grep -F 'Earthen Vessel' issue-1844-pass-1.txt
          grep -F 'T3 | READY' issue-1844-pass-1.txt

      - name: Simulate pass 2 independent shell route
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee issue-1844-pass-2.txt
          grep -F 'T2 | READY' issue-1844-pass-2.txt

      - name: Simulate pass 3 preserve Pineco route
        shell: bash
        run: |
          set -euo pipefail
          # Dawn and Secret Box regression: https://api.pokemontcg.io/v2/cards/me2-87 https://api.pokemontcg.io/v2/cards/sv6-163
          # Completed issue: https://github.com/FlareZ123/pokemon-sims/issues/1839
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 1618033 --require-ready-by 2 | tee issue-1844-pass-3.txt
          grep -F 'T2 | READY' issue-1844-pass-3.txt

      - name: Regenerate source-bound matrices and reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Run complete Release suite
        run: ctest --test-dir build --output-on-failure

      - name: Configure, build, and run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DREGIDRAGO_ENABLE_SANITIZERS=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure

      - name: Generate final T2 T3 matrix summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path('results/multi_deck_comparison.csv').open(encoding='utf-8')))
          output = Path('issue-1844-t2-t3-matrix.txt')
          with output.open('w', encoding='utf-8') as handle:
              handle.write('deck,scenario,T2,T3\n')
              for row in rows:
                  handle.write(','.join([row['deck'], row['scenario'], row['ready_by_t2_pct'], row['ready_by_t3_pct']]) + '\n')
          PY
          cat issue-1844-t2-t3-matrix.txt

      - name: Upload exact source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-1844-source-bound-${{ github.run_attempt }}
          path: |
            issue-1844-pass-*.txt
            issue-1844-t2-t3-matrix.txt
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: error

      - name: Commit exact validated source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git add src/trace_engine_v2/part_013_legacy_star_override.inc tests/issue_1844_legacy_vessel_next_turn_tests.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/simulation_results.csv results/baseline_manifest.json results/traces results/multi_deck_comparison.csv results/multi_deck_manifest.json results/multi_deck_traces
          git rm -f scripts/apply_issue_1844.py .github/workflows/issue-1844-source-bound.yml
          git commit -m "Recover delayed Earthen Vessel route for #1844"
          git push origin HEAD:${{ github.head_ref }}
