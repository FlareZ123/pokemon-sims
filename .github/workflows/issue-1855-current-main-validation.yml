name: Issue 1855 Source-Bound Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1855-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Regenerate source-bound shell baseline
        shell: bash
        run: |
          set -euo pipefail
          # Canonical fixed-seed matrix procedure: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-canonical-shell-baseline
          # Serena optional discards: https://api.pokemontcg.io/v2/cards/swsh12-164
          # Permanent Item-lock contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#full-item-lock
          # Dynamic DCI contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1855
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired all-condition baseline
        shell: bash
        run: |
          set -euo pipefail
          # Paired 32-condition procedure: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          # Registered Pineco ALS: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Validate exact regression and complete Release suite
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -R regidrago_issue_1855_serena_full_item_lock_tests --output-on-failure
          ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit refreshed evidence and remove one-shot workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/issue-1855-current-main-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REPORT.md docs/MULTI_DECK_REPORT.md results/baseline_manifest.json results/multi_deck_comparison.csv results/multi_deck_manifest.json results/simulation_results.csv results/traces results/multi_deck_traces .github/workflows/issue-1855-current-main-validation.yml
          git diff --cached --check
          git commit -m "Refresh issue 1855 source-bound setup evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
