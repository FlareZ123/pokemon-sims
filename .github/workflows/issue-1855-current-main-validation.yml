name: Issue 1855 Current Main Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: issue-1855-current-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-bound-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Run focused issue 1855 regressions
        run: ctest --test-dir build -R regidrago_issue_1855_serena_full_item_lock_tests --output-on-failure
      - name: Reproduce fixed seed 206 route
        shell: bash
        run: |
          set -euo pipefail
          # Serena permits one to three discards before drawing until five: https://api.pokemontcg.io/v2/cards/swsh12-164
          # Permanent full Item lock makes every remaining Item unusable: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#full-item-lock
          # Dynamic DCI contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1855
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-full-item-lock/go-second --seed 206 | tee issue-1855-seed-206.txt
          test "$(grep -c 'T2 | DISCARD |.*Serena' issue-1855-seed-206.txt)" -eq 3
          grep -q 'Mysterious Treasure (Serena chosen discard)' issue-1855-seed-206.txt
          grep -q 'Earthen Vessel (Serena optional discard)' issue-1855-seed-206.txt
          test "$(grep -c 'Mysterious Treasure (Serena optional discard)' issue-1855-seed-206.txt)" -eq 1
      - name: Preserve selector and paid-retreat boundaries
        shell: bash
        run: |
          set -euo pipefail
          # Existing selector boundary and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Regidrago V Celestial Roar: https://api.pokemontcg.io/v2/cards/swsh12-135
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-full-item-lock/go-second --seed 375 --require-ready-by 2 | tee issue-1855-selector-boundary-seed-375.txt
          # Tapu Lele-GX has a one-Energy Retreat Cost: https://api.pokemontcg.io/v2/cards/sm2-60
          # Registered paid-retreat route: https://github.com/FlareZ123/pokemon-sims/issues/1845
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-combined-lock/go-first --seed 271828 --require-ready-by 5 | tee issue-1855-banked-tapu-seed-271828.txt
          grep -q 'future paid Retreat' issue-1855-banked-tapu-seed-271828.txt
          grep -q 'banked one-Energy Retreat Cost' issue-1855-banked-tapu-seed-271828.txt
          grep -q 'T5 | READY' issue-1855-banked-tapu-seed-271828.txt
      - name: Simulate pass 1 shell strict JIT
        shell: bash
        run: |
          set -euo pipefail
          # Ready-state and current-turn JIT contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          # Official turn procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee simulate-pass-1.txt
      - name: Simulate pass 2 shell matchup-flex JIT
        shell: bash
        run: |
          set -euo pipefail
          # Apex Dragon requires GGF and a Dragon attack in discard: https://api.pokemontcg.io/v2/cards/swsh12-136
          # Matchup-flex current-turn JIT contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee simulate-pass-2.txt
      - name: Simulate pass 3 registered Pineco route
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco ALS: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # Pineco and Forretress ex: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee simulate-pass-3.txt
      - name: Generate canonical 100000-trial matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out issue-1855-t2-t3-matrix.csv
      - name: Generate paired all-condition 100000-trial matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out issue-1855-multi-deck-matrix.csv
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Record exact tested source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=source-snapshot.zip HEAD
      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1855-current-main-${{ github.run_attempt }}
          path: |
            issue-1855-*.txt
            simulate-pass-*.txt
            issue-1855-t2-t3-matrix.csv
            issue-1855-multi-deck-matrix.csv
            tested-head.txt
            source-snapshot.zip
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
          if-no-files-found: error
