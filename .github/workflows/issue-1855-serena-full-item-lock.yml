name: Issue 1855 Serena Full Item Lock

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-1855-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-bound-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Focused issue 1855 regressions
        run: ctest --test-dir build -R regidrago_issue_1855_serena_full_item_lock_tests --output-on-failure
      - name: Reproduce fixed issue 1855 route
        shell: bash
        run: |
          set -euo pipefail
          # Serena may discard one to three cards before drawing until the hand has five:
          # https://api.pokemontcg.io/v2/cards/swsh12-164
          # Full Item lock is permanent for all modeled turns, so locked Items have DCI 1:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#full-item-lock
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1855
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-full-item-lock/go-second --seed 206 | tee issue-1855-seed-206.txt
          test "$(grep -c 'T2 | DISCARD |.*Serena' issue-1855-seed-206.txt)" -eq 3
          grep -q 'Mysterious Treasure (Serena chosen discard)' issue-1855-seed-206.txt
          grep -q 'Earthen Vessel (Serena optional discard)' issue-1855-seed-206.txt
          test "$(grep -c 'Mysterious Treasure (Serena optional discard)' issue-1855-seed-206.txt)" -eq 1
      - name: Preserve Serena selector boundary
        shell: bash
        run: |
          set -euo pipefail
          # Issue 1855 changes optional Serena costs after the existing selector
          # accepts the play. It must preserve the established seed-375 T2 route:
          # Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
          # Regidrago V / Celestial Roar: https://api.pokemontcg.io/v2/cards/swsh12-135
          # Earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Confirmed bug scope: https://github.com/FlareZ123/pokemon-sims/issues/1855
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-full-item-lock/go-second --seed 375 --require-ready-by 2 | tee issue-1855-selector-boundary-seed-375.txt
      - name: Preserve banked Tapu retreat route
        shell: bash
        run: |
          set -euo pipefail
          # Combined-lock seed 271828 has already banked Tapu's printed Retreat
          # Cost and follows the registered diagnostic T5 Regidrago route:
          # Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
          # Regidrago V / VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136
          # Paid-Retreat route specification: https://github.com/FlareZ123/pokemon-sims/issues/1845
          # Confirmed optional-discard bug: https://github.com/FlareZ123/pokemon-sims/issues/1855
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-combined-lock/go-first --seed 271828 --require-ready-by 5 | tee issue-1855-banked-tapu-seed-271828.txt
          grep -q 'future paid Retreat' issue-1855-banked-tapu-seed-271828.txt
          grep -q 'banked one-Energy Retreat Cost' issue-1855-banked-tapu-seed-271828.txt
          grep -q 'T5 | READY' issue-1855-banked-tapu-seed-271828.txt
      - name: Simulate pass 1
        shell: bash
        run: |
          set -euo pipefail
          # K0/K1, strict-JIT, and earliest-route policy:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee simulate-pass-1.txt
      - name: Simulate pass 2
        shell: bash
        run: |
          set -euo pipefail
          # Regidrago VSTAR requires GGF and a Dragon attack in discard for Apex Dragon:
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee simulate-pass-2.txt
      - name: Simulate pass 3
        shell: bash
        run: |
          set -euo pipefail
          # Registered Pineco route policy and direct card sources:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#secret-box-and-pineco-route-policy
          # https://api.pokemontcg.io/v2/cards/sv4pt5-1
          # https://api.pokemontcg.io/v2/cards/sv4pt5-2
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee simulate-pass-3.txt
      - name: Regenerate canonical 100000-trial outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir generated-results --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir generated-results --trials 100000 --matrix-seed 20260705
          cp -a generated-results/. results/
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --output-on-failure
      - name: Commit tested outputs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-1855-serena-full-item-lock.yml
          git add -A results docs README.md .github/workflows
          git commit -m "Update setup matrices for #1855"
          git push origin HEAD:${{ github.head_ref }}
      - name: Archive exact committed source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-head.txt
          git archive --format=zip --output=source-snapshot.zip HEAD
      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1855-source-bound-${{ github.run_attempt }}
          path: |
            issue-1855-seed-206.txt
            issue-1855-selector-boundary-seed-375.txt
            issue-1855-banked-tapu-seed-271828.txt
            simulate-pass-*.txt
            generated-results
            README.md
            docs/REPORT.md
            docs/TRACE_AUDIT.md
            docs/MULTI_DECK_REPORT.md
            tested-head.txt
            source-snapshot.zip
          if-no-files-found: error
