name: Issue 1866 Source-Bound Validation

on:
  pull_request:
    branches: [fix/issue-1866-vessel-burnet-final-energy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-1866-source-bound-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Simulate final-Grass T3 witness
        shell: bash
        run: |
          set -euo pipefail
          # Earthen Vessel, Professor Burnet, and Regidrago VSTAR:
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Confirmed regression: https://github.com/FlareZ123/pokemon-sims/issues/1866
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 40 --require-ready-by 3 | tee issue-1866-seed-40.txt
          grep -q "T3 | DISCARD.*Quick Ball (Earthen Vessel cost)" issue-1866-seed-40.txt
          grep -q "searched Grass Energy for the held Professor Burnet finish" issue-1866-seed-40.txt
          grep -q "T3 | PLAY SUPPORTER.*R-BURNET-01" issue-1866-seed-40.txt
          grep -q "T3 | READY" issue-1866-seed-40.txt
      - name: Simulate final-Fire T3 witness
        shell: bash
        run: |
          set -euo pipefail
          # Earthen Vessel, Professor Burnet, Guzma, and Regidrago VSTAR:
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # https://api.pokemontcg.io/v2/cards/sm3-115
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Dynamic DCI: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
          # Confirmed regression: https://github.com/FlareZ123/pokemon-sims/issues/1866
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 138 --require-ready-by 3 | tee issue-1866-seed-138.txt
          grep -q "T3 | DISCARD.*Guzma (Earthen Vessel cost)" issue-1866-seed-138.txt
          grep -q "searched Fire Energy for the held Professor Burnet finish" issue-1866-seed-138.txt
          grep -q "T3 | PLAY SUPPORTER.*R-BURNET-01" issue-1866-seed-138.txt
          grep -q "T3 | READY" issue-1866-seed-138.txt
      - name: Simulate later final-Grass T4 witness
        shell: bash
        run: |
          set -euo pipefail
          # Earthen Vessel, Professor Burnet, Erika's Invitation, and Regidrago VSTAR:
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # https://api.pokemontcg.io/v2/cards/sv3pt5-160
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # Confirmed regression: https://github.com/FlareZ123/pokemon-sims/issues/1866
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 398 --require-ready-by 4 | tee issue-1866-seed-398.txt
          grep -q "T4 | DISCARD.*Erika's Invitation (Earthen Vessel cost)" issue-1866-seed-398.txt
          grep -q "searched Grass Energy for the held Professor Burnet finish" issue-1866-seed-398.txt
          grep -q "T4 | PLAY SUPPORTER.*R-BURNET-01" issue-1866-seed-398.txt
          grep -q "T4 | READY" issue-1866-seed-398.txt
      - name: Run focused route regressions
        run: |
          ./build/regidrago_unified_tests issue_1646_dead_quick_ball_vessel_tests
          ./build/regidrago_unified_tests issue_1009_steven_zero_energy_latias_vessel_tests
          ./build/regidrago_unified_tests issue_1868_vessel_payload_dci_tests
      - name: Regenerate canonical shell evidence
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir generated-results --trials 100000 --matrix-seed 20260705
      - name: Regenerate paired deck evidence
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir generated-results --trials 100000 --matrix-seed 20260705
      - name: Materialize generated reports
        shell: bash
        run: |
          set -euo pipefail
          cp -a generated-results/. results/
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Record tested source and policy digest
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee issue-1866-tested-head.txt
          python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))" | tee issue-1866-policy-digest.txt
          git archive --format=zip --output=issue-1866-source-snapshot.zip HEAD
      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1866-source-bound-${{ github.run_attempt }}
          path: |
            issue-1866-seed-*.txt
            issue-1866-tested-head.txt
            issue-1866-policy-digest.txt
            issue-1866-source-snapshot.zip
            generated-results
            results
            docs/REPORT.md
            docs/TRACE_AUDIT.md
            docs/MULTI_DECK_REPORT.md
            README.md
            build/regidrago_sim
            build/regidrago_unified_tests
            build/Testing
          if-no-files-found: warn
