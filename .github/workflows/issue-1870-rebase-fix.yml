name: Rebase issue 1870 fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1870-rebase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/issue-1870-wonder-tag-crispin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply validated source and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/trace_engine_v2/part_007.inc')
          source = source_path.read_text()
          anchor = '''    // Wonder Tag is resolving after legal deck inspection. A known prized
              // immediate Pokemon axis, or final attachable Basic Energy, makes Gladion
              // the fastest Supporter line.
              const bool prized_regi = need_regi() && deck_count_after_search_started(Card::RegidragoV) == 0 &&
          '''
          replacement = '''    // A same-turn strict-JIT payload plus Crispin's final Energy completion
              // outranks Gladion's one-Prize exchange. Quick Ball has already paid the
              // Dragon payload cost, Wonder Tag has established K1, and Crispin can supply
              // the last Energy without consuming a later turn:
              // Quick Ball: https://api.pokemontcg.io/v2/cards/swsh1-179
              // Tapu Lele-GX / Wonder Tag: https://api.pokemontcg.io/v2/cards/sm2-60
              // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
              // Gladion: https://api.pokemontcg.io/v2/cards/sm4-95
              // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
              // Official Supporter, Item, search, discard, and attachment procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
              // K1, supporter contention, strict-JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
              // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1870
              const bool crispin_finishes_current_turn_prized_energy_route =
                  strict_payload_timing() && supporter_allowed() && active_is_vstar() &&
                  payload_ready() && final_prized_energy_for_gladion().has_value() &&
                  crispin_can_advance_energy_axis() &&
                  deck_count_after_search_started(Card::Crispin) > 0;
              if (crispin_finishes_current_turn_prized_energy_route) return Card::Crispin;

              // Wonder Tag is resolving after legal deck inspection. A known prized
              // immediate Pokemon axis, or final attachable Basic Energy, makes Gladion
              // the fastest Supporter line when no current-turn Crispin completion exists.
              const bool prized_regi = need_regi() && deck_count_after_search_started(Card::RegidragoV) == 0 &&
          '''
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one selector anchor, found {source.count(anchor)}')
          source_path.write_text(source.replace(anchor, replacement))

          test = r'''#define REGIDRAGO_SIM_NO_MAIN
          #include "../src/regidrago_sim.cpp"

          #include <stdexcept>
          #include <utility>

          namespace sim {

          struct EngineTestAccess {
            static void set_state(Engine& engine, State state) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = true;
              engine.prizes_revealed_ = true;
            }
            static Card choose_supporter(Engine& engine) {
              return engine.choose_supporter_after_search_started();
            }
          };

          }  // namespace sim

          namespace {

          sim::State exact_state() {
            sim::State state;
            state.turn = 3;
            state.active = sim::Pokemon{sim::Card::RegidragoVstar, 1, 1, 1,
                                        sim::Tool::ForestSealStone};
            state.hand = {sim::Card::ProfessorBurnet};
            state.deck = {sim::Card::Crispin, sim::Card::Grass, sim::Card::Fire,
                          sim::Card::Gladion};
            state.prizes = {sim::Card::Grass, sim::Card::Oricorio};
            state.discard = {sim::Card::QuickBall, sim::Card::MegaDragonite};
            state.discarded_this_turn = {sim::Card::QuickBall,
                                         sim::Card::MegaDragonite};
            return state;
          }

          sim::Card selected_supporter(sim::State state,
                                       const sim::DciProfile dci =
                                           sim::DciProfile::StrictJit) {
            const sim::Scenario scenario{"issue-1870", dci, sim::LockMode::None,
                                         true, 5};
            const sim::DeckRecipe recipe = sim::baseline_recipe();
            std::mt19937_64 rng{1870};
            sim::Engine engine(scenario, recipe, rng);
            sim::EngineTestAccess::set_state(engine, std::move(state));
            return sim::EngineTestAccess::choose_supporter(engine);
          }

          void test_crispin_preempts_final_prized_energy_gladion() {
            // Quick Ball has already discarded Mega Dragonite ex this turn. Wonder Tag
            // must choose Crispin to complete GGF now instead of Gladion for a Prize card:
            // https://api.pokemontcg.io/v2/cards/swsh1-179
            // https://api.pokemontcg.io/v2/cards/sm2-60
            // https://api.pokemontcg.io/v2/cards/sv7-133
            // https://api.pokemontcg.io/v2/cards/sm4-95
            // https://api.pokemontcg.io/v2/cards/swsh12-136
            // https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
            // https://github.com/FlareZ123/pokemon-sims/issues/1870
            if (selected_supporter(exact_state()) != sim::Card::Crispin) {
              throw std::runtime_error(
                  "Crispin must preempt Gladion for the current-turn GGF finish.");
            }
          }

          void test_absent_crispin_preserves_gladion_fallback() {
            sim::State state = exact_state();
            state.deck = {sim::Card::Grass, sim::Card::Fire, sim::Card::Gladion};
            if (selected_supporter(std::move(state)) != sim::Card::Gladion) {
              throw std::runtime_error(
                  "Gladion must remain the fallback when Crispin is absent.");
            }
          }

          void test_non_strict_profile_preserves_gladion_priority() {
            if (selected_supporter(exact_state(), sim::DciProfile::NoDiscardControl) !=
                sim::Card::Gladion) {
              throw std::runtime_error(
                  "The issue-1870 override must remain strict-JIT specific.");
            }
          }

          void test_non_vstar_state_preserves_gladion_priority() {
            sim::State state = exact_state();
            state.active = sim::Pokemon{sim::Card::RegidragoV, 1, 1, 1,
                                        sim::Tool::ForestSealStone};
            state.hand.push_back(sim::Card::RegidragoVstar);
            if (selected_supporter(std::move(state)) != sim::Card::Gladion) {
              throw std::runtime_error(
                  "The narrow override must require an already Active VSTAR.");
            }
          }

          void test_spent_supporter_preserves_gladion_priority() {
            sim::State state = exact_state();
            state.supporter_used = true;
            // Only one Supporter may be played each turn, so Crispin cannot complete the
            // current-turn route once the Supporter action is spent:
            // https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
            // https://api.pokemontcg.io/v2/cards/sv7-133
            // https://github.com/FlareZ123/pokemon-sims/issues/1870
            if (selected_supporter(std::move(state)) != sim::Card::Gladion) {
              throw std::runtime_error(
                  "The override must require an unused Supporter action.");
            }
          }

          }  // namespace

          int main() {
            // Fixed-seed 100,000-trial shell and Pineco coverage for every documented
            // T2/T3 condition is source-bound beside this regression:
            // https://github.com/FlareZ123/pokemon-sims/blob/main/results/simulation_results.csv
            // https://github.com/FlareZ123/pokemon-sims/blob/main/results/multi_deck_comparison.csv
            test_crispin_preempts_final_prized_energy_gladion();
            test_absent_crispin_preserves_gladion_fallback();
            test_non_strict_profile_preserves_gladion_priority();
            test_non_vstar_state_preserves_gladion_priority();
            test_spent_supporter_preserves_gladion_priority();
            return 0;
          }
          '''
          lines = test.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('tests/issue_1870_wonder_tag_crispin_tests.cpp').write_text(normalized)
          Path('.github/workflows/issue-1870-rebase-fix.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_007.inc tests/issue_1870_wonder_tag_crispin_tests.cpp .github/workflows/issue-1870-rebase-fix.yml
          git commit -m "Rebase Wonder Tag Crispin fix onto issue 1866"
          git push origin HEAD:${{ github.head_ref }}
