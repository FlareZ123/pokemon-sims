name: Sync rebased issue 1870 reports

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'fix/issue-1870-wonder-tag-crispin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write paired matrix and source-bound reports
        shell: bash
        env:
          MULTI_GZIP_BASE64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path.cwd()
          multi = gzip.decompress(base64.b64decode(os.environ['MULTI_GZIP_BASE64']))
          (root / 'results' / 'multi_deck_comparison.csv').write_bytes(multi)
          digest = simulator_policy_source_digest(root)

          baseline_path = root / 'results' / 'baseline_manifest.json'
          baseline = json.loads(baseline_path.read_text())
          baseline['simulator_policy_source_sha256'] = digest
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n')

          multi_path = root / 'results' / 'multi_deck_manifest.json'
          manifest = json.loads(multi_path.read_text())
          manifest['simulator_policy_source_sha256'] = digest
          manifest['comparison_csv_sha256'] = hashlib.sha256(multi).hexdigest()
          multi_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          rm .github/workflows/issue-1870-sync-rebased-reports.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/simulation_results.csv results/multi_deck_comparison.csv results/baseline_manifest.json results/multi_deck_manifest.json docs/REPORT.md docs/TRACE_AUDIT.md docs/MULTI_DECK_REPORT.md README.md .github/workflows/issue-1870-sync-rebased-reports.yml
          git commit -m "Sync rebased issue 1870 source-bound reports"
          git push origin HEAD:${{ github.head_ref }}
