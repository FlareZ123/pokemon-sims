name: Sync rebased issue 1870 shell matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'fix/issue-1870-wonder-tag-crispin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Write source-bound shell matrix
        shell: bash
        env:
          SHELL_GZIP_BASE64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path
          Path('results/simulation_results.csv').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['SHELL_GZIP_BASE64'])))
          Path('.github/workflows/issue-1870-sync-shell.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/simulation_results.csv .github/workflows/issue-1870-sync-shell.yml
          git commit -m "Sync rebased issue 1870 shell matrix"
          git push origin HEAD:${{ github.head_ref }}
