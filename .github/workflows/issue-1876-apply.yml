name: Apply issue 1876 patch

on:
  push:
    branches:
      - fix/issue-1876-treasure-payload-cost

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1876-treasure-payload-cost
      - name: Apply focused fix and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/trace_engine_v2/part_issue_1436_full_supporter_dci_override.inc')
          text = source.read_text(encoding='utf-8')
          anchor = '''      const bool allow_redundant_payload = false) const {
            const auto ordinary = choose_discard_issue1436_original(
          '''
          replacement = '''      const bool allow_redundant_payload = false) const {
            const bool issue_1876_treasure_payload_finish =
                excluded_from_cost == Card::MysteriousTreasure &&
                scenario_.dci == DciProfile::MatchupFlexJit && deck_seen_ &&
                !item_locked() && supporter_allowed() && active_is_vstar() &&
                state_.active->grass == 1 && state_.active->fire == 1 &&
                need_payload() && hand_count(Card::Crispin) > 0 &&
                crispin_can_advance_energy_axis() &&
                std::any_of(state_.deck.begin(), state_.deck.end(),
                            is_dragon_or_psychic);
            if (issue_1876_treasure_payload_finish) {
              // Mysterious Treasure may discard any card. In this public K1 GF state,
              // held Crispin attaches the missing Grass, so a visible Dragon is DCI 1
              // because this exact cost creates the current-turn Apex Dragon payload.
              // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
              // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
              // Dialga-GX and Dragapult ex: https://api.pokemontcg.io/v2/cards/sm5-100 https://api.pokemontcg.io/v2/cards/sv6-130
              // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
              // Official Item, discard, search, Supporter, and attachment procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
              // K1, dynamic DCI/JIT, supporter contention, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
              // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1876
              for (const Card card : {Card::Appletun, Card::MegaDragonite,
                                      Card::Dragapult, Card::GoodraVstar,
                                      Card::DialgaGX}) {
                if (hand_count(card) > 0) return card;
              }
            }

            const auto ordinary = choose_discard_issue1436_original(
          '''
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('issue-1876 source anchor missing')
              source.write_text(text.replace(anchor, replacement), encoding='utf-8')

          test = r'''#define REGIDRAGO_SIM_NO_MAIN
          #include "../src/regidrago_sim.cpp"

          #include <algorithm>
          #include <iostream>
          #include <random>
          #include <stdexcept>
          #include <string>
          #include <utility>

          namespace sim {
          struct EngineTestAccess {
            static void set_state(Engine& engine, State state, const bool deck_seen = true) {
              engine.state_ = std::move(state);
              engine.deck_seen_ = deck_seen;
            }
            static std::optional<Card> treasure_cost(const Engine& engine) {
              return engine.choose_discard(false, true, true, Card::MysteriousTreasure);
            }
          };
          }  // namespace sim

          namespace {
          void expect(const bool condition, const char* message) {
            if (!condition) throw std::runtime_error(message);
          }

          bool trace_contains(const sim::TraceLog& trace, const std::string& text) {
            return std::any_of(trace.lines.begin(), trace.lines.end(),
                               [&text](const std::string& line) {
                                 return line.find(text) != std::string::npos;
                               });
          }

          sim::State route_state() {
            sim::State state;
            state.turn = 3;
            state.active = sim::Pokemon{sim::Card::RegidragoVstar, 1, 1, 1};
            state.hand = {sim::Card::Dragapult, sim::Card::Klara,
                          sim::Card::Crispin, sim::Card::MysteriousTreasure};
            state.deck = {sim::Card::Grass, sim::Card::Fire,
                          sim::Card::TapuLeleGX, sim::Card::RegidragoV};
            return state;
          }

          sim::Scenario flex(const sim::LockMode lock = sim::LockMode::None) {
            return sim::Scenario{"issue-1876", sim::DciProfile::MatchupFlexJit,
                                 lock, true, 5};
          }

          sim::Engine make_engine(const sim::Scenario& scenario, std::mt19937_64& rng,
                                  sim::State state, const bool deck_seen = true) {
            static const sim::DeckRecipe recipe = sim::baseline_recipe();
            sim::Engine engine(scenario, recipe, rng);
            sim::EngineTestAccess::set_state(engine, std::move(state), deck_seen);
            return engine;
          }

          void test_exact_cost_and_boundaries() {
            std::mt19937_64 rng(1876);
            sim::Engine engine = make_engine(flex(), rng, route_state());

            // The visible Dragon supplies the same-turn Apex Dragon payload while held
            // Crispin attaches the missing Grass. Klara retains its recovery role.
            // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
            // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133
            // Dragapult ex: https://api.pokemontcg.io/v2/cards/sv6-130
            // Klara: https://api.pokemontcg.io/v2/cards/swsh6-145
            // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
            // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1876
            expect(sim::EngineTestAccess::treasure_cost(engine) == sim::Card::Dragapult,
                   "The exact K1 GF state did not select the Dragon payload.");

            sim::State no_crispin = route_state();
            no_crispin.hand.erase(std::find(no_crispin.hand.begin(), no_crispin.hand.end(),
                                            sim::Card::Crispin));
            sim::Engine missing = make_engine(flex(), rng, std::move(no_crispin));
            expect(sim::EngineTestAccess::treasure_cost(missing) != sim::Card::Dragapult,
                   "Missing Crispin still admitted the payload cost.");

            sim::Engine strict = make_engine(
                sim::Scenario{"strict", sim::DciProfile::StrictJit,
                              sim::LockMode::None, true, 5},
                rng, route_state());
            expect(sim::EngineTestAccess::treasure_cost(strict) != sim::Card::Dragapult,
                   "Strict JIT admitted the matchup-flex cost.");

            sim::Engine locked = make_engine(flex(sim::LockMode::FullItem), rng,
                                             route_state());
            expect(sim::EngineTestAccess::treasure_cost(locked) != sim::Card::Dragapult,
                   "Item lock admitted the Treasure-specific cost.");

            sim::Engine k0 = make_engine(flex(), rng, route_state(), false);
            expect(sim::EngineTestAccess::treasure_cost(k0) != sim::Card::Dragapult,
                   "K0 admitted the K1-only cost override.");
          }

          void test_registered_seed_444_reaches_t3() {
            const auto scenario = sim::scenario_by_label("matchup-flex-jit/go-first");
            const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
            expect(scenario.has_value() && deck != nullptr,
                   "The registered issue-1876 fixture is unavailable.");

            std::mt19937_64 rng(444);
            sim::TraceLog trace{true, {}};
            sim::Engine engine(*scenario, deck->recipe, rng, &trace);
            const sim::TrialOutcome outcome = engine.run();

            expect(outcome.first_ready_turn == 3,
                   "Seed 444 did not reach matchup-flex readiness on T3.");
            expect(trace_contains(trace, "Dragapult ex (Mysterious Treasure cost)") ||
                       trace_contains(trace, "Dialga-GX (Mysterious Treasure cost)"),
                   "Seed 444 did not spend a visible Dragon payload.");
            expect(!trace_contains(trace, "Klara (Mysterious Treasure cost)"),
                   "Seed 444 still discarded Klara.");
          }
          }  // namespace

          int main() {
            try {
              test_exact_cost_and_boundaries();
              test_registered_seed_444_reaches_t3();
              std::cout << "Issue 1876 Treasure payload cost tests passed\n";
              return 0;
            } catch (const std::exception& error) {
              std::cerr << error.what() << '\n';
              return 1;
            }
          }
          '''
          lines = test.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('tests/issue_1876_treasure_payload_cost_tests.cpp').write_text(normalized, encoding='utf-8')
          PY
      - name: Validate focused regression
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_unified_tests --parallel 2
          ./build/regidrago_unified_tests issue_1876_treasure_payload_cost_tests
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_issue_1436_full_supporter_dci_override.inc tests/issue_1876_treasure_payload_cost_tests.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prefer Dragon payload for issue 1876 Treasure cost"
          git push origin HEAD:fix/issue-1876-treasure-payload-cost
