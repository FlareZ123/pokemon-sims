name: Issue 2154 Matrix Refresh

on:
  pull_request:

permissions:
  actions: read
  contents: write

# This branch-scoped workflow imports the exact-source artifact generated by the
# successful validation run, revalidates its digests, commits the outputs, and
# removes itself from the final branch:
# https://github.com/FlareZ123/pokemon-sims/actions/runs/30728190555
# https://github.com/FlareZ123/pokemon-sims/issues/2154
jobs:
  refresh:
    if: github.head_ref == 'fix/2154-tate-switch-burnet-route'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download verified exact-source outputs
        uses: actions/download-artifact@v4
        with:
          name: issue-2154-source-bound-outputs-1
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/pokemon-sims
          run-id: 30728190555
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revalidate imported evidence
        run: |
          python tests/source_anchor_contract_tests.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          source_digest = simulator_policy_source_digest(root)
          baseline = json.loads((root / 'results/baseline_manifest.json').read_text())
          paired = json.loads((root / 'results/multi_deck_manifest.json').read_text())
          if baseline['simulator_policy_source_sha256'] != source_digest:
              raise SystemExit('baseline source digest mismatch')
          if paired['simulator_policy_source_sha256'] != source_digest:
              raise SystemExit('paired source digest mismatch')
          comparison_digest = hashlib.sha256(
              (root / 'results/multi_deck_comparison.csv').read_bytes()
          ).hexdigest()
          if paired['comparison_csv_sha256'] != comparison_digest:
              raise SystemExit('paired CSV digest mismatch')
          PY
      - name: Commit verified outputs and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-2154-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A docs/REPORT.md docs/MULTI_DECK_REPORT.md results .github/workflows/issue-2154-refresh.yml
          git diff --cached --check
          git commit -m "Refresh source-bound matrices for issue #2154"
          git push origin "HEAD:${{ github.head_ref }}"
