name: Issue 2158 Source-Bound Refresh

on:
  pull_request:

permissions:
  contents: write

# This branch-scoped workflow applies the reviewable include-chain patch, validates
# the exact source, regenerates source-bound evidence, commits it, and removes itself:
# https://github.com/FlareZ123/pokemon-sims/issues/2158
jobs:
  refresh:
    if: github.head_ref == 'fix/2158-paid-oricorio-retreat-burnet'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install final attachment override atomically
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          path = Path('src/regidrago_sim.cpp')
          old = '''#include "trace_engine_v2/part_discard_recovery_provenance_override.inc"
          #include "trace_engine_v2/part_tate_blender_attachment_override.inc"
          #include "trace_engine_v2/part_tate_blender_tate_override.inc"'''.replace('          ', '')
          new = '''#include "trace_engine_v2/part_discard_recovery_provenance_override.inc"
          // Preserve the complete attachment policy as the fallback, then place the
          // confirmed paid-Oricorio-retreat route at the final attachment boundary:
          // https://github.com/FlareZ123/pokemon-sims/issues/2158
          #define attach_manual attach_manual_issue2158_original
          #include "trace_engine_v2/part_tate_blender_attachment_override.inc"
          #undef attach_manual
          #include "trace_engine_v2/part_issue_2158_paid_oricorio_retreat_override.inc"
          #include "trace_engine_v2/part_tate_blender_tate_override.inc"'''.replace('          ', '')
          source = path.read_text(encoding='utf-8')
          if source.count(old) != 1:
              raise SystemExit('Expected one attachment include block')
          updated = source.replace(old, new)
          with tempfile.NamedTemporaryFile(
              mode='w', encoding='utf-8', dir=path.parent,
              prefix=path.name + '.', suffix='.tmp', delete=False
          ) as handle:
              handle.write(updated)
              temporary = Path(handle.name)
          os.replace(temporary, path)
          PY
      - name: Build exact Release source
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run focused and complete tests
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Run three reviewed simulate-this audits
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 150 --require-ready-by 3 | tee trace-150.txt
          grep -q 'T3 | ATTACH.*immediate Retreat Cost' trace-150.txt
          grep -q 'T3 | RETREAT.*before Professor Burnet' trace-150.txt
          grep -q 'T3 | PLAY SUPPORTER.*Searched and discarded' trace-150.txt
          grep -q 'T3 | READY' trace-150.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-1.txt
          grep -q 'T2 | READY' trace-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 3 | tee trace-2.txt
          grep -q 'T3 | READY' trace-2.txt
      - name: Regenerate canonical shell evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired deck evidence
        run: |
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Validate generated evidence
        run: |
          python tests/source_anchor_contract_tests.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          source_digest = simulator_policy_source_digest(root)
          baseline = json.loads((root / 'results/baseline_manifest.json').read_text())
          paired = json.loads((root / 'results/multi_deck_manifest.json').read_text())
          if baseline['simulator_policy_source_sha256'] != source_digest:
              raise SystemExit('baseline source digest mismatch')
          if paired['simulator_policy_source_sha256'] != source_digest:
              raise SystemExit('paired source digest mismatch')
          comparison_digest = hashlib.sha256(
              (root / 'results/multi_deck_comparison.csv').read_bytes()
          ).hexdigest()
          if paired['comparison_csv_sha256'] != comparison_digest:
              raise SystemExit('paired CSV digest mismatch')
          PY
          git diff --check
      - name: Upload reviewed traces and matrices
        uses: actions/upload-artifact@v4
        with:
          name: issue-2158-source-bound-evidence-${{ github.run_attempt }}
          path: |
            trace-150.txt
            trace-1.txt
            trace-2.txt
            results/simulation_results.csv
            results/baseline_manifest.json
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: error
      - name: Commit verified source and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-2158-source-bound-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/regidrago_sim.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results .github/workflows/issue-2158-source-bound-refresh.yml
          git diff --cached --check
          git commit -m "Refresh source-bound evidence for issue #2158"
          git push origin "HEAD:${{ github.head_ref }}"
