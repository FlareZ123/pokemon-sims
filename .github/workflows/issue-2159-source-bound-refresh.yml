name: Issue 2159 Source-Bound Refresh

on:
  pull_request:

permissions:
  contents: write

# This branch-scoped workflow validates the exact deadline fix, regenerates all
# source-bound probability evidence, commits it, and removes itself:
# https://github.com/FlareZ123/pokemon-sims/issues/2159
jobs:
  refresh:
    if: github.head_ref == 'fix/2159-t4-t5-tate-burnet-deadline'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exact Release source
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run focused deadline regressions
        run: ctest --test-dir build -R issue_2159 --output-on-failure
      - name: Run three reviewed simulate-this audits
        shell: bash
        run: |
          set -euo pipefail

          # Confirm the reported T4 state no longer spends Tate & Liza on a route
          # whose Professor Burnet continuation can finish only on diagnostic T5.
          # Independent legal diagnostic recovery remains permitted:
          # https://github.com/FlareZ123/pokemon-sims/issues/2159
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2244 | tee trace-2244.txt
          if grep -q 'T4 | PLAY SUPPORTER.*Tate & Liza switch mode' trace-2244.txt; then
            echo 'Expired T4 Tate projection remained selectable' >&2
            exit 1
          fi

          # Preserve the legal T3 switch into T4 Burnet route. Item lock does not
          # prohibit either Supporter, and T4 is still inside the setup deadline:
          # Tate & Liza: https://api.pokemontcg.io/v2/cards/sm7-148
          # Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
          # Official turn and Trainer procedure: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository model: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#turn-2-item-lock
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-turn2-item-lock/go-second --seed 392 --require-ready-by 4 | tee trace-392.txt
          grep -q 'T3 | PLAY SUPPORTER.*Tate & Liza switch mode' trace-392.txt
          grep -q 'T4 | PLAY SUPPORTER.*Searched and discarded' trace-392.txt
          grep -q 'T4 | READY' trace-392.txt

          # Independent early-setup control guards unrelated T2 routing while the
          # deadline policy changes:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#ready-state-and-t5-policy
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee trace-1.txt
          grep -q 'T2 | READY' trace-1.txt
      - name: Regenerate canonical shell evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          mkdir -p results/setup-untruncated
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out results/setup-untruncated/t2-t3-matrix.csv
          python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired deck evidence
        run: |
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete artifact-dependent suite
        shell: bash
        run: |
          # The legacy simtest runtime inventory is generated outside this branch's
          # source-bound refresh. Permanent CI validates it on the final evidence
          # commit, while every source, trace, matrix, provenance, and docs test runs here.
          ctest --test-dir build --parallel 4 --output-on-failure -E audit_simtests
      - name: Validate generated evidence
        run: |
          python tests/source_anchor_contract_tests.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          source_digest = simulator_policy_source_digest(root)
          baseline = json.loads((root / 'results/baseline_manifest.json').read_text())
          paired = json.loads((root / 'results/multi_deck_manifest.json').read_text())
          if baseline['simulator_policy_source_sha256'] != source_digest:
              raise SystemExit('baseline source digest mismatch')
          if paired['simulator_policy_source_sha256'] != source_digest:
              raise SystemExit('paired source digest mismatch')
          comparison_digest = hashlib.sha256(
              (root / 'results/multi_deck_comparison.csv').read_bytes()
          ).hexdigest()
          if paired['comparison_csv_sha256'] != comparison_digest:
              raise SystemExit('paired CSV digest mismatch')
          PY
          git diff --check
      - name: Upload reviewed executable, traces, and matrices
        uses: actions/upload-artifact@v4
        with:
          name: issue-2159-source-bound-evidence-${{ github.run_attempt }}
          path: |
            build/regidrago_sim
            trace-2244.txt
            trace-392.txt
            trace-1.txt
            results/simulation_results.csv
            results/setup-untruncated/t2-t3-matrix.csv
            results/baseline_manifest.json
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
          if-no-files-found: error
      - name: Commit verified evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-2159-source-bound-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A docs/REPORT.md docs/MULTI_DECK_REPORT.md results .github/workflows/issue-2159-source-bound-refresh.yml
          git diff --cached --check
          git commit -m "Refresh source-bound evidence for issue #2159"
          git push origin "HEAD:${{ github.head_ref }}"
