name: Bootstrap issue 2269 fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/2269-treasure-latias-blender-oricorio-surplus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply focused source and regression changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fcntl
          import os
          import tempfile

          def atomic_locked_write(path: Path, text: str) -> None:
              lock_path = path.with_suffix(path.suffix + '.lock')
              with lock_path.open('w', encoding='utf-8') as lock:
                  fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                  with tempfile.NamedTemporaryFile('w', encoding='utf-8', dir=path.parent, delete=False) as tmp:
                      tmp.write(text)
                      tmp.flush()
                      os.fsync(tmp.fileno())
                      tmp_path = Path(tmp.name)
                  os.replace(tmp_path, path)
                  fcntl.flock(lock.fileno(), fcntl.LOCK_UN)
              lock_path.unlink(missing_ok=True)

          source_path = Path('src/trace_engine_v2/part_014c_latias_bench_override.inc')
          source = source_path.read_text(encoding='utf-8')

          old_active = '''      !need_active_vstar() || !need_payload() || state_.retreat_used ||
      !state_.active || state_.active->card != Card::TapuLeleGX ||
      bench_space() == 0 ||'''
          new_active = '''      !need_active_vstar() || !need_payload() || state_.retreat_used ||
      !state_.active ||
      // Skyliner removes Retreat Cost from every Basic Pokemon in play, so the
      // completed route applies to Basic Oricorio as well as Tapu Lele-GX:
      // Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76
      // Oricorio GRI 55: https://api.pokemontcg.io/v2/cards/sm2-55
      // Confirmed regression: https://github.com/FlareZ123/pokemon-sims/issues/2269
      !is_basic(state_.active->card) ||
      bench_space() == 0 ||'''
          if source.count(old_active) != 1:
              raise SystemExit('issue-2269 Active gate anchor did not match exactly once')
          source = source.replace(old_active, new_active, 1)

          old_cost = '''  auto cost = choose_discard(false, true, true, Card::MysteriousTreasure);
  if (!cost) cost = quick_ball_final_surplus_energy_cost();
  if (!cost) return false;
'''
          new_cost = '''  auto cost = choose_discard(false, true, true, Card::MysteriousTreasure);
  if (!cost) cost = quick_ball_final_surplus_energy_cost();
  // At this point the selected Regidrago VSTAR is already GGF, K1 proves a deck
  // payload for the held Brilliant Blender, and Skyliner supplies a free retreat.
  // A remaining Basic Energy is therefore route-conditioned Treasure fuel after
  // all ordinary lower-DCI costs have been preferred by choose_discard().
  // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
  // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
  // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Dynamic DCI and K1 policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
  // Confirmed regression: https://github.com/FlareZ123/pokemon-sims/issues/2269
  if (!cost && hand_count(Card::Grass) > 0) cost = Card::Grass;
  if (!cost && hand_count(Card::Fire) > 0) cost = Card::Fire;
  if (!cost) return false;
'''
          if source.count(old_cost) != 1:
              raise SystemExit('issue-2269 cost anchor did not match exactly once')
          source = source.replace(old_cost, new_cost, 1)
          atomic_locked_write(source_path, source)

          test_path = Path('tests/issue_2269_treasure_latias_blender_oricorio_tests.cpp')
          test = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <cstdint>
#include <iostream>
#include <random>
#include <stdexcept>
#include <string>

namespace sim {
struct EngineTestAccess {};
}  // namespace sim

namespace {
void expect(const bool condition, const char* message) {
  if (!condition) throw std::runtime_error(message);
}

bool trace_contains(const sim::TraceLog& trace, const std::string& text) {
  for (const std::string& line : trace.lines) {
    if (line.find(text) != std::string::npos) return true;
  }
  return false;
}

sim::TraceLog run_trace(const char* scenario_label, const std::uint64_t seed) {
  const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
  const auto scenario = sim::scenario_by_label(scenario_label);
  expect(deck != nullptr && scenario.has_value(),
         "The registered issue-2269 fixture is unavailable.");

  std::mt19937_64 rng(seed);
  sim::TraceLog trace{true, {}};
  sim::Engine engine(*scenario, deck->recipe, rng, &trace);
  engine.run();
  return trace;
}

void test_seed_761_uses_surplus_fire_for_basic_oricorio_t4_finish() {
  const sim::TraceLog trace = run_trace("strict-jit/go-second", 761);

  // The selected Benched Regidrago VSTAR is already GGF. Mysterious Treasure may
  // spend the setup-surplus Fire, search Basic Psychic Latias ex, and Bench it;
  // held Brilliant Blender then supplies the current-turn Dragon payload from the
  // K1-known deck, while Skyliner gives Basic Oricorio a zero Retreat Cost.
  // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
  // Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76
  // Oricorio GRI 55: https://api.pokemontcg.io/v2/cards/sm2-55
  // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
  // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Official Item, search, discard, Ability, and retreat procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
  // K1, strict-JIT, DCI, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
  // Confirmed regression: https://github.com/FlareZ123/pokemon-sims/issues/2269
  expect(trace_contains(trace, "T4 | DISCARD") &&
             trace_contains(trace, "Fire Energy (Mysterious Treasure issue-1533 Latias route cost)"),
         "Seed 761 did not spend the route-proven surplus Fire through Mysterious Treasure on T4.");
  expect(trace_contains(trace, "T4 | PLAY ITEM") &&
             trace_contains(trace, "Brilliant Blender"),
         "Seed 761 did not resolve the independent Brilliant Blender payload outlet on T4.");
  expect(trace_contains(trace, "T4 | RETREAT") &&
             trace_contains(trace, "Oricorio"),
         "Seed 761 did not use Skyliner to promote the ready Regidrago VSTAR on T4.");
  expect(trace_contains(trace, "T4 | READY"),
         "Seed 761 did not reach strict-JIT readiness on T4.");
}

void test_seed_761_route_stays_closed_under_rulebox_ability_lock() {
  const sim::TraceLog trace =
      run_trace("strict-jit-rulebox-ability-lock/go-second", 761);

  // Rule Box Ability lock suppresses Latias ex's Skyliner, so the issue-2269 free
  // promotion graph must stay unavailable even when Treasure and Energy exist.
  // Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76
  // Official Ability procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
  // Lock model contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
  // Confirmed regression scope: https://github.com/FlareZ123/pokemon-sims/issues/2269
  expect(!trace_contains(trace,
                         "Mysterious Treasure issue-1533 Latias route cost"),
         "Issue-2269 route bypassed Rule Box Ability lock.");
  expect(!trace_contains(trace, "T4 | READY"),
         "Issue-2269 locked control incorrectly reached T4 readiness.");
}

void test_seed_761_route_stays_closed_under_turn_two_item_lock() {
  const sim::TraceLog trace =
      run_trace("strict-jit-turn2-item-lock/go-second", 761);

  // A turn-two Item lock forbids Mysterious Treasure and Brilliant Blender on T4,
  // so the corrected route cannot bypass the repository's lock schedule.
  // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
  // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
  // Official Item procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
  // Lock model contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md
  // Confirmed regression scope: https://github.com/FlareZ123/pokemon-sims/issues/2269
  expect(!trace_contains(trace,
                         "Mysterious Treasure issue-1533 Latias route cost"),
         "Issue-2269 route bypassed Item lock.");
  expect(!trace_contains(trace, "T4 | READY"),
         "Issue-2269 Item-lock control incorrectly reached T4 readiness.");
}
}  // namespace

int main() {
  try {
    test_seed_761_uses_surplus_fire_for_basic_oricorio_t4_finish();
    test_seed_761_route_stays_closed_under_rulebox_ability_lock();
    test_seed_761_route_stays_closed_under_turn_two_item_lock();
    std::cout << "Issue 2269 Treasure/Latias/Blender Oricorio tests passed\n";
    return 0;
  } catch (const std::exception& error) {
    std::cerr << error.what() << '\n';
    return 1;
  }
}
'''
          atomic_locked_write(test_path, test)

          workflow = Path('.github/workflows/issue-2269-bootstrap.yml')
          workflow.unlink()
          PY
      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "pokemon-sims-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_014c_latias_bench_override.inc tests/issue_2269_treasure_latias_blender_oricorio_tests.cpp .github/workflows/issue-2269-bootstrap.yml
          git commit -m "Fix #2269 Treasure-Latias-Blender Oricorio route"
          git push origin HEAD:${{ github.head_ref }}
