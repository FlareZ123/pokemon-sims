name: Issue 2295 current-main materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-2295-reclaim-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/2295-reclaim-20260809-1757'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2295-reclaim-20260809-1757
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Materialize source and regressions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          def atomic_write(path: Path, text: str) -> None:
              fd, temp_name = tempfile.mkstemp(prefix=f'.{path.name}.', dir=path.parent)
              try:
                  with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as handle:
                      handle.write(text)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temp_name, path)
              except BaseException:
                  try:
                      os.unlink(temp_name)
                  except FileNotFoundError:
                      pass
                  raise

          source = Path('src/trace_engine_v2/part_014c_latias_bench_override.inc')
          text = source.read_text(encoding='utf-8')
          marker = '  bool resolve_final_promotion_and_attachment() {\n'
          helper = r'''  bool complete_paid_one_cost_basic_retreat_with_held_blender() {
    if (scenario_.dci != DciProfile::StrictJit || item_locked() ||
        !prizes_known() || !need_active_vstar() || need_energy() ||
        !need_payload() || state_.retreat_used || state_.manual_energy_used ||
        !state_.active || !is_basic(state_.active->card) ||
        retreat_cost(state_.active->card) != 1 ||
        hand_count(Card::BrilliantBlender) == 0 ||
        !payload_might_be_in_deck() || !can_play_payload_this_turn()) {
      return false;
    }

    Pokemon* target = best_benched_vstar_for_promotion();
    if (target == nullptr || !pays_apex_energy_cost(*target)) return false;
    const std::size_t target_index =
        static_cast<std::size_t>(target - state_.bench.data());

    const Card payment = hand_count(Card::Grass) > 0 ? Card::Grass : Card::Fire;
    if (hand_count(payment) == 0) return false;

    // The two route channels are independently payable: one held Basic Energy pays
    // the printed one-Energy Retreat Cost, while held Brilliant Blender can supply
    // a K1-known deck Dragon after the ready Regidrago VSTAR is promoted. Preflight
    // the complete post-retreat Item policy on a copy before spending real mobility.
    // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Official attachment, retreat, Item, and attack procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
    // K1, strict-JIT, and earliest-route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
    // Dynamic DCI: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2295
    Engine projected = *this;
    if (!remove_one(projected.state_.hand, payment)) return false;
    if (payment == Card::Grass) ++projected.state_.active->grass;
    else ++projected.state_.active->fire;
    projected.state_.manual_energy_used = true;
    if (payment == Card::Grass) --projected.state_.active->grass;
    else --projected.state_.active->fire;
    projected.state_.discard.push_back(payment);
    std::swap(*projected.state_.active, projected.state_.bench[target_index]);
    projected.state_.retreat_used = true;
    if (!projected.play_brilliant_blender()) return false;

    if (!remove_one(state_.hand, payment)) return false;
    // retreat_cost() is the repository's printed-cost metadata, so this resolver is
    // semantic across modeled one-cost Basics instead of hardcoding the two seeds.
    // Oricorio GRI 55: https://api.pokemontcg.io/v2/cards/sm2-55
    // Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
    // Crobat V: https://api.pokemontcg.io/v2/cards/swsh3-104
    // Mawile-GX: https://api.pokemontcg.io/v2/cards/sm11-141
    // Printed retreat metadata: https://github.com/FlareZ123/pokemon-sims/blob/main/src/trace_engine_v2/part_001.inc
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2295
    if (payment == Card::Grass) ++state_.active->grass;
    else ++state_.active->fire;
    state_.manual_energy_used = true;
    trace("ATTACH", "R-GAME-ENERGY",
          std::string(name(payment)) + " manually to " +
              std::string(name(state_.active->card)) + " for its Retreat Cost.");

    if (payment == Card::Grass) --state_.active->grass;
    else --state_.active->fire;
    state_.discard.push_back(payment);
    std::swap(*state_.active, state_.bench[target_index]);
    state_.retreat_used = true;
    trace("RETREAT", "R-GAME-RETREAT",
          "Paid the one-Energy Basic Active Retreat Cost and promoted the "
          "Apex-ready Regidrago VSTAR.");

    if (!play_brilliant_blender()) {
      throw std::logic_error("Issue-2295 Blender preflight diverged during execution");
    }
    return active_is_vstar() && !need_energy() && !need_payload();
  }

'''
          if 'complete_paid_one_cost_basic_retreat_with_held_blender()' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('final-promotion anchor changed')
              text = text.replace(marker, helper + marker, 1)

          hook = '''    if (benched_vstar_promotion_ready() &&\n        retreat_to_benched_vstar_with_latias()) {\n      return true;\n    }\n    if (pay_tapu_retreat_to_ready_benched_vstar()) return true;\n'''
          hooked = '''    if (benched_vstar_promotion_ready() &&\n        retreat_to_benched_vstar_with_latias()) {\n      return true;\n    }\n    // Keep a live Skyliner promotion first because it spends no Energy. If free\n    // retreat is unavailable, compose the independent one-Energy mobility channel\n    // with the held Blender strict-JIT payload channel before Supporter selection.\n    // Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76\n    // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164\n    // Earliest complete route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities\n    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2295\n    if (complete_paid_one_cost_basic_retreat_with_held_blender()) return true;\n    if (pay_tapu_retreat_to_ready_benched_vstar()) return true;\n'''
          if 'if (complete_paid_one_cost_basic_retreat_with_held_blender()) return true;' not in text:
              if text.count(hook) != 1:
                  raise SystemExit('final-promotion hook anchor changed')
              text = text.replace(hook, hooked, 1)
          atomic_write(source, text)

          test = Path('tests/issue_2295_paid_retreat_blender_tests.cpp')
          test_text = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <algorithm>
#include <iostream>
#include <random>
#include <stdexcept>
#include <utility>

namespace sim {
struct EngineTestAccess {
  static void set_state(Engine& engine, State state, const bool deck_seen = true,
                        const bool prizes_revealed = true) {
    engine.state_ = std::move(state);
    engine.deck_seen_ = deck_seen;
    engine.prizes_revealed_ = prizes_revealed;
  }
  static const State& state(const Engine& engine) { return engine.state_; }
  static bool complete_paid_retreat_blender(Engine& engine) {
    return engine.complete_paid_one_cost_basic_retreat_with_held_blender();
  }
};
}  // namespace sim

namespace {
void expect(const bool condition, const char* message) {
  if (!condition) throw std::runtime_error(message);
}

bool contains(const std::vector<sim::Card>& cards, const sim::Card card) {
  return std::find(cards.begin(), cards.end(), card) != cards.end();
}

sim::State route_state(const sim::Card active_card) {
  sim::State state;
  state.turn = 4;
  state.active = sim::Pokemon{active_card, 1, 0, 0, sim::Tool::None};
  state.bench.push_back(sim::Pokemon{sim::Card::RegidragoVstar, 1, 2, 1,
                                     sim::Tool::None});
  state.hand = {sim::Card::BrilliantBlender, sim::Card::Grass};
  state.deck = {sim::Card::Dragapult, sim::Card::Fire};
  return state;
}

void expect_success(const sim::Card active_card, const std::uint64_t seed) {
  const sim::Scenario scenario{"issue-2295-success", sim::DciProfile::StrictJit,
                               sim::LockMode::None, true, 4};
  std::mt19937_64 rng{seed};
  sim::Engine engine(scenario, sim::baseline_recipe(), rng);
  sim::EngineTestAccess::set_state(engine, route_state(active_card));

  // A one-cost Basic may spend one held Basic Energy on retreat while Blender
  // independently supplies the current-turn K1 deck payload after promotion.
  // Oricorio: https://api.pokemontcg.io/v2/cards/sm2-55
  // Tapu Lele-GX: https://api.pokemontcg.io/v2/cards/sm2-60
  // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
  // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Official retreat/attachment/Item procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2295
  expect(sim::EngineTestAccess::complete_paid_retreat_blender(engine),
         "paid-retreat plus Blender route should complete");
  const auto& result = sim::EngineTestAccess::state(engine);
  expect(result.active && result.active->card == sim::Card::RegidragoVstar,
         "ready Regidrago VSTAR should be Active");
  expect(result.retreat_used && result.manual_energy_used,
         "route should spend one retreat and one manual attachment");
  expect(contains(result.discard, sim::Card::BrilliantBlender) &&
             contains(result.discard, sim::Card::Dragapult),
         "Blender should establish the strict-JIT Dragon payload");
}

void test_held_payload_without_live_hand_outlet_does_not_block_blender() {
  const sim::Scenario scenario{"issue-2295-held-payload", sim::DciProfile::StrictJit,
                               sim::LockMode::None, true, 4};
  std::mt19937_64 rng{229586};
  sim::Engine engine(scenario, sim::baseline_recipe(), rng);
  auto state = route_state(sim::Card::TapuLeleGX);
  state.hand.push_back(sim::Card::MegaDragonite);
  state.hand.push_back(sim::Card::FieldBlower);
  sim::EngineTestAccess::set_state(engine, std::move(state));

  // A held Dragon does not itself put a payload in discard. With no legal held
  // discard connector, Blender remains the live independent payload channel.
  // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
  // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Dynamic DCI: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
  // Confirmed seed-86 boundary: https://github.com/FlareZ123/pokemon-sims/issues/2295
  expect(sim::EngineTestAccess::complete_paid_retreat_blender(engine),
         "held Dragon without a discard outlet must not suppress Blender");
}

void test_rejection_boundaries() {
  {
    const sim::Scenario scenario{"issue-2295-k0", sim::DciProfile::StrictJit,
                                 sim::LockMode::None, true, 4};
    std::mt19937_64 rng{1};
    sim::Engine engine(scenario, sim::baseline_recipe(), rng);
    sim::EngineTestAccess::set_state(engine, route_state(sim::Card::TapuLeleGX),
                                     false, false);
    // K0 cannot prove a deck payload for a deck-searching ACE SPEC.
    // K0/K1 policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2295
    expect(!sim::EngineTestAccess::complete_paid_retreat_blender(engine),
           "K0 must reject the deck-payload route");
  }
  {
    const sim::Scenario scenario{"issue-2295-cost2", sim::DciProfile::StrictJit,
                                 sim::LockMode::None, true, 4};
    std::mt19937_64 rng{2};
    sim::Engine engine(scenario, sim::baseline_recipe(), rng);
    sim::EngineTestAccess::set_state(engine, route_state(sim::Card::Pineco));
    // Pineco's printed Retreat Cost is two, so one Basic Energy cannot pay it.
    // Pineco: https://api.pokemontcg.io/v2/cards/sv4pt5-1
    // Official retreat procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
    // Confirmed bug boundary: https://github.com/FlareZ123/pokemon-sims/issues/2295
    expect(!sim::EngineTestAccess::complete_paid_retreat_blender(engine),
           "two-cost Basic must reject one-Energy route");
  }
  {
    const sim::Scenario scenario{"issue-2295-spent-attach", sim::DciProfile::StrictJit,
                                 sim::LockMode::None, true, 4};
    std::mt19937_64 rng{3};
    sim::Engine engine(scenario, sim::baseline_recipe(), rng);
    auto state = route_state(sim::Card::Oricorio);
    state.manual_energy_used = true;
    sim::EngineTestAccess::set_state(engine, std::move(state));
    // Only one manual Energy attachment is permitted per turn.
    // Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
    // Confirmed bug boundary: https://github.com/FlareZ123/pokemon-sims/issues/2295
    expect(!sim::EngineTestAccess::complete_paid_retreat_blender(engine),
           "spent attachment must reject paid-retreat route");
  }
  {
    const sim::Scenario scenario{"issue-2295-energy-incomplete", sim::DciProfile::StrictJit,
                                 sim::LockMode::None, true, 4};
    std::mt19937_64 rng{4};
    sim::Engine engine(scenario, sim::baseline_recipe(), rng);
    auto state = route_state(sim::Card::Oricorio);
    state.bench.front().fire = 0;
    sim::EngineTestAccess::set_state(engine, std::move(state));
    // The retreat attachment cannot also repair a GGF-incomplete attacker.
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Confirmed bug boundary: https://github.com/FlareZ123/pokemon-sims/issues/2295
    expect(!sim::EngineTestAccess::complete_paid_retreat_blender(engine),
           "energy-incomplete VSTAR must reject mobility spend");
  }
}
}  // namespace

int main() {
  try {
    expect_success(sim::Card::Oricorio, 229529);
    expect_success(sim::Card::TapuLeleGX, 229586);
    test_held_payload_without_live_hand_outlet_does_not_block_blender();
    test_rejection_boundaries();
    std::cout << "Issue 2295 paid-retreat Blender tests passed\n";
    return 0;
  } catch (const std::exception& error) {
    std::cerr << error.what() << '\n';
    return 1;
  }
}
