          def atomic_write(path: Path, text: str) -> None:
              fd, temp_name = tempfile.mkstemp(prefix=f'.{path.name}.', dir=path.parent)
              try:
                  with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as handle:
                      handle.write(text)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temp_name, path)
              except BaseException:
                  try:
                      os.unlink(temp_name)
                  except FileNotFoundError:
                      pass
                  raise

          production = Path('src/trace_engine_v2/part_014b.inc')
          text = production.read_text(encoding='utf-8')
          marker = '    // Exact Serena text: discard up to 3 cards, but "You must discard at least 1 card."\n'
          block = '''    // In a payload-only strict-JIT state, a K1-known Burnet route reaches the same\n    // ready turn as Serena while preserving Serena and the held Dragon. Require the\n    // existing route planner to prove Burnet live, and keep Item outlets higher\n    // priority because they preserve the Supporter play itself.\n    // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26\n    // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164\n    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Official Supporter and deck-search procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf\n    // K1 and resource priority: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities\n    // State-dependent DCI: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation\n    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2408\n    const bool burnet_preserves_serena_and_held_payload =\n        scenario_.dci == DciProfile::StrictJit && prizes_known() &&\n        need_payload() && !need_regi() && !need_vstar() && !need_energy() &&\n        !need_active_vstar() && hand_count(Card::ProfessorBurnet) > 0 &&\n        hand_count(Card::Serena) > 0 &&\n        std::any_of(state_.hand.begin(), state_.hand.end(), is_payload) &&\n        professor_burnet_has_live_ready_turn_route() &&\n        !has_live_blender_payload_line() &&\n        !has_live_one_discard_hand_payload_line() &&\n        !has_live_ultra_ball_hand_payload_line();\n    if (burnet_preserves_serena_and_held_payload && play_professor_burnet()) return;\n\n'''
          if 'burnet_preserves_serena_and_held_payload' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Serena choose_supporter anchor changed')
              text = text.replace(marker, block + marker, 1)
              atomic_write(production, text)

          issue1341 = Path('tests/issue_1341_burnet_held_payload_tests.cpp')
          text = issue1341.read_text(encoding='utf-8')
          old_access = '''  static void set_state(Engine& engine, State state) {\n    engine.state_ = std::move(state);\n    engine.deck_seen_ = true;\n  }'''
          new_access = '''  static void set_state(Engine& engine, State state, const bool deck_seen = true) {\n    engine.state_ = std::move(state);\n    engine.deck_seen_ = deck_seen;\n  }'''
          if old_access in text:
              text = text.replace(old_access, new_access, 1)
          start = text.index('void test_serena_uses_held_payload_instead_of_burnet() {')
          end = text.index('void test_no_held_payload_preserves_burnet_route() {', start)
          k0 = '''void test_k0_serena_uses_held_payload_instead_of_burnet() {\n  const sim::Scenario scenario{"issue-1341-serena-outlet",\n                               sim::DciProfile::StrictJit,\n                               sim::LockMode::None, false, 4};\n  std::mt19937_64 rng{1343};\n  const auto recipe = sim::baseline_recipe();\n  sim::Engine engine(scenario, recipe, rng);\n  sim::State state;\n  state.turn = 2;\n  state.active = sim::Pokemon{sim::Card::RegidragoVstar, 1, 2, 1,\n                              sim::Tool::None};\n  state.hand = {sim::Card::ProfessorBurnet, sim::Card::Serena,\n                sim::Card::MegaDragonite, sim::Card::Grass};\n  state.deck = {sim::Card::TapuLeleGX, sim::Card::RegidragoV,\n                sim::Card::Dragapult, sim::Card::DialgaGX,\n                sim::Card::Fire, sim::Card::Grass};\n  sim::EngineTestAccess::set_state(engine, std::move(state), false);\n\n  // K0 has no legal deck inspection, so it cannot assume Burnet has a Dragon target.\n  // Serena has an observable held Dragon and remains the deterministic completion.\n  // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164\n  // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26\n  // K0/K1 policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states\n  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2408\n  sim::EngineTestAccess::choose_supporter(engine);\n  const sim::State& result = sim::EngineTestAccess::state(engine);\n  expect(result.supporter_used, "Serena must use the Supporter play in K0.");\n  expect(contains(result.discard, sim::Card::Serena),\n         "K0 must keep the observable Serena route.");\n  expect(contains(result.discard, sim::Card::MegaDragonite),\n         "K0 Serena must discard the held Dragon payload.");\n  expect(!contains(result.discard, sim::Card::ProfessorBurnet),\n         "K0 must not assume a Burnet deck target.");\n}\n\n'''
          text = text[:start] + k0 + text[end:]
          text = text.replace('    test_serena_uses_held_payload_instead_of_burnet();\n',
                              '    test_k0_serena_uses_held_payload_instead_of_burnet();\n', 1)
          atomic_write(issue1341, text)

          issue2091 = Path('tests/issue_2091_prize_k1_issue_1341_burnet_held_payload_tests.cpp')
          text = issue2091.read_text(encoding='utf-8')
          start = text.index('void test_serena_uses_held_payload_instead_of_burnet() {')
          end = text.index('void test_no_held_payload_preserves_burnet_route() {', start)
          k1 = '''void test_k1_burnet_preserves_serena_and_held_payload() {\n  const sim::Scenario scenario{"issue-1341-serena-outlet",\n                               sim::DciProfile::StrictJit,\n                               sim::LockMode::None, false, 4};\n  std::mt19937_64 rng{1343};\n  const auto recipe = sim::baseline_recipe();\n  sim::Engine engine(scenario, recipe, rng);\n  sim::State state;\n  state.turn = 2;\n  state.active = sim::Pokemon{sim::Card::RegidragoVstar, 1, 2, 1,\n                              sim::Tool::None};\n  state.hand = {sim::Card::ProfessorBurnet, sim::Card::Serena,\n                sim::Card::MegaDragonite, sim::Card::Grass};\n  state.deck = {sim::Card::TapuLeleGX, sim::Card::RegidragoV,\n                sim::Card::Dragapult, sim::Card::DialgaGX,\n                sim::Card::Fire, sim::Card::Grass};\n  sim::EngineTestAccess::set_state(engine, std::move(state));\n\n  // Prize inspection is K1 here. Burnet can discard known deck Dragons while Serena\n  // and the held Dragon stay available after the same-turn payload completion.\n  // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26\n  // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164\n  // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n  // Official Supporter/search procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf\n  // K1/resource policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities\n  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2408\n  sim::EngineTestAccess::choose_supporter(engine);\n  const sim::State& result = sim::EngineTestAccess::state(engine);\n  expect(result.supporter_used, "Professor Burnet must use the Supporter play.");\n  expect(contains(result.discard, sim::Card::ProfessorBurnet),\n         "Prize-derived K1 must prefer Professor Burnet.");\n  expect(contains(result.hand, sim::Card::Serena) &&\n             !contains(result.discard, sim::Card::Serena),\n         "Serena must remain held after the K1 Burnet route.");\n  expect(contains(result.hand, sim::Card::MegaDragonite) &&\n             !contains(result.discard, sim::Card::MegaDragonite),\n         "The held Dragon must remain held after the K1 Burnet route.");\n  expect(contains(result.discard, sim::Card::Dragapult) &&\n             contains(result.discard, sim::Card::DialgaGX),\n         "Burnet must discard the K1-known deck payloads.");\n}\n\n'''
          text = text[:start] + k1 + text[end:]
          text = text.replace('    test_serena_uses_held_payload_instead_of_burnet();\n',
                              '    test_k1_burnet_preserves_serena_and_held_payload();\n', 1)
          atomic_write(issue2091, text)

          issue2408 = Path('tests/issue_2408_burnet_before_serena_tests.cpp')
          issue2408_text = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <algorithm>
#include <iostream>
#include <random>
#include <stdexcept>
#include <utility>

namespace sim {
struct EngineTestAccess {
  static void set_state(Engine& engine, State state, const bool deck_seen,
                        const bool prizes_revealed) {
    engine.state_ = std::move(state);
    engine.deck_seen_ = deck_seen;
    engine.prizes_revealed_ = prizes_revealed;
  }
  static const State& state(const Engine& engine) { return engine.state_; }
  static void choose_supporter(Engine& engine) { engine.choose_supporter(); }
};
}  // namespace sim

namespace {
bool contains(const std::vector<sim::Card>& cards, const sim::Card card) {
  return std::find(cards.begin(), cards.end(), card) != cards.end();
}
void expect(const bool condition, const char* message) {
  if (!condition) throw std::runtime_error(message);
}

sim::State payload_only_state() {
  sim::State state;
  state.turn = 2;
  state.active = sim::Pokemon{sim::Card::RegidragoVstar, 1, 2, 1,
                              sim::Tool::None};
  state.hand = {sim::Card::ProfessorBurnet, sim::Card::Serena,
                sim::Card::MegaDragonite, sim::Card::Grass};
  state.deck = {sim::Card::TapuLeleGX, sim::Card::RegidragoV,
                sim::Card::Dragapult, sim::Card::DialgaGX,
                sim::Card::Fire, sim::Card::Grass};
  return state;
}

void test_k1_prefers_burnet_for_equal_turn_payload_completion() {
  const sim::Scenario scenario{"issue-2408-k1", sim::DciProfile::StrictJit,
                               sim::LockMode::None, false, 4};
  std::mt19937_64 rng{2408};
  sim::Engine engine(scenario, sim::baseline_recipe(), rng);
  sim::EngineTestAccess::set_state(engine, payload_only_state(), true, true);

  // K1 proves deck-resident Dragon payloads. Burnet and Serena both complete the
  // sole strict-JIT payload axis this turn, and Burnet preserves the flexible Serena
  // plus the held Dragon for later routes.
  // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
  // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
  // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Official Supporter/search procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
  // K1/resource policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2408
  sim::EngineTestAccess::choose_supporter(engine);
  const sim::State& result = sim::EngineTestAccess::state(engine);
  expect(contains(result.discard, sim::Card::ProfessorBurnet),
         "K1 equal-turn payload completion failed to prefer Burnet.");
  expect(contains(result.hand, sim::Card::Serena),
         "K1 Burnet route failed to preserve Serena.");
  expect(contains(result.hand, sim::Card::MegaDragonite),
         "K1 Burnet route failed to preserve held Dragon payload.");
}

void test_k0_keeps_observable_serena_route() {
  const sim::Scenario scenario{"issue-2408-k0", sim::DciProfile::StrictJit,
                               sim::LockMode::None, false, 4};
  std::mt19937_64 rng{2409};
  sim::Engine engine(scenario, sim::baseline_recipe(), rng);
  sim::EngineTestAccess::set_state(engine, payload_only_state(), false, false);

  // K0 cannot infer a deck-resident Dragon for Burnet. Serena has a public held
  // Dragon route, so the K1 optimization stays disabled.
  // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
  // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
  // K0/K1 policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2408
  sim::EngineTestAccess::choose_supporter(engine);
  const sim::State& result = sim::EngineTestAccess::state(engine);
  expect(contains(result.discard, sim::Card::Serena),
         "K0 incorrectly assumed a Burnet deck payload.");
  expect(contains(result.discard, sim::Card::MegaDragonite),
         "K0 Serena route failed to use the observable held payload.");
}
}  // namespace

int main() {
  try {
    test_k1_prefers_burnet_for_equal_turn_payload_completion();
    test_k0_keeps_observable_serena_route();
    std::cout << "Issue 2408 Burnet-before-Serena tests passed\n";
    return 0;
  } catch (const std::exception& error) {
    std::cerr << error.what() << '\n';
    return 1;
  }
}
'''
          atomic_write(issue2408, issue2408_text)

