name: Issue 2426 bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2426-arven-dde-energy-semantics
      - name: Apply source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fcntl
          import os
          import tempfile

          def atomic_locked_write(path: Path, text: str) -> None:
              lock_path = path.with_name(path.name + '.lock')
              with lock_path.open('w', encoding='utf-8') as lock:
                  fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                  with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8', newline='\n', dir=path.parent, delete=False) as tmp:
                      tmp.write(text)
                      tmp.flush()
                      os.fsync(tmp.fileno())
                      tmp_path = Path(tmp.name)
                  os.replace(tmp_path, path)
                  fcntl.flock(lock.fileno(), fcntl.LOCK_UN)
              lock_path.unlink(missing_ok=True)

          def replace_once(path_str: str, old: str, new: str, label: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              atomic_locked_write(path, text.replace(old, new, 1))

          replace_once(
              'src/trace_engine_v2/part_004.inc',
              '''  bool attach_energy_card(Pokemon& pokemon, const Card energy) const {\n    if (energy == Card::Grass) { ++pokemon.grass; return true; }\n    if (energy == Card::Fire) { ++pokemon.fire; return true; }\n    if (energy == Card::DoubleDragonEnergy && is_dragon(pokemon.card)) {\n      ++pokemon.double_dragon;\n      return true;\n    }\n    return false;\n  }\n\n  template <typename Available>\n  std::optional<Card> preferred_manual_energy_for(\n''',
              '''  bool attach_energy_card(Pokemon& pokemon, const Card energy) const {\n    if (energy == Card::Grass) { ++pokemon.grass; return true; }\n    if (energy == Card::Fire) { ++pokemon.fire; return true; }\n    if (energy == Card::DoubleDragonEnergy && is_dragon(pokemon.card)) {\n      ++pokemon.double_dragon;\n      return true;\n    }\n    return false;\n  }\n\n  template <typename Available>\n  std::optional<Card> completing_basic_attachment_for_apex(\n      const Pokemon& target, Available available) const {\n    if (pays_apex_energy_cost(target)) return std::nullopt;\n    // DDE makes Grass and Fire alternative one-card finishes rather than additive\n    // physical deficits. Project each legal Basic attachment and accept only one\n    // that actually pays Apex Dragon after the attachment:\n    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Repository DDE contract: https://github.com/FlareZ123/pokemon-sims/issues/2238\n    // Arven regression: https://github.com/FlareZ123/pokemon-sims/issues/2426\n    for (const Card basic : {Card::Grass, Card::Fire}) {\n      if (!available(basic)) continue;\n      Pokemon projected = target;\n      if (attach_energy_card(projected, basic) && pays_apex_energy_cost(projected)) {\n        return basic;\n      }\n    }\n    return std::nullopt;\n  }\n\n  template <typename Available>\n  std::optional<Card> preferred_manual_energy_for(\n''',
              'shared one-Basic completion helper')

          replace_once(
              'src/trace_engine_v2/part_012.inc',
              '''    const bool final_energy_vessel_dead_role_cost =\n      scenario_.dci == DciProfile::NoDiscardControl &&\n      !state_.manual_energy_used && state_.active &&\n      state_.active->card == Card::RegidragoVstar && !need_payload() &&\n      grass_needed() + fire_needed() == 1 &&\n      ((grass_needed() == 1 && might_be_unseen(Card::Grass)) ||\n       (fire_needed() == 1 && might_be_unseen(Card::Fire))) &&\n      (hand_count(Card::QuickBall) > 0 ||\n       hand_count(Card::StevensResolve) > 0 ||\n       hand_count(Card::LatiasEx) > 0 ||\n       hand_count(Card::Gladion) > 0);\n''',
              '''    const bool final_energy_vessel_has_searchable_basic = state_.active &&\n      completing_basic_attachment_for_apex(\n          *state_.active, [this](const Card basic) {\n            return might_be_unseen(basic);\n          }).has_value();\n    // One DDE with no Basic attached is one physical Basic attachment from Apex.\n    // Grass/Fire are alternative finishes, so do not add typed helper deficits:\n    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163\n    // Refined bug: https://github.com/FlareZ123/pokemon-sims/issues/2426\n    const bool final_energy_vessel_dead_role_cost =\n      scenario_.dci == DciProfile::NoDiscardControl &&\n      !state_.manual_energy_used && state_.active &&\n      state_.active->card == Card::RegidragoVstar && !need_payload() &&\n      final_energy_vessel_has_searchable_basic &&\n      (hand_count(Card::QuickBall) > 0 ||\n       hand_count(Card::StevensResolve) > 0 ||\n       hand_count(Card::LatiasEx) > 0 ||\n       hand_count(Card::Gladion) > 0);\n''',
              'core Arven DCI gate')

          replace_once(
              'src/trace_engine_v2/part_012_arven_fss_blender_contention_override.inc',
              '''        state_.manual_energy_used || !state_.active ||\n        state_.active->card != Card::RegidragoVstar || need_payload() ||\n        grass_needed() + fire_needed() != 1 ||\n        deck_count_after_search_started(Card::EarthenVessel) == 0) {\n      return false;\n    }\n\n    const bool needed_energy_searchable =\n        (grass_needed() == 1 && deck_count_after_search_started(Card::Grass) > 0) ||\n        (fire_needed() == 1 && deck_count_after_search_started(Card::Fire) > 0);\n''',
              '''        state_.manual_energy_used || !state_.active ||\n        state_.active->card != Card::RegidragoVstar || need_payload() ||\n        deck_count_after_search_started(Card::EarthenVessel) == 0) {\n      return false;\n    }\n\n    const bool needed_energy_searchable =\n        completing_basic_attachment_for_apex(\n            *state_.active, [this](const Card basic) {\n              return deck_count_after_search_started(basic) > 0;\n            }).has_value();\n    // DDE + either searchable Basic is one legal final attachment:\n    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n    // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163\n    // Refined bug: https://github.com/FlareZ123/pokemon-sims/issues/2426\n''',
              'Arven dead-role override')

          replace_once(
              'src/trace_engine_v2/part_012_arven_fss_blender_contention_override.inc',
              '''    const auto powered_evolvable_regi = [this](const Pokemon& pokemon) {\n      return pokemon.card == Card::RegidragoV && pokemon.entered_turn < state_.turn &&\n             pokemon.grass >= 2 && pokemon.fire >= 1 && pokemon.tool == Tool::None;\n    };\n''',
              '''    const auto powered_evolvable_regi = [this](const Pokemon& pokemon) {\n      // DDE + Grass or DDE + Fire already pays Apex after the legal VSTAR evolution:\n      // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n      // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n      // Refined bug: https://github.com/FlareZ123/pokemon-sims/issues/2426\n      return pokemon.card == Card::RegidragoV && pokemon.entered_turn < state_.turn &&\n             pays_apex_energy_cost(pokemon) && pokemon.tool == Tool::None;\n    };\n''',
              'Arven FSS Blender powered target')

          replace_once(
              'src/trace_engine_v2/part_issue_1067_arven_before_late_steven_override.inc',
              '''        state_.active->card != Card::RegidragoV ||\n        state_.active->entered_turn >= state_.turn ||\n        state_.active->grass < 2 || state_.active->fire < 1 ||\n        state_.active->tool != Tool::None || state_.vstar_power_used ||\n''',
              '''        state_.active->card != Card::RegidragoV ||\n        state_.active->entered_turn >= state_.turn ||\n        !pays_apex_energy_cost(*state_.active) ||\n        state_.active->tool != Tool::None || state_.vstar_power_used ||\n''',
              'held Arven powered target')

          p = Path('src/trace_engine_v2/part_issue_1067_arven_before_late_steven_override.inc')
          text = p.read_text(encoding='utf-8')
          needle = '''    // Arven can search one Item and one Pokémon Tool. Forest Seal Stone then searches\n'''
          addition = '''    // Semantic Energy readiness includes DDE + either Basic:\n    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Refined bug: https://github.com/FlareZ123/pokemon-sims/issues/2426\n'''
          if text.count(needle) != 1:
              raise SystemExit('held Arven citation insertion mismatch')
          atomic_locked_write(p, text.replace(needle, addition + needle, 1))

          p = Path('src/trace_engine_v2/part_issue_2225_arven_vessel_supporter_override.inc')
          text = p.read_text(encoding='utf-8')
          old = '''  bool issue_2225_arven_vessel_finish_available() const {\n    return strict_payload_timing() && prizes_known() && supporter_allowed() &&\n        !item_locked() && deck_search_available() &&\n        !state_.manual_energy_used && active_is_vstar() &&\n        state_.active->grass == 1 && state_.active->fire == 1 &&\n        need_payload() && hand_count(Card::Arven) > 0 &&\n        deck_count_after_search_started(Card::EarthenVessel) > 0 &&\n        deck_count_after_search_started(Card::Grass) > 0 &&\n        issue_2225_arven_vessel_payload_cost().has_value();\n  }\n\n  bool play_issue_2225_arven_vessel_finish() {\n    if (!issue_2225_arven_vessel_finish_available()) return false;\n    const Card payload = *issue_2225_arven_vessel_payload_cost();\n'''
          new = '''  std::optional<Card> issue_2225_arven_vessel_finishing_energy() const {\n    if (!state_.active || state_.active->card != Card::RegidragoVstar) {\n      return std::nullopt;\n    }\n    // Vessel may search either Basic type that is a legal one-attachment Apex finish.\n    // With DDE attached, Grass and Fire are alternatives rather than two deficits:\n    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163\n    // Refined bug: https://github.com/FlareZ123/pokemon-sims/issues/2426\n    return completing_basic_attachment_for_apex(\n        *state_.active, [this](const Card basic) {\n          return deck_count_after_search_started(basic) > 0;\n        });\n  }\n\n  bool issue_2225_arven_vessel_finish_available() const {\n    return strict_payload_timing() && prizes_known() && supporter_allowed() &&\n        !item_locked() && deck_search_available() &&\n        !state_.manual_energy_used && active_is_vstar() &&\n        need_payload() && hand_count(Card::Arven) > 0 &&\n        deck_count_after_search_started(Card::EarthenVessel) > 0 &&\n        issue_2225_arven_vessel_finishing_energy().has_value() &&\n        issue_2225_arven_vessel_payload_cost().has_value();\n  }\n\n  bool play_issue_2225_arven_vessel_finish() {\n    if (!issue_2225_arven_vessel_finish_available()) return false;\n    const Card payload = *issue_2225_arven_vessel_payload_cost();\n    const Card finishing_energy = *issue_2225_arven_vessel_finishing_energy();\n'''
          if text.count(old) != 1:
              raise SystemExit('issue-2225 availability replacement mismatch')
          text = text.replace(old, new, 1)
          old2 = '''    record_deck_search_knowledge("Earthen Vessel issue-2225 route");\n    if (!move_deck_to_hand(Card::Grass)) {\n      throw std::logic_error("Issue-2225 Grass target disappeared");\n    }\n    shuffle(state_.deck);\n    trace("EARTHEN VESSEL", "R-EV-01; R-GAME-ITEM; P-DCI-01; P-JIT-01; P-COMPRESS-01",\n          "Discarded " + std::string(name(payload)) +\n              " as the current-turn payload and searched Grass Energy for the unused manual attachment.");\n'''
          new2 = '''    record_deck_search_knowledge("Earthen Vessel issue-2225 route");\n    if (!move_deck_to_hand(finishing_energy)) {\n      throw std::logic_error("Issue-2225 finishing Basic target disappeared");\n    }\n    shuffle(state_.deck);\n    trace("EARTHEN VESSEL", "R-EV-01; R-GAME-ITEM; P-DCI-01; P-JIT-01; P-COMPRESS-01",\n          "Discarded " + std::string(name(payload)) +\n              " as the current-turn payload and searched " +\n              std::string(name(finishing_energy)) +\n              " for the unused manual attachment.");\n'''
          if text.count(old2) != 1:
              raise SystemExit('issue-2225 search replacement mismatch')
          atomic_locked_write(p, text.replace(old2, new2, 1))

          test_path = Path('tests/issue_2426_arven_dde_energy_semantics_tests.cpp')
          test = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <algorithm>
#include <iostream>
#include <random>
#include <stdexcept>
#include <utility>

namespace sim {
struct EngineTestAccess {
  static void set_state(Engine& engine, State state, const bool k1 = true) {
    engine.state_ = std::move(state);
    engine.deck_seen_ = k1;
    engine.prizes_revealed_ = k1;
  }
  static bool arven_fss_blender(const Engine& engine) {
    return engine.arven_fss_blender_contention_route_live();
  }
  static bool held_arven_finish(const Engine& engine) {
    return engine.held_arven_fss_blender_finish_available();
  }
  static bool issue_2225_available(const Engine& engine) {
    return engine.issue_2225_arven_vessel_finish_available();
  }
  static bool issue_2225_play(Engine& engine) {
    return engine.play_issue_2225_arven_vessel_finish();
  }
  static bool play_arven(Engine& engine) { return engine.play_arven(); }
  static const State& state(const Engine& engine) { return engine.state_; }
};
}  // namespace sim

namespace {
void expect(const bool value, const char* message) {
  if (!value) throw std::runtime_error(message);
}

sim::Pokemon regi(const sim::Card card, const int grass, const int fire,
                  const int dde, const int entered_turn = 1) {
  sim::Pokemon result{card, entered_turn, grass, fire, sim::Tool::None};
  result.double_dragon = dde;
  return result;
}

struct Fixture {
  sim::Scenario scenario;
  sim::DeckRecipe recipe{sim::double_dragon_modeling_recipe()};
  std::mt19937_64 rng{2426};
  sim::Engine engine;

  explicit Fixture(const sim::DciProfile dci = sim::DciProfile::StrictJit)
      : scenario{"issue-2426", dci, sim::LockMode::None, false, 5},
        engine(scenario, recipe, rng) {}
};

void test_arven_fss_blender_accepts_dde_basic(const sim::Card basic) {
  Fixture fixture;
  sim::State state;
  state.turn = 2;
  state.active = regi(sim::Card::RegidragoV,
                      basic == sim::Card::Grass ? 1 : 0,
                      basic == sim::Card::Fire ? 1 : 0, 1);
  state.hand = {sim::Card::Arven};
  state.deck = {sim::Card::ForestSealStone, sim::Card::BrilliantBlender,
                sim::Card::RegidragoVstar, sim::Card::Dragapult};
  sim::EngineTestAccess::set_state(fixture.engine, std::move(state));

  // DDE + either Basic already supplies Apex's three Energy units. Arven can use
  // Blender for the strict-JIT payload and FSS for the missing VSTAR this turn:
  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
  // https://api.pokemontcg.io/v2/cards/swsh12-136
  // https://api.pokemontcg.io/v2/cards/sv1-166
  // https://api.pokemontcg.io/v2/cards/swsh12-156
  // https://api.pokemontcg.io/v2/cards/sv8-164
  // https://github.com/FlareZ123/pokemon-sims/issues/2426
  expect(sim::EngineTestAccess::arven_fss_blender(fixture.engine),
         "Arven FSS+Blender route rejected DDE + Basic.");
  expect(sim::EngineTestAccess::held_arven_finish(fixture.engine),
         "Held Arven did not suppress the slower Steven route for DDE + Basic.");
}

void test_issue_2225_dde_only_finishes_with(const sim::Card basic) {
  Fixture fixture;
  sim::State state;
  state.turn = 3;
  state.active = regi(sim::Card::RegidragoVstar, 0, 0, 1);
  state.hand = {sim::Card::Arven, sim::Card::Dragapult};
  state.deck = {sim::Card::EarthenVessel, basic, sim::Card::Klara};
  sim::EngineTestAccess::set_state(fixture.engine, std::move(state));

  // Vessel's discard cost establishes the current-turn Dragon payload, then either
  // searchable Basic can be held for the unused manual attachment to DDE:
  // https://api.pokemontcg.io/v2/cards/sv4-163
  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
  // https://api.pokemontcg.io/v2/cards/swsh12-136
  // https://github.com/FlareZ123/pokemon-sims/issues/2426
  expect(sim::EngineTestAccess::issue_2225_available(fixture.engine),
         "Arven->Vessel route rejected DDE-only one-Basic completion.");
  expect(sim::EngineTestAccess::issue_2225_play(fixture.engine),
         "Arven->Vessel DDE route did not resolve.");
  const auto& after = sim::EngineTestAccess::state(fixture.engine);
  expect(std::count(after.hand.begin(), after.hand.end(), basic) == 1,
         "Vessel did not search the actual DDE-completing Basic.");
  expect(std::count(after.discard.begin(), after.discard.end(), sim::Card::Dragapult) == 1,
         "Vessel did not use the held Dragon as the strict-JIT discard cost.");
}

void test_basic_only_issue_2225_control() {
  Fixture fixture;
  sim::State state;
  state.turn = 3;
  state.active = regi(sim::Card::RegidragoVstar, 1, 1, 0);
  state.hand = {sim::Card::Arven, sim::Card::Dragapult};
  state.deck = {sim::Card::EarthenVessel, sim::Card::Grass};
  sim::EngineTestAccess::set_state(fixture.engine, std::move(state));
  expect(sim::EngineTestAccess::issue_2225_available(fixture.engine),
         "Canonical GF + Grass Arven->Vessel control regressed.");
}

void test_core_arven_dci_accepts_dde_final_energy() {
  Fixture fixture(sim::DciProfile::NoDiscardControl);
  sim::State state;
  state.turn = 3;
  state.active = regi(sim::Card::RegidragoVstar, 0, 0, 1);
  state.hand = {sim::Card::Arven, sim::Card::QuickBall};
  state.deck = {sim::Card::EarthenVessel, sim::Card::Fire, sim::Card::Klara};
  state.discard = {sim::Card::Dragapult};
  sim::EngineTestAccess::set_state(fixture.engine, std::move(state), false);

  // Quick Ball is dynamically dead once the attacker/payload axes are complete.
  // The one-card Vessel cost is therefore legal under the repository's DCI policy,
  // and DDE + Fire is a one-manual-attachment Apex finish:
  // https://api.pokemontcg.io/v2/cards/swsh1-179
  // https://api.pokemontcg.io/v2/cards/sv4-163
  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
  // https://api.pokemontcg.io/v2/cards/swsh12-136
  // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation
  // https://github.com/FlareZ123/pokemon-sims/issues/2426
  expect(sim::EngineTestAccess::play_arven(fixture.engine),
         "Core Arven DCI gate rejected the DDE final-Energy Vessel route.");
  const auto& after = sim::EngineTestAccess::state(fixture.engine);
  expect(std::count(after.hand.begin(), after.hand.end(), sim::Card::EarthenVessel) == 1,
         "Arven did not search Earthen Vessel through the DDE final-Energy DCI escape.");
}
}  // namespace

int main() {
  try {
    test_arven_fss_blender_accepts_dde_basic(sim::Card::Grass);
    test_arven_fss_blender_accepts_dde_basic(sim::Card::Fire);
    test_issue_2225_dde_only_finishes_with(sim::Card::Grass);
    test_issue_2225_dde_only_finishes_with(sim::Card::Fire);
    test_basic_only_issue_2225_control();
    test_core_arven_dci_accepts_dde_final_energy();
    std::cout << "issue-2426 Arven DDE semantics regressions passed\n";
    return 0;
  } catch (const std::exception& error) {
    std::cerr << error.what() << '\n';
    return 1;
  }
}
'''
          atomic_locked_write(test_path, test)
          PY
      - name: Build and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'regidrago_issue_2426_arven_dde_energy_semantics_tests|regidrago_issue_2238_double_dragon_energy_tests' --output-on-failure
      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-2426-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix Arven DDE energy semantics (#2426)'
          git push origin HEAD:fix/2426-arven-dde-energy-semantics
