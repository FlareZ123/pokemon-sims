name: Issue 2426 push bootstrap

on:
  push:
    branches: [fix/2426-arven-dde-energy-semantics]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2426-arven-dde-energy-semantics
      - name: Materialize issue 2426 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-2426-bootstrap.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exec(compile(code, 'issue-2426-bootstrap.py', 'exec'))
          PY
      - name: Build and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'regidrago_issue_2426_arven_dde_energy_semantics_tests|regidrago_issue_2238_double_dragon_energy_tests' --output-on-failure
      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-2426-bootstrap.yml
          rm .github/workflows/issue-2426-push-bootstrap.yml
          rm -f .github/issue-2426-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix Arven DDE energy semantics (#2426)'
          git push origin HEAD:fix/2426-arven-dde-energy-semantics
