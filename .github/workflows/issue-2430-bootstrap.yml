name: Issue 2430 bootstrap

on:
  push:
    branches: [fix/2430-dde-paid-retreat-readiness]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2430-dde-paid-retreat-readiness
      - name: Apply source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fcntl
          import os
          import tempfile

          def atomic_locked_write(path: Path, text: str) -> None:
              lock_path = path.with_name(path.name + '.lock')
              with lock_path.open('w', encoding='utf-8') as lock:
                  fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                  with tempfile.NamedTemporaryFile(
                      mode='w', encoding='utf-8', newline='\n',
                      dir=path.parent, delete=False
                  ) as tmp:
                      tmp.write(text)
                      tmp.flush()
                      os.fsync(tmp.fileno())
                      tmp_path = Path(tmp.name)
                  os.replace(tmp_path, path)
                  fcntl.flock(lock.fileno(), fcntl.LOCK_UN)
              lock_path.unlink(missing_ok=True)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          tate_path = Path('src/trace_engine_v2/part_tate_blender_attachment_override.inc')
          tate = tate_path.read_text(encoding='utf-8')
          tate = replace_once(
              tate,
              '''  Pokemon* target = projected.best_benched_vstar_for_promotion();\n  if (target == nullptr || target->grass < 2 || target->fire < 1) return false;\n\n  const Card payment = projected.hand_count(Card::Grass) > 0\n''',
              '''  Pokemon* target = projected.best_benched_vstar_for_promotion();\n  // Double Dragon Energy provides two flexible Energy on Dragon Pokemon, so a\n  // DDE + Grass or DDE + Fire Regidrago VSTAR is already ready for Apex Dragon:\n  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n  // https://api.pokemontcg.io/v2/cards/swsh12-136\n  // https://github.com/FlareZ123/pokemon-sims/issues/2430\n  if (target == nullptr || !projected.pays_apex_energy_cost(*target)) return false;\n\n  const Card payment = projected.hand_count(Card::Grass) > 0\n''',
              'issue-2158 projection guard')
          tate = replace_once(
              tate,
              '''  Pokemon* target = best_benched_vstar_for_promotion();\n  if (target == nullptr || target->grass < 2 || target->fire < 1) {\n    throw std::logic_error("Issue-2158 projected GGF promotion target disappeared");\n  }\n''',
              '''  Pokemon* target = best_benched_vstar_for_promotion();\n  // Keep execution aligned with the semantic DDE-aware readiness proof above:\n  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n  // https://api.pokemontcg.io/v2/cards/swsh12-136\n  // https://github.com/FlareZ123/pokemon-sims/issues/2430\n  if (target == nullptr || !pays_apex_energy_cost(*target)) {\n    throw std::logic_error("Issue-2158 projected Apex-ready promotion target disappeared");\n  }\n''',
              'issue-2158 execution guard')
          atomic_locked_write(tate_path, tate)

          latias_path = Path('src/trace_engine_v2/part_014c_latias_bench_override.inc')
          latias = latias_path.read_text(encoding='utf-8')
          latias = replace_once(
              latias,
              '''    Pokemon* target = best_benched_vstar_for_promotion();\n    if (target == nullptr || target->grass < 2 || target->fire < 1) return false;\n\n    const Card payment = hand_count(Card::Grass) > 0 ? Card::Grass : Card::Fire;\n''',
              '''    Pokemon* target = best_benched_vstar_for_promotion();\n    // DDE + either Basic Energy pays Apex Dragon's GGF cost and is a legal\n    // paid-retreat promotion target when the other readiness axes are complete:\n    // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n    // https://api.pokemontcg.io/v2/cards/swsh12-136\n    // https://github.com/FlareZ123/pokemon-sims/issues/2430\n    if (target == nullptr || !pays_apex_energy_cost(*target)) return false;\n\n    const Card payment = hand_count(Card::Grass) > 0 ? Card::Grass : Card::Fire;\n''',
              'Tapu paid-retreat guard')
          latias = replace_once(
              latias,
              '''    Pokemon* target = best_benched_vstar_for_promotion();\n    if (target == nullptr || target->grass < 2 || target->fire < 1) return false;\n\n    const Card payment = state_.active->grass > 0 ? Card::Grass : Card::Fire;\n''',
              '''    Pokemon* target = best_benched_vstar_for_promotion();\n    // The banked FSS route may promote any semantically Apex-ready VSTAR,\n    // including DDE + Grass and DDE + Fire configurations:\n    // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/\n    // https://api.pokemontcg.io/v2/cards/swsh12-136\n    // https://github.com/FlareZ123/pokemon-sims/issues/2430\n    if (target == nullptr || !pays_apex_energy_cost(*target)) return false;\n\n    const Card payment = state_.active->grass > 0 ? Card::Grass : Card::Fire;\n''',
              'Oricorio banked-retreat guard')
          atomic_locked_write(latias_path, latias)

          test_path = Path('tests/issue_2430_paid_retreat_dde_tests.cpp')
          test = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <algorithm>
#include <iostream>
#include <random>
#include <stdexcept>
#include <vector>

namespace sim {

struct EngineTestAccess {
  static void set_state(Engine& engine, State state) {
    engine.state_ = std::move(state);
  }
  static const State& state(const Engine& engine) { return engine.state_; }
  static void establish_k1(Engine& engine) {
    engine.deck_seen_ = true;
    engine.prizes_revealed_ = true;
  }
  static bool pays_apex_energy_cost(const Engine& engine, const Pokemon& pokemon) {
    return engine.pays_apex_energy_cost(pokemon);
  }
  static bool issue_2158_available(const Engine& engine) {
    return engine.issue_2158_paid_oricorio_retreat_burnet_available();
  }
  static bool play_issue_2158(Engine& engine) {
    return engine.play_issue_2158_paid_oricorio_retreat_burnet();
  }
  static bool pay_tapu(Engine& engine) {
    return engine.pay_tapu_retreat_to_ready_benched_vstar();
  }
  static void arm_issue_1022(Engine& engine) {
    engine.issue_1022_banked_route_ = true;
  }
  static bool pay_banked_oricorio(Engine& engine) {
    return engine.pay_oricorio_retreat_for_known_t4_fss_route();
  }
};

}  // namespace sim

namespace {

struct Fixture {
  sim::Scenario scenario;
  sim::DeckRecipe recipe;
  std::mt19937_64 rng;
  sim::TraceLog trace;
  sim::Engine engine;

  Fixture()
      : scenario{"issue-2430/exact", sim::DciProfile::StrictJit,
                 sim::LockMode::None, false, 5},
        recipe(sim::double_dragon_modeling_recipe()),
        rng(2430),
        trace{true, {}},
        engine(scenario, recipe, rng, &trace) {}
};

sim::Pokemon pokemon(const sim::Card card, const int grass = 0,
                     const int fire = 0, const int dde = 0) {
  sim::Pokemon result{card, 1, grass, fire, sim::Tool::None};
  result.double_dragon = dde;
  return result;
}

void require(const bool condition, const char* message) {
  if (!condition) throw std::runtime_error(message);
}

void add_current_turn_payload(sim::State& state) {
  state.discard.push_back(sim::Card::Dragapult);
  state.discarded_this_turn.push_back(sim::Card::Dragapult);
}

void run_issue_2158_variant(const int grass, const int fire, const int dde) {
  Fixture fixture;
  sim::State state;
  state.turn = 3;
  state.active = pokemon(sim::Card::Oricorio);
  state.bench = {pokemon(sim::Card::RegidragoVstar, grass, fire, dde)};
  state.hand = {sim::Card::ProfessorBurnet, sim::Card::Grass};
  state.deck = {sim::Card::Dragapult, sim::Card::Klara};
  sim::EngineTestAccess::set_state(fixture.engine, std::move(state));
  sim::EngineTestAccess::establish_k1(fixture.engine);

  // Oricorio pays its one-Colorless Retreat Cost with the held Basic while Burnet
  // remains available to establish the strict-JIT payload. DDE + either Basic is
  // already sufficient for Apex Dragon:
  // https://api.pokemontcg.io/v2/cards/sm2-55
  // https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
  // https://api.pokemontcg.io/v2/cards/swsh12-136
  // https://github.com/FlareZ123/pokemon-sims/issues/2158
  // https://github.com/FlareZ123/pokemon-sims/issues/2430
  require(sim::EngineTestAccess::issue_2158_available(fixture.engine),
          "Issue-2158 paid Oricorio route rejected an Apex-ready Benched VSTAR.");
  require(sim::EngineTestAccess::play_issue_2158(fixture.engine),
          "Issue-2158 paid Oricorio retreat did not resolve.");
  const sim::State& after = sim::EngineTestAccess::state(fixture.engine);
  require(after.active && after.active->card == sim::Card::RegidragoVstar &&
              sim::EngineTestAccess::pays_apex_energy_cost(
                  fixture.engine, *after.active),
          "Issue-2158 did not promote the Apex-ready VSTAR.");
  require(std::count(after.hand.begin(), after.hand.end(), sim::Card::ProfessorBurnet) == 1,
          "Issue-2158 retreat consumed the held Burnet Supporter.");
}

void run_tapu_variant(const int grass, const int fire, const int dde) {
  Fixture fixture;
  sim::State state;
  state.turn = 3;
  state.active = pokemon(sim::Card::TapuLeleGX);
  state.bench = {pokemon(sim::Card::RegidragoVstar, grass, fire, dde)};
  state.hand = {sim::Card::Grass};
  add_current_turn_payload(state);
  sim::EngineTestAccess::set_state(fixture.engine, std::move(state));
  sim::EngineTestAccess::establish_k1(fixture.engine);

  // Tapu Lele-GX has a one-Colorless Retreat Cost. With payload and Energy axes
  // complete, the held Basic may pay Retreat and promote the semantic ready VSTAR:
  // https://api.pokemontcg.io/v2/cards/sm2-60
  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
  // https://api.pokemontcg.io/v2/cards/swsh12-136
  // https://github.com/FlareZ123/pokemon-sims/issues/2430
  require(sim::EngineTestAccess::pay_tapu(fixture.engine),
          "Paid Tapu retreat rejected an Apex-ready Benched VSTAR.");
  const sim::State& after = sim::EngineTestAccess::state(fixture.engine);
  require(after.active && after.active->card == sim::Card::RegidragoVstar &&
              sim::EngineTestAccess::pays_apex_energy_cost(
                  fixture.engine, *after.active),
          "Paid Tapu retreat did not promote the Apex-ready VSTAR.");
}

void run_banked_oricorio_variant(const int grass, const int fire, const int dde) {
  Fixture fixture;
  sim::State state;
  state.turn = 4;
  state.active = pokemon(sim::Card::Oricorio, 1, 0, 0);
  state.bench = {pokemon(sim::Card::RegidragoVstar, grass, fire, dde)};
  add_current_turn_payload(state);
  sim::EngineTestAccess::set_state(fixture.engine, std::move(state));
  sim::EngineTestAccess::establish_k1(fixture.engine);
  sim::EngineTestAccess::arm_issue_1022(fixture.engine);

  // The banked Oricorio already carries the one Energy needed for Retreat. Once
  // FSS/Blender have completed the other axes, the promotion check must accept the
  // same semantic Apex payment states as the rest of the engine:
  // https://api.pokemontcg.io/v2/cards/sm2-55
  // https://api.pokemontcg.io/v2/cards/swsh12-156
  // https://api.pokemontcg.io/v2/cards/sv8-164
  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
  // https://api.pokemontcg.io/v2/cards/swsh12-136
  // https://github.com/FlareZ123/pokemon-sims/issues/2430
  require(sim::EngineTestAccess::pay_banked_oricorio(fixture.engine),
          "Banked Oricorio retreat rejected an Apex-ready Benched VSTAR.");
  const sim::State& after = sim::EngineTestAccess::state(fixture.engine);
  require(after.active && after.active->card == sim::Card::RegidragoVstar &&
              sim::EngineTestAccess::pays_apex_energy_cost(
                  fixture.engine, *after.active),
          "Banked Oricorio retreat did not promote the Apex-ready VSTAR.");
}

}  // namespace

int main() {
  // DDE + Grass, DDE + Fire, and the original two-Grass/one-Fire Basic payment
  // are all legal Apex Dragon Energy states:
  // https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
  // https://api.pokemontcg.io/v2/cards/swsh12-136
  // https://github.com/FlareZ123/pokemon-sims/issues/2430
  for (const auto [grass, fire, dde] : std::vector<std::tuple<int, int, int>>{
           {1, 0, 1}, {0, 1, 1}, {2, 1, 0}}) {
    run_issue_2158_variant(grass, fire, dde);
    run_tapu_variant(grass, fire, dde);
    run_banked_oricorio_variant(grass, fire, dde);
  }
  std::cout << "issue-2430 paid-retreat DDE regressions passed\n";
  return 0;
}
'''
          atomic_locked_write(test_path, test)
          PY
      - name: Build and run issue 2430 regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'regidrago_issue_2430_paid_retreat_dde_tests|regidrago_issue_2238_double_dragon_energy_tests' --output-on-failure
      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-2430-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix DDE-ready paid retreat guards (#2430)'
          git push origin HEAD:fix/2430-dde-paid-retreat-readiness
