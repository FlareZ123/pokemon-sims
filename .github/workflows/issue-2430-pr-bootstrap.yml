name: Issue 2430 PR bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2430-dde-paid-retreat-readiness
      - name: Materialize issue 2430 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-2430-bootstrap.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exec(compile(code, 'issue-2430-bootstrap.py', 'exec'))
          PY
      - name: Build and run issue 2430 regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'regidrago_issue_2430_paid_retreat_dde_tests|regidrago_issue_2238_double_dragon_energy_tests' --output-on-failure
      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-2430-bootstrap.yml
          rm .github/workflows/issue-2430-pr-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix DDE-ready paid retreat guards (#2430)'
          git push origin HEAD:fix/2430-dde-paid-retreat-readiness
