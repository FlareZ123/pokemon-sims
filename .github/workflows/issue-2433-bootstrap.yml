name: Issue 2433 bootstrap
on: {pull_request: {branches: [main]}}
permissions: {contents: write}
jobs:
  apply:
    if: github.head_ref == 'bug/2433-powerglass-dde-distance'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: bug/2433-powerglass-dde-distance, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/issue_2433_patch.py
      - run: git diff --check
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2 && ctest --test-dir build -R '^regidrago_issue_2433_powerglass_dde_tests$' --output-on-failure
      - run: |
          rm tools/issue_2433_patch.py .github/workflows/issue-2433-bootstrap.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix #2433 DDE-aware Powerglass distance'
          git push origin HEAD:bug/2433-powerglass-dde-distance
