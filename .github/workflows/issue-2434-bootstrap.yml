name: Issue 2434 bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.head_ref == 'bug/2434-serena-latias-dde'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bug/2434-serena-latias-dde
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize semantic Serena-Latias fix
        run: python tools/issue_2434_patch.py
      - name: Validate patch shape
        run: git diff --check
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --parallel 2
      - name: Run focused #2434 regression
        run: ctest --test-dir build -R '^regidrago_issue_2434_serena_latias_dde_tests$' --output-on-failure
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git add src/trace_engine_v2/part_issue_1683_serena_dead_quick_ball_override.inc tests/issue_2434_serena_latias_dde_tests.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix #2434 DDE-aware Serena-Latias readiness'
          git push origin HEAD:bug/2434-serena-latias-dde
