name: Issue 2446 bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.head_ref == 'bug/2446-opening-tapu-dde-crispin'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bug/2446-opening-tapu-dde-crispin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize opening Tapu fix
        run: python tools/issue_2446_patch.py
      - name: Validate patch shape
        run: git diff --check
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --parallel 2
      - name: Run focused #2446 regression
        run: ctest --test-dir build -R '^regidrago_issue_2446_opening_tapu_dde_crispin_tests$' --output-on-failure
      - name: Commit validated fix and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm tools/issue_2446_patch.py .github/workflows/issue-2446-bootstrap.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix #2446 DDE-aware opening Tapu Crispin projection'
          git push origin HEAD:bug/2446-opening-tapu-dde-crispin
