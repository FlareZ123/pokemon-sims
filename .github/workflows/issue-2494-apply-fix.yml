name: Apply issue 2494 branch fix

on:
  push:
    branches: [fix/2494-legacy-star-held-vessel]

permissions:
  contents: write

jobs:
  apply-source-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2494-legacy-star-held-vessel
      - name: Apply exact source edit
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/trace_engine_v2/part_013_legacy_star_override.inc')
          text = path.read_text()
          old = '''    if (legacy_star_delayed_vessel_route() && recovered.size() < 2U) {
      if (!recover_discard_to_hand(Card::EarthenVessel)) {
        throw std::logic_error("Legacy Star delayed Earthen Vessel target disappeared");
      }
      recovered.push_back(Card::EarthenVessel);
    }
'''
          new = '''    // Legacy Star may select only cards that are physically in the discard pile.
    // A held Earthen Vessel already satisfies this delayed route, so recovering a
    // second copy would spend one of the two recovery choices without advancing it:
    // Legacy Star: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
    // Resource-preservation policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2494
    const bool delayed_vessel_needs_recovery =
        legacy_star_delayed_vessel_route() &&
        hand_count(Card::EarthenVessel) == 0 &&
        count_of(state_.discard, Card::EarthenVessel) > 0;
    if (delayed_vessel_needs_recovery && recovered.size() < 2U) {
      if (!recover_discard_to_hand(Card::EarthenVessel)) {
        throw std::logic_error("Legacy Star delayed Earthen Vessel target disappeared");
      }
      recovered.push_back(Card::EarthenVessel);
    }
'''
          if old not in text:
              raise SystemExit('issue 2494 source anchor missing or already changed')
          path.write_text(text.replace(old, new, 1))
      - name: Build focused regression
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_unified_tests -j2
          ctest --test-dir build -R regidrago_issue_2494_legacy_star_held_vessel_tests --output-on-failure
      - name: Commit validated source edit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_013_legacy_star_override.inc
          git commit -m "Fix #2494 Legacy Star held Vessel recovery"
          git push origin HEAD:fix/2494-legacy-star-held-vessel
