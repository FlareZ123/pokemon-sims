name: Issue 2533 materializer
on:
  pull_request:
    paths: ['.github/workflows/issue-2533-materialize.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/2533-reclaim-current-main, fetch-depth: 0}
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply semantic Powerglass guard atomically
        run: |
          python - <<'PY'
          import os,tempfile
          from pathlib import Path
          p=Path('src/trace_engine_v2/part_discard_recovery_provenance_override.inc')
          s=p.read_text(encoding='utf-8')
          old='''    // Preserve a live Powerglass attachment that immediately advances the Active
    // Regidrago's GGF axis. Both Tools compete for the same one-Tool slot:
    // https://api.pokemontcg.io/v2/cards/sv6pt5-63
    const bool live_powerglass = hand_count(Card::Powerglass) > 0 && state_.active &&
        (state_.active->card == Card::RegidragoV ||
         state_.active->card == Card::RegidragoVstar) &&
        state_.active->tool == Tool::None &&
        ((state_.active->grass < 2 && count_of(state_.discard, Card::Grass) > 0) ||
         (state_.active->fire < 1 && count_of(state_.discard, Card::Fire) > 0));
'''
          new='''    // Preserve Powerglass only when a recoverable Basic advances semantic Apex progress.
    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Powerglass: https://api.pokemontcg.io/v2/cards/sv6pt5-63
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2533
    const bool live_powerglass = hand_count(Card::Powerglass) > 0 && state_.active &&
        (state_.active->card == Card::RegidragoV ||
         state_.active->card == Card::RegidragoVstar) &&
        state_.active->tool == Tool::None &&
        preferred_manual_energy_for(*state_.active, [this](const Card card) {
          return (card == Card::Grass || card == Card::Fire) &&
              count_of(state_.discard, card) > 0;
        }).has_value();
'''
          if s.count(old)!=1: raise SystemExit(f'expected one raw Powerglass guard, found {s.count(old)}')
          s=s.replace(old,new)
          fd,t=tempfile.mkstemp(prefix=f'.{p.name}.',dir=p.parent)
          try:
            with os.fdopen(fd,'w',encoding='utf-8',newline='\n') as f: f.write(s); f.flush(); os.fsync(f.fileno())
            os.replace(t,p)
          finally:
            if os.path.exists(t): os.unlink(t)
          PY
      - name: Commit materialized fix
        run: |
          rm .github/workflows/issue-2533-materialize.yml
          git add src/trace_engine_v2/part_discard_recovery_provenance_override.inc tests/issue_2533_crobat_fss_powerglass_tests.cpp .github/workflows/issue-2533-materialize.yml
          git commit -m "Fix #2533: make Powerglass guard DDE-aware"
          git push origin HEAD:fix/2533-reclaim-current-main
