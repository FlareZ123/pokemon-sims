name: Issue 2621 regenerate evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Regenerate canonical evidence
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
      - name: Regenerate paired evidence
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Regenerate reports
        run: |
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Validate regenerated evidence
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Record generated diff
        if: always()
        run: git diff --binary -- results docs/REPORT.md docs/MULTI_DECK_REPORT.md > issue-2621-generated.patch
      - name: Upload regenerated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-2621-regenerated-evidence
          path: |
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
            issue-2621-generated.patch
            build/Testing
          if-no-files-found: error
