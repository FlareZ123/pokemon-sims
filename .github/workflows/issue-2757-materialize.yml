name: Issue 2757 materializer

on:
  pull_request:
    paths:
      - '.github/workflows/issue-2757-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2757-reclaim-current-main
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply shared JIT profile gate
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          path = Path('src/trace_engine_v2/part_009b1.inc')
          text = path.read_text(encoding='utf-8')
          old = '''  std::optional<Card> quick_ball_crispin_replaced_energy_cost() const {
    if (scenario_.dci != DciProfile::StrictJit || state_.turn != 1 ||
'''
          new = '''  std::optional<Card> quick_ball_crispin_replaced_energy_cost() const {
    // Both JIT profiles share ready-turn payload timing: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
    // Confirmed cross-profile regression: https://github.com/FlareZ123/pokemon-sims/issues/2757
    if (!strict_payload_timing() || state_.turn != 1 ||
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one issue-1093 StrictJit gate, found {text.count(old)}')
          text = text.replace(old, new)
          fd, tmp = tempfile.mkstemp(prefix=f'.{path.name}.', dir=path.parent)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as handle:
                  handle.write(text)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp, path)
          finally:
              if os.path.exists(tmp):
                  os.unlink(tmp)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue-2757-materialize.yml
          git add src/trace_engine_v2/part_009b1.inc tests/issue_2757_jit_profile_gate_tests.cpp .github/workflows/issue-2757-materialize.yml
          git commit -m "Fix #2757: share issue-1093 JIT timing gate"
          git push origin HEAD:fix/2757-reclaim-current-main
