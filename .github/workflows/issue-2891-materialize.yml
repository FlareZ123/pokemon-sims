name: Materialize issue 2891

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/2891-fss-seed23-state-generic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize state-semantic FSS route
        run: python scripts/issue_2891_materialize.py
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and tests
        run: cmake --build build --parallel 2
      - name: Run focused issue 2891 regressions
        run: ctest --test-dir build --output-on-failure -R '2891'
      - name: Run three reviewed simulate-this traces
        shell: bash
        run: |
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-3.txt
      - name: Commit materialized fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/issue_2891_materialize.py .github/workflows/issue-2891-materialize.yml
          git add -A
          git diff --cached --check
          git commit -m 'Fix #2891 state-generic Forest Seal Stone Grass route'
          git push origin HEAD:${{ github.head_ref }}
