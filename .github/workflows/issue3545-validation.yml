name: Issue 3545 validation

on:
  push:
    branches: [enhancement-bc-vs-seeker-20260813]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run issue 3545 regressions
        run: ctest --test-dir build --output-on-failure -R issue_3545
      - name: Upload simulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3545-build
          path: |
            build/regidrago_sim
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
