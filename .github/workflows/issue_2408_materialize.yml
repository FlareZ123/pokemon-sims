name: Issue 2408 materialize current evidence

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 2980 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2408-burnet-current-main-20260811-sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source and current main
        env:
          EXPECTED_MAIN: 3ce51671d8817736d0dc6315c2062386274ad193
          EXPECTED_POLICY_DIGEST: 89c3488a74c41740ed26a02e3b670d87ae3ba19ae3bed11fc4c1a0e7dd2b9bd7
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          current_main=$(git rev-parse origin/main)
          if [ "$current_main" != "$EXPECTED_MAIN" ]; then
            echo "main moved: expected $EXPECTED_MAIN, found $current_main" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD; then
            echo "expected main is not an ancestor of the materialized source" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest
          expected = "89c3488a74c41740ed26a02e3b670d87ae3ba19ae3bed11fc4c1a0e7dd2b9bd7"
          actual = simulator_policy_source_digest(Path.cwd())
          if actual != expected:
              raise SystemExit(f"policy source moved: expected {expected}, found {actual}")
          PY
          git rm .github/workflows/issue_2408_materialize.yml

      - name: Reuse exact tested PR artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: 9093271466
        run: |
          set -euo pipefail
          rm -rf /tmp/issue-2408-release /tmp/issue-2408-release.zip
          mkdir -p /tmp/issue-2408-release
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/issue-2408-release.zip
          unzip -q /tmp/issue-2408-release.zip -d /tmp/issue-2408-release
          test -f /tmp/issue-2408-release/multi-deck-matrix.csv
          test -f /tmp/issue-2408-release/t2-t3-matrix.csv
          test -x /tmp/issue-2408-release/build/regidrago_sim || chmod +x /tmp/issue-2408-release/build/regidrago_sim
          cp /tmp/issue-2408-release/multi-deck-matrix.csv results/multi_deck_comparison.csv
          cp /tmp/issue-2408-release/t2-t3-matrix.csv results/simulation_results.csv

      - name: Regenerate manifests and reviewed traces
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import generate_multi_deck_comparison as multi
          from scripts import regenerate_setup_baselines as base

          results = Path('results')
          executable = Path('/tmp/issue-2408-release/build/regidrago_sim')
          matrix_seed = 20260705
          trials = 100000

          trace_dir = results / 'traces'
          trace_dir.mkdir(parents=True, exist_ok=True)
          baseline_manifest = base.build_manifest(matrix_seed, trials)
          expected_trace_files = set()
          for scenario, deadline, stem in base.TRACE_SPECS:
              seed, trace = base.find_trace_seed(executable, scenario, deadline, 5000)
              file_name = base.trace_file_name(stem, seed)
              expected_trace_files.add(file_name)
              base.atomic_write_text(trace_dir / file_name, trace)
              baseline_manifest['traces'].append({
                  'scenario': scenario,
                  'deadline': deadline,
                  'seed': seed,
                  'file': file_name,
              })
          base.reconcile_generated_traces(trace_dir, expected_trace_files)
          base.atomic_write_text(
              results / base.MANIFEST_FILENAME,
              json.dumps(baseline_manifest, indent=2, sort_keys=True) + '\n',
          )

          multi_traces = multi.generate_traces(executable, results / 'multi_deck_traces')
          multi_manifest = multi.build_manifest(
              results / 'multi_deck_comparison.csv', multi_traces, trials, matrix_seed
          )
          multi.atomic_write_text(
              results / 'multi_deck_manifest.json',
              json.dumps(multi_manifest, indent=2, sort_keys=True) + '\n',
          )
          PY

      - name: Regenerate reports and validate generated tree
        run: |
          set -euo pipefail
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
          python tests/update_setup_docs_tests.py
          git diff --check

      - name: Refuse stale main and commit exact evidence
        env:
          EXPECTED_MAIN: 3ce51671d8817736d0dc6315c2062386274ad193
        run: |
          set -euo pipefail
          git fetch origin main
          current_main=$(git rev-parse origin/main)
          if [ "$current_main" != "$EXPECTED_MAIN" ]; then
            echo "main moved during materialization: $EXPECTED_MAIN -> $current_main" >&2
            exit 1
          fi
          git add -A results docs/REPORT.md docs/TRACE_AUDIT.md docs/MULTI_DECK_REPORT.md README.md .github/workflows/issue_2408_materialize.yml
          git diff --cached --check
          git commit -m 'Fix #2408 regenerate exact current-main evidence'
          git push origin HEAD:fix/2408-burnet-current-main-20260811-sol
