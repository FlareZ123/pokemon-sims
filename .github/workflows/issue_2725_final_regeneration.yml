name: Issue 2725 final regeneration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'regen/2725-final-20260810' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: regen/2725-final-20260810
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_sim --parallel 2
      - name: Run three final simulate-this audits
        run: |
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-final-1.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee trace-final-2.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-final-3.txt
          grep -q 'T2 | READY' trace-final-1.txt
          grep -q 'T3 | READY' trace-final-2.txt
          grep -q 'T2 | READY' trace-final-3.txt
      - name: Generate one paired 100k aggregate
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Derive canonical shell matrix from same aggregate
        run: python scripts/extract_deck_matrix.py --input results/multi_deck_comparison.csv --output results/simulation_results.csv --deck regidrago-shell
      - name: Refresh canonical manifest and traces without another aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.regenerate_setup_baselines import TRACE_SPECS, atomic_write_text, build_manifest, find_trace_seed, reconcile_generated_traces, trace_file_name
          exe = Path('build/regidrago_sim').resolve()
          out = Path('results').resolve()
          trace_dir = out / 'traces'
          trace_dir.mkdir(parents=True, exist_ok=True)
          manifest = build_manifest(20260705, 100000)
          expected = set()
          for scenario, deadline, stem in TRACE_SPECS:
              seed, trace = find_trace_seed(exe, scenario, deadline, 5000)
              name = trace_file_name(stem, seed)
              expected.add(name)
              atomic_write_text(trace_dir / name, trace)
              manifest['traces'].append({'scenario': scenario, 'deadline': deadline, 'seed': seed, 'file': name})
          reconcile_generated_traces(trace_dir, expected)
          atomic_write_text(out / 'baseline_manifest.json', json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - name: Regenerate setup documentation
        run: |
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          git diff --check
      - name: Validate generated contracts
        run: |
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
          python tests/update_setup_docs_tests.py
      - name: Materialize generated evidence and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue_2725_final_regeneration.yml
          git add -A results docs/REPORT.md docs/TRACE_AUDIT.md docs/MULTI_DECK_REPORT.md README.md
          git diff --cached --check
          git commit -m 'Refresh #2725 source-bound setup evidence'
          git push origin HEAD:regen/2725-final-20260810
