name: Issue 2725 regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'regen/2725-clean-main-20260810' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: regen/2725-clean-main-20260810
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_sim --parallel 2
      - name: Review three simulate-this routes
        run: |
          build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-final-1.txt
          build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee trace-final-2.txt
          build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-final-3.txt
      - name: Regenerate canonical setup evidence
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Regenerate paired setup evidence
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Regenerate setup documentation
        run: |
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          git diff --check
          git diff --name-status
      - name: Validate generated contracts
        run: |
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
          python tests/update_setup_docs_tests.py
      - name: Materialize generated evidence and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue_2725_regeneration.yml
          git add -A results docs/REPORT.md docs/TRACE_AUDIT.md docs/MULTI_DECK_REPORT.md README.md
          git diff --cached --check
          git commit -m "Refresh #2725 source-bound setup evidence"
          git push origin HEAD:regen/2725-clean-main-20260810