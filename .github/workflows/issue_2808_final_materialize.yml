name: Issue 2808 final materialization

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2808-garbodor-shake-current-main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind completed exact-source CI evidence
        run: echo "CI_RUN_ID=31426466125" >> "$GITHUB_ENV"
      - name: Prepare final source state
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/card_audit_contract_tests.py')
          source = path.read_text(encoding='utf-8')
          anchor = '    "xy1-123",\n'
          replacement = '    "swsh7-142", "xy1-123", "xy9-57",\n'
          if replacement not in source:
              if anchor not in source:
                  raise SystemExit('card-audit canonical-ID anchor changed')
              source = source.replace(anchor, replacement, 1)
              path.write_text(source, encoding='utf-8')
          PY
          git rm .github/workflows/issue_2808_final_materialize.yml
      - name: Reuse the single paired 100k aggregate from CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/issue-2808-release
          mkdir -p /tmp/issue-2808-release
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-validation-1 --dir /tmp/issue-2808-release
          test -f /tmp/issue-2808-release/multi-deck-matrix.csv
          test -f /tmp/issue-2808-release/t2-t3-matrix.csv
          test -x /tmp/issue-2808-release/build/regidrago_sim || chmod +x /tmp/issue-2808-release/build/regidrago_sim
          cp /tmp/issue-2808-release/multi-deck-matrix.csv results/multi_deck_comparison.csv
          cp /tmp/issue-2808-release/t2-t3-matrix.csv results/simulation_results.csv
      - name: Refresh manifests and reviewed traces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from scripts import generate_multi_deck_comparison as multi
          from scripts import regenerate_setup_baselines as base

          results = Path('results')
          executable = Path('/tmp/issue-2808-release/build/regidrago_sim')
          matrix_seed = 20260705
          trials = 100000

          trace_dir = results / 'traces'
          trace_dir.mkdir(parents=True, exist_ok=True)
          baseline_manifest = base.build_manifest(matrix_seed, trials)
          expected_trace_files = set()
          for scenario, deadline, stem in base.TRACE_SPECS:
              seed, trace = base.find_trace_seed(executable, scenario, deadline, 5000)
              file_name = base.trace_file_name(stem, seed)
              expected_trace_files.add(file_name)
              base.atomic_write_text(trace_dir / file_name, trace)
              baseline_manifest['traces'].append({
                  'scenario': scenario,
                  'deadline': deadline,
                  'seed': seed,
                  'file': file_name,
              })
          base.reconcile_generated_traces(trace_dir, expected_trace_files)
          base.atomic_write_text(
              results / base.MANIFEST_FILENAME,
              json.dumps(baseline_manifest, indent=2, sort_keys=True) + '\n',
          )

          multi_traces = multi.generate_traces(executable, results / 'multi_deck_traces')
          multi_manifest = multi.build_manifest(
              results / 'multi_deck_comparison.csv', multi_traces, trials, matrix_seed
          )
          multi.atomic_write_text(
              results / 'multi_deck_manifest.json',
              json.dumps(multi_manifest, indent=2, sort_keys=True) + '\n',
          )
          PY
      - name: Regenerate reports and validate final tree
        run: |
          set -euo pipefail
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          python tests/card_audit_contract_tests.py
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
          python tests/update_setup_docs_tests.py
          git diff --check
      - name: Commit generated evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A tests/card_audit_contract_tests.py results docs/REPORT.md docs/TRACE_AUDIT.md docs/MULTI_DECK_REPORT.md README.md .github/workflows/issue_2808_final_materialize.yml
          git diff --cached --check
          git commit -m 'Refresh #2808 source-bound setup evidence'
          git push origin HEAD:fix/2808-garbodor-shake-current-main
