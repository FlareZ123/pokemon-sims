name: Issue 2808 materialize current main

on:
  push:
    branches: [fix/2808-garbodor-shake-current-main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2808-garbodor-shake-current-main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge exact current main and prepare final source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          start_main=$(git rev-parse origin/main)
          echo "MATERIALIZE_MAIN=$start_main" >> "$GITHUB_ENV"
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/card_audit_contract_tests.py')
          source = path.read_text(encoding='utf-8')
          anchor = '    "xy1-123",\n'
          replacement = '    "swsh7-142", "xy1-123", "xy9-57",\n'
          if replacement not in source:
              if anchor not in source:
                  raise SystemExit('card-audit canonical-ID anchor changed')
              source = source.replace(anchor, replacement, 1)
              path.write_text(source, encoding='utf-8')
          PY

          # Remove the temporary workflow before provenance is generated so the
          # committed evidence is derived from the intended final repository tree.
          git rm .github/workflows/issue_2808_materialize_current.yml

      - name: Build exact merged simulator
        run: |
          set -euo pipefail
          cmake -S . -B build-issue-2808 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-issue-2808 --parallel 2

      - name: Generate one paired 100k aggregate
        run: |
          set -euo pipefail
          ./build-issue-2808/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out results/multi_deck_comparison.csv
          python scripts/extract_deck_matrix.py \
            --input results/multi_deck_comparison.csv \
            --output results/simulation_results.csv \
            --deck regidrago-shell

      - name: Refresh source-bound manifests and reviewed traces
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from scripts import generate_multi_deck_comparison as multi
          from scripts import regenerate_setup_baselines as base

          results = Path('results')
          executable = Path('build-issue-2808/regidrago_sim')
          matrix_seed = 20260705
          trials = 100000

          trace_dir = results / 'traces'
          trace_dir.mkdir(parents=True, exist_ok=True)
          baseline_manifest = base.build_manifest(matrix_seed, trials)
          expected_trace_files = set()
          for scenario, deadline, stem in base.TRACE_SPECS:
              seed, trace = base.find_trace_seed(executable, scenario, deadline, 5000)
              file_name = base.trace_file_name(stem, seed)
              expected_trace_files.add(file_name)
              base.atomic_write_text(trace_dir / file_name, trace)
              baseline_manifest['traces'].append({
                  'scenario': scenario,
                  'deadline': deadline,
                  'seed': seed,
                  'file': file_name,
              })
          base.reconcile_generated_traces(trace_dir, expected_trace_files)
          base.atomic_write_text(
              results / base.MANIFEST_FILENAME,
              json.dumps(baseline_manifest, indent=2, sort_keys=True) + '\n',
          )

          multi_traces = multi.generate_traces(executable, results / 'multi_deck_traces')
          multi_manifest = multi.build_manifest(
              results / 'multi_deck_comparison.csv', multi_traces, trials, matrix_seed
          )
          multi.atomic_write_text(
              results / 'multi_deck_manifest.json',
              json.dumps(multi_manifest, indent=2, sort_keys=True) + '\n',
          )
          PY

      - name: Regenerate reports and validate final tree
        run: |
          set -euo pipefail
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          python tests/card_audit_contract_tests.py
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
          python tests/update_setup_docs_tests.py
          ctest --test-dir build-issue-2808 --parallel 4 --output-on-failure
          git diff --check

      - name: Refuse stale-main materialization
        run: |
          set -euo pipefail
          git fetch origin main
          current_main=$(git rev-parse origin/main)
          if [ "$current_main" != "$MATERIALIZE_MAIN" ]; then
            echo "main moved during materialization: $MATERIALIZE_MAIN -> $current_main" >&2
            exit 1
          fi

      - name: Commit exact evidence
        run: |
          set -euo pipefail
          # This marker is deliberately outside src/include provenance. The next
          # user-authored commit deletes it to trigger the normal PR workflows on
          # the exact generated evidence tree.
          printf '%s\n' "$MATERIALIZE_MAIN" > results/.issue_2808_materialized
          git add -A tests/card_audit_contract_tests.py results docs/REPORT.md docs/TRACE_AUDIT.md docs/MULTI_DECK_REPORT.md README.md .github/workflows/issue_2808_materialize_current.yml
          git diff --cached --check
          git commit -m 'Refresh #2808 exact current-main setup evidence'
          git push origin HEAD:fix/2808-garbodor-shake-current-main
