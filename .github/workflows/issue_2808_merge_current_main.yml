name: Issue 2808 merge current main

on:
  push:
    branches: [fix/2808-garbodor-shake-current-main]

permissions:
  contents: write

jobs:
  merge-current-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2808-garbodor-shake-current-main
          fetch-depth: 0
      - name: Merge current main with resolved composition
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git rm .github/workflows/issue_2808_merge_current_main.yml
          git commit -m 'Remove temporary #2808 main-merge workflow'

          git fetch origin main
          if git merge --no-edit origin/main; then
            :
          else
            git checkout --ours src/trace_engine_v2/composition/engine_body.inc
            git add src/trace_engine_v2/composition/engine_body.inc
            git rm -f src/trace_engine_v2/composition/core_engine_body.inc 2>/dev/null || true

            unresolved=$(git diff --name-only --diff-filter=U)
            if [ -n "$unresolved" ]; then
              echo "Unexpected unresolved paths:" >&2
              echo "$unresolved" >&2
              exit 1
            fi
            git commit --no-edit
          fi

          git diff origin/main...HEAD --check
          git push origin HEAD:fix/2808-garbodor-shake-current-main
