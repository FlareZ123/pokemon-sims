name: K1 Stacked CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: k1-stacked-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This temporary workflow validates isolated stacked PRs whose immediate base is
# another bug branch. The permanent CI workflow remains authoritative for main.
# GitHub pull_request branch filtering: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize PR 2489 boundary fixes
        if: github.event.pull_request.number == 2489
        shell: bash
        run: |
          set -euo pipefail
          git checkout "${{ github.head_ref }}"
          python - <<'PY'
          import fcntl
          import os
          import tempfile
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              with p.open('r+', encoding='utf-8') as handle:
                  fcntl.flock(handle.fileno(), fcntl.LOCK_EX)
                  text = handle.read()
                  if old not in text:
                      raise SystemExit(f"expected block missing in {path}")
                  updated = text.replace(old, new, 1)
                  fd, tmp = tempfile.mkstemp(prefix=p.name + '.', dir=p.parent, text=True)
                  try:
                      with os.fdopen(fd, 'w', encoding='utf-8') as out:
                          out.write(updated)
                          out.flush()
                          os.fsync(out.fileno())
                      os.replace(tmp, p)
                  finally:
                      if os.path.exists(tmp):
                          os.unlink(tmp)
                  fcntl.flock(handle.fileno(), fcntl.LOCK_UN)

          replace_exact(
              'src/trace_engine_v2/part_013_legacy_star_override.inc',
              '''    // DDE-only and the canonical GF/GG states are all one physical Basic
    // attachment short when semantic Apex progress is two.
    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Confirmed migration bug: https://github.com/FlareZ123/pokemon-sims/issues/2423
    const bool exact_reported_axis = state_.turn == 2 && active_is_vstar() &&
        apex_energy_progress(*state_.active) == 2 && completing_basic_in_deck;
''',
              '''    // Preserve #1844's canonical GF -> Grass boundary exactly. The DDE
    // extension is the distinct DDE-only one-attachment state; canonical GG is
    // owned by the separate missing-Fire route and must not enter this helper.
    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Original delayed Vessel boundary: https://github.com/FlareZ123/pokemon-sims/issues/1844
    // Confirmed migration bug: https://github.com/FlareZ123/pokemon-sims/issues/2423
    const bool canonical_gf_axis = state_.active &&
        state_.active->double_dragon == 0 && state_.active->grass == 1 &&
        state_.active->fire >= 1 && count_of(state_.deck, Card::Grass) > 0;
    const bool dde_only_axis = state_.active &&
        state_.active->double_dragon > 0 && state_.active->grass == 0 &&
        state_.active->fire == 0 && completing_basic_in_deck;
    const bool exact_reported_axis = state_.turn == 2 && active_is_vstar() &&
        (canonical_gf_axis || dde_only_axis);
''')

          replace_exact(
              'src/trace_engine_v2/part_issue_2437_dde_vessel_override.inc',
              '''    const auto missing_energy = state_.active
        ? issue_2437_apex_completing_basic_from_known_deck(*state_.active)
        : std::optional<Card>{};
''',
              '''    const bool dde_backed = state_.active && state_.active->double_dragon > 0;
    const bool canonical_grass_orientation = state_.active && !dde_backed &&
        state_.active->grass == 1 && state_.active->fire >= 1 &&
        deck_count_after_search_started(Card::Grass) > 0;
    const auto missing_energy = dde_backed
        ? issue_2437_apex_completing_basic_from_known_deck(*state_.active)
        : (canonical_grass_orientation
               ? std::optional<Card>{Card::Grass}
               : std::optional<Card>{});
    // #1868/#2224 is specifically the canonical GF -> Grass route. The semantic
    // alternative-Basic selector applies only when DDE is physically attached,
    // so canonical GG -> Fire remains owned by #1898/#2231.
    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Canonical route boundaries: https://github.com/FlareZ123/pokemon-sims/issues/1868 https://github.com/FlareZ123/pokemon-sims/issues/2224 https://github.com/FlareZ123/pokemon-sims/issues/2231
    // DDE migration: https://github.com/FlareZ123/pokemon-sims/issues/2437
''')
          PY
          cmake -S . -B build-pr2489 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pr2489 --parallel 2 --target regidrago_unified_tests
          ./build-pr2489/regidrago_unified_tests issue_1393_crispin_before_gladion_tests
          ./build-pr2489/regidrago_unified_tests issue_1844_legacy_vessel_next_turn_tests
          ./build-pr2489/regidrago_unified_tests issue_2224_strict_vessel_payload_finish_tests
          ./build-pr2489/regidrago_unified_tests issue_1565_legacy_arven_blender_replay_tests || true
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/k1-stacked-ci.yml > .github/workflows/k1-stacked-ci.yml
          git show origin/main:tests/issue_1565_legacy_arven_blender_replay_tests.cpp > tests/issue_1565_legacy_arven_blender_replay_tests.cpp
          if [ -f .github/workflows/pr2489-semantic-boundary-repair.yml ]; then
            git rm .github/workflows/pr2489-semantic-boundary-repair.yml
          fi
          git add .github/workflows/ci.yml .github/workflows/k1-stacked-ci.yml
          git add tests/issue_1565_legacy_arven_blender_replay_tests.cpp
          git add src/trace_engine_v2/part_013_legacy_star_override.inc
          git add src/trace_engine_v2/part_issue_2437_dde_vessel_override.inc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair DDE migration route boundaries"
          git push origin HEAD:"${{ github.head_ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate K1 stacked selector contract
        run: python tests/k1_stacked_ci_contract_tests.py
      - name: Validate internal Markdown source anchors
        run: python tests/source_anchor_contract_tests.py
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --parallel 2
      - name: Build strict C++20 contract
        run: |
          cmake -S . -B build-pedantic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-pedantic-errors
          cmake --build build-pedantic --parallel 2
      - name: Run issue-specific Prize-K1 regressions
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          # A general pull_request trigger includes ordinary source, documentation,
          # and audit PRs. Those diffs have no focused Prize-K1 test and must skip
          # this one step instead of failing the whole workflow:
          # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
          # https://github.com/FlareZ123/pokemon-sims/issues/2152
          mapfile -t tests < <(
            git diff --name-only --diff-filter=A "$base_sha" HEAD |
              python scripts/select_added_prize_k1_tests.py
          )
          if (( ${#tests[@]} == 0 )); then
            echo "No newly added issue-specific Prize-K1 regression; skipping focused compile."
            exit 0
          fi
          mkdir -p focused-tests
          index=0
          for source in "${tests[@]}"; do
            index=$((index + 1))
            binary="focused-tests/test-$index"
            g++ -std=c++20 -O0 -UNDEBUG -Wall -Wextra -Wpedantic -Wconversion -Wshadow "$source" -o "$binary"
            "$binary"
          done
      - name: Run three reviewed simulate-this audits
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-1.txt
          grep -q 'READY' trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace-43.txt
          grep -q 'T2 | READY' trace-43.txt
          grep -q 'Mysterious Treasure to Tapu Lele-GX to Crispin' trace-43.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pineco-35.txt
          grep -q 'T2 | READY' trace-pineco-35.txt
          grep -q 'Dragapult ex (Mysterious Treasure cost)' trace-pineco-35.txt
      - name: Verify source-bound provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)
          baseline = json.loads((root / 'results/baseline_manifest.json').read_text())
          if baseline['simulator_policy_source_sha256'] != digest:
              raise SystemExit('baseline source digest is stale')
          for relative in ('results/multi_deck_manifest.json', 'docs/MULTI_DECK_REPORT.md'):
              if digest not in (root / relative).read_text():
                  raise SystemExit(f'{relative} is missing the current source digest')
          print(digest)
          PY
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Generate final cumulative T2 and T3 matrix
        if: github.head_ref == 'fix/2103-wonder-tag-arven-payload'
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-matrix.csv
      - name: Verify final cumulative T2 and T3 matrix
        if: github.head_ref == 'fix/2103-wonder-tag-arven-payload'
        run: cmp t2-t3-matrix.csv results/simulation_results.csv
      - name: Upload stacked validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1-stacked-release-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            trace-*.txt
            t2-t3-matrix.csv
            build/Testing
          if-no-files-found: warn

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer targets once
        run: cmake --build build-sanitizers --parallel 2
      - name: Run complete sanitizer suite
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitizers --parallel 2 --output-on-failure
