name: Clean Klara evidence branch

on:
  push:
    branches: [klara-evidence-helper]

permissions:
  contents: write
  pull-requests: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement-1773-klara-swap
          fetch-depth: 0
      - name: Remove helper build products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf build-finalize
          git add -A
          git commit -m 'Remove helper build products'
          git push origin HEAD:enhancement-1773-klara-swap
          gh pr comment 1774 --body 'Removed all helper build products from the Klara branch. The PR diff now contains only source, tests, documentation, and committed evidence.'
      - name: Report cleanup failure
        if: failure()
        shell: bash
        run: gh pr comment 1774 --body 'The Klara build-product cleanup helper failed. Inspect workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.'
