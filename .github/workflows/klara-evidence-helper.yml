name: Finalize Klara evidence

on:
  push:
    branches: [klara-evidence-helper]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement-1773-klara-swap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import exact matrices and regenerate reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mkdir -p /tmp/klara-release
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8739367745/zip" > /tmp/klara-release.zip
          unzip -q /tmp/klara-release.zip -d /tmp/klara-release
          cmp /tmp/klara-release/t2-t3-matrix.csv results/simulation_results.csv
          cp /tmp/klara-release/multi-deck-matrix.csv results/multi_deck_comparison.csv

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          root = Path('.').resolve()
          sys.path.insert(0, str(root))
          from scripts.baseline_provenance import simulator_policy_source_digest

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              digest.update(path.read_bytes())
              return digest.hexdigest()

          policy_digest = simulator_policy_source_digest(root)

          baseline_path = root / 'results' / 'baseline_manifest.json'
          baseline = json.loads(baseline_path.read_text())
          baseline['simulator_policy_source_sha256'] = policy_digest
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n')

          comparison_path = root / 'results' / 'multi_deck_comparison.csv'
          multi_path = root / 'results' / 'multi_deck_manifest.json'
          multi = json.loads(multi_path.read_text())
          multi['simulator_policy_source_sha256'] = policy_digest
          multi['comparison_csv_sha256'] = sha256(comparison_path)
          multi_path.write_text(json.dumps(multi, indent=2, sort_keys=True) + '\n')
          PY

          python tests/source_anchor_contract_tests.py
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py

          rm -f .github/klara-ci-trigger.txt
          git add -A
          git commit -m 'Finalize Klara matrices and reports'
          git push origin HEAD:enhancement-1773-klara-swap
          gh pr comment 1774 --body 'Final Klara evidence commit pushed from the exact Release artifacts. Both generated-report contracts passed before push.'
      - name: Report helper failure
        if: failure()
        shell: bash
        run: gh pr comment 1774 --body 'The Klara evidence helper failed. Inspect workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.'
