name: Klara source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: tar --exclude=.git -czf klara-source-snapshot.tgz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: klara-source-snapshot
          path: klara-source-snapshot.tgz
          if-no-files-found: error
