name: Apply Klara implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'enhancement-1773-klara-swap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement-1773-klara-swap
          fetch-depth: 0
      - name: Apply source-bound implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/klara-patch/part-00 \
              .github/klara-patch/part-01 \
              .github/klara-patch/rest-00 \
              .github/klara-patch/rest-01 \
              .github/klara-patch/rest-02a \
              .github/klara-patch/rest-02b \
              .github/klara-patch/rest-03 \
            | base64 -d | tar -xzf -
          rm -rf .github/klara-patch
          rm -f .github/workflows/klara-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Klara and replace Roseanne’s Backup'
          git push origin HEAD:enhancement-1773-klara-swap
