name: Linearize K1 Branch Stack

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: linearize-k1-stack
  cancel-in-progress: true

jobs:
  linearize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for source-bound output refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Workflow run status API: https://docs.github.com/en/rest/actions/workflow-runs?apiVersion=2022-11-28#get-a-workflow-run
          while true; do
            status="$(gh api '/repos/${{ github.repository }}/actions/runs/30710015366' --jq .status)"
            conclusion="$(gh api '/repos/${{ github.repository }}/actions/runs/30710015366' --jq '.conclusion // ""')"
            echo "refresh status=$status conclusion=$conclusion"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]]
              break
            fi
            sleep 30
          done
      - name: Cancel superseded stacked validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api "/repos/${{ github.repository }}/actions/workflows/325167671/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[].id' | while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                gh api --method POST "/repos/${{ github.repository }}/actions/runs/${run_id}/cancel" || true
              done
          done
      - name: Restore reviewed issue generator
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/build_k1_stack.py
          python -m py_compile /tmp/build_k1_stack.py
      - name: Rebuild a strictly linear issue stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --detach origin/main

          issues=(2070 2072 2073 2074 2076 2077 2078 2079 2080 2081 2082 2083 2084 2085 2086 2087 2088 2089 2090 2091 2092 2093 2094 2096 2097 2098 2099 2100 2101 2102 2103)
          branches=(fix/2070-oricorio-treasure-tapu fix/2072-wonder-tag-burnet-legacy-star fix/2073-fss-treasure-energy fix/2074-wonder-tag-complete-route fix/2076-arven-fss-blender-contention fix/2077-ultra-ball-post-payload-outlet fix/2078-one-discard-known-dead-costs fix/2079-evolution-incense-payload-outlet fix/2080-fss-k1-hold-targets fix/2081-late-steven-vstar-vessel fix/2082-wonder-tag-steven-fss fix/2083-late-steven-payload-treasure fix/2084-duplicate-held-arven fix/2085-late-steven-held-blender fix/2086-late-steven-held-burnet fix/2087-fss-latias-burnet fix/2088-fss-bank-tate fix/2089-arven-quick-ball-latias fix/2090-quick-ball-dialga-vessel fix/2091-blender-known-dead-costs fix/2092-arven-redundant-fss-regression fix/2093-rulebox-late-steven fix/2094-treasure-tapu-projection fix/2096-arven-powerglass fix/2097-fss-complete-quick-ball fix/2098-wonder-tag-redundant-crispin fix/2099-wonder-tag-gladion-held-energy fix/2100-wonder-tag-arven-held-burnet fix/2101-wonder-tag-steven-consistency fix/2102-late-steven-t3-compression fix/2103-wonder-tag-arven-payload)

          for index in "${!issues[@]}"; do
            issue="${issues[$index]}"
            branch="${branches[$index]}"
            echo "linearizing issue $issue on $branch"
            git fetch origin "$branch"
            python /tmp/build_k1_stack.py . --issue "$issue"
            git add src tests
            git commit -m "Accept Prize-inspection K1 for issue #$issue"

            git checkout "origin/$branch" -- results docs/REPORT.md docs/MULTI_DECK_REPORT.md
            python - <<'PY'
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest
          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)
          baseline = json.loads((root / 'results/baseline_manifest.json').read_text())
          if baseline['simulator_policy_source_sha256'] != digest:
              raise SystemExit(f"source/output digest mismatch: {baseline['simulator_policy_source_sha256']} != {digest}")
          for relative in ('results/multi_deck_manifest.json', 'docs/MULTI_DECK_REPORT.md'):
              if digest not in (root / relative).read_text():
                  raise SystemExit(f'{relative} is missing current digest {digest}')
          PY
            git add results docs/REPORT.md docs/MULTI_DECK_REPORT.md
            if ! git diff --cached --quiet; then
              git commit -m "Refresh source-bound matrices for issue #$issue"
            fi
            git status --short
            test -z "$(git status --porcelain)"
            git push --force origin "HEAD:refs/heads/$branch"
          done
