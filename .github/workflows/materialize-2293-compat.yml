name: Materialize issue 2293 compatibility fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-2293-compat.yml'
      - 'scripts/apply_2293_compat.py'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'automation/2293-compat-materialize'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply compatibility correction
        run: |
          python scripts/apply_2293_compat.py
          rm scripts/apply_2293_compat.py
          rm .github/workflows/materialize-2293-compat.yml
          git diff --check
      - name: Build and run focused regressions
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R '2293|1675' --output-on-failure
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 291 --require-ready-by 4 > /tmp/seed291.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1907 > /tmp/seed1907.txt
          grep -F 'T5 | READY' /tmp/seed1907.txt
          grep -F 'Completed the deadline Latias ex promotion route' /tmp/seed1907.txt
      - name: Commit validated permanent diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Fix #2293 preserve late Latias promotion contract'
          git push origin HEAD:${{ github.head_ref }}
