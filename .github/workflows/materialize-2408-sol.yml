name: Materialize 2408 current-main patch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/2408-burnet-resource-sol-20260811'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2408-burnet-resource-sol-20260811
          fetch-depth: 0
      - name: Copy reviewed scoped patch
        run: |
          git fetch origin fix/2408-burnet-resource-clean-20260810
          git checkout origin/fix/2408-burnet-resource-clean-20260810 -- \
            src/trace_engine_v2/part_issue_1873_blender_crispin_supporter_override.inc \
            src/trace_engine_v2/part_issue_2408_burnet_resource_override.inc \
            tests/issue_1059_prized_treasure_gladion_tests.cpp \
            tests/issue_1341_burnet_held_payload_tests.cpp \
            tests/issue_2408_burnet_before_serena_tests.cpp \
            tests/run_issue_1079_celestial_roar_hold.cmake
          git rm .github/workflows/materialize-2408-sol.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Fix #2408: preserve Serena and held Dragon on equal-turn Burnet route"
          git push origin HEAD:fix/2408-burnet-resource-sol-20260811