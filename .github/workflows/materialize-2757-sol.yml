name: Materialize issue 2757 current-main fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-2757-sol.yml'
      - 'tests/issue_2757_jit_profile_gate_tests.cpp'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.head_ref == 'reclaim/2757-current-main-sol-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply shared JIT timing gate atomically
        shell: bash
        run: |
          python - <<'PY'
          import fcntl
          import os
          import tempfile
          from pathlib import Path

          path = Path('src/trace_engine_v2/part_009b1.inc')
          lock_path = Path('src/trace_engine_v2/.issue_2757.lock')
          with lock_path.open('w', encoding='utf-8') as lock_file:
              fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)
              source = path.read_text(encoding='utf-8')
              old = '''  std::optional<Card> quick_ball_crispin_replaced_energy_cost() const {\n    if (scenario_.dci != DciProfile::StrictJit || state_.turn != 1 ||\n'''
              new = '''  std::optional<Card> quick_ball_crispin_replaced_energy_cost() const {\n    // StrictJit and MatchupFlexJit share current-turn payload timing.\n    // JIT policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment\n    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2757\n    if (!strict_payload_timing() || state_.turn != 1 ||\n'''
              if source.count(old) != 1:
                  raise RuntimeError(f'expected one #2757 profile gate, found {source.count(old)}')
              updated = source.replace(old, new, 1).replace(
                  'Brilliant Blender supplies the turn-two strict-JIT payload, and Latias ex',
                  'Brilliant Blender supplies the turn-two current-turn JIT payload, and Latias ex',
                  1,
              )
              fd, temp_name = tempfile.mkstemp(dir=path.parent, prefix=path.name + '.', suffix='.tmp')
              try:
                  with os.fdopen(fd, 'w', encoding='utf-8', newline='') as temp_file:
                      temp_file.write(updated)
                      temp_file.flush()
                      os.fsync(temp_file.fileno())
                  os.replace(temp_name, path)
              finally:
                  if os.path.exists(temp_name):
                      os.unlink(temp_name)
          lock_path.unlink(missing_ok=True)
          PY
          git diff --check

      - name: Compile and run isolated issue regression
        shell: bash
        run: |
          c++ -std=c++20 -O2 -pthread tests/issue_2757_jit_profile_gate_tests.cpp -o /tmp/issue_2757_jit_profile_gate_tests
          /tmp/issue_2757_jit_profile_gate_tests

      - name: Commit validated source fix
        shell: bash
        run: |
          rm .github/workflows/materialize-2757-sol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/trace_engine_v2/part_009b1.inc .github/workflows/materialize-2757-sol.yml
          git commit -m 'Fix #2757 use shared JIT timing gate'
          git push origin HEAD:${{ github.head_ref }}
