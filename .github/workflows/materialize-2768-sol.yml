name: Materialize issue 2768 semantic JIT fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-2768-sol.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.head_ref == 'reclaim/2768-current-main-sol-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply shared JIT predicate and regression atomically
        shell: bash
        run: |
          python - <<'PY'
          import fcntl
          import os
          import tempfile
          from pathlib import Path

          def update(path_text, replacements):
              path = Path(path_text)
              lock_path = path.with_name(path.name + '.issue2768.lock')
              with lock_path.open('w', encoding='utf-8') as lock_file:
                  fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)
                  text = path.read_text(encoding='utf-8')
                  for old, new in replacements:
                      if text.count(old) != 1:
                          raise RuntimeError(f'{path}: expected one match, found {text.count(old)} for {old[:100]!r}')
                      text = text.replace(old, new, 1)
                  fd, tmp = tempfile.mkstemp(dir=path.parent, prefix=path.name + '.', suffix='.tmp')
                  try:
                      with os.fdopen(fd, 'w', encoding='utf-8', newline='') as f:
                          f.write(text)
                          f.flush()
                          os.fsync(f.fileno())
                      os.replace(tmp, path)
                  finally:
                      if os.path.exists(tmp):
                          os.unlink(tmp)
              lock_path.unlink(missing_ok=True)

          source = 'src/trace_engine_v2/part_issue_1393_crispin_route_helper.inc'
          old = '''  bool issue_1393_held_crispin_completion_available() const {\n    // A resolved full Prize inspection establishes K1 without a deck search: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states\n    if (scenario_.dci != DciProfile::StrictJit ||\n'''
          new = '''  bool issue_1393_held_crispin_completion_available() const {\n    // A resolved full Prize inspection establishes K1 without a deck search: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states\n    // StrictJit and MatchupFlexJit share current-turn payload timing; keep the\n    // semantic predicate centralized instead of duplicating profile names here:\n    // https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment\n    // https://github.com/FlareZ123/pokemon-sims/issues/2768\n    if (!strict_payload_timing() ||\n'''
          update(source, [(old, new)])

          test = 'tests/issue_1393_crispin_before_gladion_tests.cpp'
          anchor = '''void test_prize_inspection_alone_establishes_k1() {\n'''
          addition = '''void test_issue_2768_shared_jit_profiles() {\n  const sim::DeckRecipe recipe = sim::baseline_recipe();\n  for (const sim::DciProfile profile : {sim::DciProfile::StrictJit,\n                                        sim::DciProfile::MatchupFlexJit}) {\n    const sim::Scenario scenario{"issue-2768-jit", profile,\n                                 sim::LockMode::None, false, 4};\n    std::mt19937_64 rng{2768};\n    sim::Engine engine(scenario, recipe, rng);\n    sim::EngineTestAccess::set_state(engine, exact_state());\n    // Both registered current-turn JIT profiles have the same payload timing.\n    // Crispin completes GGF while held Brilliant Blender supplies the payload;\n    // Gladion remains the slower competing Supporter.\n    // Crispin: https://api.pokemontcg.io/v2/cards/sv7-133\n    // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164\n    // Gladion: https://api.pokemontcg.io/v2/cards/sm4-95\n    // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Official turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf\n    // Shared JIT policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment\n    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2768\n    expect(sim::EngineTestAccess::route_available(engine),\n           "Both current-turn JIT profiles must admit the held-Crispin route.");\n  }\n\n  const sim::Scenario control{"issue-2768-control",\n                              sim::DciProfile::NoDiscardControl,\n                              sim::LockMode::None, false, 4};\n  std::mt19937_64 control_rng{2769};\n  sim::Engine control_engine(control, recipe, control_rng);\n  sim::EngineTestAccess::set_state(control_engine, exact_state());\n  expect(!sim::EngineTestAccess::route_available(control_engine),\n         "NoDiscardControl must remain outside the current-turn JIT route.");\n}\n\n''' + anchor
          main_old = '''    test_exact_route_holds_fss_and_plays_crispin();\n    test_prize_inspection_alone_establishes_k1();\n'''
          main_new = '''    test_exact_route_holds_fss_and_plays_crispin();\n    test_issue_2768_shared_jit_profiles();\n    test_prize_inspection_alone_establishes_k1();\n'''
          update(test, [(anchor, addition), (main_old, main_new)])
          PY
          git diff --check

      - name: Compile and run focused regression
        shell: bash
        run: |
          c++ -std=c++20 -O2 -pthread tests/issue_1393_crispin_before_gladion_tests.cpp -o /tmp/issue_1393_tests
          /tmp/issue_1393_tests

      - name: Commit validated source fix
        shell: bash
        run: |
          rm .github/workflows/materialize-2768-sol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/trace_engine_v2/part_issue_1393_crispin_route_helper.inc tests/issue_1393_crispin_before_gladion_tests.cpp .github/workflows/materialize-2768-sol.yml
          git commit -m 'Fix #2768 use shared current-turn JIT predicate'
          git push origin HEAD:${{ github.head_ref }}
