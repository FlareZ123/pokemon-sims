name: Materialize issue 2834 on branch push

on:
  push:
    branches:
      - fix/2834-post-legacy-vessel-powerglass

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2834-post-legacy-vessel-powerglass
          fetch-depth: 0

      - name: Apply source and regression patch
        shell: bash
        run: |
          python scripts/materialize_2834.py
          rm scripts/materialize_2834.py
          rm .github/workflows/materialize-2834.yml
          rm .github/workflows/materialize-2834-push.yml
          git diff --check

      - name: Build and validate focused route
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'legacy_star_post_powerglass_vessel' --output-on-failure
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 2 | tee issue-2834-seed2.txt
          grep -q 'T2 | DISCARD .*Mega Dragonite ex (Earthen Vessel cost)' issue-2834-seed2.txt
          grep -q 'T2 | POWERGLASS' issue-2834-seed2.txt
          grep -q 'T2 | READY' issue-2834-seed2.txt

      - name: Run three independent simulate-this controls
        shell: bash
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-control-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-control-2.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-rulebox-ability-lock/go-second --seed 13 --require-ready-by 3 | tee trace-control-3.txt

      - name: Commit validated source and regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix #2834 post-Legacy Vessel Powerglass JIT finish'
          git push origin HEAD:fix/2834-post-legacy-vessel-powerglass
