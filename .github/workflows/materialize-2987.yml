name: Materialize issue 2987 public-state Tapu fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-2987.yml'
      - 'scripts/apply_issue_2987.py'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'bug/2987-proactive-tapu-public-state-sol'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply public-state repair
        run: |
          python scripts/apply_issue_2987.py
          rm scripts/apply_issue_2987.py
          rm .github/workflows/materialize-2987.yml
          git diff --check
      - name: Build and run focused regression
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R '1845' --output-on-failure
      - name: Commit validated permanent diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix #2987 generalize proactive Tapu surplus attachment'
          git push origin HEAD:${{ github.head_ref }}
