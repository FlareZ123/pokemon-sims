name: Materialize #3039 shared-JIT staging fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-3039.yml"
      - "tests/issue_3039_t1_vessel_shared_jit_tests.cpp"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply semantic profile fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/trace_engine_v2/part_014a.inc')
          text = path.read_text()
          old = '''const auto issue_1552_t1_vessel_route_available = [this] {
            if (secret_box_combo_enabled() ||
                scenario_.dci != DciProfile::StrictJit ||
                scenario_.locks != LockMode::None || !scenario_.going_first ||
          '''
          new = '''const auto issue_1552_t1_vessel_route_available = [this] {
            // StrictJit and MatchupFlexJit share the same ready-turn payload timing,
            // so profile identity cannot block this already-proven T1 staging route.
            // Same-turn JIT policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
            // Advanced procedure: https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
            // Confirmed cross-profile bug: https://github.com/FlareZ123/pokemon-sims/issues/3039
            if (secret_box_combo_enabled() ||
                !strict_payload_timing() ||
                scenario_.locks != LockMode::None || !scenario_.going_first ||
          '''
          if text.count(old) != 1:
              raise SystemExit('issue-1552 T1 Vessel profile anchor changed')
          path.write_text(text.replace(old, new))
          PY
      - name: Compile focused regression
        shell: bash
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            tests/issue_3039_t1_vessel_shared_jit_tests.cpp \
            -o issue-3039-tests
          ./issue-3039-tests
      - name: Build simulator
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_sim --parallel 2
      - name: Verify strict and matchup-flex witness traces
        shell: bash
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell \
            --scenario strict-jit/go-first --seed 165 --require-ready-by 2 \
            | tee strict.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell \
            --scenario matchup-flex-jit/go-first --seed 165 --require-ready-by 2 \
            | tee flex.txt
          grep -F "T1 | DISCARD | rules: R-EV-01 | Mysterious Treasure (Earthen Vessel cost)" strict.txt
          grep -F "T1 | DISCARD | rules: R-EV-01 | Mysterious Treasure (Earthen Vessel cost)" flex.txt
          grep -F "T2 | READY | rules: R-RVS-01; P-JIT-01" strict.txt
          grep -F "T2 | READY | rules: R-RVS-01; P-JIT-01" flex.txt
      - name: Commit validated production fix
        shell: bash
        run: |
          git config user.name "pokemon-sims automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/trace_engine_v2/part_014a.inc
          git commit -m "Fix #3039: share T1 Vessel staging across JIT profiles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
