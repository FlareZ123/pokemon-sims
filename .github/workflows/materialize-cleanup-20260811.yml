name: Materialize three cleanup composition commits

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-cleanup-20260811.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "pokemon-sims automation"
          git config user.email "actions@users.noreply.github.com"
      - name: Cleanup 1 - centralize opening Bench and Tate composition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parent = Path('src/trace_engine_v2/composition/opening_engine_overrides.inc')
          text = parent.read_text()
          start_marker = '// Preserve the legacy opening Bench, connector, recovery, discard, and Tate aliases\n'
          end_marker = '// Keep post-evolution discard provenance, Tate handling, and the following Item\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          child = Path('src/trace_engine_v2/composition/opening_bench_tate_stack.inc')
          child.write_text('#pragma once\n\n// Centralized legacy opening Bench/Tate alias stack.\n// C++ textual include semantics: https://eel.is/c++draft/cpp.include\n\n' + block)
          replacement = '''// Opening Bench/Tate alias stack is centralized so its macro lifetime is audited\n// in one composition unit.\n#include "opening_bench_tate_stack.inc"\n\n'''
          parent.write_text(text[:start] + replacement + text[end:])
          PY
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            src/regidrago_sim.cpp -o /tmp/regidrago-cleanup-1
          git add src/trace_engine_v2/composition/opening_engine_overrides.inc \
                  src/trace_engine_v2/composition/opening_bench_tate_stack.inc
          git commit -m "Cleanup: centralize opening Bench and Tate aliases"
      - name: Cleanup 2 - centralize search-item wrapper stack
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parent = Path('src/trace_engine_v2/composition/opening_engine_overrides.inc')
          text = parent.read_text()
          start_marker = '#if defined(play_mysterious_treasure) || defined(play_heavy_ball) || \\\n'
          end_marker = '// Continue into the Steven/Blender, legacy Supporter, Supporter selector, and\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          child = Path('src/trace_engine_v2/composition/opening_search_item_stack.inc')
          child.write_text('#pragma once\n\n// Centralized opening search-item wrapper stack. play_ultra_ball intentionally\n// remains exported for the immediately following Steven/Blender boundary.\n// C++ textual include semantics: https://eel.is/c++draft/cpp.include\n\n' + block)
          replacement = '''// Search-item wrapper aliases are centralized while preserving the intentional\n// play_ultra_ball export into the Steven/Blender layer.\n#include "opening_search_item_stack.inc"\n\n'''
          parent.write_text(text[:start] + replacement + text[end:])
          PY
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            src/regidrago_sim.cpp -o /tmp/regidrago-cleanup-2
          git add src/trace_engine_v2/composition/opening_engine_overrides.inc \
                  src/trace_engine_v2/composition/opening_search_item_stack.inc
          git commit -m "Cleanup: centralize opening search-item wrappers"
      - name: Cleanup 3 - centralize Supporter and VSTAR tail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parent = Path('src/trace_engine_v2/composition/opening_engine_overrides.inc')
          text = parent.read_text()
          start_marker = '// Preserve the Forest Seal Stone alias for the later post-part_014a wrapper chain.\n'
          start = text.index(start_marker)
          block = text[start:]
          child = Path('src/trace_engine_v2/composition/opening_supporter_vstar_stack.inc')
          child.write_text('#pragma once\n\n// Centralized Supporter/VSTAR tail. use_fss and use_celestial_roar remain\n// intentionally exported to post_014a_overrides.inc.\n// C++ textual include semantics: https://eel.is/c++draft/cpp.include\n\n' + block)
          replacement = '''// Supporter and VSTAR tail aliases are centralized; the two documented exports\n// remain live for post_014a_overrides.inc.\n#include "opening_supporter_vstar_stack.inc"\n'''
          parent.write_text(text[:start] + replacement)
          PY
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            src/regidrago_sim.cpp -o /tmp/regidrago-cleanup-3
          git add src/trace_engine_v2/composition/opening_engine_overrides.inc \
                  src/trace_engine_v2/composition/opening_supporter_vstar_stack.inc
          git commit -m "Cleanup: centralize Supporter and VSTAR composition"
      - name: Final Release build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Push three cleanup commits
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
