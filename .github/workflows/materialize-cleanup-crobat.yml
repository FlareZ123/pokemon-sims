name: Materialize Crobat modeling cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-cleanup-crobat.yml'
      - 'scripts/materialize_cleanup_crobat.py'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'cleanup-1786437140774'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize four cleanup commits
        run: python scripts/materialize_cleanup_crobat.py
      - name: Verify formatting, build, and complete tests
        run: |
          git diff --check HEAD~4..HEAD
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --parallel 4 --output-on-failure
      - name: Push validated cleanup history
        run: git push origin HEAD:${{ github.head_ref }}
