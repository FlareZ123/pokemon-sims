name: Materialize issue 1516 current-main fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1516-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1516-qb-tapu-crispin-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply current-main source patch
        run: |
          python .github/issue-1516-v2-apply.py
          git diff --check
          git diff --stat

      - name: Build Release
        shell: bash
        run: |
          set -o pipefail
          (cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2) 2>&1 | tee build.log

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_unified_tests issue_1516_quick_ball_tapu_crispin_tests 2>&1 | tee focused-test.log
          ctest --test-dir build -R issue_1516 --output-on-failure

      - name: Run three reviewed simulate-this traces
        shell: bash
        run: |
          set -euo pipefail
          # Quick Ball, Wonder Tag, Crispin, Gladion, and the one-Supporter limit: https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sm4-95 https://www.pokemon.com/us/pokemon-tcg/rules https://github.com/FlareZ123/pokemon-sims/issues/1516
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 42 --require-ready-by 3 | tee trace-42.txt
          grep -q "T1 | HOLD QUICK BALL" trace-42.txt
          ! grep -q "T1 | BENCH.*Tapu Lele-GX" trace-42.txt
          ! grep -q "T1 | WONDER TAG" trace-42.txt
          grep -q "T3 | READY" trace-42.txt

          # Strict JIT still requires the distinct Quick Ball to Tapu Lele-GX to Crispin route: https://api.pokemontcg.io/v2/cards/swsh1-179 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sv7-133 https://github.com/FlareZ123/pokemon-sims/issues/962
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee trace-104.txt
          grep -q "Searched a Basic Pokémon: Tapu Lele-GX" trace-104.txt
          grep -q "WONDER TAG" trace-104.txt
          grep -q "Crispin" trace-104.txt
          grep -q "T3 | READY" trace-104.txt

          # Mysterious Treasure may discard a Dragon payload and search Tapu Lele-GX for the legal T2 Crispin finish: https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv6-130 https://api.pokemontcg.io/v2/cards/sm2-60 https://api.pokemontcg.io/v2/cards/sv7-133 https://github.com/FlareZ123/pokemon-sims/issues/1209
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace-43.txt
          grep -q "T2 | READY" trace-43.txt

      - name: Regenerate repository matrices and reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Generate this-run T2 and T3 matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260726 --out run-shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260726 --out run-all-decks-matrix.csv
          cat run-shell-matrix.csv
          cat run-all-decks-matrix.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Run sanitizer suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Commit validated source and fresh evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/issue-1516-v2-apply.py .github/workflows/materialize-issue-1516-v2.yml
          git add src tests README.md docs results
          git diff --cached --check
          git commit -m "Preserve Quick Ball before duplicate Crispin route (#1516)"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload source-bound validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1516-current-main-${{ github.run_attempt }}
          path: |
            build.log
            focused-test.log
            trace-42.txt
            trace-104.txt
            trace-43.txt
            run-shell-matrix.csv
            run-all-decks-matrix.csv
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
