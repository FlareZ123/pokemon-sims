name: Materialize issue 1522 K0 Tate fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1522-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1522-tate-k0-hidden-vstar'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply K0 public-state projection and regression
        run: python .github/issue-1522-apply.py
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run paired K0 and K1 regression
        run: ctest --test-dir build -R issue_1522 --output-on-failure
      - name: Run three reviewed simulate-this traces
        shell: bash
        run: |
          set -euo pipefail
          # Core procedure and earliest-ready contract: https://www.pokemon.com/us/pokemon-tcg/rules
          # Repository scope: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#scope
          # Confirmed K0 fix: https://github.com/FlareZ123/pokemon-sims/issues/1522
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee issue-1522-trace-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee issue-1522-trace-2.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1522-trace-3.txt
          grep -q "T3 | READY" issue-1522-trace-1.txt
          grep -q "T2 | READY" issue-1522-trace-2.txt
          grep -q "T2 | READY" issue-1522-trace-3.txt
      - name: Generate exact canonical and paired matrices
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Configure, build, and run complete sanitizer suite
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitizers --parallel 2
          ctest --test-dir build-sanitizers --parallel 2 --output-on-failure
      - name: Upload source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1522-validation-${{ github.run_attempt }}
          path: |
            issue-1522-trace-*.txt
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitizers/Testing
          if-no-files-found: warn
      - name: Commit validated production files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/issue-1522-apply.py .github/workflows/materialize-issue-1522.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent K0 Tate hidden VSTAR oracle (#1522)"
          git push origin HEAD:fix/issue-1522-tate-k0-hidden-vstar
