name: Materialize issue 1526

on:
  push:
    branches: [fix/issue-1526-tate-dark-asset]

permissions:
  contents: write

concurrency:
  group: materialize-issue-1526
  cancel-in-progress: true

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize the source and regression atomically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/refresh-issue-1526.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(script, 'issue-1526-materializer', 'exec'))
          PY
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run focused issue 1526 regression
        run: ./build/regidrago_unified_tests issue_1526_tate_dark_asset_tests
      - name: Run three independent simulate-this reviews
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee issue-1526-trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee issue-1526-trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1526-trace-3.txt
          grep -q "T3 | READY" issue-1526-trace-1.txt
          grep -q "T2 | READY" issue-1526-trace-2.txt
          grep -q "T2 | READY" issue-1526-trace-3.txt
      - name: Regenerate source-bound probability evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-issue-1526.yml .github/workflows/materialize-issue-1526.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_turo_oricorio_override.inc tests/issue_1526_tate_dark_asset_tests.cpp .github/workflows/refresh-issue-1526.yml .github/workflows/materialize-issue-1526.yml docs/REPORT.md docs/MULTI_DECK_REPORT.md results/baseline_manifest.json results/simulation_results.csv results/multi_deck_manifest.json results/multi_deck_comparison.csv
          git commit -m "Reject unresolved Dark Asset Tate shadows (#1526)"
          git push origin HEAD:${{ github.ref_name }}
