name: Materialize issue 1561 refined fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1561-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1561-forretress-promotion-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply current-main source patch
        run: |
          python .github/issue-1561-v2-apply.py
          git diff --check
          git diff --stat

      - name: Build Release
        shell: bash
        run: |
          set -o pipefail
          (cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2) 2>&1 | tee build.log

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_unified_tests issue_1561_forretress_promotion_tests 2>&1 | tee focused-test.log
          ctest --test-dir build -R issue_1561 --output-on-failure

      - name: Run three independent simulate-this audits
        shell: bash
        run: |
          set -euo pipefail
          # Exploding Energy must select at least one Grass as an Ability, attach it, self-Knock Out, and promote the ready VSTAR: https://professorprogram.pokemon.com/news/11473085 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/us/pokemon-tcg/rules https://github.com/FlareZ123/pokemon-sims/issues/1561
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario matchup-flex-jit/go-second --seed 17 --require-ready-by 3 | tee trace-issue-1561-seed-17.txt
          grep -q "Exploding Energy attached 1 Basic Grass Energy" trace-issue-1561-seed-17.txt
          grep -q "T3 | PROMOTE" trace-issue-1561-seed-17.txt
          grep -q "T3 | READY" trace-issue-1561-seed-17.txt

          # The established lower-resource Pineco strict-JIT route remains a T2 control: https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-136 https://github.com/FlareZ123/pokemon-sims/issues/1420
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee trace-pineco-seed-35.txt
          grep -q "T2 | READY" trace-pineco-seed-35.txt

          # The registered shell matchup-flex route remains an independent T2 control: https://api.pokemontcg.io/v2/cards/swsh12-136 https://www.pokemon.com/us/pokemon-tcg/rules https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-shell-flex-seed-3.txt
          grep -q "T2 | READY" trace-shell-flex-seed-3.txt

      - name: Regenerate repository matrices and reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Generate this-run T2 and T3 matrices
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260726 --out run-shell-matrix.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260726 --out run-all-decks-matrix.csv
          cat run-shell-matrix.csv
          cat run-all-decks-matrix.csv

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Run ASan and UBSan suite
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-sanitize --parallel 2 --output-on-failure

      - name: Commit validated source and fresh evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/issue-1561-v2-apply.py .github/workflows/materialize-issue-1561-v2.yml
          git add src tests README.md docs results
          git diff --cached --check
          git commit -m "Use Exploding Energy for paid final promotion (#1561)"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload source-bound validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1561-refined-current-main-${{ github.run_attempt }}
          path: |
            build.log
            focused-test.log
            trace-issue-1561-seed-17.txt
            trace-pineco-seed-35.txt
            trace-shell-flex-seed-3.txt
            run-shell-matrix.csv
            run-all-decks-matrix.csv
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
