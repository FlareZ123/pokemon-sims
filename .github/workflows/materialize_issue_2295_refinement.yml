name: Materialize issue 2295 refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'fix/2295-reclaim-20260809-1324'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refinement
        run: python scripts/refine_issue_2295.py
      - name: Validate source anchors
        run: python tests/source_anchor_contract_tests.py
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Validate exact witnesses
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 29 --require-ready-by 4
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 86 --require-ready-by 4
      - name: Validate Professor Letter matrix counterexample space
        run: ./build/regidrago_unified_tests issue_2509_professors_letter_tests
      - name: Materialize refinement
        shell: bash
        run: |
          rm scripts/refine_issue_2295.py
          rm .github/workflows/materialize_issue_2295_refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix #2295 preflight paid-retreat Blender route"
          git push origin HEAD:${{ github.head_ref }}
