name: Materialize issue 2295 semantic retreat gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/2295-reclaim-20260809-1759'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize semantic gate
        run: python scripts/materialize_issue_2295_semantic_gate.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Semantic route and exact witness contracts
        run: |
          ctest --test-dir build --output-on-failure -R '^(regidrago_issue_2295_semantic_retreat_gate_tests|trace_issue_2295_)$'
      - name: Independent simulate-this controls
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 4
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2
      - name: Materialize validated source
        run: |
          rm scripts/materialize_issue_2295_semantic_gate.py
          rm .github/workflows/materialize_issue_2295_semantic_gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix #2295 generalize one-cost Basic retreat gate"
          git push origin HEAD:${{ github.head_ref }}
