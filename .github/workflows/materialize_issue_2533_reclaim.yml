name: Materialize issue 2533 reclaim

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/2533-reclaim-20260809-1322'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source and focused regression
        run: python scripts/apply_issue_2533_reclaim.py
      - name: Validate source anchors
        run: python tests/source_anchor_contract_tests.py
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run focused regression
        run: ctest --test-dir build -R regidrago_issue_2533_crobat_fss_powerglass_tests --output-on-failure
      - name: Materialize validated source
        shell: bash
        run: |
          rm scripts/apply_issue_2533_reclaim.py
          rm .github/workflows/materialize_issue_2533_reclaim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix #2533 use semantic Powerglass progress"
          git push origin HEAD:${{ github.head_ref }}
