name: Materialize issue 2533 v2

on:
  push:
    branches: [fix/2533-crobat-fss-powerglass-dde-v2]
    paths:
      - scripts/materialize_issue_2533_v2.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2533-crobat-fss-powerglass-dde-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply source and regression changes
        run: python scripts/materialize_issue_2533_v2.py
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Regenerate canonical setup baseline
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results
      - name: Regenerate multi-deck comparison
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Remove bootstrap files
        run: |
          rm scripts/materialize_issue_2533_v2.py
          rm .github/workflows/materialize_issue_2533_v2.yml
      - name: Commit materialized fix and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix #2533 semantic Powerglass compression guard"
          git push origin HEAD:fix/2533-crobat-fss-powerglass-dde-v2
