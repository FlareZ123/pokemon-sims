name: Merge latest main into Klara

on:
  pull_request:
    branches: [klara-workflow-base]

permissions:
  contents: write

jobs:
  merge:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'enhancement-1773-klara-swap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement-1773-klara-swap
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          rm -f .github/workflows/merge-klara-current-main.yml
          git add -A
          git commit -m 'Merge latest main into Klara enhancement'
          git push origin HEAD:enhancement-1773-klara-swap
