name: One-shot resolve issue 1845

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-resolve-issue-1845
  cancel-in-progress: false

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge current main into the issue branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main fix/issue-1845-proactive-tapu-retreat
          git checkout -B resolve-issue-1845 origin/fix/issue-1845-proactive-tapu-retreat
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            git checkout --ours -- \
              docs/MULTI_DECK_REPORT.md \
              docs/REPORT.md \
              results/baseline_manifest.json \
              results/multi_deck_comparison.csv \
              results/multi_deck_manifest.json \
              results/simulation_results.csv
            git add -- \
              docs/MULTI_DECK_REPORT.md \
              docs/REPORT.md \
              results/baseline_manifest.json \
              results/multi_deck_comparison.csv \
              results/multi_deck_manifest.json \
              results/simulation_results.csv
          fi
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved merge paths:\n%s\n' "$unresolved"
            exit 1
          fi

      - name: Build merged simulator
        run: |
          cmake -S . -B build-resolve -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-resolve --parallel 2

      - name: Run three source-bound simulate-this passes
        shell: bash
        run: |
          set -euo pipefail
          # Three visible Grass preserve Regidrago VSTAR's two-Grass Apex Dragon reserve while the third pays Tapu Lele-GX's printed one-Energy Retreat Cost:
          # https://api.pokemontcg.io/v2/cards/sm2-60
          # https://api.pokemontcg.io/v2/cards/swsh12-136
          # Official attachment, retreat, evolution, and first-turn procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Refined confirmed issue: https://github.com/FlareZ123/pokemon-sims/issues/1845
          ./build-resolve/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-combined-lock/go-first --seed 271828 | tee issue-1845-trace.txt
          grep -q 'T1 | ATTACH.*future paid Retreat' issue-1845-trace.txt
          grep -q 'banked one-Energy Retreat Cost' issue-1845-trace.txt
          grep -q 'T5 | READY' issue-1845-trace.txt

          # Reviewed earliest-route controls under the repository's observable-information policy:
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
          # https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#policy-versus-future-card-oracle
          ./build-resolve/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee shell-control-trace.txt
          grep -q 'T2 | READY' shell-control-trace.txt
          ./build-resolve/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee pineco-control-trace.txt
          grep -q 'T2 | READY' pineco-control-trace.txt

      - name: Regenerate source-bound reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/regenerate_setup_baselines.py --exe build-resolve/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
          python scripts/generate_multi_deck_comparison.py --exe build-resolve/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Push resolved bug branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/resolve-issue-1845-current-main.yml
          git rm -f .github/workflows/one-shot-resolve-issue-1845.yml
          git add docs results src tests
          git commit -m 'Rebase issue 1845 fix onto current main'
          git push origin HEAD:fix/issue-1845-proactive-tapu-retreat

      - name: Remove one-shot workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-main origin/main
          if [ -f .github/workflows/one-shot-resolve-issue-1845.yml ]; then
            git rm .github/workflows/one-shot-resolve-issue-1845.yml
            git commit -m 'Remove one-shot issue 1845 resolver'
            git push origin HEAD:main
          fi
