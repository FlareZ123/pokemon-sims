name: Patch 4044

on:
  push:
    branches:
      - bug-4044-held-burnet-locks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bug-4044-held-burnet-locks
          fetch-depth: 0

      - name: Apply exact lock-admission fix
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tempfile

          path = Path('src/trace_engine_v2/part_010_steven_crispin_override.inc')
          text = path.read_text(encoding='utf-8')
          old = '''    if (!prizes_known() || state_.turn >= scenario_.max_turn ||
                  scenario_.dci != DciProfile::StrictJit ||
                  scenario_.locks != LockMode::None || !supporter_allowed() ||
          '''
          new = '''    // This continuation uses Supporters, normal evolution, and a manual attachment.
              // Item-only and Rule Box Ability-only locks leave those actions legal; the
              // persistent Supporter lock remains rejected by supporter_allowed().
              // Steven's Resolve: https://api.pokemontcg.io/v2/cards/sm7-145
              // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
              // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
              // Advanced procedure: https://github.com/FlareZ123/pokemon-sims/blob/main/EN_advanced_manual-2025-transcription-structured.md
              // Lock semantics: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#scenario-lock-treatment
              // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/4044
              if (!prizes_known() || state_.turn >= scenario_.max_turn ||
                  scenario_.dci != DciProfile::StrictJit ||
                  !supporter_allowed() ||
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one #4044 target, found {text.count(old)}')
          updated = text.replace(old, new, 1)
          fd, temp_name = tempfile.mkstemp(dir=path.parent, prefix=path.name + '.', text=True)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8', newline='') as handle:
                  handle.write(updated)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_name, path)
          finally:
              if os.path.exists(temp_name):
                  os.unlink(temp_name)
          PY
          rm .github/workflows/patch-4044.yml

      - name: Commit production fix and retire helper workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trace_engine_v2/part_010_steven_crispin_override.inc .github/workflows/patch-4044.yml
          git commit -m "Fix #4044: use action-specific lock admission"
          git push origin HEAD:bug-4044-held-burnet-locks
