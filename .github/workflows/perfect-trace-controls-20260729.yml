name: Perfect Trace Controls 20260729

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  perfect-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Record exact tested source
        run: git rev-parse HEAD | tee tested-head.txt

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2

      - name: Perfect pass 1 shell strict JIT T2
        shell: bash
        run: |
          set -euo pipefail
          # T2 is the earliest legal VSTAR readiness window because Pokémon cannot evolve on either player's first turn: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Regidrago V/VSTAR, Steven, Crispin, Latias, and Blender: https://api.pokemontcg.io/v2/cards/swsh12-135 https://api.pokemontcg.io/v2/cards/swsh12-136 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-76 https://api.pokemontcg.io/v2/cards/sv8-164
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 2 | tee perfect-pass-1.txt

      - name: Perfect pass 2 shell matchup-flex T2
        shell: bash
        run: |
          set -euo pipefail
          # T2 is the earliest legal VSTAR readiness window: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Mysterious Treasure, Steven, Crispin, Blender, and Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/sv8-164 https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee perfect-pass-2.txt

      - name: Perfect pass 3 Pineco strict JIT T2
        shell: bash
        run: |
          set -euo pipefail
          # T2 is the earliest legal VSTAR readiness window: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf
          # Pineco, Forretress ex, Mysterious Treasure, Steven, Crispin, and Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/sv4pt5-1 https://api.pokemontcg.io/v2/cards/sv4pt5-2 https://api.pokemontcg.io/v2/cards/sm6-113 https://api.pokemontcg.io/v2/cards/sm7-145 https://api.pokemontcg.io/v2/cards/sv7-133 https://api.pokemontcg.io/v2/cards/swsh12-136
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee perfect-pass-3.txt

      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Upload exact traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-trace-controls-20260729-${{ github.run_attempt }}
          path: |
            tested-head.txt
            perfect-pass-*.txt
            build/regidrago_sim
            build/Testing
          if-no-files-found: error
