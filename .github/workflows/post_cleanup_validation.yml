name: Post-cleanup validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.head_ref == 'audit/post-cleanup-20260809-1817'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Release simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Record full Release suite including known repository contract failures
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure
      - name: Require all tests outside the seven pre-existing source and report contracts
        run: >-
          ctest --test-dir build --output-on-failure
          -E 'regidrago_issue_1318_policy_payload_docs_tests|regidrago_issue_1320_model_assumptions_payload_docs_tests|regidrago_issue_1489_sim_plan_appletun_contract_tests|regidrago_issue_1490_rules_appletun_contract_tests|setup_report_contract|multi_deck_report_contract|setup_docs_generator_contract'
      - name: Representative simulator traces
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3
      - name: Generate 100k T2/T3 setup matrix
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-matrix.csv
          echo '===== T2/T3 MATRIX ====='
          cat t2-t3-matrix.csv
