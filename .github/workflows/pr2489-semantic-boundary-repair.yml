name: PR 2489 semantic boundary repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 2489
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dde-semantic-rollup-20260809
          fetch-depth: 0

      - name: Apply narrow semantic boundary repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block missing in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              "src/trace_engine_v2/part_issue_1393_crispin_route_helper.inc",
              '''    const int grass = grass_needed();
    const int fire = fire_needed();
    if (grass > 1 || fire > 1) return false;

    const std::array<Card, 2> basic_energies{Card::Grass, Card::Fire};
    const bool crispin_completes_energy = std::any_of(
        basic_energies.begin(), basic_energies.end(), [this](const Card energy) {
          if (deck_count_after_search_started(energy) == 0) return false;
          Pokemon projected = *state_.active;
          return attach_energy_card(projected, energy) &&
              pays_apex_energy_cost(projected);
        });
''',
              '''    const bool grass_available =
        deck_count_after_search_started(Card::Grass) > 0;
    const bool fire_available =
        deck_count_after_search_started(Card::Fire) > 0;
    const auto one_basic_completes = [this](const Card energy) {
      Pokemon projected = *state_.active;
      return attach_energy_card(projected, energy) &&
          pays_apex_energy_cost(projected);
    };
    const auto two_basics_complete = [this](const Card first, const Card second) {
      Pokemon projected = *state_.active;
      return attach_energy_card(projected, first) &&
          attach_energy_card(projected, second) &&
          pays_apex_energy_cost(projected);
    };
    const bool one_found_manual_completion =
        (grass_available && one_basic_completes(Card::Grass)) ||
        (fire_available && one_basic_completes(Card::Fire));
    const bool two_found_crispin_manual_completion =
        grass_available && fire_available &&
        (two_basics_complete(Card::Grass, Card::Fire) ||
         two_basics_complete(Card::Fire, Card::Grass));
    const bool crispin_completes_energy =
        one_found_manual_completion || two_found_crispin_manual_completion;
''')

          replace_exact(
              "src/trace_engine_v2/part_013_legacy_star_override.inc",
              '''    // DDE-only and the canonical GF/GG states are all one physical Basic
    // attachment short when semantic Apex progress is two.
    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Confirmed migration bug: https://github.com/FlareZ123/pokemon-sims/issues/2423
    const bool exact_reported_axis = state_.turn == 2 && active_is_vstar() &&
        apex_energy_progress(*state_.active) == 2 && completing_basic_in_deck;
''',
              '''    // Preserve #1844's canonical GF -> Grass boundary exactly. The DDE
    // extension is the distinct DDE-only one-attachment state; canonical GG is
    // owned by the separate missing-Fire route and must not enter this helper.
    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Original delayed Vessel boundary: https://github.com/FlareZ123/pokemon-sims/issues/1844
    // Confirmed migration bug: https://github.com/FlareZ123/pokemon-sims/issues/2423
    const bool canonical_gf_axis = state_.active &&
        state_.active->double_dragon == 0 && state_.active->grass == 1 &&
        state_.active->fire >= 1 && count_of(state_.deck, Card::Grass) > 0;
    const bool dde_only_axis = state_.active &&
        state_.active->double_dragon > 0 && state_.active->grass == 0 &&
        state_.active->fire == 0 && completing_basic_in_deck;
    const bool exact_reported_axis = state_.turn == 2 && active_is_vstar() &&
        (canonical_gf_axis || dde_only_axis);
''')

          replace_exact(
              "src/trace_engine_v2/part_issue_2437_dde_vessel_override.inc",
              '''    const auto missing_energy = state_.active
        ? issue_2437_apex_completing_basic_from_known_deck(*state_.active)
        : std::optional<Card>{};
''',
              '''    const bool dde_backed = state_.active && state_.active->double_dragon > 0;
    const bool canonical_grass_orientation = state_.active && !dde_backed &&
        state_.active->grass == 1 && state_.active->fire >= 1 &&
        deck_count_after_search_started(Card::Grass) > 0;
    const auto missing_energy = dde_backed
        ? issue_2437_apex_completing_basic_from_known_deck(*state_.active)
        : (canonical_grass_orientation
               ? std::optional<Card>{Card::Grass}
               : std::optional<Card>{});
    // #1868/#2224 is specifically the canonical GF -> Grass route. The semantic
    // alternative-Basic selector applies only when DDE is physically attached,
    // so canonical GG -> Fire remains owned by #1898/#2231.
    // Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
    // Double Dragon Energy: https://www.pokemon.com/us/pokemon-tcg/pokemon-cards/series/xy6/97/
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Canonical route boundaries: https://github.com/FlareZ123/pokemon-sims/issues/1868 https://github.com/FlareZ123/pokemon-sims/issues/2224 https://github.com/FlareZ123/pokemon-sims/issues/2231
    // DDE migration: https://github.com/FlareZ123/pokemon-sims/issues/2437
''')

          test_path = Path("tests/issue_1565_legacy_arven_blender_replay_tests.cpp")
          test_text = test_path.read_text()
          marker = "  const sim::TrialOutcome outcome = engine.run();\n"
          if marker not in test_text:
              raise SystemExit("issue-1565 diagnostic insertion point missing")
          test_path.write_text(test_text.replace(
              marker,
              marker + '  std::cerr << "PR2489 issue-1565 diagnostic trace\\n";\n'
                       '  for (const auto& line : trace.lines) std::cerr << line << \'\\n\';\n',
              1))
          PY

      - name: Build focused Release tests
        run: |
          cmake -S . -B build-pr2489 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pr2489 --parallel 2 --target regidrago_unified_tests

      - name: Validate repaired regressions
        run: |
          ./build-pr2489/regidrago_unified_tests issue_1393_crispin_before_gladion_tests
          ./build-pr2489/regidrago_unified_tests issue_1844_legacy_vessel_next_turn_tests
          ./build-pr2489/regidrago_unified_tests issue_2224_strict_vessel_payload_finish_tests

      - name: Diagnose remaining issue-1565 route
        continue-on-error: true
        run: ./build-pr2489/regidrago_unified_tests issue_1565_legacy_arven_blender_replay_tests

      - name: Commit clean repairs and remove bootstrap
        run: |
          git checkout -- tests/issue_1565_legacy_arven_blender_replay_tests.cpp
          git rm .github/workflows/pr2489-semantic-boundary-repair.yml
          git add src/trace_engine_v2/part_issue_1393_crispin_route_helper.inc
          git add src/trace_engine_v2/part_013_legacy_star_override.inc
          git add src/trace_engine_v2/part_issue_2437_dde_vessel_override.inc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair DDE migration route boundaries"
          git push origin HEAD:fix/dde-semantic-rollup-20260809
