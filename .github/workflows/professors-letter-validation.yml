name: Professor Letter Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/professors_letter_swap_matrix.cpp"
      - "tools/professors_letter_simulate_this.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/professors-letter-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/professors_letter_swap_matrix.cpp"
      - "tools/professors_letter_simulate_this.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/professors-letter-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --parallel 2
      - name: Run Professor's Letter focused regression
        run: ./build/regidrago_unified_tests issue_2509_professors_letter_tests
      - name: Compile matched-seed comparison analyzer
        shell: bash
        run: |
          # Professor's Letter is a paper-Expanded Item that searches up to two
          # Basic Energy with no discard cost. The analyzer keeps it outside the
          # registered deck registry and compares only an in-memory -2 Vessel
          # +2 Letter derivative of regidrago-shell:
          # https://api.pokemontcg.io/v2/cards/xy1-123
          # https://api.pokemontcg.io/v2/cards/sv4-163
          # https://www.pokemon.com/us/pokemon-tcg/rules
          # https://github.com/FlareZ123/pokemon-sims/issues/2509
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            tools/professors_letter_swap_matrix.cpp -o professors-letter-swap-matrix
      - name: Compile temporary single-trace Professor's Letter demo
        shell: bash
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            tools/professors_letter_simulate_this.cpp -o professors-letter-simulate-this
      - name: Run at least five actual Item-lock Professor's Letter simulate-this plays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p professors-letter-traces
          count=0
          for scenario in \
            strict-jit-turn2-item-lock/go-first \
            strict-jit-turn2-item-lock/go-second
          do
            scenario_slug=${scenario//\//_}
            for seed in $(seq 1 1000); do
              candidate=$(mktemp)
              ./professors-letter-simulate-this \
                --simulate-this --scenario "$scenario" --seed "$seed" > "$candidate"
              if grep -Fq "| Professor's Letter | rules:" "$candidate"; then
                count=$((count + 1))
                cp "$candidate" \
                  "professors-letter-traces/${count}-letter-${scenario_slug}-seed-${seed}.txt"
                ./build/regidrago_sim --simulate-this --deck regidrago-shell \
                  --scenario "$scenario" --seed "$seed" > \
                  "professors-letter-traces/${count}-vessel-${scenario_slug}-seed-${seed}.txt"
                echo "TRACE ${count}: scenario=${scenario} seed=${seed}"
                cat "$candidate"
                if [ "$count" -ge 6 ]; then
                  rm -f "$candidate"
                  break 2
                fi
              fi
              rm -f "$candidate"
            done
          done
          test "$count" -ge 5
      - name: Upload Professor's Letter trace diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: professors-letter-item-lock-traces-${{ github.run_attempt }}
          path: professors-letter-traces
          if-no-files-found: error
      - name: Generate 100,000-trial Professor's Letter swap matrix
        run: ./professors-letter-swap-matrix 100000 20260705 professors-letter-swap-matrix.csv
      - name: Upload comparison matrix
        uses: actions/upload-artifact@v4
        with:
          name: professors-letter-swap-matrix-${{ github.run_attempt }}
          path: professors-letter-swap-matrix.csv
          if-no-files-found: error
