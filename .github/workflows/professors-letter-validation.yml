name: Professor Letter Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/professors_letter_simulate_this.cpp"
      - ".github/workflows/professors-letter-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Compile temporary single-trace Professor's Letter demo
        shell: bash
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            tools/professors_letter_simulate_this.cpp -o professors-letter-simulate-this
      - name: Find five actual Professor's Letter item-lock wins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p professors-letter-winning-traces
          count=0
          for scenario in \
            strict-jit-turn2-item-lock/go-first \
            strict-jit-turn2-item-lock/go-second
          do
            scenario_slug=${scenario//\//_}
            for seed in $(seq 1 5000); do
              letter=$(mktemp)
              vessel=$(mktemp)
              ./professors-letter-simulate-this \
                --simulate-this --scenario "$scenario" --seed "$seed" > "$letter"
              if ! grep -Fq "| Professor's Letter | rules:" "$letter"; then
                rm -f "$letter" "$vessel"
                continue
              fi
              letter_ready=$(sed -n 's/.*RESULT | first_ready_turn=\([0-9][0-9]*\).*/\1/p' "$letter")
              if [ -z "$letter_ready" ] || [ "$letter_ready" -eq 0 ] || [ "$letter_ready" -gt 4 ]; then
                rm -f "$letter" "$vessel"
                continue
              fi
              ./build/regidrago_sim --simulate-this --deck regidrago-shell \
                --scenario "$scenario" --seed "$seed" > "$vessel"
              vessel_ready=$(sed -n 's/^T\([0-9][0-9]*\) | READY |.*/\1/p' "$vessel" | head -n 1)
              if [ -z "$vessel_ready" ]; then vessel_ready=0; fi
              if [ "$vessel_ready" -ne 0 ] && [ "$vessel_ready" -le "$letter_ready" ]; then
                rm -f "$letter" "$vessel"
                continue
              fi
              count=$((count + 1))
              cp "$letter" "professors-letter-winning-traces/${count}-letter-${scenario_slug}-seed-${seed}-ready-${letter_ready}.txt"
              cp "$vessel" "professors-letter-winning-traces/${count}-vessel-${scenario_slug}-seed-${seed}-ready-${vessel_ready}.txt"
              echo "WIN ${count}: scenario=${scenario} seed=${seed} letter_ready=${letter_ready} vessel_ready=${vessel_ready}"
              cat "$letter"
              if [ "$count" -ge 6 ]; then
                rm -f "$letter" "$vessel"
                break 2
              fi
              rm -f "$letter" "$vessel"
            done
          done
          test "$count" -ge 5
      - name: Upload winning trace diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: professors-letter-item-lock-wins-${{ github.run_attempt }}
          path: professors-letter-winning-traces
          if-no-files-found: error
