name: Professor Letter Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/professors_letter_swap_matrix.cpp"
      - "tools/professors_letter_real_game_analysis.cpp"
      - "tools/professors_letter_combined_analysis.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/professors-letter-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/professors_letter_swap_matrix.cpp"
      - "tools/professors_letter_real_game_analysis.cpp"
      - "tools/professors_letter_combined_analysis.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/professors-letter-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --parallel 2
      - name: Run Professor's Letter focused regression
        run: ./build/regidrago_unified_tests issue_2509_professors_letter_tests
      - name: Verify one-pass CI contract
        run: python tests/professors_letter_single_pass_contract_tests.py
      - name: Compile combined Professor's Letter analyzer
        shell: bash
        run: |
          # The temporary deck remains unregistered and replaces the two physical
          # Earthen Vessel slots in place, preserving the other 58 pre-shuffle slots.
          # One matched-seed pass now owns readiness, checkpoint, trace, and branch
          # evidence instead of running a second independent 100k experiment.
          # Professor's Letter: https://api.pokemontcg.io/v2/cards/xy1-123
          # Earthen Vessel: https://api.pokemontcg.io/v2/cards/sv4-163
          # Core rules: https://www.pokemon.com/us/pokemon-tcg/rules
          # Pairing/trace bug: https://github.com/FlareZ123/pokemon-sims/issues/2599
          # Confirmed overcomputation bug: https://github.com/FlareZ123/pokemon-sims/issues/3008
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            tools/professors_letter_combined_analysis.cpp -o professors-letter-analysis
      - name: Audit one normal full-deck simulate-this hand
        run: |
          ./professors-letter-analysis --simulate-this \
            strict-jit-turn2-item-lock/go-first 165 letter-swap \
            > professors-letter-simulate-this.txt
          grep -F "Professor's Letter" professors-letter-simulate-this.txt
      - name: Capture real full-deck Letter-play traces
        run: |
          ./professors-letter-analysis --trace-letter-plays \
            12 1 strict-jit-turn2-item-lock/go-first \
            professors-letter-item-lock-traces.txt
          ./professors-letter-analysis --trace-letter-plays \
            12 1 strict-jit/go-second \
            professors-letter-normal-traces.txt
          grep -F "| Professor's Letter | rules:" professors-letter-item-lock-traces.txt
          grep -F "| Professor's Letter | rules:" professors-letter-normal-traces.txt
      - name: Analyze one 100,000-pair experiment per scenario
        run: |
          # All three CSVs derive from the same baseline/Letter matched-seed games.
          # Confirmed one-pass requirement: https://github.com/FlareZ123/pokemon-sims/issues/3008
          ./professors-letter-analysis --analyze-real-games 100000 20260705 professors-letter-real-games.csv professors-letter-branches.csv professors-letter-swap-matrix.csv
          python - <<'PY'
          import csv
          with open('professors-letter-real-games.csv', newline='') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('real-game analysis produced no rows')
          locked = sum(int(row['letter_locked_plays']) for row in rows)
          if locked:
              raise SystemExit(f'illegal Professor Letter plays under Item lock: {locked}')
          plays = sum(int(row['letter_total_plays']) for row in rows)
          if plays == 0:
              raise SystemExit('real-game analysis saw no Professor Letter plays')
          print(f'Professor Letter plays audited: {plays}; locked plays: {locked}')
          PY
      - name: Upload Professor's Letter evidence
        uses: actions/upload-artifact@v4
        with:
          name: professors-letter-real-game-analysis-${{ github.run_attempt }}
          path: |
            professors-letter-swap-matrix.csv
            professors-letter-real-games.csv
            professors-letter-branches.csv
            professors-letter-simulate-this.txt
            professors-letter-item-lock-traces.txt
            professors-letter-normal-traces.txt
          if-no-files-found: error
