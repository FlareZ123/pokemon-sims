name: Provenance Regeneration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build-regen -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build-regen --parallel 2
      - name: Regenerate canonical setup evidence
        run: python scripts/regenerate_setup_baselines.py --exe build-regen/regidrago_sim --out-dir results
      - name: Regenerate setup report
        run: python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired deck evidence
        run: python scripts/generate_multi_deck_comparison.py --exe build-regen/regidrago_sim --out-dir results
      - name: Regenerate paired deck report
        run: python scripts/update_multi_deck_docs.py --repo-root .
      - name: Verify regenerated report contracts
        run: |
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py
      - name: Upload regenerated source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: provenance-regeneration-${{ github.run_attempt }}
          path: |
            results/simulation_results.csv
            results/baseline_manifest.json
            results/traces
            docs/REPORT.md
            results/multi_deck_comparison.csv
            results/multi_deck_manifest.json
            results/multi_deck_traces
            docs/MULTI_DECK_REPORT.md
