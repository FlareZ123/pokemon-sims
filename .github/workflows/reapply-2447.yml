name: Reapply 2447
on: {pull_request: {branches: [main]}}
permissions: {contents: write}
jobs:
  apply:
    if: github.head_ref == 'bug/2447-forretress-dde-promotion'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: bug/2447-forretress-dde-promotion, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/reapply_2447.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2 && ctest --test-dir build -R '^regidrago_issue_2447_forretress_dde_promotion_tests$' --output-on-failure
      - run: |
          rm tools/reapply_2447.py .github/workflows/reapply-2447.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebase #2447 onto current main'
          git push origin HEAD:bug/2447-forretress-dde-promotion
