name: Reclaim issue 2408 on current main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reclaim-2408-current-main.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'reclaim/2408-burnet-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replay confirmed Burnet priority onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main bug/2408-burnet-before-serena-sol
          git checkout origin/bug/2408-burnet-before-serena-sol -- tests/issue_2408_burnet_before_serena_tests.cpp
          python - <<'PY'
          import fcntl
          import os
          import tempfile
          from pathlib import Path

          path = Path('src/trace_engine_v2/part_014b.inc')
          anchor = '''    // Exact Serena text: discard up to 3 cards, but "You must discard at least 1 card."\n'''
          block = '''    // K1 can prove Burnet has a deck-resident Dragon payload. When the payload\n    // is the sole missing strict-JIT axis, Burnet reaches the same ready turn while\n    // preserving Serena and the held Dragon. A live Item outlet stays higher because\n    // it preserves the entire Supporter action.\n    // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26\n    // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164\n    // Dialga-GX: https://api.pokemontcg.io/v2/cards/sm5-100\n    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136\n    // Official Supporter, search, and discard procedure: https://www.pokemon.com/static-assets/content-assets/cms2/pdf/trading-card-game/rulebook/par_rulebook_en.pdf\n    // K1 and resource-preservation policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities\n    // Strict-JIT payload timing: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#dcijit-treatment\n    // DCI resource model: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation\n    // Existing Item-outlet boundary: https://github.com/FlareZ123/pokemon-sims/issues/1341\n    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/2408\n    const bool burnet_preserves_serena_and_held_payload =\n        scenario_.dci == DciProfile::StrictJit && prizes_known() &&\n        need_payload() && !need_regi() && !need_vstar() && !need_energy() &&\n        !need_active_vstar() && hand_count(Card::ProfessorBurnet) > 0 &&\n        hand_count(Card::Serena) > 0 &&\n        std::any_of(state_.hand.begin(), state_.hand.end(), is_payload) &&\n        professor_burnet_has_live_ready_turn_route() &&\n        !has_live_blender_payload_line() &&\n        !has_live_one_discard_hand_payload_line() &&\n        !has_live_ultra_ball_hand_payload_line();\n    if (burnet_preserves_serena_and_held_payload && play_professor_burnet()) return;\n\n'''
          with path.open('r+', encoding='utf-8') as source_file:
              fcntl.flock(source_file.fileno(), fcntl.LOCK_EX)
              source = source_file.read()
              if 'burnet_preserves_serena_and_held_payload' in source:
                  raise RuntimeError('Burnet priority is already materialized')
              if source.count(anchor) != 1:
                  raise RuntimeError('expected exactly one Serena selector anchor')
              updated = source.replace(anchor, block + anchor)
              fd, temporary_name = tempfile.mkstemp(dir=path.parent, prefix=path.name + '.', suffix='.tmp')
              try:
                  with os.fdopen(fd, 'w', encoding='utf-8', newline='') as temporary_file:
                      temporary_file.write(updated)
                      temporary_file.flush()
                      os.fsync(temporary_file.fileno())
                  os.replace(temporary_name, path)
              finally:
                  if os.path.exists(temporary_name):
                      os.unlink(temporary_name)
          PY
          rm .github/workflows/reclaim-2408-current-main.yml
          git diff --check
      - name: Build and validate focused regression
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R '2408' --output-on-failure
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 19 --require-ready-by 3 | tee issue-2408-seed19.txt
          grep -q 'T3 | READY' issue-2408-seed19.txt
      - name: Commit validated source and regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/reclaim-2408-current-main.yml
          git commit -m 'Fix #2408 prefer K1 Burnet over Serena'
          git push origin HEAD:${{ github.head_ref }}
