name: Reclaim issue 2533 on current main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reclaim-2533-current-main.yml'

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'fix/2533-reclaim-20260810-0344'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify production file stayed unchanged
        shell: bash
        run: |
          git fetch origin main fix/2533-final-20260809
          git diff --quiet 8c5931d2ae1ae37835803008c3e5537c920fb754 origin/main -- src/trace_engine_v2/part_discard_recovery_provenance_override.inc
      - name: Replay reviewed semantic Powerglass guard
        shell: bash
        run: |
          git checkout origin/fix/2533-final-20260809 -- src/trace_engine_v2/part_discard_recovery_provenance_override.inc tests/issue_2533_crobat_fss_powerglass_tests.cpp
          rm .github/workflows/reclaim-2533-current-main.yml
          git diff --check
      - name: Build and validate focused exact states
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'issue_2533' --output-on-failure
      - name: Run three independent simulate-this controls
        shell: bash
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-control-1.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee trace-control-2.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-control-3.txt
      - name: Commit validated source and regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Fix #2533 semantic Powerglass progress'
          git push origin HEAD:${{ github.head_ref }}
