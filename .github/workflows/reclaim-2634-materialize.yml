name: Reclaim issue 2634 state-generic route

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reclaim-2634-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'reclaim/2634-state-generic-20260810-1232'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replay reviewed state-generic fix on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main reclaim/2634-state-generic-current
          git rebase origin/main
          git checkout origin/reclaim/2634-state-generic-current -- src/trace_engine_v2/part_issue_2272_route_replaced_arven_quick_ball_override.inc tests/issue_2634_quick_ball_tapu_arven_state_generic_tests.cpp
          rm .github/workflows/reclaim-2634-materialize.yml
          git diff --check
      - name: Build and focused validation
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R '2634' --output-on-failure
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 19 --require-ready-by 2
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 3
      - name: Commit validated source and regression
        shell: bash
        run: |
          git add -A src tests .github/workflows/reclaim-2634-materialize.yml
          git commit -m 'Fix #2634 generalize Tapu-Arven connector by state'
          git push --force-with-lease origin HEAD:${{ github.head_ref }}
