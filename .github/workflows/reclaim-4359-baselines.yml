name: Temporary 4359 baseline refresh
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/reclaim-4359-baselines.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Refresh setup baselines
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Refresh setup docs
        run: python scripts/update_setup_docs.py --repo-root .
      - name: Refresh paired deck baselines
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Refresh paired deck docs
        run: python scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit generated baselines and remove temporary workflow
        run: |
          rm .github/workflows/reclaim-4359-baselines.yml
          git config user.name "pokemon-sims-ci"
          git config user.email "actions@users.noreply.github.com"
          git add results docs .github/workflows/reclaim-4359-baselines.yml
          git commit -m "Refresh #4359 generated baselines"
          git push origin "HEAD:${{ github.head_ref }}"
