name: Refresh 1765 Baselines

on:
  push:
    branches:
      - fix/issue-1765-surplus-energy-treasure

permissions:
  contents: write

concurrency:
  group: refresh-1765-baselines
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1765-surplus-energy-treasure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Release simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Regenerate source-bound outputs
        run: |
          python3 scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python3 scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python3 scripts/update_setup_docs.py --repo-root .
          python3 scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit generated outputs and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results docs README.md
          git rm .github/workflows/refresh-1765-baselines.yml
          git commit -m "Refresh #1765 generated baselines"
          git push origin HEAD:fix/issue-1765-surplus-energy-treasure
