name: Refresh 2446 provenance

on:
  push:
    branches:
      - bug/2446-opening-tapu-dde-crispin

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bug/2446-opening-tapu-dde-crispin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh source-bound provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)

          baseline_path = root / 'results/baseline_manifest.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          old_digest = baseline['simulator_policy_source_sha256']
          baseline['simulator_policy_source_sha256'] = digest
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')

          multi_path = root / 'results/multi_deck_manifest.json'
          multi = json.loads(multi_path.read_text(encoding='utf-8'))
          multi['simulator_policy_source_sha256'] = digest
          multi_path.write_text(json.dumps(multi, indent=2) + '\n', encoding='utf-8')

          report_path = root / 'docs/MULTI_DECK_REPORT.md'
          report = report_path.read_text(encoding='utf-8')
          if old_digest not in report:
              raise SystemExit('old source digest missing from multi-deck report')
          report_path.write_text(report.replace(old_digest, digest), encoding='utf-8')

          print(digest)
          PY
      - name: Remove temporary workflow and commit provenance
        run: |
          rm .github/workflows/refresh-2446-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/baseline_manifest.json results/multi_deck_manifest.json docs/MULTI_DECK_REPORT.md .github/workflows/refresh-2446-provenance.yml
          git diff --cached --quiet && exit 1 || true
          git commit -m "Refresh #2446 simulator source provenance"
          git push origin HEAD:bug/2446-opening-tapu-dde-crispin
