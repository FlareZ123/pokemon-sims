name: Refresh Professor Letter Provenance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'enhancement/2509-professors-letter'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout enhancement branch
        uses: actions/checkout@v4
        with:
          ref: enhancement/2509-professors-letter
          fetch-depth: 0

      - name: Refresh source-bound manifests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)
          for relative in ('results/baseline_manifest.json', 'results/multi_deck_manifest.json'):
              path = root / relative
              data = json.loads(path.read_text(encoding='utf-8'))
              data['simulator_policy_source_sha256'] = digest
              temporary = path.with_suffix(path.suffix + '.tmp')
              temporary.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              temporary.replace(path)
          print(digest)
          PY
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Verify refreshed provenance contracts
        run: |
          python tests/card_audit_contract_tests.py
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py

      - name: Commit generated provenance only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pokemon-sims provenance refresher"
          git config user.email "actions@users.noreply.github.com"
          git add results/baseline_manifest.json results/multi_deck_manifest.json docs/REPORT.md docs/MULTI_DECK_REPORT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh source-bound evidence for Professor's Letter (#2509)"
          git push origin HEAD:enhancement/2509-professors-letter
