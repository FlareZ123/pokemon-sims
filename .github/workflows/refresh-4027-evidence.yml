name: Refresh 4027 evidence

on:
  push:
    branches:
      - fix/4027-current-lock-semantics

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download reviewed CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31940213648 -n release-validation-1 -D .evidence
      - name: Refresh source-bound evidence
        run: |
          cp .evidence/t2-t3-matrix.csv results/simulation_results.csv
          cp .evidence/multi-deck-matrix.csv results/multi_deck_comparison.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)

          baseline_path = root / 'results' / 'baseline_manifest.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          baseline['simulator_policy_source_sha256'] = digest
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          comparison_path = root / 'results' / 'multi_deck_comparison.csv'
          multi_path = root / 'results' / 'multi_deck_manifest.json'
          multi = json.loads(multi_path.read_text(encoding='utf-8'))
          multi['simulator_policy_source_sha256'] = digest
          multi['comparison_csv_sha256'] = hashlib.sha256(comparison_path.read_bytes()).hexdigest()
          multi_path.write_text(json.dumps(multi, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit refreshed evidence and retire helper workflow
        run: |
          rm .github/workflows/refresh-4027-evidence.yml
          rm -rf .evidence
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refresh #4027 generated validation evidence"
          git push origin HEAD:fix/4027-current-lock-semantics
