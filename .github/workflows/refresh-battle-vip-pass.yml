name: Materialize Battle VIP Pass enhancement
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: battle-vip-pass-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'enhancement/issue-1647-battle-vip-pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and materialize enhancement
        shell: bash
        run: |
          base64 --decode .github/battle-vip-pass-ci.sh.gz.b64 | gzip --decompress > /tmp/battle-vip-pass-ci.sh
          bash /tmp/battle-vip-pass-ci.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-vip-pass-validation-${{ github.run_attempt }}
          path: |
            vip-baseline.csv
            vip-test.csv
            vip-comparison.csv
            vip-trace-*.txt
            build/Testing
            build-sanitize/Testing
          if-no-files-found: warn
