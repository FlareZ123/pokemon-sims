name: Refresh issue 1478 evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-issue-1478-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1478-field-blower-direct-regi'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align the seed 290 regression with the reviewed trace
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("tests/issue_1478_field_blower_direct_regi_tests.cpp")
          original = path.read_text(encoding="utf-8")
          old = 'trace_contains(trace, "T2 | STAR ALCHEMY")'
          new = 'trace_contains(trace, "T1 | STAR ALCHEMY")'
          if old not in original:
              raise SystemExit("Expected seed-290 Star Alchemy assertion was not found")
          updated = original.replace(old, new, 1)
          temporary = path.with_suffix(path.suffix + ".tmp")
          temporary.write_text(updated, encoding="utf-8")
          os.replace(temporary, path)
          PY
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run three reviewed simulate-this audits
        shell: bash
        run: |
          set +e
          # Field Blower is targetless in the no-lock seed-290 state and may pay Mysterious Treasure before K1:
          # https://api.pokemontcg.io/v2/cards/sm2-125
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://github.com/FlareZ123/pokemon-sims/issues/1478
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 290 --require-ready-by 3 | tee trace-290.txt
          status_290=${PIPESTATUS[0]}

          # Preserve the confirmed Oricorio-first T2 route from issue 1476:
          # https://api.pokemontcg.io/v2/cards/sm2-55
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://github.com/FlareZ123/pokemon-sims/issues/1476
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 129 --require-ready-by 2 | tee trace-129.txt
          status_129=${PIPESTATUS[0]}

          # Preserve the source-bounded Treasure to Tapu Lele-GX to Crispin T2 route:
          # https://api.pokemontcg.io/v2/cards/sm6-113
          # https://api.pokemontcg.io/v2/cards/sm2-60
          # https://api.pokemontcg.io/v2/cards/sv7-133
          # https://github.com/FlareZ123/pokemon-sims/issues/1209
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee trace-43.txt
          status_43=${PIPESTATUS[0]}

          printf 'seed_290=%s\nseed_129=%s\nseed_43=%s\n' "$status_290" "$status_129" "$status_43" | tee trace-statuses.txt
          exit 0
      - name: Upload reviewed traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1478-reviewed-traces
          path: |
            trace-*.txt
            trace-statuses.txt
      - name: Verify reviewed audit deadlines
        run: |
          grep -q '^seed_290=0$' trace-statuses.txt
          grep -q '^seed_129=0$' trace-statuses.txt
          grep -q '^seed_43=0$' trace-statuses.txt
      - name: Run focused regression
        run: ./build/regidrago_unified_tests issue_1478_field_blower_direct_regi_tests
      - name: Regenerate source-bound setup evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate source-bound named-deck evidence
        run: |
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Validate refreshed Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit refreshed evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-issue-1478.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh issue 1478 validation evidence"
          git push origin HEAD:${{ github.head_ref }}
