name: Apply issue 1526 Tate shadow fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-1526-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1526-tate-dark-asset'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the confirmed Tate shadow guard and regression
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source_path = Path("src/trace_engine_v2/part_turo_oricorio_override.inc")
          source = source_path.read_text(encoding="utf-8")
          old = """    if (projected.outcome_.used_legacy_star) return false;

    return projected.active_is_vstar() && projected.state_.active->grass >= 2 &&
"""
          new = """    if (projected.outcome_.used_legacy_star) return false;

    // Dark Asset draws unresolved future cards only after Crobat V is played from
    // hand to the Bench. A shadow completion that uses those cards is probabilistic,
    // so it cannot prove that holding Tate & Liza deterministically completes the turn:
    // Crobat V / Dark Asset: https://api.pokemontcg.io/v2/cards/swsh3-104
    // Tate & Liza: https://api.pokemontcg.io/v2/cards/sm7-148
    // Core Bench, Ability, draw, and Supporter procedure: https://www.pokemon.com/us/pokemon-tcg/rules
    // Future-card-oracle boundary: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#policy-versus-future-card-oracle
    // Crobat probabilistic-connector policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#crobat-v-draw-connector-policy
    // Confirmed refined bug: https://github.com/FlareZ123/pokemon-sims/issues/1526
    if (projected.outcome_.used_dark_asset) return false;

    return projected.active_is_vstar() && projected.state_.active->grass >= 2 &&
"""
          if source.count(old) != 1:
              raise SystemExit("Expected one Tate shadow Legacy Star guard")
          source_tmp = source_path.with_suffix(source_path.suffix + ".tmp")
          source_tmp.write_text(source.replace(old, new, 1), encoding="utf-8")
          os.replace(source_tmp, source_path)

          test_path = Path("tests/issue_1526_tate_dark_asset_tests.cpp")
          test = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <stdexcept>
#include <utility>

namespace sim {

struct EngineTestAccess {
  static void set_state(Engine& engine, State state) {
    engine.state_ = std::move(state);
    engine.deck_seen_ = false;
    engine.prizes_revealed_ = false;
  }

  static void play_basics(Engine& engine) {
    engine.play_basics_from_hand();
  }

  static void attach_manual(Engine& engine) {
    engine.attach_manual();
  }

  static bool tate_route_completes(const Engine& engine) {
    return engine.tate_draw_has_held_non_supporter_completion();
  }

  static const State& state(const Engine& engine) {
    return engine.state_;
  }
};

}  // namespace sim

namespace {

void expect(const bool condition, const char* message) {
  if (!condition) throw std::runtime_error(message);
}

sim::DeckRecipe extra_dark_asset_draw_recipe() {
  // Fixed-copy K0 projection leaves Regidrago VSTAR followed by Crispin in the
  // synthetic zone. Dark Asset draws from the back, so one legal draw sees only
  // Crispin while the shadow's extra second draw reaches Regidrago VSTAR:
  // Crobat V: https://api.pokemontcg.io/v2/cards/swsh3-104
  // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
  // K0 projection contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#knowledge-states
  // Confirmed refined bug: https://github.com/FlareZ123/pokemon-sims/issues/1526
  return {{sim::Card::RegidragoV, 1},     {sim::Card::CrobatV, 1},
          {sim::Card::TateLiza, 1},       {sim::Card::Grass, 6},
          {sim::Card::Fire, 1},           {sim::Card::MegaDragonite, 1},
          {sim::Card::RegidragoVstar, 1}, {sim::Card::Crispin, 1}};
}

sim::State seven_card_pre_attachment_state() {
  sim::State state;
  state.turn = 2;
  state.active = sim::Pokemon{sim::Card::RegidragoV, 1, 1, 1};
  state.hand = {sim::Card::TateLiza, sim::Card::CrobatV,
                sim::Card::Grass, sim::Card::Grass, sim::Card::Grass,
                sim::Card::Grass, sim::Card::Grass};
  state.deck = {sim::Card::RegidragoVstar, sim::Card::Crispin};
  state.discard = {sim::Card::MegaDragonite};
  state.discarded_this_turn = {sim::Card::MegaDragonite};
  return state;
}

void test_extra_shadow_dark_asset_draw_cannot_prove_completion() {
  const sim::Scenario scenario{"issue-1526", sim::DciProfile::StrictJit,
                               sim::LockMode::None, false, 4};
  sim::DeckRecipe recipe = extra_dark_asset_draw_recipe();
  std::mt19937_64 rng{1526};
  sim::Engine engine(scenario, recipe, rng);
  sim::EngineTestAccess::set_state(engine, seven_card_pre_attachment_state());

  // At seven cards Crobat V cannot draw after leaving the hand. The real turn first
  // attaches Grass, reaches six cards at choose_supporter(), and can draw only one
  // card if Tate & Liza is held. The shadow removes Tate before replaying the turn,
  // reaches four cards after Benching Crobat, and would otherwise draw two:
  // Crobat V / Dark Asset: https://api.pokemontcg.io/v2/cards/swsh3-104
  // Tate & Liza: https://api.pokemontcg.io/v2/cards/sm7-148
  // Manual attachment, Bench, Ability, draw, Supporter, and evolution procedure:
  // https://www.pokemon.com/us/pokemon-tcg/rules
  // Confirmed refined bug: https://github.com/FlareZ123/pokemon-sims/issues/1526
  sim::EngineTestAccess::play_basics(engine);
  expect(sim::EngineTestAccess::state(engine).hand.size() == 7U,
         "Crobat V was played before the seven-card attachment transition");
  expect(!sim::EngineTestAccess::state(engine).dark_asset_used,
         "Dark Asset resolved before the reported Supporter decision");

  sim::EngineTestAccess::attach_manual(engine);
  expect(sim::EngineTestAccess::state(engine).hand.size() == 6U,
         "Manual attachment did not create the six-card Tate decision");
  expect(sim::EngineTestAccess::state(engine).active->grass == 2,
         "The legal Grass attachment did not complete GGF");
  expect(!sim::EngineTestAccess::tate_route_completes(engine),
         "Tate classifier still used unresolved Dark Asset cards as deterministic proof");
}

sim::DeckRecipe deterministic_vstar_recipe(const bool include_crobat) {
  sim::DeckRecipe recipe{{sim::Card::RegidragoV, 1},
                         {sim::Card::TateLiza, 1},
                         {sim::Card::Grass, 6},
                         {sim::Card::Fire, 1},
                         {sim::Card::MegaDragonite, 1},
                         {sim::Card::RegidragoVstar, 1},
                         {sim::Card::Crispin, 1}};
  if (include_crobat) recipe.insert(recipe.begin() + 1, {sim::Card::CrobatV, 1});
  return recipe;
}

sim::State deterministic_vstar_state(const bool dark_asset_resolved) {
  sim::State state;
  state.turn = 2;
  state.active = sim::Pokemon{sim::Card::RegidragoV, 1, 2, 1};
  state.hand = {sim::Card::TateLiza, sim::Card::RegidragoVstar,
                sim::Card::Grass, sim::Card::Grass,
                sim::Card::Grass, sim::Card::Grass};
  state.deck = {sim::Card::Crispin};
  state.discard = {sim::Card::MegaDragonite};
  state.discarded_this_turn = {sim::Card::MegaDragonite};
  state.manual_energy_used = true;
  state.dark_asset_used = dark_asset_resolved;
  if (dark_asset_resolved) {
    state.bench = {sim::Pokemon{sim::Card::CrobatV, 2}};
  }
  return state;
}

void test_public_held_vstar_completion_remains_live() {
  const sim::Scenario scenario{"issue-1526-public", sim::DciProfile::StrictJit,
                               sim::LockMode::None, false, 4};
  sim::DeckRecipe recipe = deterministic_vstar_recipe(false);
  std::mt19937_64 rng{152601};
  sim::Engine engine(scenario, recipe, rng);
  sim::EngineTestAccess::set_state(engine, deterministic_vstar_state(false));

  // The in-hand VSTAR is public, deterministic, and does not require Crobat draws:
  // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Tate & Liza: https://api.pokemontcg.io/v2/cards/sm7-148
  // Earliest deterministic route policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
  // Confirmed refined bug: https://github.com/FlareZ123/pokemon-sims/issues/1526
  expect(sim::EngineTestAccess::tate_route_completes(engine),
         "Public held VSTAR completion was suppressed with no Dark Asset projection");
}

void test_completion_after_real_dark_asset_resolution_remains_live() {
  const sim::Scenario scenario{"issue-1526-resolved", sim::DciProfile::StrictJit,
                               sim::LockMode::None, false, 4};
  sim::DeckRecipe recipe = deterministic_vstar_recipe(true);
  std::mt19937_64 rng{152602};
  sim::Engine engine(scenario, recipe, rng);
  sim::EngineTestAccess::set_state(engine, deterministic_vstar_state(true));

  // Once Dark Asset has legally resolved in the real public state, the held VSTAR is
  // known and the shadow performs no new probabilistic Crobat draw:
  // Crobat V / Dark Asset: https://api.pokemontcg.io/v2/cards/swsh3-104
  // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Core Ability, draw, Supporter, and evolution procedure: https://www.pokemon.com/us/pokemon-tcg/rules
  // Confirmed refined bug: https://github.com/FlareZ123/pokemon-sims/issues/1526
  expect(sim::EngineTestAccess::tate_route_completes(engine),
         "A legally resolved Dark Asset state lost its deterministic held completion");
}

}  // namespace

int main() {
  test_extra_shadow_dark_asset_draw_cannot_prove_completion();
  test_public_held_vstar_completion_remains_live();
  test_completion_after_real_dark_asset_resolution_remains_live();
  return 0;
}
'''
          test_tmp = test_path.with_suffix(test_path.suffix + ".tmp")
          test_tmp.write_text(test, encoding="utf-8")
          os.replace(test_tmp, test_path)
          PY
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run focused issue 1526 regression
        run: ./build/regidrago_unified_tests issue_1526_tate_dark_asset_tests
      - name: Run three independent simulate-this reviews
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee issue-1526-trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee issue-1526-trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1526-trace-3.txt
          grep -q "T3 | READY" issue-1526-trace-1.txt
          grep -q "T2 | READY" issue-1526-trace-2.txt
          grep -q "T2 | READY" issue-1526-trace-3.txt
      - name: Regenerate source-bound probability evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-issue-1526.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_turo_oricorio_override.inc tests/issue_1526_tate_dark_asset_tests.cpp .github/workflows/refresh-issue-1526.yml docs/REPORT.md docs/MULTI_DECK_REPORT.md results/baseline_manifest.json results/simulation_results.csv results/multi_deck_manifest.json results/multi_deck_comparison.csv
          git commit -m "Reject unresolved Dark Asset Tate shadows (#1526)"
          git push origin HEAD:${{ github.head_ref }}
