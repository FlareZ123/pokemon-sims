name: One-time issue 1964 provenance refresh

on:
  push:
    branches:
      - fix/issue-1964-heavy-ball-pineco-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1964-heavy-ball-pineco-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh source-bound manifests and reports
        shell: python
        run: |
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from baseline_provenance import simulator_policy_source_digest

          source_digest = simulator_policy_source_digest(root)
          baseline_path = root / "results" / "baseline_manifest.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["simulator_policy_source_sha256"] = source_digest
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8", newline="")

          comparison_path = root / "results" / "multi_deck_comparison.csv"
          comparison_digest = hashlib.sha256(comparison_path.read_bytes()).hexdigest()
          multi_path = root / "results" / "multi_deck_manifest.json"
          multi = json.loads(multi_path.read_text(encoding="utf-8"))
          multi["comparison_csv_sha256"] = comparison_digest
          multi["simulator_policy_source_sha256"] = source_digest
          multi_path.write_text(json.dumps(multi, indent=2) + "\n", encoding="utf-8", newline="")

          subprocess.run([sys.executable, "scripts/update_setup_docs.py", "--repo-root", str(root)], check=True)
          subprocess.run([sys.executable, "scripts/update_multi_deck_docs.py", "--repo-root", str(root)], check=True)
      - name: Commit refreshed provenance and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-issue-1964-provenance.yml
          git add results/baseline_manifest.json results/multi_deck_manifest.json docs README.md
          git commit -m "Refresh issue 1964 source-bound provenance"
          git push origin HEAD:fix/issue-1964-heavy-ball-pineco-v2
