name: Refresh issue 2175 canonical evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/refresh-issue-2175-canonical.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'fix/issue-2175-prize-k1-quick-ball'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2175-prize-k1-quick-ball
          fetch-depth: 0
      - name: Build Release simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_sim --parallel 2
      - name: Regenerate canonical evidence with the CI seed
        run: |
          python scripts/regenerate_setup_baselines.py --exe ./build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python tests/setup_report_contract_tests.py
      - name: Commit canonical evidence
        run: |
          rm .github/workflows/refresh-issue-2175-canonical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh canonical evidence with CI seed"
          git push origin HEAD:fix/issue-2175-prize-k1-quick-ball
