name: Refresh K1 Stack Outputs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-k1-stack-outputs
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        branch:
          - fix/2070-oricorio-treasure-tapu
          - fix/2072-wonder-tag-burnet-legacy-star
          - fix/2073-fss-treasure-energy
          - fix/2074-wonder-tag-complete-route
          - fix/2076-arven-fss-blender-contention
          - fix/2077-ultra-ball-post-payload-outlet
          - fix/2078-one-discard-known-dead-costs
          - fix/2079-evolution-incense-payload-outlet
          - fix/2080-fss-k1-hold-targets
          - fix/2081-late-steven-vstar-vessel
          - fix/2082-wonder-tag-steven-fss
          - fix/2083-late-steven-payload-treasure
          - fix/2084-duplicate-held-arven
          - fix/2085-late-steven-held-blender
          - fix/2086-late-steven-held-burnet
          - fix/2087-fss-latias-burnet
          - fix/2088-fss-bank-tate
          - fix/2089-arven-quick-ball-latias
          - fix/2090-quick-ball-dialga-vessel
          - fix/2091-blender-known-dead-costs
          - fix/2092-arven-redundant-fss-regression
          - fix/2093-rulebox-late-steven
          - fix/2094-treasure-tapu-projection
          - fix/2096-arven-powerglass
          - fix/2097-fss-complete-quick-ball
          - fix/2098-wonder-tag-redundant-crispin
          - fix/2099-wonder-tag-gladion-held-energy
          - fix/2100-wonder-tag-arven-held-burnet
          - fix/2101-wonder-tag-steven-consistency
          - fix/2102-late-steven-t3-compression
          - fix/2103-wonder-tag-arven-payload
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure and build Release simulator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Regenerate canonical setup baselines
        run: |
          # Repository generation contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-canonical-shell-baseline
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired named-deck outputs
        run: |
          # Repository generation contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#generate-the-paired-two-deck-matrices
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit source-bound outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/REPORT.md docs/MULTI_DECK_REPORT.md
          if git diff --cached --quiet; then
            echo "No generated output changes for ${{ matrix.branch }}"
            exit 0
          fi
          git commit -m "Refresh source-bound matrices for ${{ matrix.branch }}"
          git push origin "HEAD:${{ matrix.branch }}"
