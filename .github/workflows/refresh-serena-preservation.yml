name: Apply Serena preservation fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: serena-preservation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1481-preserve-serena'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the confirmed Serena preservation gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("src/trace_engine_v2/part_014c_issue_1152_bridge.inc")
          text = path.read_text(encoding="utf-8")
          include_anchor = (
              '#include "part_issue_1199_steven_package_override.inc"\n'
              '#include "part_issue_1478_arven_vessel_completion.inc"\n\n'
          )
          helper = include_anchor + r'''  bool issue_1481_hold_serena_for_free_latias_completion() const {
    // Once Brilliant Blender has established the strict-JIT payload and a Benched
    // Regidrago VSTAR already pays GGF, Skyliner resolves the sole remaining Active
    // axis for zero. Preserve Serena, its mandatory discard, the Supporter action,
    // and the random draw state:
    // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
    // Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76
    // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Core Supporter, Ability, and retreat procedure: https://www.pokemon.com/us/pokemon-tcg/rules
    // Earliest resource-preserving route: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1481
    return supporter_allowed() && hand_count(Card::Serena) > 0 &&
        need_active_vstar() && !need_regi() && !need_vstar() &&
        !need_energy() && !need_payload() &&
        can_free_retreat_with_latias() && benched_vstar_promotion_ready();
  }

'''
          if text.count(include_anchor) != 1:
              raise SystemExit("Expected one bridge include anchor")
          text = text.replace(include_anchor, helper, 1)

          supporter_anchor = '''  void choose_supporter_issue_1152() {
    if (play_issue_1478_t3_arven_vessel_completion()) return;
'''
          supporter_replacement = '''  void choose_supporter_issue_1152() {
    if (issue_1481_hold_serena_for_free_latias_completion()) {
      trace("HOLD SUPPORTER", "P-DCI-01; P-COMPRESS-01",
            "Preserved Serena because Skyliner already completes the sole remaining Active axis.");
      return;
    }
    if (play_issue_1478_t3_arven_vessel_completion()) return;
'''
          if text.count(supporter_anchor) != 1:
              raise SystemExit("Expected one Supporter bridge anchor")
          text = text.replace(supporter_anchor, supporter_replacement, 1)
          tmp = path.with_suffix(path.suffix + ".tmp")
          tmp.write_text(text, encoding="utf-8")
          os.replace(tmp, path)

          test_path = Path("tests/issue_1481_serena_preservation_tests.cpp")
          test_text = r'''#define REGIDRAGO_SIM_NO_MAIN
#include "../src/regidrago_sim.cpp"

#include <algorithm>
#include <random>
#include <stdexcept>
#include <string>
#include <utility>

namespace sim {

struct EngineTestAccess {
  static void set_state(Engine& engine, State state,
                        const bool deck_seen = true) {
    engine.state_ = std::move(state);
    engine.deck_seen_ = deck_seen;
    engine.prizes_revealed_ = deck_seen;
  }

  static bool hold_serena(const Engine& engine) {
    return engine.issue_1481_hold_serena_for_free_latias_completion();
  }
};

}  // namespace sim

namespace {

void expect(const bool condition, const char* message) {
  if (!condition) throw std::runtime_error(message);
}

bool trace_contains(const sim::TraceLog& trace, const std::string& text) {
  return std::any_of(trace.lines.begin(), trace.lines.end(),
                     [&text](const std::string& line) {
                       return line.find(text) != std::string::npos;
                     });
}

sim::State complete_free_retreat_state() {
  sim::State state;
  state.turn = 4;
  state.active = sim::Pokemon{sim::Card::TapuLeleGX, 0};
  state.bench = {
      sim::Pokemon{sim::Card::RegidragoVstar, 1, 2, 1},
      sim::Pokemon{sim::Card::LatiasEx, 4}};
  state.hand = {sim::Card::Serena};
  state.discard = {sim::Card::Dragapult};
  state.discarded_this_turn = {sim::Card::Dragapult};
  state.stadium = sim::Stadium::ChaoticSwell;
  return state;
}

bool hold_from_state(sim::State state, const sim::LockMode lock,
                     const std::uint64_t seed) {
  const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
  expect(deck != nullptr, "The registered shell recipe is unavailable.");
  const sim::Scenario scenario{
      "issue-1481", sim::DciProfile::StrictJit, lock, false, 5};
  std::mt19937_64 rng(seed);
  sim::Engine engine(scenario, deck->recipe, rng);
  sim::EngineTestAccess::set_state(engine, std::move(state));
  return sim::EngineTestAccess::hold_serena(engine);
}

void test_complete_free_retreat_holds_serena() {
  // Serena requires a real discard, while Skyliner already gives the Basic Active
  // a zero Retreat Cost and the Benched VSTAR has GGF plus a current-turn payload:
  // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
  // Latias ex: https://api.pokemontcg.io/v2/cards/sv8-76
  // Regidrago VSTAR: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1481
  expect(hold_from_state(complete_free_retreat_state(),
                         sim::LockMode::FullRuleBoxAbility, 148101),
         "The complete Skyliner route did not preserve Serena.");
}

void test_boundaries_keep_live_serena_routes() {
  sim::State no_latias = complete_free_retreat_state();
  no_latias.bench.pop_back();
  expect(!hold_from_state(std::move(no_latias), sim::LockMode::None, 148102),
         "Serena was held without Latias ex in play.");

  sim::State locked_latias = complete_free_retreat_state();
  locked_latias.stadium = sim::Stadium::PathToPeak;
  expect(!hold_from_state(std::move(locked_latias),
                          sim::LockMode::FullRuleBoxAbility, 148103),
         "Serena was held while Skyliner was locked.");

  sim::State missing_energy = complete_free_retreat_state();
  missing_energy.bench.front().grass = 1;
  expect(!hold_from_state(std::move(missing_energy), sim::LockMode::None, 148104),
         "Serena was held while the Benched VSTAR lacked GGF.");

  sim::State missing_payload = complete_free_retreat_state();
  missing_payload.discarded_this_turn.clear();
  missing_payload.hand.push_back(sim::Card::MegaDragonite);
  expect(!hold_from_state(std::move(missing_payload), sim::LockMode::None, 148105),
         "Serena's live strict-JIT payload route was suppressed.");

  sim::State retreat_spent = complete_free_retreat_state();
  retreat_spent.retreat_used = true;
  expect(!hold_from_state(std::move(retreat_spent), sim::LockMode::None, 148106),
         "Serena was held after the Retreat action was spent.");
}

void test_seed_8_preserves_serena_and_reaches_t4() {
  const auto scenario = sim::scenario_by_label(
      "strict-jit-rulebox-ability-lock/go-second");
  const sim::NamedDeck* deck = sim::deck_by_id("regidrago-shell");
  expect(scenario.has_value() && deck != nullptr,
         "The registered seed-8 fixture is unavailable.");

  std::mt19937_64 rng(8);
  sim::TraceLog trace{true, {}};
  sim::Engine engine(*scenario, deck->recipe, rng, &trace);
  const sim::TrialOutcome outcome = engine.run();

  // Brilliant Blender and Skyliner already complete the deterministic T4 route.
  // Serena must remain unused because its mandatory discard advances no axis:
  // Brilliant Blender: https://api.pokemontcg.io/v2/cards/sv8-164
  // Serena: https://api.pokemontcg.io/v2/cards/swsh12-164
  // Latias ex: https://api.pokemontcg.io/v2/cards/sv8-76
  // Policy: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1481
  expect(outcome.first_ready_turn == 4 && !outcome.setup_failed,
         "Seed 8 did not retain its earliest T4 ready state.");
  expect(!trace_contains(trace, "Serena chosen discard") &&
             !trace_contains(trace, "Used Serena draw mode"),
         "Seed 8 still spent Serena after setup was deterministic.");
  expect(trace_contains(trace, "T4 | HOLD SUPPORTER") &&
             trace_contains(trace, "T4 | RETREAT") &&
             trace_contains(trace, "T4 | READY"),
         "Seed 8 did not follow the preserved-Serena Skyliner finish.");
}

}  // namespace

int main() {
  test_complete_free_retreat_holds_serena();
  test_boundaries_keep_live_serena_routes();
  test_seed_8_preserves_serena_and_reaches_t4();
  return 0;
}
'''
          tmp_test = test_path.with_suffix(test_path.suffix + ".tmp")
          tmp_test.write_text(test_text, encoding="utf-8")
          os.replace(tmp_test, test_path)
          PY
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run focused regression
        run: ./build/regidrago_unified_tests issue_1481_serena_preservation_tests
      - name: Run three reviewed simulate-this audits
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit-rulebox-ability-lock/go-second --seed 8 --require-ready-by 4 | tee trace-8.txt
          ! grep -q "Serena chosen discard" trace-8.txt
          ! grep -q "Used Serena draw mode" trace-8.txt
          grep -q "T4 | HOLD SUPPORTER" trace-8.txt
          grep -q "T4 | READY" trace-8.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 290 --require-ready-by 3
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 129 --require-ready-by 2
      - name: Regenerate source-bound evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated source and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-serena-preservation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_014c_issue_1152_bridge.inc tests/issue_1481_serena_preservation_tests.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/baseline_manifest.json results/simulation_results.csv results/multi_deck_manifest.json results/multi_deck_comparison.csv .github/workflows/refresh-serena-preservation.yml
          git commit -m "Preserve Serena for the free Skyliner finish (#1481)"
          git push origin HEAD:${{ github.head_ref }}
