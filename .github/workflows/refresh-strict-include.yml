name: Apply strict include fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: strict-include-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-1482-strict-include'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the confirmed strict-include fix
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source_path = Path("src/regidrago_sim.cpp")
          source = source_path.read_text(encoding="utf-8")
          old = '#include "trace_engine_v2/part_016.inc"}'
          new = (
              '// C++ preprocessing include grammar: https://eel.is/c++draft/cpp.include\n'
              '// Confirmed portability bug: https://github.com/FlareZ123/pokemon-sims/issues/1482\n'
              '#include "trace_engine_v2/part_016.inc"'
          )
          if source.count(old) != 1:
              raise SystemExit("Expected one malformed part_016 include")
          source_tmp = source_path.with_suffix(source_path.suffix + ".tmp")
          source_tmp.write_text(source.replace(old, new, 1), encoding="utf-8")
          os.replace(source_tmp, source_path)

          workflow_path = Path(".github/workflows/ci.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          anchor = (
              '      - name: Build simulator and unified tests\n'
              '        run: cmake --build build --parallel 2\n'
          )
          strict_step = anchor + (
              '      - name: Build strict C++20 contract\n'
              '        shell: bash\n'
              '        run: |\n'
              '          # C++ include grammar: https://eel.is/c++draft/cpp.include\n'
              '          # Confirmed portability bug: https://github.com/FlareZ123/pokemon-sims/issues/1482\n'
              '          cmake -S . -B build-pedantic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-pedantic-errors\n'
              '          cmake --build build-pedantic --parallel 2\n'
          )
          if workflow.count(anchor) != 1:
              raise SystemExit("Expected one Release build anchor")
          workflow_tmp = workflow_path.with_suffix(workflow_path.suffix + ".tmp")
          workflow_tmp.write_text(workflow.replace(anchor, strict_step, 1), encoding="utf-8")
          os.replace(workflow_tmp, workflow_path)
          PY
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Validate strict C++20 build
        run: cmake -S . -B build-pedantic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-pedantic-errors && cmake --build build-pedantic --parallel 2
      - name: Run three reviewed simulate-this audits
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 290 --require-ready-by 3 | tee issue-1482-trace-290.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 129 --require-ready-by 2 | tee issue-1482-trace-129.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1482-trace-43.txt
      - name: Regenerate source-bound evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/regidrago_sim.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/baseline_manifest.json results/simulation_results.csv results/multi_deck_manifest.json results/multi_deck_comparison.csv
          git commit -m "Fix strict C++20 include directive (#1482)"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1482-source-bound-${{ github.run_attempt }}
          path: |
            issue-1482-trace-*.txt
            results/baseline_manifest.json
            results/simulation_results.csv
            results/multi_deck_manifest.json
            results/multi_deck_comparison.csv
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
            build/Testing
          if-no-files-found: warn
