name: Apply 1079 Artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: apply-1079-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1079-held-energy-regression
          fetch-depth: 0
      - name: Download verified generated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Source-bound generation run: https://github.com/FlareZ123/pokemon-sims/actions/runs/30416698466
          # Confirmed regression scope: https://github.com/FlareZ123/pokemon-sims/issues/1079
          gh run download 30416698466 --repo FlareZ123/pokemon-sims --name issue-1079-regenerated-artifacts-1 --dir generated
      - name: Apply generated contracts
        run: |
          cp generated/docs/MULTI_DECK_REPORT.md docs/MULTI_DECK_REPORT.md
          cp generated/docs/REPORT.md docs/REPORT.md
          cp generated/results/baseline_manifest.json results/baseline_manifest.json
          cp generated/results/multi_deck_comparison.csv results/multi_deck_comparison.csv
          cp generated/results/multi_deck_manifest.json results/multi_deck_manifest.json
          cp generated/results/simulation_results.csv results/simulation_results.csv
          git rm .github/workflows/regenerate-1079-artifacts.yml
          git diff --check
      - name: Commit generated contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/MULTI_DECK_REPORT.md docs/REPORT.md results/baseline_manifest.json results/multi_deck_comparison.csv results/multi_deck_manifest.json results/simulation_results.csv
          git commit -m "Regenerate source-bound setup reports for #1079"
          git push origin HEAD:fix-1079-held-energy-regression
