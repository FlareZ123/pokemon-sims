name: Regenerate 1079 Artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate-1079-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --target regidrago_sim --parallel 2
      - name: Regenerate canonical shell baselines
        run: |
          # Fixed-seed matrix contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#run-aggregate-smoke-test
          # Source-bound baseline generator: https://github.com/FlareZ123/pokemon-sims/blob/main/scripts/regenerate_setup_baselines.py
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --max-seed 5000 --trials 100000 --matrix-seed 20260705
      - name: Regenerate paired deck comparison
        run: |
          # Registered deck and scenario contract: https://github.com/FlareZ123/pokemon-sims/blob/main/README.md#registered-decks
          # Source-bound paired generator: https://github.com/FlareZ123/pokemon-sims/blob/main/scripts/generate_multi_deck_comparison.py
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Update generated reports
        run: |
          # Generated documentation contract: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/REPORT.md
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Verify generated contracts
        run: |
          python scripts/compare_setup_matrix.py --actual results/simulation_results.csv --expected results/simulation_results.csv
          python scripts/compare_setup_matrix.py --actual results/multi_deck_comparison.csv --expected results/multi_deck_comparison.csv
          git diff --check
      - name: Record generated paths
        run: git status --short | tee regenerated-paths.txt
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: issue-1079-regenerated-artifacts-${{ github.run_attempt }}
          path: |
            results
            docs
            README.md
            regenerated-paths.txt
          if-no-files-found: error
