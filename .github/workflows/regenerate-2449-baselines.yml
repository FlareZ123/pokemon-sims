name: Regenerate issue 2449 baselines

on:
  push:
    branches:
      - fix/2449-burnet-dde-ready-route

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build simulator and unified tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target regidrago_sim regidrago_unified_tests -j2
      - name: Run focused regression
        run: ./build/regidrago_unified_tests issue_2449_burnet_dde_ready_tests
      - name: Regenerate canonical setup baseline
        run: python3 scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Regenerate named-deck comparison
        run: python3 scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - name: Regenerate reports
        run: |
          python3 scripts/update_setup_docs.py --repo-root .
          python3 scripts/update_multi_deck_docs.py --repo-root .
      - name: Verify regenerated provenance contracts
        run: |
          python3 tests/setup_report_contract_tests.py
          python3 tests/multi_deck_report_contract_tests.py
      - name: Commit generated baselines and remove bootstrap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results docs
          git rm .github/workflows/regenerate-2449-baselines.yml .github/issue-2449-baseline-trigger
          git commit -m "Regenerate #2449 setup baselines"
          git push
