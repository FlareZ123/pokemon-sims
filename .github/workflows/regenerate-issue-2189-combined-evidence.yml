name: Regenerate issue 2189 combined evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-issue-2189-combined-evidence.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'fix/issue-2189-ultra-ball-prize-k1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2189-ultra-ball-prize-k1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and unified tests
        run: cmake --build build --parallel 2
      - name: Run focused Ultra Ball controls
        run: ./build/regidrago_unified_tests issue_2189_ultra_ball_prize_k1_target_tests
      - name: Regenerate canonical source-bound evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Verify generated provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest
          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)
          baseline = json.loads((root / 'results/baseline_manifest.json').read_text())
          multi = json.loads((root / 'results/multi_deck_manifest.json').read_text())
          assert baseline['simulator_policy_source_sha256'] == digest
          assert multi['simulator_policy_source_sha256'] == digest
          assert digest in (root / 'docs/MULTI_DECK_REPORT.md').read_text()
          print(digest)
          PY
      - name: Remove temporary workflow and commit evidence
        run: |
          rm .github/workflows/regenerate-issue-2189-combined-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Regenerate combined Ultra Ball source-bound evidence"
          git push origin HEAD:fix/issue-2189-ultra-ball-prize-k1
