name: Regenerate issue 2190 fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-issue-2190-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/issue-2190-secret-box-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2190-secret-box-shadow
          fetch-depth: 0
      - name: Apply isolated patch
        run: python scripts/apply_issue_2190.py
      - name: Compile with shadow warnings as errors
        run: >-
          c++ -std=c++20 -O0 -Wall -Wextra -Wpedantic -Wconversion -Wshadow
          -Werror=shadow -I src tests/issue_1118_multi_deck_secret_box_tests.cpp
          -o issue_1118_shadow
      - name: Run focused test
        run: ./issue_1118_shadow
      - name: Remove staging files and commit fix
        run: |
          rm scripts/apply_issue_2190.py
          rm .github/workflows/regenerate-issue-2190-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove Secret Box regression state shadow"
          git push origin HEAD:fix/issue-2190-secret-box-shadow
