name: Regenerate issue 2191 final fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-issue-2191-final-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/issue-2191-communication-k1-outlets'
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2191-communication-k1-outlets
          fetch-depth: 0
      - name: Apply isolated production patch
        run: python scripts/apply_issue_2191_final.py
      - name: Configure focused validation
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build unified tests
        run: cmake --build build --target regidrago_unified_tests --parallel 2
      - name: Run focused controls
        run: ./build/regidrago_unified_tests issue_2191_pokemon_communication_k1_outlet_target_tests
      - name: Remove staging files and commit fix
        run: |
          rm scripts/apply_issue_2191_final.py
          rm .github/workflows/regenerate-issue-2191-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Pokémon Communication K1 outlet targets"
          git push origin HEAD:fix/issue-2191-communication-k1-outlets
