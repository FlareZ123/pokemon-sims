name: Repair issue 3721 from completed CI artifact

on:
  push:
    branches:
      - bug-3721-current-evidence-1786739328000

permissions:
  contents: write

jobs:
  install-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bug-3721-current-evidence-1786739328000
          fetch-depth: 0

      - name: Download exact completed validation artifact
        uses: actions/download-artifact@v4
        with:
          name: release-validation-1
          path: _issue3721_artifact
          github-token: ${{ github.token }}
          repository: FlareZ123/pokemon-sims
          run-id: 31838125497

      - name: Install canonical generated matrices
        run: |
          cp _issue3721_artifact/t2-t3-matrix.csv results/simulation_results.csv
          cp _issue3721_artifact/multi-deck-matrix.csv results/multi_deck_comparison.csv
          python -c "import hashlib,json; from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; root=Path('.').resolve(); digest=simulator_policy_source_digest(root); bp=root/'results/baseline_manifest.json'; b=json.loads(bp.read_text(encoding='utf-8')); b['simulator_policy_source_sha256']=digest; bp.write_text(json.dumps(b, indent=2)+'\n', encoding='utf-8'); mp=root/'results/multi_deck_manifest.json'; m=json.loads(mp.read_text(encoding='utf-8')); m['simulator_policy_source_sha256']=digest; m['comparison_csv_sha256']=hashlib.sha256((root/'results/multi_deck_comparison.csv').read_bytes()).hexdigest(); mp.write_text(json.dumps(m, indent=2)+'\n', encoding='utf-8')"
          python scripts/update_setup_docs.py --repo-root .
          python scripts/update_multi_deck_docs.py --repo-root .

      - name: Verify both generated-report contracts
        run: |
          python tests/setup_report_contract_tests.py
          python tests/multi_deck_report_contract_tests.py

      - name: Commit exact generated evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulation_results.csv results/multi_deck_comparison.csv results/baseline_manifest.json results/multi_deck_manifest.json docs/REPORT.md docs/MULTI_DECK_REPORT.md
          git rm .github/workflows/repair-3721.yml
          git commit -m "Fix #3721: install current-source generated evidence"
          git push origin HEAD:bug-3721-current-evidence-1786739328000
