name: Replay validated issue 2757 fix
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/replay-2757.yml']
permissions:
  contents: write
jobs:
  replay:
    if: github.head_ref == 'replay/2757-post2921-sol'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replay validated semantic fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick a38233bf1ac3ae9b315e84d2519c1f489c3f1282
          rm .github/workflows/replay-2757.yml
          git add .github/workflows/replay-2757.yml
          git commit --amend --no-edit
          git push origin HEAD:${{ github.head_ref }}
