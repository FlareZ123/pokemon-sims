name: Replay validated issue 2768 fix
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/replay-2768.yml']
permissions:
  contents: write
jobs:
  replay:
    if: github.head_ref == 'replay/2768-post2921-sol'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick cfadca137e379e58e46bb868493a5be242ad4327
          rm .github/workflows/replay-2768.yml
          git add .github/workflows/replay-2768.yml
          git commit --amend --no-edit
          git push origin HEAD:${{ github.head_ref }}
