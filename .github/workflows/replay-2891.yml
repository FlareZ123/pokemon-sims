name: Replay validated issue 2891 fix
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/replay-2891.yml']
permissions:
  contents: write
jobs:
  replay:
    if: github.head_ref == 'replay/2891-post2921-sol'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick 3c6990219b4c9675b3bbdfbcfa3c857aeecd0875
          rm .github/workflows/replay-2891.yml
          git add .github/workflows/replay-2891.yml
          git commit --amend --no-edit
          git push origin HEAD:${{ github.head_ref }}
