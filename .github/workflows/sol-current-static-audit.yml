name: Sol Current Static Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan source, tests, and scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src'), Path('tests'), Path('scripts')]
          patterns = {
              'strict-jit': re.compile(r'DciProfile::StrictJit'),
              'lock-none': re.compile(r'LockMode::None'),
              'seat': re.compile(r'(?:scenario_\.|scenario\.)going_first'),
              'turn-coordinate': re.compile(r'(?:state_\.|state\.)turn\s*(?:==|!=|<=|>=|<|>)'),
              'seed-coordinate': re.compile(r'\bseed\b\s*(?:==|!=|<=|>=|<|>)'),
              'raw-energy-axis': re.compile(r'(?:grass|fire)(?:_energy|_attached|_in_hand|_in_deck)', re.IGNORECASE),
          }

          rows = []
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in {'.cpp', '.h', '.hpp', '.inc', '.py', '.sh'}:
                      continue
                  for lineno, line in enumerate(path.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                      hits = [name for name, rx in patterns.items() if rx.search(line)]
                      if hits:
                          rows.append(f"{path}:{lineno}:{','.join(hits)}:{line.strip()}")

          Path('sol-current-static-scan.txt').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f"STATIC_SCAN_MATCHES={len(rows)}")
          for row in rows:
              print(row)
          PY
      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: sol-current-static-scan
          path: sol-current-static-scan.txt
