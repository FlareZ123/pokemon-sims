name: Sol Static Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan systemic gameplay gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src'), Path('tests'), Path('scripts')]
          patterns = {
              'literal_strict_jit': re.compile(r'DciProfile::StrictJit'),
              'literal_lock_none': re.compile(r'LockMode::None'),
              'seat_identity': re.compile(r'(?:scenario_|scenario\.)going_first'),
              'turn_identity': re.compile(r'(?:state_|state\.)turn\s*(?:==|!=|<=|>=|<|>)'),
              'seed_identity': re.compile(r'\bseed\b\s*(?:==|!=|<=|>=|<|>)'),
              'raw_grass_fire_axis': re.compile(r'(?:grass|fire)(?:_energy|_attached|_in_hand|_in_deck)', re.IGNORECASE),
          }
          out = []
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in {'.cpp', '.h', '.hpp', '.inc', '.py', '.sh'}:
                      continue
                  text = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  for lineno, line in enumerate(text, 1):
                      hits = [name for name, rx in patterns.items() if rx.search(line)]
                      if hits:
                          out.append(f"{path}:{lineno}:{','.join(hits)}:{line.strip()}")
          Path('sol-static-scan.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f"STATIC_SCAN_MATCHES={len(out)}")
          for row in out[:120]:
              print(row)
          PY
      - name: Build and run issue 1795 semantic probe
        run: |
          c++ -std=c++20 -O0 tests/sol_issue_1795_semantic_probe.cpp -o /tmp/sol_issue_1795_semantic_probe
          /tmp/sol_issue_1795_semantic_probe
      - name: Build and run issue 1796 semantic probe
        run: |
          c++ -std=c++20 -O0 tests/sol_issue_1796_semantic_probe.cpp -o /tmp/sol_issue_1796_semantic_probe
          /tmp/sol_issue_1796_semantic_probe
      - name: Download current-main pass 1 validation artifact
        uses: actions/download-artifact@v4
        with:
          name: release-validation-1
          path: release-validation-1
          repository: FlareZ123/pokemon-sims
          run-id: 31521397904
          github-token: ${{ github.token }}
      - name: Print pass 1 matrix and trace summaries
        shell: bash
        run: |
          echo '=== t2-t3-matrix.csv ==='
          cat release-validation-1/t2-t3-matrix.csv
          echo '=== trace files ==='
          find release-validation-1 -maxdepth 1 -type f -name 'trace-*.txt' -print | sort
          echo '=== selected trace contents ==='
          for file in $(find release-validation-1 -maxdepth 1 -type f -name 'trace-*.txt' -print | sort); do
            echo "--- $file ---"
            cat "$file"
          done
      - name: Upload static scan
        uses: actions/upload-artifact@v4
        with:
          name: sol-static-scan
          path: sol-static-scan.txt
