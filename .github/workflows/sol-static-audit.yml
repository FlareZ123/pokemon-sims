name: Sol Static Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan systemic gameplay gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src'), Path('tests'), Path('scripts')]
          patterns = {
              'literal_strict_jit': re.compile(r'DciProfile::StrictJit'),
              'literal_lock_none': re.compile(r'LockMode::None'),
              'seat_identity': re.compile(r'(?:scenario_|scenario\.)going_first'),
              'turn_identity': re.compile(r'(?:state_|state\.)turn\s*(?:==|!=|<=|>=|<|>)'),
              'seed_identity': re.compile(r'\bseed\b\s*(?:==|!=|<=|>=|<|>)'),
              'raw_grass_fire_axis': re.compile(r'(?:grass|fire)(?:_energy|_attached|_in_hand|_in_deck)', re.IGNORECASE),
          }
          out = []
          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in {'.cpp', '.h', '.hpp', '.inc', '.py', '.sh'}:
                      continue
                  text = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  for lineno, line in enumerate(text, 1):
                      hits = [name for name, rx in patterns.items() if rx.search(line)]
                      if hits:
                          out.append(f"{path}:{lineno}:{','.join(hits)}:{line.strip()}")
          Path('sol-static-scan.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f"STATIC_SCAN_MATCHES={len(out)}")
          for row in out[:120]:
              print(row)
          PY
      - name: Classify production historical-coordinate gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          strict = re.compile(r'DciProfile::StrictJit')
          coordinate = re.compile(r'(?:going_first|state_\.turn\s*(?:==|!=|<=|>=|<|>)|LockMode::None)')
          name_rx = re.compile(r'(issue_\d+[A-Za-z0-9_]*|const auto [A-Za-z0-9_]+|bool [A-Za-z0-9_]+)')
          candidates = []
          for path in sorted(Path('src').rglob('*')):
              if not path.is_file() or path.suffix not in {'.cpp', '.h', '.hpp', '.inc'}:
                  continue
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              for index, line in enumerate(lines):
                  if not strict.search(line):
                      continue
                  start = max(0, index - 12)
                  end = min(len(lines), index + 13)
                  window = lines[start:end]
                  if not any(coordinate.search(row) for row in window):
                      continue
                  label = 'unknown'
                  for row in reversed(lines[max(0, index - 30):index + 1]):
                      match = name_rx.search(row)
                      if match:
                          label = match.group(1)
                          break
                  coordinates = []
                  joined = '\n'.join(window)
                  if 'going_first' in joined:
                      coordinates.append('seat')
                  if re.search(r'state_\.turn\s*(?:==|!=|<=|>=|<|>)', joined):
                      coordinates.append('turn')
                  if 'LockMode::None' in joined:
                      coordinates.append('lock-none')
                  candidates.append((str(path), index + 1, label, ','.join(coordinates)))
          print(f"HISTORICAL_COORDINATE_CANDIDATES={len(candidates)}")
          for path, line, label, coordinates in candidates:
              print(f"{path}:{line}:{label}:{coordinates}")
          PY
      - name: Build and run issue 1795 semantic probe
        run: |
          c++ -std=c++20 -O0 tests/sol_issue_1795_semantic_probe.cpp -o /tmp/sol_issue_1795_semantic_probe
          /tmp/sol_issue_1795_semantic_probe
      - name: Build and run issue 1796 semantic probe
        run: |
          c++ -std=c++20 -O0 tests/sol_issue_1796_semantic_probe.cpp -o /tmp/sol_issue_1796_semantic_probe
          /tmp/sol_issue_1796_semantic_probe
      - name: Upload static scan
        uses: actions/upload-artifact@v4
        with:
          name: sol-static-scan
          path: sol-static-scan.txt
