name: Temporary Source Digest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute simulator policy source digest
        run: |
          python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))" | tee simulator-policy-source-sha256.txt
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: temporary-source-digest
          path: simulator-policy-source-sha256.txt
