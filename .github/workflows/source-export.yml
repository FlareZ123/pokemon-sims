name: Source Export

on:
  pull_request:
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
