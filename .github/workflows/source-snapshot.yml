name: Source Snapshot

on:
  pull_request:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload mergeable source tree
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            CMakeLists.txt
            src
            tests
            docs
            scripts
            results
          retention-days: 1
