name: Temporary source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'fix/issue-1599-quick-ball-tapu-crispin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-sims-source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
