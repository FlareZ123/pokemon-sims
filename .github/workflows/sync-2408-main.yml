name: Sync 2408 branch to current main

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'fix/2408-burnet-resource-sol-20260811'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2408-burnet-resource-sol-20260811
          fetch-depth: 0
      - name: Merge exact current main and remove sync workflow
        run: |
          git fetch origin main
          git config user.name github-actions
          git config user.email github-actions@github.com
          git merge --no-edit origin/main
          git rm .github/workflows/sync-2408-main.yml
          git commit -m "Sync #2408 with current main"
          git push origin HEAD:fix/2408-burnet-resource-sol-20260811