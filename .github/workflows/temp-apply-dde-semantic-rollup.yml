name: Temporary apply DDE semantic rollup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-apply-dde-semantic-rollup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-tested-rollup:
    if: github.head_ref == 'fix/dde-semantic-rollup-20260809' || github.ref_name == 'fix/dde-semantic-rollup-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dde-semantic-rollup-20260809
          fetch-depth: 0
      - name: Reconstruct, verify, and apply exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/dde-rollup-part-00 .github/dde-rollup-part-01 \
              .github/dde-rollup-part-02 .github/dde-rollup-part-03 \
              .github/dde-rollup-part-04 .github/dde-rollup-part-05 \
              > /tmp/dde-semantic-rollup.patch.gz.b64
          test "$(wc -c < /tmp/dde-semantic-rollup.patch.gz.b64)" -eq 28608
          base64 -d /tmp/dde-semantic-rollup.patch.gz.b64 > /tmp/dde-semantic-rollup.patch.gz
          gzip -t /tmp/dde-semantic-rollup.patch.gz
          gzip -dc /tmp/dde-semantic-rollup.patch.gz > /tmp/dde-semantic-rollup.patch
          git apply --3way --index --whitespace=nowarn /tmp/dde-semantic-rollup.patch
          git diff --cached --check

          git rm .github/dde-semantic-rollup.patch.gz.b64 \
                 .github/dde-rollup-part-00 .github/dde-rollup-part-01 \
                 .github/dde-rollup-part-02 .github/dde-rollup-part-03 \
                 .github/dde-rollup-part-04 .github/dde-rollup-part-05 \
                 .github/workflows/temp-apply-dde-semantic-rollup.yml
          echo 'Applied semantic files and removed all staging transport:'
          git diff --cached --stat

      - name: Commit exact semantic rollup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete DDE semantic route migration'
          git push origin HEAD:fix/dde-semantic-rollup-20260809
