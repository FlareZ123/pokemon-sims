name: Temporary DDE semantic rollup materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-dde-semantic-rollup-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/dde-semantic-rollup-20260809' || github.ref_name == 'fix/dde-semantic-rollup-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dde-semantic-rollup-20260809
          fetch-depth: 0

      - name: Apply reviewed DDE production and regression patches
        shell: bash
        run: |
          set -euo pipefail
          apply_reviewed() {
            local pr="$1" base="$2" head="$3"; shift 3
            echo "=== PR #${pr} ==="
            git fetch --no-tags origin "$base" "$head"
            git diff --binary "$base" "$head" -- "$@" > "/tmp/pr-${pr}.patch"
            test -s "/tmp/pr-${pr}.patch"
            git apply --3way --index --whitespace=nowarn "/tmp/pr-${pr}.patch"
          }

          # #2432 Crispin + Blender projected semantic readiness.
          apply_reviewed 2448 1eadd21c5e836bbe3db8c58c9ba6edbe82d25a78 c3f8dbddf0905d1e7498a34bf6448fc18aa75f8e \
            src/trace_engine_v2/part_issue_1873_blender_crispin_supporter_override.inc \
            tests/issue_2432_dde_crispin_blender_tests.cpp

          # #2419 Tate held non-Supporter shadow.
          apply_reviewed 2450 1eadd21c5e836bbe3db8c58c9ba6edbe82d25a78 15507a3aee4507061b4458181235f9319681ff92 \
            src/trace_engine_v2/part_turo_oricorio_override.inc \
            tests/issue_2419_dde_tate_shadow_tests.cpp

          # #2437 Earthen Vessel one-attachment family.
          apply_reviewed 2451 1eadd21c5e836bbe3db8c58c9ba6edbe82d25a78 22662a6e138d66309f88072f1113f1e701506dd5 \
            src/trace_engine_v2/part_014a_issue_1447_vessel_hold.inc \
            src/trace_engine_v2/part_014a_issue_962_eligibility.inc \
            src/trace_engine_v2/part_issue_1167_treasure_vessel_override.inc \
            src/trace_engine_v2/part_issue_1368_earthen_vessel_celestial_roar_override.inc \
            src/trace_engine_v2/part_issue_2437_dde_vessel_override.inc \
            tests/issue_2437_dde_vessel_tests.cpp

          # #2447 Forretress forced promotion.
          apply_reviewed 2454 293b71b02067481a65bc38f972b47a55e20c4f66 457f30f3fae6c392067cd5e71da2c7c3896ae92a \
            src/trace_engine_v2/part_forretress_ex_combo.inc \
            tests/issue_2447_forretress_dde_promotion_tests.cpp

          # #2446 opening Tapu -> future Crispin projection.
          apply_reviewed 2455 8f5569a8dc834c738983cf51941200f401e3cb99 bcfcd8a34f7405d739e3d1432ddf2c9dbeb1521b \
            src/trace_engine_v2/part_tapu_tate_switch_override.inc \
            tests/issue_2446_opening_tapu_dde_crispin_tests.cpp

          # #2438 Quick Ball -> Latias one-Basic finish.
          apply_reviewed 2456 293b71b02067481a65bc38f972b47a55e20c4f66 c8b5418979a8a53cbca309a8d9fce5862f1779d7 \
            src/trace_engine_v2/part_issue_1516_quick_ball_tapu_crispin_override.inc \
            tests/issue_2438_quick_ball_latias_dde_tests.cpp

          # #2435 held-Arven duplicate-Tapu suppression.
          apply_reviewed 2457 293b71b02067481a65bc38f972b47a55e20c4f66 9ee1228dfe9fc8d8f6ad347e54c1500263085d88 \
            src/trace_engine_v2/part_issue_989_empty_deck_tapu_override.inc \
            tests/issue_2435_held_arven_dde_tests.cpp

          # #2449 central Professor Burnet ready-turn gate.
          apply_reviewed 2458 293b71b02067481a65bc38f972b47a55e20c4f66 0b1e45875908960c13466c0e1544aed3f81900bc \
            src/trace_engine_v2/part_011_burnet_thinning_override.inc \
