          # #2426 Arven semantic Energy family. Exclude generated simulation CSV.
          apply_reviewed 2469 8f5569a8dc834c738983cf51941200f401e3cb99 83a267cb1f21b8deb2b10c3d14d3804edaff37b4 \
            src/trace_engine_v2/part_012_arven_fss_blender_contention_override.inc \
            src/trace_engine_v2/part_issue_1067_arven_before_late_steven_override.inc \
            src/trace_engine_v2/part_issue_2225_arven_vessel_supporter_override.inc \
            tests/issue_2426_arven_dde_energy_semantics_tests.cpp

          # #2431 Treasure -> Tapu -> Crispin semantic projections. Exclude generated CSVs.
          apply_reviewed 2470 8f5569a8dc834c738983cf51941200f401e3cb99 475b8dba93644f7d41861ef32928c04b2973ea3c \
            src/trace_engine_v2/part_issue_1209_treasure_tapu_crispin_override.inc \
            src/trace_engine_v2/part_issue_1235_oricorio_treasure_tapu_override.inc \
            tests/issue_2431_dde_treasure_tapu_crispin_tests.cpp

          # #2482 exact DDE card-source registry documentation.
          apply_reviewed 2487 9d789495c009f9140ca3dca107141dbd27a77edc dffb9cb0c31f4130d57e35d4bc797cf3b33e2656 \
            docs/RULE_SOURCES.md

          git diff --check
          echo 'Materialized reviewed DDE patches:'
          git status --short

      - name: Remove temporary materializer and commit rollup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-dde-semantic-rollup-materialize.yml
          git add -u .github/workflows/temp-dde-semantic-rollup-materialize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Integrate reviewed DDE semantic route fixes'
          git push origin HEAD:fix/dde-semantic-rollup-20260809
