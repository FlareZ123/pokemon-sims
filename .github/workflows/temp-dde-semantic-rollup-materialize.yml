          # #2434 Serena / Latias ready-Benched VSTAR.
          apply_reviewed 2459 293b71b02067481a65bc38f972b47a55e20c4f66 2f39e7087ab8efe6caa4afecf37354b1b8bc5890 \
            src/trace_engine_v2/part_issue_1683_serena_dead_quick_ball_override.inc \
            tests/issue_2434_serena_latias_dde_tests.cpp

          # #2443 Klara setup advance.
          apply_reviewed 2460 293b71b02067481a65bc38f972b47a55e20c4f66 8a997ef095c79c28aaccd810b324bbc6e536ca4e \
            src/trace_engine_v2/part_klara_recovery_override.inc \
            tests/issue_2443_klara_dde_setup_advance_tests.cpp

