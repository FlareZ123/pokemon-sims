          # #2444 Roseanne Energy recovery.
          apply_reviewed 2462 293b71b02067481a65bc38f972b47a55e20c4f66 28820f367f382447a78158449591ed037254f372 \
            src/trace_engine_v2/part_014b.inc \
            tests/issue_2444_roseanne_dde_energy_recovery_tests.cpp

          # #2429 Blender preservation for Burnet.
          apply_reviewed 2463 293b71b02067481a65bc38f972b47a55e20c4f66 10dd5e34aa9b06f8bcab2144879b0ad0f4e2996c \
            src/trace_engine_v2/part_blender_vstar_axis_override.inc \
            tests/issue_2429_blender_burnet_dde_hold_tests.cpp

          # #2420 Team Yell semantic powered-Regidrago checks. Exclude temporary baseline workflow.
          apply_reviewed 2464 293b71b02067481a65bc38f972b47a55e20c4f66 c01b34a26a6c41d1b038dab9890f995a1fa7ee7d \
            src/trace_engine_v2/part_team_yell_vstar_override.inc \
            tests/issue_2420_team_yell_dde_readiness_tests.cpp

          # #2421 Tate evolution/switch family.
          apply_reviewed 2465 293b71b02067481a65bc38f972b47a55e20c4f66 fd6581b5737031acd194ebe327a279b62deb2c2c \
            src/trace_engine_v2/part_issue_1070_tate_after_vstar_search_override.inc \
            src/trace_engine_v2/part_issue_2225_arven_vessel_supporter_override.inc \
            src/trace_engine_v2/part_tate_blender_attachment_override.inc \
            tests/issue_2421_tate_dde_routes_tests.cpp

          # #2423 Legacy Star physical-attachment semantics.
          apply_reviewed 2466 293b71b02067481a65bc38f972b47a55e20c4f66 7a21f0d19c79baa8a485935a7771a354a74dd952 \
            src/trace_engine_v2/part_013_legacy_star_override.inc \
