name: Temporary fix DDE rollup compile token

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-dde-rollup-compile.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/dde-semantic-rollup-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dde-semantic-rollup-20260809
          fetch-depth: 0
      - name: Remove accidental token and temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/trace_engine_v2/part_008b.inc')
          s=p.read_text()
          old='    }test\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one accidental token, found {s.count(old)}')
          p.write_text(s.replace(old, '    }\n', 1))
          PY
          rm -f .github/workflows/temp-dde-rollup-compile-diagnostic.yml
          rm -f .github/workflows/temp-fix-dde-rollup-compile.yml
          git diff --check
          git add src/trace_engine_v2/part_008b.inc
          git add -u .github/workflows/temp-dde-rollup-compile-diagnostic.yml .github/workflows/temp-fix-dde-rollup-compile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix DDE rollup compile integration token'
          git push origin HEAD:fix/dde-semantic-rollup-20260809
