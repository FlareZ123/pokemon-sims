name: Temporary rollup source snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-rollup-source-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/dde-semantic-rollup-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dde-semantic-rollup-20260809
      - name: Package exact rollup source
        run: tar -czf rollup-source.tgz src tests docs scripts CMakeLists.txt README.md
      - uses: actions/upload-artifact@v4
        with:
          name: dde-rollup-source-snapshot
          path: rollup-source.tgz
