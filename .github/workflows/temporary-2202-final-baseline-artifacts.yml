name: Temporary 2202 Final Baseline Artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator
        run: cmake --build build --parallel 2
      - name: Generate shell matrix
        run: ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-matrix.csv
      - name: Generate paired matrix
        run: ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out multi-deck-matrix.csv
      - name: Record simulator policy source digest
        run: python -c "from pathlib import Path; from scripts.baseline_provenance import simulator_policy_source_digest; print(simulator_policy_source_digest(Path('.').resolve()))" | tee simulator-policy-source-sha256.txt
      - name: Upload regeneration evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-2202-baseline-regeneration
          path: |
            t2-t3-matrix.csv
            multi-deck-matrix.csv
            simulator-policy-source-sha256.txt
            build/regidrago_sim
