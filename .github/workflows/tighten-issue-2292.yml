name: Tighten issue 2292

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/2292-gladion-final-prize-energy'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tighten route
        run: python scripts/tighten_issue_2292.py
      - name: Build and run focused regressions
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build -R 'issue_2292|issue_1039_duplicate_gladion_wonder_tag|issue_1050_dynamic_dead_role_dci' --output-on-failure
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 692 --require-ready-by 4 | tee issue-2292-seed-692.txt
      - name: Refresh source-bound matrices
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Commit tightened materialized fix
        run: |
          git rm scripts/tighten_issue_2292.py .github/workflows/tighten-issue-2292.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten #2292 to strict-JIT route'
          git push origin HEAD:${{ github.head_ref }}
