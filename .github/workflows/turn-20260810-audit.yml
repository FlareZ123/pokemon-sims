name: Turn 2026-08-10 audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build simulator and tests
        run: cmake --build build --parallel 2

      - name: Release tests excluding separately owned current-main failures
        run: ctest --test-dir build --output-on-failure -E 'setup_report_contract|multi_deck_report_contract|card_audit_contract'

      - name: Static policy scan
        run: |
          mkdir -p audit
          grep -RInE 'DciProfile::StrictJit|scenario_\.going_first|state_\.turn[[:space:]]*==|grass[[:space:]]*>=[[:space:]]*2|fire[[:space:]]*>=[[:space:]]*1|grass_needed\(\)[[:space:]]*\+[[:space:]]*fire_needed\(\)|max\(0,[[:space:]]*2[[:space:]]*-[^)]*grass' src tests > audit/static-patterns.txt || true
          find src tests -type f \( -name '*.inc' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print | sort > audit/source-files.txt
          find src -type f -name '*.inc' -print | sort > audit/inc-files.txt
          wc -l audit/static-patterns.txt audit/source-files.txt audit/inc-files.txt | tee audit/counts.txt

      - name: Simulate-this pass 1
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee audit/trace-1.txt

      - name: Simulate-this pass 2
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee audit/trace-2.txt

      - name: Simulate-this pass 3
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 6 --require-ready-by 4 | tee audit/trace-3.txt

      - name: Simulate-this Pineco control
        run: ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee audit/trace-pineco.txt

      - name: Archive source snapshot and audit outputs
        run: zip -qr audit/source-snapshot.zip src tests docs README.md CMakeLists.txt EN_advanced_manual-2025-transcription-structured.md

      - uses: actions/upload-artifact@v4
        with:
          name: turn-20260810-audit
          path: audit/
          if-no-files-found: error
