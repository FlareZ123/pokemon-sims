name: Validate issue 1516 script

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: issue-1516-script-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'fix/issue-1516-qb-tapu-crispin'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: |
          python .github/issue-1516-apply.py
          python .github/issue-1516-array-fix.py
          python .github/issue-1516-target-proof.py
          python .github/issue-1516-live-print.py
      - name: Build Release
        shell: bash
        run: |
          set -o pipefail
          (cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2) 2>&1 | tee build.log
      - name: Capture seed 42 diagnostic
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 42 | tee trace-42.txt
      - name: Run focused regression
        shell: bash
        run: |
          set -o pipefail
          ./build/regidrago_unified_tests issue_1516_quick_ball_tapu_crispin_tests 2>&1 | tee focused-test.log
      - name: Run reviewed no-control and strict-JIT traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario no-discard-control/go-first --seed 42 --require-ready-by 3 | tee trace-42.txt
          grep -q "T1 | HOLD QUICK BALL" trace-42.txt
          ! grep -q "T1 | BENCH | Tapu Lele-GX from hand." trace-42.txt
          grep -q "T3 | READY" trace-42.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 104 --require-ready-by 3 | tee trace-104.txt
          grep -q "Searched a Basic Pokémon: Tapu Lele-GX" trace-104.txt
          grep -q "T3 | READY" trace-104.txt
      - name: Find and replay a matchup-flex Tapu control
        shell: bash
        run: |
          set -euo pipefail
          : > matchup-control.txt
          for seed in $(seq 1 500); do
            ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed "$seed" > candidate.txt
            if grep -q "Searched a Basic Pokémon: Tapu Lele-GX" candidate.txt && grep -q "WONDER TAG" candidate.txt && grep -q "Crispin" candidate.txt; then
              printf 'seed=%s\n' "$seed" | tee matchup-control.txt
              cat candidate.txt | tee trace-matchup.txt
              exit 0
            fi
          done
          echo "No matchup-flex Tapu-Crispin control found in seeds 1-500" >&2
          exit 1
      - name: Regenerate matrices
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Upload validated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1516-script-${{ github.run_attempt }}
          path: |
            src/regidrago_sim.cpp
            src/trace_engine_v2/part_issue_991_wonder_tag_burnet_legacy_star_override_base.inc
            src/trace_engine_v2/part_issue_1516_quick_ball_tapu_crispin_override.inc
            tests/issue_1516_quick_ball_tapu_crispin_tests.cpp
            docs/REPORT.md
            docs/MULTI_DECK_REPORT.md
            results/baseline_manifest.json
            results/simulation_results.csv
            results/multi_deck_manifest.json
            results/multi_deck_comparison.csv
            build.log
            focused-test.log
            matchup-control.txt
            trace-42.txt
            trace-104.txt
            trace-matchup.txt
            build/Testing
          if-no-files-found: warn
