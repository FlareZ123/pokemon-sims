          helper = r'''  bool issue_1634_secret_box_latias_burnet_axes_visible() const {
    const bool complete_benched_vstar = std::any_of(
        state_.bench.begin(), state_.bench.end(), [](const Pokemon& pokemon) {
          return pokemon.card == Card::RegidragoVstar && pokemon.grass >= 2 &&
              pokemon.fire >= 1;
        });
    return secret_box_combo_enabled() && deck_seen_ && !item_locked() &&
        supporter_allowed() && !state_.retreat_used && state_.active &&
        is_basic(state_.active->card) && bench_space() > 0 &&
        complete_benched_vstar && need_active_vstar() && !need_energy() &&
        need_payload() && can_play_payload_this_turn() &&
        ability_available_for_pokemon(Card::LatiasEx) &&
        deck_count_after_search_started(Card::MysteriousTreasure) > 0 &&
        deck_count_after_search_started(Card::LatiasEx) > 0 &&
        deck_count_after_search_started(Card::ProfessorBurnet) > 0 &&
        payload_might_be_in_deck();
  }

  std::optional<Card> issue_1634_treasure_cost_after_box(
      const std::array<Card, 3>& box_costs) const {
    if (!issue_1634_secret_box_latias_burnet_axes_visible()) {
      return std::nullopt;
    }
    std::map<Card, int> remaining;
    for (const Card card : state_.hand) ++remaining[card];
    if (--remaining[Card::SecretBox] < 0) return std::nullopt;
    for (const Card cost : box_costs) {
      if (--remaining[cost] < 0) return std::nullopt;
    }

    // The powered Benched VSTAR already satisfies the Pokémon and GGF axes.
    // Burnet owns the Supporter slot, Latias owns the Bench and Retreat axis,
    // and Treasure owns the Item channel. These listed cards therefore have a
    // public replacement and may pay Treasure only inside this complete route:
    // Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
    // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
    // Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76
    // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
    // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
    // Core Item, Supporter, Bench, Retreat, search, and discard procedure: https://www.pokemon.com/us/pokemon-tcg/rules
    // Dynamic DCI and route priority: https://github.com/FlareZ123/pokemon-sims/blob/main/docs/MODEL_ASSUMPTIONS.md#dci-implementation https://github.com/FlareZ123/pokemon-sims/blob/main/docs/POLICY_DECISIONS.md#decision-priorities
    // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1634
    for (const Card card : {
             Card::Grant, Card::WishfulBaton, Card::ErikasInvitation,
             Card::Guzma, Card::Channeler, Card::FieldBlower,
             Card::ChaoticSwell, Card::PathToPeak, Card::TeamYellsCheer,
             Card::RoseannesBackup, Card::Lusamine, Card::ProfessorTuro,
             Card::Powerglass, Card::StevensResolve, Card::Arven,
             Card::Crispin, Card::Dawn, Card::ForestOfVitality,
             Card::Pineco, Card::ForretressEx, Card::QuickBall,
             Card::EarthenVessel, Card::Grass, Card::Fire,
             Card::RegidragoV, Card::RegidragoVstar, Card::Appletun,
             Card::MegaDragonite, Card::Dragapult, Card::GoodraVstar,
             Card::DialgaGX}) {
      if (remaining[card] > 0) return card;
    }
    return std::nullopt;
  }

'''
