void test_issue_1634_route_gates() {
  const auto expect_blocked = [](sim::State state, const sim::LockMode lock,
                                 const bool establish_k1,
                                 const char* message) {
    Fixture fixture(lock, sim::DciProfile::MatchupFlexJit);
    sim::EngineTestAccess::set_state(fixture.engine, std::move(state));
    if (establish_k1) sim::EngineTestAccess::establish_k1(fixture.engine);
    if (sim::EngineTestAccess::play_secret_box(fixture.engine)) {
      throw std::runtime_error(message);
    }
  };

  expect_blocked(issue_1634_route_state(), sim::LockMode::None, false,
                 "The issue-1634 route ignored K0.");
  expect_blocked(issue_1634_route_state(), sim::LockMode::FullItem, true,
                 "The issue-1634 route ignored Item lock.");
  expect_blocked(issue_1634_route_state(), sim::LockMode::FullSupporter, true,
                 "The issue-1634 route ignored Supporter lock.");
  expect_blocked(issue_1634_route_state(),
                 sim::LockMode::FullRuleBoxAbility, true,
                 "The issue-1634 route ignored Rule Box Ability lock.");

  sim::State no_fourth_cost = issue_1634_route_state();
  no_fourth_cost.hand = {sim::Card::SecretBox, sim::Card::Grant,
                         sim::Card::WishfulBaton,
                         sim::Card::ErikasInvitation};
  expect_blocked(std::move(no_fourth_cost), sim::LockMode::None, true,
                 "The issue-1634 route ignored Treasure's separate cost.");

  sim::State retreat_spent = issue_1634_route_state();
  retreat_spent.retreat_used = true;
  expect_blocked(std::move(retreat_spent), sim::LockMode::None, true,
                 "The issue-1634 route ignored a spent Retreat action.");

  sim::State missing_latias = issue_1634_route_state();
  missing_latias.deck.erase(std::find(missing_latias.deck.begin(),
                                     missing_latias.deck.end(),
                                     sim::Card::LatiasEx));
  expect_blocked(std::move(missing_latias), sim::LockMode::None, true,
                 "The issue-1634 route ignored a missing Latias target.");

  sim::State missing_burnet = issue_1634_route_state();
  missing_burnet.deck.erase(std::find(missing_burnet.deck.begin(),
                                     missing_burnet.deck.end(),
                                     sim::Card::ProfessorBurnet));
  expect_blocked(std::move(missing_burnet), sim::LockMode::None, true,
                 "The issue-1634 route ignored a missing Burnet target.");

  sim::State missing_payload = issue_1634_route_state();
  missing_payload.deck.erase(std::find(missing_payload.deck.begin(),
                                      missing_payload.deck.end(),
                                      sim::Card::Dragapult));
  expect_blocked(std::move(missing_payload), sim::LockMode::None, true,
                 "The issue-1634 route ignored a missing deck payload.");
}

void test_issue_1634_seed_123_route() {
  const auto scenario = sim::scenario_by_label("matchup-flex-jit/go-second");
  const sim::NamedDeck* deck = sim::deck_by_id("regidrago-pineco");
  if (!scenario || deck == nullptr) {
    throw std::runtime_error("The issue-1634 seed fixture is unavailable.");
  }
  std::mt19937_64 rng(123);
  sim::TraceLog trace{true, {}};
  sim::Engine engine(*scenario, deck->recipe, rng, &trace);
  const sim::TrialOutcome outcome = engine.run();
  const auto has_line = [&trace](const std::string& needle) {
    return std::any_of(trace.lines.begin(), trace.lines.end(),
                       [&needle](const std::string& line) {
                         return line.find(needle) != std::string::npos;
                       });
  };

  // Secret Box may leave its optional Tool and Stadium searches unused. Its
  // Item and Supporter channels fetch Treasure and Burnet, Treasure pays a
  // separate fourth discard to find Latias, Burnet establishes strict-JIT
  // payload, and Skyliner supplies the free retreat into the powered VSTAR:
  // Secret Box: https://api.pokemontcg.io/v2/cards/sv6-163
  // Mysterious Treasure: https://api.pokemontcg.io/v2/cards/sm6-113
  // Latias ex / Skyliner: https://api.pokemontcg.io/v2/cards/sv8-76
  // Professor Burnet: https://api.pokemontcg.io/v2/cards/swsh12tg-TG26
  // Regidrago VSTAR / Apex Dragon: https://api.pokemontcg.io/v2/cards/swsh12-136
  // Core procedure: https://www.pokemon.com/us/pokemon-tcg/rules
  // Confirmed bug: https://github.com/FlareZ123/pokemon-sims/issues/1634
  if (outcome.first_ready_turn != 4 ||
      !has_line("route-required Mysterious Treasure and Professor Burnet") ||
      !has_line("Mysterious Treasure discarded the reserved fourth cost and searched Latias ex") ||
      !has_line("T4 | PLAY SUPPORTER | rules: R-BURNET-01") ||
      !has_line("T4 | RETREAT |") || !has_line("T4 | READY |") ||
      has_line("T4 | PLAY SUPPORTER | rules: R-STEVEN-01")) {
    throw std::runtime_error("Pineco seed 123 did not use the legal T4 Latias-Burnet route.");
  }
}

