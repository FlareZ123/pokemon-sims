name: Validate issue 2164 branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate-issue-2164-branch
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.issue.pull_request && github.event.issue.number == 2212 && github.event.comment.body == '/validate-issue-2164-branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 2212 --repo ${{ github.repository }} --body "Issue 2164 source-bound validation started: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2164-current-main-reclaim
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Build strict C++20 contract
        run: |
          cmake -S . -B build-pedantic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-pedantic-errors
          cmake --build build-pedantic --parallel 2
      - name: Run focused and complete Release tests
        run: |
          ./build/regidrago_unified_tests issue_2164_quick_ball_latias_finish_tests
          ctest --test-dir build --parallel 4 --output-on-failure
      - name: Review three simulate-this traces
        run: |
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 69 --require-ready-by 4 | tee trace-strict-69.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-first --seed 69 --require-ready-by 4 | tee trace-flex-69.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-control.txt
          grep -q 'T4 | READY' trace-strict-69.txt
          grep -q 'T4 | READY' trace-flex-69.txt
          grep -q 'searched Latias ex' trace-strict-69.txt
          grep -q 'Mega Dragonite ex' trace-strict-69.txt
      - name: Regenerate source-bound matrices and reports
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete ASan and UBSan suite
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-sanitizers --parallel 2
          ctest --test-dir build-sanitizers --parallel 2 --output-on-failure
      - name: Commit exact tested evidence to the issue branch
        run: |
          rm -f .github/workflows/regenerate-issue-2164-evidence.yml
          rm -f .issue-2164-validation-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Regenerate issue 2164 source-bound evidence'
          git push origin HEAD:fix/issue-2164-current-main-reclaim
      - name: Upload source-bound validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-2164-validation-${{ github.run_attempt }}
          path: |
            trace-*.txt
            results/simulation_results.csv
            results/multi_deck_comparison.csv
            build/Testing
            build-sanitizers/Testing
          if-no-files-found: warn
      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 2212 --repo ${{ github.repository }} --body "Issue 2164 source-bound validation finished with status ${{ job.status }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
