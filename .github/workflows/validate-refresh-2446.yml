name: Validate and refresh 2446

on:
  push:
    branches:
      - bug/2446-opening-tapu-dde-crispin

permissions:
  contents: write

jobs:
  validate-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bug/2446-opening-tapu-dde-crispin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate internal Markdown source anchors
        run: python tests/source_anchor_contract_tests.py
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release targets
        run: cmake --build build --parallel 2
      - name: Build strict C++20 contract
        run: |
          cmake -S . -B build-pedantic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-pedantic-errors
          cmake --build build-pedantic --parallel 2
      - name: Run #2446 exact-state regression
        run: ./build/regidrago_unified_tests issue_2446_opening_tapu_dde_crispin_tests
      - name: Run reviewed simulate-this audits
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee trace-1.txt
          grep -q "T2 | READY" trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 2 | tee trace-2.txt
          grep -q "T3 | READY" trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee trace-3.txt
          grep -q "T2 | READY" trace-3.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 293 | tee trace-293.txt
          grep -q "T1 | WONDER TAG.*Steven's Resolve" trace-293.txt
          grep -q "T4 | READY" trace-293.txt
          ./build/regidrago_sim --simulate-this --deck regidrago-pineco --scenario strict-jit/go-second --seed 35 --require-ready-by 2 | tee pineco-trace-35.txt
          grep -q "T2 | READY" pineco-trace-35.txt
      - name: Verify canonical shell matrix
        run: |
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out t2-t3-matrix.csv
          cmp t2-t3-matrix.csv results/simulation_results.csv
      - name: Regenerate paired matrix and report
        run: |
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out paired-new.csv
          python tools/refresh_issue_2446_paired_baseline.py
          cmp paired-new.csv results/multi_deck_comparison.csv
      - name: Verify source-bound provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.baseline_provenance import simulator_policy_source_digest

          root = Path('.').resolve()
          digest = simulator_policy_source_digest(root)
          baseline = json.loads((root / 'results/baseline_manifest.json').read_text(encoding='utf-8'))
          multi = json.loads((root / 'results/multi_deck_manifest.json').read_text(encoding='utf-8'))
          report = (root / 'docs/MULTI_DECK_REPORT.md').read_text(encoding='utf-8')
          assert baseline['simulator_policy_source_sha256'] == digest
          assert multi['simulator_policy_source_sha256'] == digest
          assert digest in report
          print(digest)
          PY
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer targets once
        run: cmake --build build-sanitizers --parallel 2
      - name: Run complete sanitizer suite
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitizers --parallel 2 --output-on-failure
      - name: Commit validated generated evidence
        run: |
          rm -f paired-new.csv t2-t3-matrix.csv trace-1.txt trace-2.txt trace-293.txt trace-3.txt pineco-trace-35.txt
          git rm .github/workflows/validate-refresh-2446.yml tools/refresh_issue_2446_paired_baseline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/multi_deck_comparison.csv results/multi_deck_manifest.json docs/MULTI_DECK_REPORT.md
          git diff --cached --quiet && exit 1 || true
          git commit -m "Refresh #2446 paired validation baselines"
          git push origin HEAD:bug/2446-opening-tapu-dde-crispin
