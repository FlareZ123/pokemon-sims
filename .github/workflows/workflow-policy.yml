name: Workflow Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only validation is sufficient for this repository contract:
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
permissions:
  contents: read

jobs:
  reject-obsolete-issue-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce permanent workflow allowlist
        # Completed issue workflows must not run on unrelated pull requests:
        # https://github.com/FlareZ123/pokemon-sims/issues/1360
        # Pull-request event behavior:
        # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
        run: python scripts/check_issue_workflow_policy.py

  # BEGIN ISSUE 1482 RECOVERY
  materialize_issue_1482:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-1482-strict-include-recovery-v2'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply confirmed source fix and regression contract
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def atomic_write(path: Path, content: str) -> None:
              temporary = path.with_suffix(path.suffix + ".tmp")
              temporary.write_text(content, encoding="utf-8")
              os.replace(temporary, path)

          source_path = Path("src/regidrago_sim.cpp")
          source = source_path.read_text(encoding="utf-8")
          malformed = '#include "trace_engine_v2/part_016.inc"}'
          corrected = (
              '// A preprocessing include directive ends after its header name: https://eel.is/c++draft/cpp.include\n'
              '// Confirmed strict-C++20 build defect: https://github.com/FlareZ123/pokemon-sims/issues/1482\n'
              '#include "trace_engine_v2/part_016.inc"'
          )
          if source.count(malformed) != 1:
              raise SystemExit("Expected exactly one malformed part_016 include")
          atomic_write(source_path, source.replace(malformed, corrected, 1))

          test_path = Path("tests/issue_1482_strict_include_contract.py")
          atomic_write(test_path, '''from pathlib import Path

# C++ include grammar: https://eel.is/c++draft/cpp.include
# Confirmed strict-build defect: https://github.com/FlareZ123/pokemon-sims/issues/1482
source = (Path(__file__).resolve().parents[1] / "src" / "regidrago_sim.cpp").read_text(encoding="utf-8")
assert '#include "trace_engine_v2/part_016.inc"}' not in source
assert '// A preprocessing include directive ends after its header name: https://eel.is/c++draft/cpp.include' in source
assert '#include "trace_engine_v2/part_016.inc"' in source
''')

          cmake_path = Path("CMakeLists.txt")
          cmake = cmake_path.read_text(encoding="utf-8")
          anchor = '''add_test(NAME regidrago_issue_1300_matrix_lock_cleanup
  COMMAND ${Python3_EXECUTABLE}
    ${CMAKE_CURRENT_SOURCE_DIR}/tests/issue_1300_matrix_lock_cleanup_tests.py)
'''
          addition = anchor + '''# C++ include grammar: https://eel.is/c++draft/cpp.include
# Confirmed strict-build defect: https://github.com/FlareZ123/pokemon-sims/issues/1482
add_test(NAME regidrago_issue_1482_strict_include_contract
  COMMAND ${Python3_EXECUTABLE}
    ${CMAKE_CURRENT_SOURCE_DIR}/tests/issue_1482_strict_include_contract.py)
'''
          if cmake.count(anchor) != 1:
              raise SystemExit("Expected one issue-1300 CTest anchor")
          atomic_write(cmake_path, cmake.replace(anchor, addition, 1))
          PY
      - name: Build Release and strict C++20
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          cmake -S . -B build-pedantic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-pedantic-errors
          cmake --build build-pedantic --parallel 2
      - name: Review three independent simulate-this traces
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee issue-1482-trace-1.txt
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 2 --require-ready-by 4 | tee issue-1482-trace-2.txt
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee issue-1482-trace-3.txt
          grep -q "T3 | READY" issue-1482-trace-1.txt
          grep -q "T4 | READY" issue-1482-trace-2.txt
          grep -q "T2 | READY" issue-1482-trace-3.txt
      - name: Verify matrices and complete Release suite
        shell: bash
        run: |
          set -euo pipefail
          ./build/regidrago_sim --trials 100000 --seed 20260705 --out issue-1482-t2-t3.csv
          cmp issue-1482-t2-t3.csv results/simulation_results.csv
          ./build/regidrago_sim --all-decks --trials 100000 --seed 20260705 --out issue-1482-paired.csv
          cmp issue-1482-paired.csv results/multi_deck_comparison.csv
          ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated files and restore workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(".github/workflows/workflow-policy.yml")
          text = path.read_text(encoding="utf-8")
          marker = "  # BEGIN ISSUE 1482 RECOVERY\n"
          if text.count(marker) != 1:
              raise SystemExit("Issue 1482 recovery marker missing")
          restored = text.split(marker, 1)[0]
          temporary = path.with_suffix(path.suffix + ".tmp")
          temporary.write_text(restored, encoding="utf-8")
          os.replace(temporary, path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/regidrago_sim.cpp CMakeLists.txt tests/issue_1482_strict_include_contract.py .github/workflows/workflow-policy.yml
          git commit -m "Fix strict C++20 include directive (#1482)"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload source-bound recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1482-recovery-${{ github.run_attempt }}
          path: |
            issue-1482-trace-*.txt
            issue-1482-t2-t3.csv
            issue-1482-paired.csv
            build/Testing
          if-no-files-found: warn
