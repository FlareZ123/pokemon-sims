name: Workflow Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  # Permanent validation workflows are read-only by repository policy:
  # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
  contents: read

concurrency:
  group: workflow-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test workflow policy contract
        run: python tests/workflow_policy_contract_tests.py
      - name: Enforce permanent workflow inventory
        # Workflows installed on the base branch can run for matching pull requests:
        # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
        # Repository incident and cleanup contract:
        # https://github.com/FlareZ123/pokemon-sims/issues/1360
        run: python scripts/check_workflow_policy.py
