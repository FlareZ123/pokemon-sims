name: Workflow Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only validation is sufficient for this repository contract:
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
permissions:
  contents: read

jobs:
  reject-obsolete-issue-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce permanent workflow allowlist
        # Completed issue workflows must not run on unrelated pull requests:
        # https://github.com/FlareZ123/pokemon-sims/issues/1360
        # Pull-request event behavior:
        # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
        run: python scripts/check_issue_workflow_policy.py

  # BEGIN ISSUE 1526 TRUSTED MATERIALIZER
  materialize-issue-1526:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-1526-tate-dark-asset'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize source and focused regression
        run: |
          python .github/issue-1526-materialize.py
          python .github/issue-1526-fixture-patch.py
      - name: Configure and build Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Run focused issue 1526 regression
        shell: bash
        run: |
          set +e
          ./build/regidrago_unified_tests issue_1526_tate_dark_asset_tests >focused-output.txt 2>&1
          status=$?
          cat focused-output.txt
          exit $status
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1526-focused-${{ github.run_attempt }}
          path: focused-output.txt
          if-no-files-found: warn
      - name: Run three independent simulate-this reviews
        shell: bash
        run: |
          set +e
          status=0
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-second --seed 1 --require-ready-by 3 | tee issue-1526-trace-1.txt || status=1
          ./build/regidrago_sim --simulate-this --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2 | tee issue-1526-trace-2.txt || status=1
          ./build/regidrago_sim --simulate-this --scenario strict-jit/go-first --seed 43 --require-ready-by 2 | tee issue-1526-trace-3.txt || status=1
          grep -q "T2 | READY" issue-1526-trace-1.txt || status=1
          grep -q "T2 | READY" issue-1526-trace-2.txt || status=1
          grep -q "T2 | READY" issue-1526-trace-3.txt || status=1
          exit $status
      - name: Upload trace diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1526-traces-${{ github.run_attempt }}
          path: issue-1526-trace-*.txt
          if-no-files-found: warn
      - name: Regenerate source-bound probability evidence
        run: |
          python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_setup_docs.py --repo-root .
          python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
          python scripts/update_multi_deck_docs.py --repo-root .
      - name: Run complete Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Commit validated source and probability evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trace_engine_v2/part_turo_oricorio_override.inc tests/issue_1526_tate_dark_asset_tests.cpp docs/REPORT.md docs/MULTI_DECK_REPORT.md results/baseline_manifest.json results/simulation_results.csv results/multi_deck_manifest.json results/multi_deck_comparison.csv
          git commit -m "Reject unresolved Dark Asset Tate shadows (#1526) [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
