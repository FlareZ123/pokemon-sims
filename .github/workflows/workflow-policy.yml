name: Workflow Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-issue-2408:
    if: github.head_ref == 'fix/2408-reclaim-20260809-1752'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2408-reclaim-20260809-1752
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Execute issue materializer
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/issue-2408-reclaim-materialize.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line
                           for line in lines[start:end])
          exec(compile(code, str(workflow), 'exec'), {})
          PY
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - name: Focused regressions
        run: ctest --test-dir build --output-on-failure -R 'issue_1341|issue_2091|issue_2408'
      - name: Simulate exact issue seed 19
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-second --seed 19 --require-ready-by 2
      - name: Simulate strict JIT go-first seed 2
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario strict-jit/go-first --seed 2 --require-ready-by 4
      - name: Simulate matchup-flex go-second seed 3
        run: ./build/regidrago_sim --simulate-this --deck regidrago-shell --scenario matchup-flex-jit/go-second --seed 3 --require-ready-by 2
      - name: Regenerate canonical 100k evidence
        run: python scripts/regenerate_setup_baselines.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - run: python scripts/update_setup_docs.py --repo-root .
      - name: Regenerate paired 100k evidence
        run: python scripts/generate_multi_deck_comparison.py --exe build/regidrago_sim --out-dir results --trials 100000 --matrix-seed 20260705
      - run: python scripts/update_multi_deck_docs.py --repo-root .
      - name: Full Release suite
        run: ctest --test-dir build --parallel 4 --output-on-failure
      - name: Materialize validated commit
        run: |
          git checkout origin/main -- .github/workflows/workflow-policy.yml
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Fix #2408 prefer K1 Burnet over Serena'
          git push origin HEAD:fix/2408-reclaim-20260809-1752
